      <p>
        A Corvia é uma plataforma de apoio à decisão clínica em Cardiologia, idealizada e
        desenvolvida por Dr. Rafael Paes Meirelles (CRM-SP 138266, RQE 134798), de uso
        independente e sem vínculo institucional. Reúne biblioteca científica com fluxogramas
