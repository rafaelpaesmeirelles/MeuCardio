# Deploy de produção: HTTPS automático (Caddy + Let's Encrypt) no seu domínio,
# frontend compilado como arquivos estáticos (sem servidor de desenvolvimento),
# banco e cache não expostos à internet.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    env_file: .env
    environment:
      ENVIRONMENT: production
      DEPLOY_COMMIT: ${DEPLOY_COMMIT:-unknown}
      SCIENTIFIC_PUBLICATION_LIBRARY_DIR: /scientific-publication-library
      # Release Clinical OS: tools reais do Assistente Pessoal ficam disponíveis
      # em produção, ainda condicionadas ao consentimento individual do médico
      # (users.ia_ferramentas_consent_em) e bloqueadas para Investidor.
      AI_ENABLED: "true"
      AI_PROVIDER: "openai"
      AI_ASSISTANT_TOOLS_ENABLED: "true"
      # Autorização operacional registrada em 25/08/2026: a central exige
      # desidentificação e consentimento explícito, sanitiza os arquivos e não
      # persiste conteúdo clínico nem solicita armazenamento da resposta.
      AI_CLINICAL_MULTIMODAL_ENABLED: "true"
      AI_CLINICAL_DATA_CONTROLS_APPROVED: "true"
      # Heart Team Virtual aprovado para esta release: permanece restrito a
      # médico com CRM/perfil aprovado e exige desidentificação + revisão
      # humana antes de qualquer conclusão utilizável.
      HEART_TEAM_ENABLED: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./content:/content:ro
      - ./galeria:/galeria:ro
      - ./exames:/exames:ro
      - ./evidencias:/evidencias:ro
      - ./estudos:/estudos:ro
      - ./medicamentos:/medicamentos:ro
      - ./checklists:/checklists:ro
      - ./trilhas:/trilhas:ro
      - ./material-paciente:/material-paciente:ro
      - ./emergencia:/emergencia:ro
      - ./casos-clinicos:/casos-clinicos:ro
      - ./doencas:/doencas:ro
      - ./triagem-sintomas:/triagem-sintomas:ro
      - ./controlados:/controlados:ro
      - ./editorial-approvals:/editorial-approvals:ro
      # Evidências exatas da autorização do corpus, somente leitura.
      - ./docs/scoped-corpus-release-evidence-20260910.json:/docs/scoped-corpus-release-evidence-20260910.json:ro
      - ./docs/scoped-corpus-theme-normalization-20260910.json:/docs/scoped-corpus-theme-normalization-20260910.json:ro
      - ./docs/HANDOFF-producao-prevalentes-20260909.md:/docs/HANDOFF-producao-prevalentes-20260909.md:ro
      - ./docs/prevalentes-round2-release-application-20260909.md:/docs/prevalentes-round2-release-application-20260909.md:ro
      - ./releases/scientific-20260909/reviewed-content.json:/releases/scientific-20260909/reviewed-content.json:ro
      - ./backend/app/services/canonical_themes.py:/backend/app/services/canonical_themes.py:ro
      - ./backend/migrations/versions:/app/migrations/versions
      - userfiles:/uploads
      - examefiles:/exames-pacientes
      - documentofiles:/documentos-emitidos
      - certificadosfiles:/certificados-a1
      - kycfiles:/kyc-documentos
      - cursofiles:/materiais-curso
      - whatsappmediafiles:/whatsapp-media
      - heartteamfiles:/heart-team-files
      - scientific-publication-library:/scientific-publication-library:ro
    command: ["sh", "-c", "python -m app.commands.migrate && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # Supervisor permanente de Google/Microsoft/Apple/Yahoo. Calendário e
  # contatos usam sync incremental; e-mail externo continua proxy ao vivo e
  # recebe heartbeat/renovação de credencial. O worker espera o backend ficar
  # saudável para nunca disputar migrations no startup.
  agenda-sync:
    build:
      context: ./backend
    env_file: .env
    environment:
      ENVIRONMENT: production
      DEPLOY_COMMIT: ${DEPLOY_COMMIT:-unknown}
      AGENDA_BACKGROUND_SYNC_ENABLED: "true"
      AGENDA_SYNC_INTERVAL_SECONDS: "60"
    depends_on:
      backend:
        condition: service_healthy
    command: ["python", "-m", "app.services.agenda_sync_worker"]
    restart: unless-stopped

  whatsapp-heart-team-worker:
    build:
      context: ./backend
    env_file: .env
    environment:
      ENVIRONMENT: production
      DEPLOY_COMMIT: ${DEPLOY_COMMIT:-unknown}
      AI_ENABLED: "true"
      AI_PROVIDER: "openai"
      AI_CLINICAL_MULTIMODAL_ENABLED: "true"
      AI_CLINICAL_DATA_CONTROLS_APPROVED: "true"
      HEART_TEAM_ENABLED: "true"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - whatsappmediafiles:/whatsapp-media
      - heartteamfiles:/heart-team-files
    command: ["python", "-m", "app.services.whatsapp_heart_team_worker"]
    restart: unless-stopped

  intelligence-radar:
    build:
      context: ./backend
    env_file: .env
    environment:
      ENVIRONMENT: production
      DEPLOY_COMMIT: ${DEPLOY_COMMIT:-unknown}
      AI_ENABLED: "true"
      AI_PROVIDER: "openai"
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "-m", "app.services.guideline_radar_worker"]
    restart: unless-stopped

  scientific-publication-library-worker:
    build:
      context: ./backend
    env_file: .env
    environment:
      ENVIRONMENT: production
      DEPLOY_COMMIT: ${DEPLOY_COMMIT:-unknown}
      SCIENTIFIC_PUBLICATION_LIBRARY_DIR: /scientific-publication-library
      AI_ENABLED: "true"
      AI_PROVIDER: "openai"
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - scientific-publication-library:/scientific-publication-library
    command: ["python", "-m", "app.services.scientific_publication_library_worker"]
    restart: unless-stopped

  frontend-build:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: /api
        VITE_DEPLOY_COMMIT: ${DEPLOY_COMMIT:-unknown}
        VITE_CARDIOLOGY_SPACES_ENABLED: ${VITE_CARDIOLOGY_SPACES_ENABLED:-true}
        VITE_HEART_TEAM_ENABLED: "true"
        VITE_WHATSAPP_ASSISTANT_ENABLED: ${VITE_WHATSAPP_ASSISTANT_ENABLED:-false}
    volumes:
      - sitefiles:/site
    restart: "no"

  caddy:
    image: caddy:2-alpine
    depends_on:
      backend:
        condition: service_healthy
      frontend-build:
        condition: service_completed_successfully
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - sitefiles:/site:ro
      - ./galeria:/galeria:ro
      - ./downloads:/downloads:ro
      - userfiles:/uploads:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  sitefiles:
  userfiles:
  examefiles:
  documentofiles:
  certificadosfiles:
  kycfiles:
  cursofiles:
  whatsappmediafiles:
  heartteamfiles:
  scientific-publication-library:
  caddy_data:
  caddy_config:
