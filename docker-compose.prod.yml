# Deploy de produção: HTTPS automático (Caddy + Let's Encrypt) no seu domínio,
# frontend compilado como arquivos estáticos (sem servidor de desenvolvimento),
# banco e cache não expostos à internet.
#
#   cp .env.example .env    # preencha DOMAIN, senhas e OPENAI_API_KEY
#   docker compose -f docker-compose.prod.yml up -d --build
#
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./content:/content:ro
      - ./galeria:/galeria:ro
      - ./exames:/exames:ro
      - ./evidencias:/evidencias:ro
      - ./estudos:/estudos:ro
      - ./medicamentos:/medicamentos:ro
      - ./checklists:/checklists:ro
      - ./trilhas:/trilhas:ro
      - ./backend/migrations/versions:/app/migrations/versions
      # Único volume gravável pelo backend: arquivos enviados pelo usuário
      # (foto de perfil). O Caddy monta o mesmo volume como somente-leitura.
      - userfiles:/uploads
      # Exames de paciente, cifrados em repouso. Este volume NAO e montado no
      # Caddy de proposito: arquivo de exame nao pode ter URL alcancavel de
      # fora, o acesso passa obrigatoriamente pela rota autenticada que audita.
      - examefiles:/exames-pacientes
      - cursofiles:/materiais-curso
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    restart: unless-stopped

  frontend-build:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: /api
    volumes:
      - sitefiles:/site
    restart: "no"

  caddy:
    image: caddy:2-alpine
    depends_on:
      backend:
        condition: service_started
      frontend-build:
        condition: service_completed_successfully
    environment:
      DOMAIN: ${DOMAIN}
      DOMAIN_NOVO: ${DOMAIN_NOVO}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - sitefiles:/site:ro
      - ./galeria:/galeria:ro
      - userfiles:/uploads:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  sitefiles:
  userfiles:
  examefiles:
  cursofiles:
  caddy_data:
  caddy_config:
