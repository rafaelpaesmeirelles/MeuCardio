# Deploy de produção: HTTPS automático (Caddy + Let's Encrypt) no seu domínio,
# frontend compilado como arquivos estáticos (sem servidor de desenvolvimento),
# banco e cache não expostos à internet.
#
#   cp .env.example .env    # preencha DOMAIN, senhas e OPENAI_API_KEY
#   ./deploy.sh             # fluxo certificado de backup, corpus e readiness
#
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    env_file: .env
    environment:
      ENVIRONMENT: production
      # Injetado por deploy.sh a partir de git rev-parse HEAD. Permite comprovar
      # externamente qual revisão está atendendo em /api/version.
      DEPLOY_COMMIT: ${DEPLOY_COMMIT:-unknown}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./content:/content:ro
      - ./galeria:/galeria:ro
      - ./exames:/exames:ro
      - ./evidencias:/evidencias:ro
      - ./estudos:/estudos:ro
      - ./medicamentos:/medicamentos:ro
      - ./checklists:/checklists:ro
      - ./trilhas:/trilhas:ro
      # Material educativo do paciente (Tarefa 12). Somente-leitura como as
      # demais frentes de conteúdo: o backend lê, nunca escreve.
      - ./material-paciente:/material-paciente:ro
      - ./emergencia:/emergencia:ro
      - ./casos-clinicos:/casos-clinicos:ro
      - ./doencas:/doencas:ro
      - ./triagem-sintomas:/triagem-sintomas:ro
      # Listas da Portaria 344/98 e regras de adendo (Tarefa 27).
      - ./controlados:/controlados:ro
      - ./backend/migrations/versions:/app/migrations/versions
      # Único volume gravável pelo backend: arquivos enviados pelo usuário.
      - userfiles:/uploads
      # Exames de paciente, cifrados em repouso e servidos por rota autenticada.
      - examefiles:/exames-pacientes
      # PDFs de receita/documento emitidos, cifrados em repouso.
      - documentofiles:/documentos-emitidos
      - cursofiles:/materiais-curso
    command: ["sh", "-c", "python -m app.commands.migrate && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  frontend-build:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: /api
    volumes:
      - sitefiles:/site
    restart: "no"

  caddy:
    image: caddy:2-alpine
    depends_on:
      backend:
        condition: service_healthy
      frontend-build:
        condition: service_completed_successfully
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - sitefiles:/site:ro
      - ./galeria:/galeria:ro
      - userfiles:/uploads:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  sitefiles:
  userfiles:
  examefiles:
  documentofiles:
  cursofiles:
  caddy_data:
  caddy_config:
