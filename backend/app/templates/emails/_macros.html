{% macro botao(texto, url) -%}
<table role="presentation" cellpadding="0" cellspacing="0" style="margin:20px 0;">
  <tr>
    <td style="background-color:#C98C66;background-image:linear-gradient(115deg,#D39770 0%,#F2D1AF 24%,#D8A27C 49%,#C98C66 77%,#E2B18D 100%);border-radius:6px;">
      <a href="{{ url }}" style="display:inline-block;padding:12px 28px;font-size:15px;font-weight:bold;color:#1E2A22;text-decoration:none;border-radius:6px;font-family:Arial,Helvetica,sans-serif;">{{ texto }}</a>
    </td>
  </tr>
</table>
<p style="font-size:12.5px;color:#55666F;word-break:break-all;margin:0 0 20px;">{{ url }}</p>
{%- endmacro %}
