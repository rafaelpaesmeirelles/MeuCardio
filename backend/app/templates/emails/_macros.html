{% macro botao(texto, url) -%}
<table role="presentation" cellpadding="0" cellspacing="0" style="margin:20px 0;">
  <tr>
    <td style="background-color:#D5001D;border-radius:6px;">
      <a href="{{ url }}" style="display:inline-block;padding:12px 28px;font-size:15px;font-weight:bold;color:#ffffff;text-decoration:none;border-radius:6px;font-family:Arial,Helvetica,sans-serif;">{{ texto }}</a>
    </td>
  </tr>
</table>
<p style="font-size:12.5px;color:#55666F;word-break:break-all;margin:0 0 20px;">{{ url }}</p>
{%- endmacro %}
