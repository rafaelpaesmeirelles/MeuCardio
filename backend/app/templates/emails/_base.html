<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light only">
<title>{{ assunto }}</title>
</head>
<body style="margin:0;padding:0;background-color:#F4F6F7;font-family:Arial,Helvetica,sans-serif;color:#26333B;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#F4F6F7;padding:24px 0;">
<tr><td align="center">
<table role="presentation" width="600" cellpadding="0" cellspacing="0" style="background-color:#ffffff;max-width:600px;width:100%;border-collapse:collapse;">
  <tr>
    <td align="center" style="background-color:#ffffff;padding:28px 0 20px;">
      <img src="{{ public_url }}/corvia-logo-canonical.svg" alt="CorVIA Clinical OS" width="220" style="display:block;width:220px;max-width:220px;height:auto;border:0;">
    </td>
  </tr>
  <tr>
    <td style="padding:8px 32px 32px 32px;font-size:15px;line-height:1.6;color:#26333B;">
      {% block corpo %}{% endblock %}
    </td>
  </tr>
  <tr>
    <td style="padding:20px 32px 28px;border-top:1px solid #E4E8EA;font-size:12px;line-height:1.6;color:#55666F;font-family:Arial,Helvetica,sans-serif;">
      <p style="margin:0 0 6px;">CorVIA — Clinical OS</p>
      <p style="margin:0 0 6px;">{{ empresa.razao_social }} — CNPJ {{ empresa.cnpj }}</p>
      <p style="margin:0 0 6px;"><a href="{{ public_url }}/privacidade" style="color:#1C7293;">Política de privacidade</a></p>
      <p style="margin:0;">Você recebeu este e-mail porque tem uma assinatura ativa no CorVIA.</p>
    </td>
  </tr>
</table>
</td></tr>
</table>
</body>
</html>
