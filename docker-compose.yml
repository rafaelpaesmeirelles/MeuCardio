services:
  db:
    image: pgvector/pgvector:pg16   # Postgres 16 com a extensão vector
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-meucardio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meucardio}
      POSTGRES_DB: ${POSTGRES_DB:-meucardio}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meucardio}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports: ["5432:5432"]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports: ["6379:6379"]

  backend:
    build: ./backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./content:/content:ro
      - whatsappmediafiles:/whatsapp-media
      - heartteamfiles:/heart-team-files
    command: ["sh", "-c", "python -m app.commands.migrate && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    ports: ["8000:8000"]

  whatsapp-heart-team-worker:
    build: ./backend
    env_file: .env
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - whatsappmediafiles:/whatsapp-media
      - heartteamfiles:/heart-team-files
    command: ["python", "-m", "app.services.whatsapp_heart_team_worker"]
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_API_URL: /api
      VITE_CARDIOLOGY_SPACES_ENABLED: ${VITE_CARDIOLOGY_SPACES_ENABLED:-true}
      VITE_HEART_TEAM_ENABLED: ${VITE_HEART_TEAM_ENABLED:-false}
      VITE_WHATSAPP_ASSISTANT_ENABLED: ${VITE_WHATSAPP_ASSISTANT_ENABLED:-false}
    ports: ["5173:5173"]
    volumes:
      - ./frontend:/app
      - /app/node_modules

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["8080:80"]

volumes:
  pgdata:
  redisdata:
  whatsappmediafiles:
  heartteamfiles:
