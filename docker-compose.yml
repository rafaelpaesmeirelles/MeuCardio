services:
  db:
    image: pgvector/pgvector:pg16   # Postgres 16 com a extensão vector
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cardiobene}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cardiobene}
      POSTGRES_DB: ${POSTGRES_DB:-cardiobene}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cardiobene}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports: ["5432:5432"]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports: ["6379:6379"]

  backend:
    build: ./backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
      - ./content:/content:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports: ["8000:8000"]

  frontend:
    build: ./frontend
    depends_on: [backend]
    environment:
      VITE_API_URL: /api
    ports: ["5173:5173"]
    volumes:
      - ./frontend:/app
      - /app/node_modules

  nginx:
    image: nginx:1.27-alpine
    depends_on: [backend, frontend]
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["8080:80"]

volumes:
  pgdata:
  redisdata:
