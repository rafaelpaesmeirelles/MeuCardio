name: Reconcile open scientific PR corpus

on:
  push:
    branches:
      - science/reconcile-open-pr-corpus-20260904
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: science-reconcile-open-pr-corpus-20260904
  cancel-in-progress: false

jobs:
  reconcile:
    name: Consolidar conteúdo científico pendente
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout preparation branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: science/reconcile-open-pr-corpus-20260904

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install lightweight reconciliation dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML>=6,<7'

      - name: Fetch canonical main and every pull-request head
        run: |
          git fetch origin main --prune
          git fetch origin '+refs/pull/*/head:refs/remotes/pr/*'

      - name: Snapshot open pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
            --jq '.[].number' | jq -s 'unique | sort' > /tmp/open-prs.json
          echo "Open PRs: $(jq length /tmp/open-prs.json)"

      - name: Compile reconciliation tool
        run: python -m py_compile scripts/reconcile_open_science_prs.py

      - name: Snapshot canonical corpus baseline
        run: |
          set +e
          python scripts/content_inventory.py --strict > /tmp/science-baseline.json 2> /tmp/science-baseline.err
          echo $? > /tmp/science-baseline.exit
          set -e
          echo "Baseline strict exit: $(cat /tmp/science-baseline.exit)"
          jq '{total_records, missing, invalid, duplicate_keys: [.fronts | to_entries[] | select((.value.duplicate_keys | length) > 0) | {front: .key, keys: .value.duplicate_keys}]}' /tmp/science-baseline.json

      - name: Reconcile, deduplicate and mark accepted units reviewed
        run: |
          python scripts/reconcile_open_science_prs.py \
            --base origin/main \
            --open-prs /tmp/open-prs.json

      - name: Preserve reconciliation report even if a later gate fails
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: science-open-pr-reconciliation
          path: |
            artifacts/science-reconcile-report.json
            docs/REVISAO-CIENTIFICA-PRS-PENDENTES-20260904.md
          if-no-files-found: error
          retention-days: 14

      - name: Validate all touched JSON and YAML front matter
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          manifests = [
              'casos-clinicos/metadados.json', 'checklists/metadados.json',
              'doencas/metadados.json', 'emergencia/metadados.json',
              'estudos/metadados.json', 'evidencias/metadados.json',
              'exames/metadados.json', 'galeria/metadados.json',
              'material-paciente/metadados.json', 'medicamentos/metadados.json',
              'triagem-sintomas/metadados.json', 'trilhas/metadados.json',
          ]
          for item in manifests:
              path = Path(item)
              if path.exists():
                  json.loads(path.read_text(encoding='utf-8'))

          for path in Path('content').rglob('*.md'):
              text = path.read_text(encoding='utf-8')
              if text.startswith('---\n'):
                  end = text.find('\n---\n', 4)
                  if end < 0:
                      raise SystemExit(f'front matter incompleto: {path}')
                  meta = yaml.safe_load(text[4:end])
                  if not isinstance(meta, dict):
                      raise SystemExit(f'front matter inválido: {path}')
          PY

      - name: Inventory prepared corpus without masking baseline defects
        run: |
          set +e
          python scripts/content_inventory.py --strict > /tmp/science-prepared.json 2> /tmp/science-prepared.err
          echo $? > /tmp/science-prepared.exit
          set -e
          python - <<'PY'
          import json
          from pathlib import Path

          before = json.loads(Path('/tmp/science-baseline.json').read_text())
          after = json.loads(Path('/tmp/science-prepared.json').read_text())

          def duplicate_map(payload):
              return {
                  name: tuple(data.get('duplicate_keys') or [])
                  for name, data in payload.get('fronts', {}).items()
                  if data.get('duplicate_keys')
              }

          problems = []
          before_missing = set(before.get('missing') or [])
          after_missing = set(after.get('missing') or [])
          new_missing = sorted(after_missing - before_missing)
          if new_missing:
              problems.append(f'novos caminhos ausentes: {new_missing}')

          before_invalid = set(before.get('invalid') or [])
          after_invalid = set(after.get('invalid') or [])
          new_invalid = sorted(after_invalid - before_invalid)
          if new_invalid:
              problems.append(f'novas invalidezes: {new_invalid}')

          before_dup = duplicate_map(before)
          after_dup = duplicate_map(after)
          for front, keys in after_dup.items():
              new_keys = sorted(set(keys) - set(before_dup.get(front, ())))
              if new_keys:
                  problems.append(f'novas chaves duplicadas em {front}: {new_keys[:20]}')

          if int(after.get('total_records') or 0) < int(before.get('total_records') or 0):
              problems.append(
                  f"corpus encolheu: {before.get('total_records')} -> {after.get('total_records')}"
              )

          print(json.dumps({
              'baseline_strict_was_clean': not bool(before_missing or before_invalid or before_dup),
              'baseline_invalid': sorted(before_invalid),
              'prepared_invalid': sorted(after_invalid),
              'records_before': before.get('total_records'),
              'records_after': after.get('total_records'),
              'new_regressions': problems,
          }, ensure_ascii=False, indent=2))

          if problems:
              raise SystemExit('Corpus preparado introduziu regressão estrutural: ' + '; '.join(problems))
          PY

      - name: Show consolidation summary
        run: |
          jq '.summary, .accepted_by_pr' artifacts/science-reconcile-report.json
          git diff --stat

      - name: Commit prepared corpus to isolated branch
        run: |
          git config user.name 'CorVIA Science Reconciler'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            content \
            casos-clinicos checklists doencas emergencia estudos evidencias exames galeria \
            material-paciente medicamentos triagem-sintomas trilhas \
            artifacts/science-reconcile-report.json \
            docs/REVISAO-CIENTIFICA-PRS-PENDENTES-20260904.md
          if git diff --cached --quiet; then
            echo 'Nenhum conteúdo novo seguro para gravar nesta rodada.'
            exit 0
          fi
          git commit -m 'science: consolida corpus revisado dos PRs pendentes'
          git push origin HEAD:science/reconcile-open-pr-corpus-20260904
