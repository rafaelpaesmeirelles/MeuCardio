name: RC4 Acceptance Temporary

on:
  push:
    branches: [qa/rc4-acceptance-pr]

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: corvia_rc4_acceptance
      ENVIRONMENT: test
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: meucardio_rc4
      POSTGRES_PASSWORD: test
      POSTGRES_DB: meucardio_rc4
      REDIS_URL: redis://redis:6379/0
      STORAGE_ENCRYPTION_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
      JWT_SECRET: rc4-acceptance-test-secret
      ADMIN_EMAIL: rc4-acceptance@teste.local
      ADMIN_PASSWORD: rc4-acceptance-test-password
      AI_ENABLED: "false"
      MAIL360_CLIENT_ID: test-id
      MAIL360_CLIENT_SECRET: test-secret
      MAIL360_REFRESH_TOKEN: test-refresh
      CORVIA_MAIL_PRECO_CENTAVOS: "1000"
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_test
      PUBLIC_URL: http://127.0.0.1:8080
      UPLOADS_DIR: /tmp/corvia-rc4/uploads
      EXAMES_DIR: /tmp/corvia-rc4/exames
      DOCUMENTOS_DIR: /tmp/corvia-rc4/documentos
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Prepare isolated environment
        run: |
          cat > .env <<'ENV'
          COMPOSE_PROJECT_NAME=corvia_rc4_acceptance
          ENVIRONMENT=test
          POSTGRES_HOST=db
          POSTGRES_PORT=5432
          POSTGRES_USER=meucardio_rc4
          POSTGRES_PASSWORD=test
          POSTGRES_DB=meucardio_rc4
          REDIS_URL=redis://redis:6379/0
          STORAGE_ENCRYPTION_KEY=MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
          JWT_SECRET=rc4-acceptance-test-secret
          ADMIN_EMAIL=rc4-acceptance@teste.local
          ADMIN_PASSWORD=rc4-acceptance-test-password
          AI_ENABLED=false
          MAIL360_CLIENT_ID=test-id
          MAIL360_CLIENT_SECRET=test-secret
          MAIL360_REFRESH_TOKEN=test-refresh
          CORVIA_MAIL_PRECO_CENTAVOS=1000
          STRIPE_SECRET_KEY=sk_test_dummy
          STRIPE_WEBHOOK_SECRET=whsec_test
          PUBLIC_URL=http://127.0.0.1:8080
          UPLOADS_DIR=/tmp/corvia-rc4/uploads
          EXAMES_DIR=/tmp/corvia-rc4/exames
          DOCUMENTOS_DIR=/tmp/corvia-rc4/documentos
          ENV
          docker compose up -d --build db redis backend
          for attempt in $(seq 1 90); do
            docker compose exec -T backend python - <<'PY' && break
          import urllib.request
          urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=2).read()
          PY
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8000/api/ready >/dev/null || true

      - name: Mount and reconcile canonical corpus
        run: |
          BACKEND_ID="$(docker compose ps -q backend)"
          # /content já é um bind mount somente leitura no docker-compose canônico.
          # Os demais corpora históricos não são montados e precisam ser copiados.
          for dir in galeria exames evidencias estudos medicamentos controlados checklists casos-clinicos trilhas material-paciente emergencia doencas triagem-sintomas; do
            docker cp "$dir" "$BACKEND_ID:/$dir"
          done
          docker compose exec -T backend python -m pytest -q tests/test_canonical_content_review_status.py
          docker compose exec -T backend python -m app.commands.reconcile_content --publish-reviewed
          docker compose exec -T backend python - <<'PY'
          from app.core.db import SessionLocal
          from app.models.content import Document
          wanted = {
            'aha-acc-ada-asn-2026-sindrome-cardiovascular-renal-metabolica-ckm',
            'betabloqueador-pos-iam-evidencia-estratificada-por-feve-40-49-versus-50',
            'chip-bcis3-impella-eletiva-em-pci-complexa-e-disfuncao-ventricular-grave',
            'smart-choice-3-clopidogrel-versus-aas-monoterapia-apos-pci',
            'smart-decision-retirada-betabloqueador-apos-um-ano-do-iam',
            'acc-2026-cuidado-cardiovascular-pos-parto-primeiro-ano',
            'acc-2026-expert-consensus-icfep-diagnostico-fenotipos-e-tratamento',
            'segunda-definicao-universal-insuficiencia-cardiaca-2026',
            'acc-aha-2026-diretriz-dislipidemia-prevent-lpa-apob-e-metas-ldl',
            'aha-acc-2026-tep-agudo-categorias-clinicas-anticoagulacao-e-terapias-avancadas',
            'dig-rhd-digoxina-na-cardiopatia-reumatica-sintomatica',
          }
          db = SessionLocal()
          try:
            rows = db.query(Document).filter(Document.slug.in_(wanted)).all()
            assert {r.slug for r in rows} == wanted
            assert all(r.review_status == 'revisado' and r.published for r in rows)
            print({'validated_new_documents': len(rows)})
          finally:
            db.close()
          PY
          docker compose exec -T backend python -m app.commands.create_admin --email "$ADMIN_EMAIL" --password "$ADMIN_PASSWORD" --name "Dr. Visual QA"

      - name: Build and serve production frontend
        run: |
          cd frontend
          npm ci
          npm run build
          node scripts/check-bundle-budget.mjs
          cd ..
          mkdir -p rc4-acceptance
          cat > rc4-acceptance/nginx.conf <<'NGINX'
          server {
            listen 80;
            root /usr/share/nginx/html;
            index index.html;
            location /api/ { proxy_pass http://backend:8000/api/; proxy_buffering off; }
            location /uploads/ { proxy_pass http://backend:8000/uploads/; }
            location / { try_files $uri $uri/ /index.html; }
          }
          NGINX
          docker run -d --name corvia-rc4-nginx --network corvia_rc4_acceptance_default -p 8080:80 -v "$PWD/frontend/dist:/usr/share/nginx/html:ro" -v "$PWD/rc4-acceptance/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.27-alpine
          for attempt in $(seq 1 60); do curl --fail --silent http://127.0.0.1:8080/api/ready >/dev/null && break; sleep 2; done
          curl --fail http://127.0.0.1:8080/api/ready

      - name: Run authenticated Visual QA
        env:
          QA_BASE_URL: http://127.0.0.1:8080
          QA_EMAIL: rc4-acceptance@teste.local
          QA_PASSWORD: rc4-acceptance-test-password
          QA_OUTPUT_DIR: rc4-acceptance/screenshots
        run: |
          mkdir -p /tmp/rc4-playwright
          cd /tmp/rc4-playwright
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.54.2
          npx playwright install --with-deps chromium
          NODE_PATH=/tmp/rc4-playwright/node_modules node "$GITHUB_WORKSPACE/scripts/rc4_visual_acceptance.mjs"

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rc4-acceptance-visual-qa
          path: rc4-acceptance
          if-no-files-found: error
          retention-days: 7

      - name: Diagnostics
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=250 backend

      - name: Cleanup
        if: always()
        run: |
          docker rm -f corvia-rc4-nginx 2>/dev/null || true
          docker compose down -v --remove-orphans
