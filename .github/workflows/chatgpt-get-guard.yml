name: ChatGPT investor GET guard apply

on:
  push:
    branches:
      - agent/chatgpt-investidor-demo-readonly-20260813

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified GET guard
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .chatgpt/rc72-get-guard.patch.b64 > /tmp/getguard.patch
          test "$(sha256sum /tmp/getguard.patch | cut -d' ' -f1)" = "6f22c56cfff3721350da92896270c8df23810d20bb6e03ddb6586c212ae2a783"
          patch --dry-run -p1 --batch < /tmp/getguard.patch
          patch -p1 --batch < /tmp/getguard.patch

          python3 -m py_compile \
            backend/app/services/investidor_demo.py \
            backend/app/api/receituario.py \
            backend/app/api/documents.py \
            backend/tests/test_investidor_demo_readonly_v2.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm -f \
            .chatgpt/rc72-get-guard.patch.b64 \
            .github/workflows/chatgpt-get-guard.yml

          git add -- \
            backend/app/services/investidor_demo.py \
            backend/app/api/receituario.py \
            backend/app/api/documents.py \
            backend/tests/test_investidor_demo_readonly_v2.py

          git diff --cached --check
          git status --short
          git commit -m "fix(rc): bloqueia GETs operacionais do Investidor"
          git push origin HEAD:${GITHUB_REF_NAME}
