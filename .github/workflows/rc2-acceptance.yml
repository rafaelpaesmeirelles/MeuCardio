name: RC2 Acceptance — Canonical CorVIA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/rc2-acceptance.yml"
      - "frontend/**"
      - "backend/**"
      - "scripts/feature_inventory.py"
      - "content/**"
      - "galeria/**"
      - "exames/**"
      - "evidencias/**"
      - "estudos/**"
      - "medicamentos/**"
      - "checklists/**"
      - "casos-clinicos/**"
      - "trilhas/**"
      - "material-paciente/**"
      - "emergencia/**"
      - "doencas/**"
      - "triagem-sintomas/**"

permissions:
  contents: read

jobs:
  acceptance:
    name: Real corpus + authenticated surface certification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: corvia_rc2_acceptance
      ENVIRONMENT: test
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: meucardio_rc2
      POSTGRES_PASSWORD: rc2-test
      POSTGRES_DB: meucardio_rc2
      REDIS_URL: redis://redis:6379/0
      STORAGE_ENCRYPTION_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
      JWT_SECRET: chave-rc2-acceptance-nao-usar-em-producao
      ADMIN_EMAIL: rc2-acceptance@teste.local
      ADMIN_PASSWORD: rc2-acceptance-seguro-123
      AI_ENABLED: "false"
      MAIL360_CLIENT_ID: id-de-teste
      MAIL360_CLIENT_SECRET: secret-de-teste
      MAIL360_REFRESH_TOKEN: refresh-de-teste
      CORVIA_MAIL_PRECO_CENTAVOS: "1000"
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_rc2_dummy
      PUBLIC_URL: http://127.0.0.1:8080
      UPLOADS_DIR: /tmp/corvia-rc2/uploads
      EXAMES_DIR: /tmp/corvia-rc2/exames-pacientes
      DOCUMENTOS_DIR: /tmp/corvia-rc2/documentos-emitidos

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Create isolated runtime environment
        run: |
          cat > .env <<'ENV'
          COMPOSE_PROJECT_NAME=corvia_rc2_acceptance
          ENVIRONMENT=test
          POSTGRES_HOST=db
          POSTGRES_PORT=5432
          POSTGRES_USER=meucardio_rc2
          POSTGRES_PASSWORD=rc2-test
          POSTGRES_DB=meucardio_rc2
          REDIS_URL=redis://redis:6379/0
          STORAGE_ENCRYPTION_KEY=MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
          JWT_SECRET=chave-rc2-acceptance-nao-usar-em-producao
          ADMIN_EMAIL=rc2-acceptance@teste.local
          ADMIN_PASSWORD=rc2-acceptance-seguro-123
          AI_ENABLED=false
          MAIL360_CLIENT_ID=id-de-teste
          MAIL360_CLIENT_SECRET=secret-de-teste
          MAIL360_REFRESH_TOKEN=refresh-de-teste
          CORVIA_MAIL_PRECO_CENTAVOS=1000
          STRIPE_SECRET_KEY=sk_test_dummy
          STRIPE_WEBHOOK_SECRET=whsec_rc2_dummy
          PUBLIC_URL=http://127.0.0.1:8080
          UPLOADS_DIR=/tmp/corvia-rc2/uploads
          EXAMES_DIR=/tmp/corvia-rc2/exames-pacientes
          DOCUMENTOS_DIR=/tmp/corvia-rc2/documentos-emitidos
          ENV

      - name: Start isolated backend stack
        run: docker compose up -d --build db redis backend

      - name: Wait for backend readiness
        run: |
          for attempt in $(seq 1 90); do
            if docker compose exec -T backend python - <<'PY'
          import urllib.request
          urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=2).read()
          PY
            then exit 0; fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color --tail=250 backend
          exit 1

      - name: Mount complete versioned corpus
        run: |
          BACKEND_ID="$(docker compose ps -q backend)"
          test -n "$BACKEND_ID"
          for dir in galeria exames evidencias estudos medicamentos checklists casos-clinicos trilhas material-paciente emergencia doencas triagem-sintomas; do
            test -e "$dir"
            docker cp "$dir" "$BACKEND_ID:/$dir"
          done
          docker compose exec -T backend test -f /medicamentos/metadados.json
          docker compose exec -T backend test -f /emergencia/metadados.json

      - name: Load official clinical stores
        run: |
          docker compose exec -T backend python - <<'PY'
          from app.services.carregar_drugs import carregar as carregar_drugs
          from app.services.carregar_emergencia import carregar as carregar_emergencia
          resultado_drugs = carregar_drugs('/medicamentos/metadados.json')
          carregar_emergencia()
          assert resultado_drugs.get('total', 0) >= 200, resultado_drugs
          print({'drugs': resultado_drugs, 'emergency': 'loaded'})
          PY

      - name: Reconcile versioned corpus
        run: docker compose exec -T backend python -m app.commands.reconcile_content --publish-reviewed

      - name: Create acceptance administrator
        run: |
          docker compose exec -T backend python -m app.commands.create_admin \
            --email rc2-acceptance@teste.local \
            --password rc2-acceptance-seguro-123 \
            --name "Dr. Visual QA"

      - name: Build production frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Serve production build
        run: |
          mkdir -p rc2-acceptance
          cat > rc2-acceptance/nginx.conf <<'NGINX'
          server {
            listen 80;
            server_name _;
            root /usr/share/nginx/html;
            index index.html;
            location /api/ {
              proxy_pass http://backend:8000/api/;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_buffering off;
            }
            location /uploads/ { proxy_pass http://backend:8000/uploads/; }
            location / { try_files $uri $uri/ /index.html; }
          }
          NGINX
          docker run -d --name corvia-rc2-nginx \
            --network corvia_rc2_acceptance_default \
            -p 8080:80 \
            -v "$PWD/frontend/dist:/usr/share/nginx/html:ro" \
            -v "$PWD/rc2-acceptance/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:8080/api/ready >/dev/null && exit 0
            sleep 2
          done
          exit 1

      - name: Install Playwright Chromium
        run: |
          mkdir -p /tmp/corvia-rc2-playwright
          cd /tmp/corvia-rc2-playwright
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Authenticate, seed clinical state and certify every route
        run: |
          mkdir -p rc2-acceptance/screenshots
          cat > /tmp/corvia-rc2-playwright/acceptance.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import path from 'node:path';

          const base = 'http://127.0.0.1:8080';
          const out = path.join(process.env.GITHUB_WORKSPACE, 'rc2-acceptance', 'screenshots');
          const reportPath = path.join(process.env.GITHUB_WORKSPACE, 'rc2-acceptance', 'report.json');
          fs.mkdirSync(out, { recursive: true });

          const routes = [
            '/', '/apresentacao', '/biblioteca', '/doencas', '/triagem-sintomas', '/fluxogramas',
            '/diretrizes', '/busca', '/calculadoras', '/medicamentos', '/interacoes', '/condicoes',
            '/galeria', '/exames', '/evidencias', '/estudos', '/trilhas', '/trilhas/timeline', '/material-paciente',
            '/emergencia', '/casos-clinicos', '/checklists', '/indicadores', '/cursos', '/favoritos',
            '/assistente', '/round', '/agenda', '/documentos', '/avaliacao-preoperatoria', '/receituario',
            '/assinatura', '/minha-conta', '/sincronizacao', '/telediagnostico', '/caixa-de-email',
            '/corvia-mail', '/usuarios-online', '/admin', '/admin/usuarios', '/fila-telediagnostico'
          ];

          const browser = await chromium.launch({ headless: true });
          const report = { routes: [], failures: [], pageErrors: [] };

          async function login(viewport) {
            const context = await browser.newContext({ viewport, colorScheme: 'dark', locale: 'pt-BR' });
            const page = await context.newPage();
            page.on('pageerror', (e) => report.pageErrors.push(`${page.url()} :: ${String(e)}`));
            await page.goto(`${base}/entrar`, { waitUntil: 'networkidle' });
            await page.locator('#email').fill('rc2-acceptance@teste.local');
            await page.locator('#senha').fill('rc2-acceptance-seguro-123');
            await page.locator('button[type="submit"]').click();
            await page.waitForURL((url) => !url.pathname.includes('/entrar'), { timeout: 20000 });
            await page.waitForTimeout(500);
            return { context, page };
          }

          async function requestJson(page, url, options = {}) {
            return await page.evaluate(async ({ url, options }) => {
              const response = await fetch(url, {
                credentials: 'include',
                headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
                ...options,
              });
              const text = await response.text();
              let body = null;
              try { body = text ? JSON.parse(text) : null; } catch { body = text; }
              return { ok: response.ok, status: response.status, body };
            }, { url, options });
          }

          function fail(message) { report.failures.push(message); }

          try {
            const desktop = await login({ width: 1440, height: 1000 });
            const page = desktop.page;

            const patient = await requestJson(page, '/api/round/patients', {
              method: 'POST',
              body: JSON.stringify({ record_number: 'RC2-0001', initials: 'J.S.', bed: '12', unit: 'Enfermaria' }),
            });
            if (!patient.ok) fail(`seed paciente: HTTP ${patient.status}`);
            if (patient.ok && patient.body?.id) {
              const patch = await requestJson(page, `/api/round/patients/${patient.body.id}`, {
                method: 'PATCH',
                body: JSON.stringify({
                  diagnostic_hypothesis: ['ICFER', 'Hipertensão Arterial', 'Fibrilação Atrial'],
                  medications: ['Sacubitril/Valsartana 49/51 mg 12/12 h', 'Metoprolol succinato 50 mg/dia', 'Rivaroxabana 20 mg/dia'],
                  labs: { Ecocardiograma: 'FE 35%', Creatinina: '1,1 mg/dL', 'K+': '4,6 mEq/L' },
                  plan: 'Otimizar terapia e reavaliar.',
                }),
              });
              if (!patch.ok) fail(`seed contexto paciente: HTTP ${patch.status}`);
            }

            for (const route of routes) {
              try {
                await page.goto(`${base}${route}`, { waitUntil: 'networkidle', timeout: 25000 });
                await page.waitForTimeout(450);
                const state = await page.evaluate(() => {
                  const text = document.body?.innerText || '';
                  return {
                    path: location.pathname,
                    width: innerWidth,
                    scrollWidth: document.documentElement.scrollWidth,
                    stuck: /carregando a tela/i.test(text),
                    serverError: /internal server error|application error|erro 500/i.test(text),
                    shell: !!document.querySelector('.clinical-os'),
                  };
                });
                report.routes.push({ route, ...state });
                if (state.path === '/entrar') fail(`${route}: perdeu sessão`);
                if (state.stuck) fail(`${route}: preso em Carregando a tela`);
                if (state.serverError) fail(`${route}: erro de servidor visível`);
                if (!state.shell && !route.startsWith('/tour')) fail(`${route}: fora do shell canônico`);
                if (state.scrollWidth > state.width + 16 && route !== '/agenda') fail(`${route}: overflow horizontal ${state.scrollWidth} > ${state.width}`);
              } catch (e) {
                fail(`${route}: ${e}`);
              }
            }

            await page.goto(`${base}/`, { waitUntil: 'networkidle' });
            await page.screenshot({ path: path.join(out, 'desktop-home.png'), fullPage: false });

            const drugResponse = await requestJson(page, '/api/drugs');
            const drugs = Array.isArray(drugResponse.body) ? drugResponse.body : [];
            const selected = drugs.find((d) => /sacubitril/i.test(d.generic_name || '')) || drugs[0];
            if (!selected?.slug) fail('medicamentos: loader oficial não retornou slug');
            else {
              await page.goto(`${base}/medicamentos?slug=${encodeURIComponent(selected.slug)}`, { waitUntil: 'networkidle' });
              await page.locator('.mc-command').waitFor({ state: 'visible', timeout: 15000 });
              await page.screenshot({ path: path.join(out, 'desktop-medication-command.png'), fullPage: false });
            }

            await page.goto(`${base}/round`, { waitUntil: 'networkidle' });
            await page.locator('.pc-command').waitFor({ state: 'visible', timeout: 15000 });
            await page.screenshot({ path: path.join(out, 'desktop-patient-command.png'), fullPage: false });

            await page.goto(`${base}/emergencia`, { waitUntil: 'networkidle' });
            const firstProtocol = page.locator('.emerg__alvo').first();
            if (!await firstProtocol.count()) fail('emergencia: loader oficial não retornou protocolos');
            else {
              await firstProtocol.click();
              await page.locator('.emerg-command__layout').waitFor({ state: 'visible', timeout: 10000 });
              await page.screenshot({ path: path.join(out, 'desktop-emergency-command.png'), fullPage: false });
            }

            await page.goto(`${base}/trilhas/timeline`, { waitUntil: 'networkidle' });
            await page.screenshot({ path: path.join(out, 'desktop-science-timeline.png'), fullPage: false });

            await page.goto(`${base}/`, { waitUntil: 'networkidle' });
            await page.locator('.ccc-assistant-input').click();
            await page.locator('.cos-assistant-panel.is-open').waitFor({ state: 'visible', timeout: 10000 });
            await page.screenshot({ path: path.join(out, 'desktop-personal-assistant.png'), fullPage: false });
            await desktop.context.close();

            const mobile = await login({ width: 390, height: 844 });
            await mobile.page.goto(`${base}/`, { waitUntil: 'networkidle' });
            await mobile.page.screenshot({ path: path.join(out, 'mobile-home.png'), fullPage: false });
            const labels = await mobile.page.locator('.cc-mobile-nav > * span').allTextContents();
            const expected = ['Início', 'Buscar', 'Pacientes', 'Agenda', 'Mais'];
            if (JSON.stringify(labels.slice(0, 5)) !== JSON.stringify(expected)) fail(`mobile/nav divergente: ${JSON.stringify(labels.slice(0, 5))}`);
            await mobile.page.locator('.ccc-mobile-summary__card--assistant').click();
            await mobile.page.locator('.cos-assistant-panel.is-open').waitFor({ state: 'visible', timeout: 10000 });
            await mobile.page.screenshot({ path: path.join(out, 'mobile-personal-assistant.png'), fullPage: false });
            await mobile.context.close();
          } catch (e) {
            fail(`acceptance runner: ${e?.stack || e}`);
          } finally {
            await browser.close();
          }

          if (report.pageErrors.length) fail(`page errors: ${report.pageErrors.join(' | ')}`);
          fs.writeFileSync(reportPath, JSON.stringify(report, null, 2));
          console.log(JSON.stringify(report, null, 2));
          if (report.failures.length) process.exitCode = 1;
          JS
          cd /tmp/corvia-rc2-playwright
          node acceptance.mjs

      - name: Validate canonical feature inventory
        run: python3 scripts/feature_inventory.py

      - name: Upload RC2 acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: corvia-rc2-acceptance
          path: rc2-acceptance/
          if-no-files-found: warn
          retention-days: 7

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose logs --no-color --tail=300 backend
          docker logs corvia-rc2-nginx || true

      - name: Stop isolated stack
        if: always()
        run: |
          docker rm -f corvia-rc2-nginx 2>/dev/null || true
          docker compose down -v --remove-orphans
