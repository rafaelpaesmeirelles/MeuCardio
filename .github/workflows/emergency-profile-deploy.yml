name: CorVIA Intelligence final verification

on:
  push:
    branches:
      - ops/intelligence-final-fc4-20260829
    paths:
      - .github/workflows/emergency-profile-deploy.yml

permissions:
  contents: read

concurrency:
  group: corvia-intelligence-scientific-radar
  cancel-in-progress: false

jobs:
  verify-and-run:
    name: Verify production SHA and run CorVIA Intelligence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      TARGET_SHA: fc4eb947973700843b781487d832e26697d04d65
      PUBLIC_URL: https://corvia.med.br
      SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
      SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
      SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
    steps:
      - name: Confirm exact deployed production SHA
        run: |
          set -euo pipefail
          version_file="$RUNNER_TEMP/version.json"
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 \
            "$PUBLIC_URL/api/version" > "$version_file"
          python3 - "$version_file" "$TARGET_SHA" <<'PY'
          import json, sys
          path, expected = sys.argv[1:]
          with open(path, encoding="utf-8") as handle:
              payload = json.load(handle)
          actual = payload.get("commit") or payload.get("version") or payload.get("sha")
          if actual != expected:
              raise SystemExit(f"Production reports {actual!r}; expected {expected!r}")
          print(f"Production version confirmed: {actual}")
          PY
          curl --fail --silent --show-error "$PUBLIC_URL/api/health" > /dev/null
          curl --fail --silent --show-error "$PUBLIC_URL/api/ready" > /dev/null
          echo "Production SHA, health and readiness confirmed."

      - name: Prepare restricted SSH client
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Missing PRODUCTION_SSH_HOST}"
          : "${SSH_USER:?Missing PRODUCTION_SSH_USER}"
          : "${SSH_PRIVATE_KEY:?Missing PRODUCTION_SSH_PRIVATE_KEY}"
          : "${SSH_KNOWN_HOSTS:?Missing PRODUCTION_SSH_KNOWN_HOSTS}"
          SSH_PORT="${SSH_PORT:-22}"
          ssh_dir="$RUNNER_TEMP/corvia-intelligence-ssh"
          install -m 0700 -d "$ssh_dir"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$ssh_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 0600 "$ssh_dir/key" "$ssh_dir/known_hosts"
          echo "SSH_DIR=$ssh_dir" >> "$GITHUB_ENV"
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"

      - name: Run CorVIA Intelligence inside deployed production backend
        run: |
          set -euo pipefail
          ssh \
            -p "$SSH_PORT" \
            -i "$SSH_DIR/key" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$SSH_DIR/known_hosts" \
            "$SSH_USER@$SSH_HOST" \
            "intelligence $TARGET_SHA"
