name: Corpus database reconciliation

on:
  pull_request:
    paths:
      - "backend/app/commands/reconcile_content.py"
      - "backend/app/services/**"
      - "backend/app/models/**"
      - "backend/migrations/**"
      - "content/**"
      - "galeria/**"
      - "exames/**"
      - "evidencias/**"
      - "estudos/**"
      - "medicamentos/**"
      - "checklists/**"
      - "trilhas/**"
      - "material-paciente/**"
      - "emergencia/**"
      - "casos-clinicos/**"
      - "doencas/**"
      - "triagem-sintomas/**"
      - "controlados/**"
      - ".github/workflows/corpus-database.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    name: Load 5,035 scientific records
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: meucardio_test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: meucardio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meucardio_test -d meucardio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      ENVIRONMENT: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: meucardio_test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: meucardio_test
      STORAGE_ENCRYPTION_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
      JWT_SECRET: chave-de-teste-nao-usar-em-producao
      ADMIN_EMAIL: admin@teste.local
      ADMIN_PASSWORD: admin-teste-123
      AI_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Apply migrations
        working-directory: backend
        run: python -m app.commands.migrate

      - name: Reconcile and publish reviewed corpus
        working-directory: backend
        run: python -m app.commands.reconcile_content --publish-reviewed
