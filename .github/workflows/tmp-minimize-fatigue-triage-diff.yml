name: Temporary minimize fatigue triage diff

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  minimize:
    if: github.event.pull_request.head.ref == 'content/triagem-fadiga-intolerancia-esforco-20260821'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Rebuild manifest from pinned base preserving existing formatting
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          path = Path('triagem-sintomas/metadados.json')
          slug = 'fadiga-e-intolerancia-ao-esforco'
          base_sha = 'aedc0d38d447725747534d6ecf8c51ddd2a6f988'

          current = json.loads(path.read_text(encoding='utf-8'))
          records = [item for item in current if isinstance(item, dict) and item.get('slug') == slug]
          if len(records) != 1:
              raise SystemExit(f'expected exactly one fatigue record in current branch, got {len(records)}')
          record = records[0]

          base_raw = subprocess.check_output(
              ['git', 'show', f'{base_sha}:triagem-sintomas/metadados.json'],
              text=True,
              encoding='utf-8',
          )
          base_data = json.loads(base_raw)
          if any(isinstance(item, dict) and item.get('slug') == slug for item in base_data):
              raise SystemExit('fatigue slug unexpectedly exists in pinned base')

          stripped = base_raw.rstrip()
          if not stripped.endswith(']'):
              raise SystemExit('base manifest does not end with JSON list delimiter')
          prefix = stripped[:-1].rstrip()
          record_json = json.dumps(record, ensure_ascii=False, indent=2)
          record_json = '  ' + record_json.replace('\n', '\n  ')
          new_raw = prefix + ',\n' + record_json + '\n]\n'

          expected = base_data + [record]
          parsed = json.loads(new_raw)
          if parsed != expected:
              raise SystemExit('semantic round-trip mismatch after minimal append')
          slugs = [item.get('slug') for item in parsed if isinstance(item, dict)]
          if len(slugs) != len(set(slugs)):
              raise SystemExit('duplicate slugs after minimal append')

          path.write_text(new_raw, encoding='utf-8')
          print(json.dumps({'base_records': len(base_data), 'final_records': len(parsed), 'added': slug}, ensure_ascii=False))
          PY
          git diff --check

      - name: Commit minimal manifest diff and remove temporary workflow
        run: |
          rm .github/workflows/tmp-minimize-fatigue-triage-diff.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add triagem-sintomas/metadados.json .github/workflows/tmp-minimize-fatigue-triage-diff.yml
          git commit -m "chore: minimize fatigue triage manifest diff"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
