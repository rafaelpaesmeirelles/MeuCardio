name: Temporary fix patient laboratory unit wording

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'content/consolidate-claude-science-backlog-20260821'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Normalize LDL laboratory unit wording
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('material-paciente/metadados.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          slug = 'colesterol-alto-que-vem-de-familia-o-que-e-hipercolesterolemia-familiar'
          hits = [r for r in data if r.get('slug') == slug]
          if len(hits) != 1:
              raise SystemExit(f'expected exactly one target record, got {len(hits)}')
          rec = hits[0]
          old = '190 mg/dL'
          new = '190 miligramas por decilitro (mg/dL)'

          def count(v):
              if isinstance(v, str):
                  return v.count(old)
              if isinstance(v, list):
                  return sum(count(x) for x in v)
              if isinstance(v, dict):
                  return sum(count(x) for x in v.values())
              return 0

          def replace(v):
              if isinstance(v, str):
                  return v.replace(old, new)
              if isinstance(v, list):
                  return [replace(x) for x in v]
              if isinstance(v, dict):
                  return {k: replace(x) for k, x in v.items()}
              return v

          occurrences = count(rec)
          if occurrences == 0:
              print('Laboratory unit wording already normalized.')
              raise SystemExit(0)
          if occurrences != 1:
              raise SystemExit(f'guard mismatch: expected 1 occurrence, got {occurrences}')
          idx = data.index(rec)
          data[idx] = replace(rec)
          if count(data[idx]) != 0:
              raise SystemExit('old laboratory wording remains in target record')
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'Normalized one LDL laboratory threshold in {slug}')
          PY
          git diff --check
      - name: Commit laboratory wording normalization
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add material-paciente/metadados.json
          git commit -m "fix(content): disambiguate LDL laboratory unit from medication dose"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
