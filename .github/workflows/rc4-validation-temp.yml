name: RC4 Temporary Validation

on:
  push:
    branches:
      - release/conteudo-mobile-deslocamento-20260813-rc4

permissions:
  contents: read

jobs:
  backend-and-content:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: meucardio_test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: meucardio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meucardio_test -d meucardio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      ENVIRONMENT: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: meucardio_test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: meucardio_test
      REDIS_URL: redis://localhost:6379/0
      STORAGE_ENCRYPTION_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
      JWT_SECRET: chave-de-teste-nao-usar-em-producao
      ADMIN_EMAIL: admin@teste.local
      ADMIN_PASSWORD: admin-teste-123
      AI_ENABLED: "false"
      MAIL360_CLIENT_ID: id-de-teste
      MAIL360_CLIENT_SECRET: secret-de-teste
      MAIL360_REFRESH_TOKEN: refresh-de-teste
      CORVIA_MAIL_PRECO_CENTAVOS: "1000"
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_teste_dummy
      PUBLIC_URL: https://corvia.med.br
      UPLOADS_DIR: /tmp/corvia-test/uploads
      EXAMES_DIR: /tmp/corvia-test/exames-pacientes
      DOCUMENTOS_DIR: /tmp/corvia-test/documentos-emitidos
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Workflow and shell validation
        run: |
          python scripts/check_workflow_actions.py
          bash -n ops/*.sh
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Migrate test database
        working-directory: backend
        run: |
          python -m app.commands.migrate
          python -m app.commands.migrate
      - name: Compile backend
        working-directory: backend
        run: python -m compileall -q app tests migrations
      - name: Backend tests
        working-directory: backend
        run: python -m pytest -q --tb=short
      - name: Scientific corpus inventory
        run: python scripts/content_inventory.py --minimum-records 5035 --minimum-files 1329 --strict
      - name: Canonical feature inventory
        run: python3 scripts/feature_inventory.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Security and architecture gates
        working-directory: frontend
        run: |
          npm run audit:security
          node scripts/check-auth-storage.mjs
          node scripts/check-rendering-security.mjs
          node --test scripts/check-rendering-security.test.mjs
          node scripts/check-route-splitting.mjs
      - name: Production build
        working-directory: frontend
        run: |
          npm run build
          node scripts/check-bundle-budget.mjs
