name: Temporary prepare Claude content for consolidated release
on:
  push:
    branches: [claude/aprofundar-avaliacao-multidimensional-cardiogeriatrica-20260828]
    paths: [.github/workflows/temporary-prepare-release.yml]
permissions: {contents: write}
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - run: |
          git fetch origin release/all-pending-20260828
          git checkout origin/release/all-pending-20260828 -- backend/tests/test_canonical_content_review_status.py backend/tests/test_disease_fragments_canonical.py
          mkdir -p doencas/correcoes
          echo '[{"slug":"avaliacao-multidimensional-cardiogeriatrica","set":{"review_status":"revisado","review_note":"Aprofundamento Tudo com Tudo produzido pelo Claude e publicação explicitamente autorizada pelo responsável médico em 28/08/2026 para o release consolidado, após revisão dos gates e vínculos clínicos. Mantém necessidade de julgamento clínico individual."}}]' > doencas/correcoes/release-approve-20260828-avaliacao-multidimensional-cardiogeriatrica.json
          git rm .github/workflows/temporary-prepare-release.yml
          git diff --check
          git config user.name 'CorVIA Release Bot'; git config user.email 'actions@users.noreply.github.com'
          git add backend/tests doencas/correcoes
          git commit -m 'review(science): preparar avaliação cardiogeriátrica para release'
          git push origin HEAD:claude/aprofundar-avaliacao-multidimensional-cardiogeriatrica-20260828
