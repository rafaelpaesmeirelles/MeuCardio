name: Deploy production

on:
  workflow_run:
    workflows:
      - CI
      - RC2 Acceptance — Canonical CorVIA
      - Visual QA — Clinical OS
      - Corpus database reconciliation
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character SHA from main (defaults to current main)
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: corvia-production-deploy
  cancel-in-progress: false

jobs:
  certify:
    name: Confirm exact main SHA and mandatory gates
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.gates.outputs.ready }}
      sha: ${{ steps.gates.outputs.sha }}
    steps:
      - name: Require every release gate for the current main SHA
        id: gates
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
          REQUESTED_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail

          current_main="$(gh api "repos/${REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          candidate="$current_main"
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            candidate="$EVENT_SHA"
          elif [[ -n "$REQUESTED_SHA" ]]; then
            candidate="$REQUESTED_SHA"
          fi

          if [[ ! "$candidate" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid full commit SHA: $candidate" >&2
            exit 64
          fi

          echo "sha=$candidate" >> "$GITHUB_OUTPUT"
          if [[ "$candidate" != "$current_main" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Ignoring $candidate because current main is $current_main."
            exit 0
          fi

          runs_file="$RUNNER_TEMP/workflow-runs.json"
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${REPOSITORY}/actions/runs?branch=main&head_sha=${candidate}&per_page=100" \
            > "$runs_file"

          if python3 - "$runs_file" "$candidate" <<'PY'
          import json
          import sys

          path, expected_sha = sys.argv[1:]
          with open(path, encoding="utf-8") as handle:
              runs = json.load(handle)["workflow_runs"]

          required = {
              "CI": "push",
              "RC2 Acceptance — Canonical CorVIA": "workflow_dispatch",
              "Visual QA — Clinical OS": "workflow_dispatch",
              "Corpus database reconciliation": "workflow_dispatch",
          }
          latest = {}
          for run in runs:
              name = run.get("name")
              if (
                  name not in required
                  or run.get("head_sha") != expected_sha
                  or run.get("head_branch") != "main"
                  or run.get("event") != required[name]
              ):
                  continue
              previous = latest.get(name)
              if previous is None or run.get("created_at", "") > previous.get("created_at", ""):
                  latest[name] = run

          failures = []
          for name in required:
              run = latest.get(name)
              if run is None:
                  failures.append(f"{name}: missing")
              elif run.get("status") != "completed" or run.get("conclusion") != "success":
                  failures.append(
                      f"{name}: status={run.get('status')} conclusion={run.get('conclusion')}"
                  )

          if failures:
              print("Mandatory gates are not all green for this exact SHA:")
              for failure in failures:
                  print(f"- {failure}")
              raise SystemExit(1)

          print(f"All mandatory gates succeeded for {expected_sha}.")
          PY
          then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy certified SHA through restricted SSH
    needs: certify
    if: needs.certify.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: production
    env:
      TARGET_SHA: ${{ needs.certify.outputs.sha }}
      SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
      SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
      SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
    steps:
      - name: Deploy exact SHA and publish signed Android 1.0.1 APK
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Missing PRODUCTION_SSH_HOST}"
          : "${SSH_USER:?Missing PRODUCTION_SSH_USER}"
          : "${SSH_PRIVATE_KEY:?Missing PRODUCTION_SSH_PRIVATE_KEY}"
          : "${SSH_KNOWN_HOSTS:?Missing PRODUCTION_SSH_KNOWN_HOSTS}"
          SSH_PORT="${SSH_PORT:-22}"

          ssh_dir="$RUNNER_TEMP/corvia-ssh"
          install -m 0700 -d "$ssh_dir"
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$ssh_dir/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 0600 "$ssh_dir/deploy_key" "$ssh_dir/known_hosts"

          ssh \
            -p "$SSH_PORT" \
            -i "$ssh_dir/deploy_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$ssh_dir/known_hosts" \
            "$SSH_USER@$SSH_HOST" \
            "deploy $TARGET_SHA"

          ssh \
            -p "$SSH_PORT" \
            -i "$ssh_dir/deploy_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$ssh_dir/known_hosts" \
            "$SSH_USER@$SSH_HOST" \
            "apk $TARGET_SHA"

      - name: Verify public production
        env:
          PUBLIC_URL: https://corvia.med.br
        run: |
          set -euo pipefail
          version_file="$RUNNER_TEMP/version.json"
          curl --fail --silent --show-error \
            --retry 6 --retry-all-errors --retry-delay 5 \
            "$PUBLIC_URL/api/version" > "$version_file"
          python3 - "$version_file" "$TARGET_SHA" <<'PY'
          import json
          import sys

          path, expected = sys.argv[1:]
          with open(path, encoding="utf-8") as handle:
              payload = json.load(handle)
          actual = payload.get("commit") or payload.get("version") or payload.get("sha")
          if actual != expected:
              raise SystemExit(f"Production reports {actual!r}; expected {expected!r}")
          print(f"Production version confirmed: {actual}")
          PY
          curl --fail --silent --show-error "$PUBLIC_URL/api/health" > /dev/null
          curl --fail --silent --show-error "$PUBLIC_URL/api/ready" > /dev/null
          curl --fail --silent --show-error --head "$PUBLIC_URL/downloads/corvia-os-android-1.0.1.apk" > /dev/null
          curl --fail --silent --show-error "$PUBLIC_URL/downloads/corvia-os-android-1.0.1.apk.sha256" > /dev/null
          echo "Production health, readiness and Android 1.0.1 download confirmed."
