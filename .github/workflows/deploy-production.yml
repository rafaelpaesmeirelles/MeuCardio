name: Deploy production

on:
  workflow_run:
    workflows:
      - CI
      - RC2 Acceptance — Canonical CorVIA
      - Visual QA — Clinical OS
      - Corpus database reconciliation
      - Deep functional inventory and public apps
      - Native installers
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character SHA from main (defaults to current main)
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: corvia-production-deploy
  cancel-in-progress: false

jobs:
  certify:
    name: Confirm exact main SHA and mandatory gates
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.gates.outputs.ready }}
      sha: ${{ steps.gates.outputs.sha }}
      native_run_id: ${{ steps.gates.outputs.native_run_id }}
    steps:
      - name: Require every release gate for the current main SHA
        id: gates
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
          REQUESTED_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/${REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          candidate="$current_main"
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then candidate="$EVENT_SHA";
          elif [[ -n "$REQUESTED_SHA" ]]; then candidate="$REQUESTED_SHA"; fi
          [[ "$candidate" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid full commit SHA: $candidate" >&2; exit 64; }
          echo "sha=$candidate" >> "$GITHUB_OUTPUT"
          if [[ "$candidate" != "$current_main" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Ignoring $candidate because current main is $current_main."
            exit 0
          fi
          runs_file="$RUNNER_TEMP/workflow-runs.json"
          gh api -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${REPOSITORY}/actions/runs?branch=main&head_sha=${candidate}&per_page=100" > "$runs_file"
          python3 - "$runs_file" "$candidate" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys

          path, expected_sha, output_path = sys.argv[1:]
          with open(path, encoding="utf-8") as handle:
              runs = json.load(handle)["workflow_runs"]
          required = {
              "CI": "push",
              "RC2 Acceptance — Canonical CorVIA": "workflow_dispatch",
              "Visual QA — Clinical OS": "workflow_dispatch",
              "Corpus database reconciliation": "workflow_dispatch",
              "Deep functional inventory and public apps": "workflow_dispatch",
              "Native installers": "workflow_dispatch",
          }
          latest = {}
          for run in runs:
              name = run.get("name")
              if (name not in required or run.get("head_sha") != expected_sha
                      or run.get("head_branch") != "main" or run.get("event") != required[name]):
                  continue
              previous = latest.get(name)
              if previous is None or run.get("created_at", "") > previous.get("created_at", ""):
                  latest[name] = run
          failures = []
          for name in required:
              run = latest.get(name)
              if run is None:
                  failures.append(f"{name}: missing")
              elif run.get("status") != "completed" or run.get("conclusion") != "success":
                  failures.append(f"{name}: status={run.get('status')} conclusion={run.get('conclusion')}")
          if failures:
              print("Mandatory gates are not all green for this exact SHA:")
              for failure in failures: print(f"- {failure}")
              raise SystemExit(1)
          native_run_id = latest["Native installers"].get("id")
          if not isinstance(native_run_id, int):
              raise SystemExit("Native installers run has no numeric run id")
          with open(output_path, "a", encoding="utf-8") as output:
              output.write(f"native_run_id={native_run_id}\n")
          print(f"All mandatory gates succeeded for {expected_sha}; native run {native_run_id}.")
          PY
          echo "ready=true" >> "$GITHUB_OUTPUT"

  deploy:
    name: Stage native clients and deploy certified SHA
    needs: certify
    if: needs.certify.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      TARGET_SHA: ${{ needs.certify.outputs.sha }}
      NATIVE_RUN_ID: ${{ needs.certify.outputs.native_run_id }}
      ANDROID_CERT_SHA256: ${{ vars.CORVIA_ANDROID_CERT_SHA256 }}
      WINDOWS_CERT_SHA256: ${{ vars.CORVIA_WINDOWS_SIGNING_CERT_SHA256 }}
      SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
      SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
      SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
    steps:
      - name: Checkout certified release validators
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Download exact certified Windows artifact
        id: windows
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$NATIVE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "Invalid certified native run id" >&2; exit 65; }
          artifact_dir="$RUNNER_TEMP/corvia-windows"
          install -d -m 0700 "$artifact_dir"
          gh run download "$NATIVE_RUN_ID" --repo "$REPOSITORY" \
            --name corvia-cardiology-spaces-windows-1.2.0 --dir "$artifact_dir"
          installer="$artifact_dir/corvia-cardiology-spaces-windows-1.2.0.exe"
          sidecar="$installer.sha256"
          source_sha="$artifact_dir/source-sha.txt"
          signer_sha="$artifact_dir/windows-signing-cert-sha256.txt"
          [[ -s "$installer" && -s "$sidecar" && -s "$source_sha" && -s "$signer_sha" ]] \
            || { echo "Windows artifact is incomplete" >&2; exit 65; }
          [[ "$(tr -d '[:space:]' < "$source_sha")" == "$TARGET_SHA" ]] \
            || { echo "Windows artifact was built from another commit" >&2; exit 65; }
          artifact_sha="$(sha256sum "$installer" | cut -d' ' -f1)"
          grep -Eiq "^${artifact_sha}([[:space:]]|$)" "$sidecar" \
            || { echo "Windows artifact digest differs from sidecar" >&2; exit 65; }
          [[ "$(od -An -tx1 -N2 "$installer" | tr -d '[:space:]')" == "4d5a" ]] \
            || { echo "Windows artifact is not a PE executable" >&2; exit 65; }
          expected_signer="$(printf '%s' "$WINDOWS_CERT_SHA256" | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          artifact_signer="$(tr -d '[:space:]:' < "$signer_sha" | tr '[:upper:]' '[:lower:]')"
          [[ "$expected_signer" =~ ^[0-9a-f]{64}$ && "$artifact_signer" == "$expected_signer" ]] \
            || { echo "Windows artifact signer differs from pinned certificate" >&2; exit 65; }
          echo "sha256=$artifact_sha" >> "$GITHUB_OUTPUT"
          echo "path=$installer" >> "$GITHUB_OUTPUT"

      - name: Prepare restricted SSH transport
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Missing PRODUCTION_SSH_HOST}"
          : "${SSH_USER:?Missing PRODUCTION_SSH_USER}"
          : "${SSH_PRIVATE_KEY:?Missing PRODUCTION_SSH_PRIVATE_KEY}"
          : "${SSH_KNOWN_HOSTS:?Missing PRODUCTION_SSH_KNOWN_HOSTS}"
          [[ "$ANDROID_CERT_SHA256" =~ ^[0-9A-Fa-f:]{64,95}$ ]] \
            || { echo "CORVIA_ANDROID_CERT_SHA256 repository variable is missing or invalid" >&2; exit 65; }
          ssh_dir="$RUNNER_TEMP/corvia-ssh"
          install -m 0700 -d "$ssh_dir"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$ssh_dir/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 0600 "$ssh_dir/deploy_key" "$ssh_dir/known_hosts"

      - name: Stage bounded Windows installer before web mutation
        run: |
          set -euo pipefail
          SSH_PORT="${SSH_PORT:-22}"
          timeout 360s ssh -p "$SSH_PORT" -i "$RUNNER_TEMP/corvia-ssh/deploy_key" \
            -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$RUNNER_TEMP/corvia-ssh/known_hosts" \
            "$SSH_USER@$SSH_HOST" "windows-stage $TARGET_SHA ${{ steps.windows.outputs.sha256 }}" \
            < "${{ steps.windows.outputs.path }}"

      - name: Build and stage signed Android, deploy web, then promote both clients
        id: release
        run: |
          set -euo pipefail
          SSH_PORT="${SSH_PORT:-22}"
          cert="$(printf '%s' "$ANDROID_CERT_SHA256" | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          [[ "$cert" =~ ^[0-9a-f]{64}$ ]] || { echo "Invalid normalized Android certificate SHA-256" >&2; exit 65; }
          release_log="$RUNNER_TEMP/corvia-release.log"
          timeout 3000s ssh -p "$SSH_PORT" -i "$RUNNER_TEMP/corvia-ssh/deploy_key" \
            -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$RUNNER_TEMP/corvia-ssh/known_hosts" \
            "$SSH_USER@$SSH_HOST" \
            "deploy-release $TARGET_SHA ${{ steps.windows.outputs.sha256 }} $cert" | tee "$release_log"
          android_sha="$(sed -n 's/^ANDROID_SHA256=//p' "$release_log" | tail -n 1)"
          [[ "$android_sha" =~ ^[0-9a-f]{64}$ ]] \
            || { echo "Remote release did not return a valid Android digest" >&2; exit 65; }
          echo "android_sha256=$android_sha" >> "$GITHUB_OUTPUT"

      - name: Verify exact production release and public artifacts
        env:
          PUBLIC_URL: https://corvia.med.br
          EXPECTED_ANDROID_SHA256: ${{ steps.release.outputs.android_sha256 }}
          EXPECTED_WINDOWS_SHA256: ${{ steps.windows.outputs.sha256 }}
        run: |
          set -euo pipefail
          cache_buster="${TARGET_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          version_file="$RUNNER_TEMP/version.json"
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 \
            -H 'Cache-Control: no-cache, no-store, max-age=0' \
            "$PUBLIC_URL/api/version?release=$cache_buster" > "$version_file"
          python3 - "$version_file" "$TARGET_SHA" <<'PY'
          import json
          import sys
          path, expected = sys.argv[1:]
          with open(path, encoding="utf-8") as handle: payload = json.load(handle)
          actual = payload.get("commit") or payload.get("version") or payload.get("sha")
          if actual != expected: raise SystemExit(f"Production reports {actual!r}; expected {expected!r}")
          print(f"Production version confirmed: {actual}")
          PY
          curl --fail --silent --show-error -H 'Cache-Control: no-cache' "$PUBLIC_URL/api/health?release=$cache_buster" > /dev/null
          curl --fail --silent --show-error -H 'Cache-Control: no-cache' "$PUBLIC_URL/api/ready?release=$cache_buster" > /dev/null
          python3 scripts/validate_public_app_artifacts.py --base-url "$PUBLIC_URL" \
            --expected-android-sha256 "$EXPECTED_ANDROID_SHA256" \
            --expected-windows-sha256 "$EXPECTED_WINDOWS_SHA256" \
            --cache-buster "$cache_buster"
          echo "Production SHA and exact Android/Windows 1.2.0 digests confirmed."
