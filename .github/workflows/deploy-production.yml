name: Deploy production

on:
  workflow_run:
    workflows:
      - RC2 Acceptance — Canonical CorVIA
      - Visual QA — Clinical OS
      - Corpus database reconciliation
      - Deep functional inventory and public apps
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character SHA from main (defaults to current main)
        required: false
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  # This repository-wide lock serializes the four workflow_run triggers and
  # reruns. A successful deploy job in Actions history is the durable SHA claim.
  group: corvia-production-deploy
  cancel-in-progress: false

jobs:
  certify:
    name: Confirm exact main SHA and mandatory gates
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.ready.outputs.ready }}
      sha: ${{ steps.candidate.outputs.sha }}
      claimed: ${{ steps.claim.outputs.claimed }}
    steps:
      - name: Resolve one immutable current-main candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
          REQUESTED_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/${REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          candidate="$current_main"
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            candidate="$EVENT_SHA"
          elif [[ -n "$REQUESTED_SHA" ]]; then
            candidate="$REQUESTED_SHA"
          fi
          [[ "$candidate" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "Invalid full commit SHA: $candidate" >&2; exit 64; }
          echo "sha=$candidate" >> "$GITHUB_OUTPUT"
          if [[ "$candidate" == "$current_main" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Ignoring obsolete candidate $candidate; current main is $current_main."
          fi

      - name: Checkout policy from the immutable candidate
        if: steps.candidate.outputs.current == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.candidate.outputs.sha }}

      - name: Claim the merge SHA or recognize a completed deployment
        id: claim
        if: steps.candidate.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          CURRENT_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: >-
          python scripts/ci_release_policy.py check-deploy-claim
          --repository "$REPOSITORY"
          --sha "$CANDIDATE_SHA"
          --current-run-id "$CURRENT_RUN_ID"
          --current-run-attempt "$CURRENT_RUN_ATTEMPT"
          --github-output "$GITHUB_OUTPUT"

      - name: Verify equivalent source PR and pre-merge CI
        if: >-
          steps.candidate.outputs.current == 'true' &&
          steps.claim.outputs.claimed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: >-
          python scripts/ci_release_policy.py verify-merged-pr-ci
          --repository "$REPOSITORY"
          --merge-sha "$CANDIDATE_SHA"
          --attempts 3
          --delay 2

      - name: Verify exact workflow paths, IDs and green gate runs
        if: >-
          steps.candidate.outputs.current == 'true' &&
          steps.claim.outputs.claimed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: >-
          python scripts/ci_release_policy.py verify-release-gates
          --repository "$REPOSITORY"
          --sha "$CANDIDATE_SHA"

      - name: Freeze certified candidate
        id: ready
        if: steps.candidate.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/${REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test "$current_main" = "$CANDIDATE_SHA"
          echo "ready=true" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy certified web and Android release
    needs: certify
    if: needs.certify.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      TARGET_SHA: ${{ needs.certify.outputs.sha }}
      CLAIMED: ${{ needs.certify.outputs.claimed }}
      REPOSITORY: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      # Public fingerprint of the existing production release certificate.
      # The repository variable remains an explicit override for a controlled
      # certificate rotation; no private signing material is stored in Git.
      ANDROID_CERT_SHA256: ${{ vars.CORVIA_ANDROID_CERT_SHA256 || '1344fed66fce26841b5fbb6a302a27ad5cd207c1b8fb989005e9be370148ce5e' }}
      SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
      SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
      SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
    steps:
      - name: Checkout certified release validators
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Prepare restricted SSH transport
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Missing PRODUCTION_SSH_HOST}"
          : "${SSH_USER:?Missing PRODUCTION_SSH_USER}"
          : "${SSH_PRIVATE_KEY:?Missing PRODUCTION_SSH_PRIVATE_KEY}"
          : "${SSH_KNOWN_HOSTS:?Missing PRODUCTION_SSH_KNOWN_HOSTS}"
          [[ "$ANDROID_CERT_SHA256" =~ ^[0-9A-Fa-f:]{64,95}$ ]] \
            || { echo "CORVIA_ANDROID_CERT_SHA256 repository variable is missing or invalid" >&2; exit 65; }
          ssh_dir="$RUNNER_TEMP/corvia-ssh"
          install -m 0700 -d "$ssh_dir"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$ssh_dir/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 0600 "$ssh_dir/deploy_key" "$ssh_dir/known_hosts"

      - name: Revalidate current main and deploy the certified release
        id: release
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/${REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$current_main" != "$TARGET_SHA" ]]; then
            echo "Blocking obsolete deploy $TARGET_SHA; current main is $current_main" >&2
            exit 1
          fi
          python scripts/ci_release_policy.py verify-release-gates \
            --repository "$REPOSITORY" --sha "$TARGET_SHA"
          current_main="$(gh api "repos/${REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test "$current_main" = "$TARGET_SHA"

          SSH_PORT="${SSH_PORT:-22}"
          cert="$(printf '%s' "$ANDROID_CERT_SHA256" | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          [[ "$cert" =~ ^[0-9a-f]{64}$ ]] \
            || { echo "Invalid normalized Android certificate SHA-256" >&2; exit 65; }
          [[ "$CLAIMED" == "true" || "$CLAIMED" == "false" ]] \
            || { echo "Deploy claim state is invalid" >&2; exit 65; }
          remote_command="deploy-web-android $TARGET_SHA $cert"
          remote_timeout="3000s"
          if [[ "$CLAIMED" == "true" ]]; then
            remote_command="verify-release $TARGET_SHA $cert"
            remote_timeout="300s"
          fi
          release_log="$RUNNER_TEMP/corvia-release.log"
          timeout "$remote_timeout" ssh -p "$SSH_PORT" -i "$RUNNER_TEMP/corvia-ssh/deploy_key" \
            -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$RUNNER_TEMP/corvia-ssh/known_hosts" \
            "$SSH_USER@$SSH_HOST" \
            "$remote_command" | tee "$release_log"
          android_sha="$(sed -n 's/^ANDROID_SHA256=//p' "$release_log" | tail -n 1)"
          [[ "$android_sha" =~ ^[0-9a-f]{64}$ ]] \
            || { echo "Remote release did not return a valid Android digest" >&2; exit 65; }
          echo "android_sha256=$android_sha" >> "$GITHUB_OUTPUT"

      - name: Verify exact production release and public artifacts
        env:
          PUBLIC_URL: https://corvia.med.br
          EXPECTED_ANDROID_SHA256: ${{ steps.release.outputs.android_sha256 }}
        run: |
          set -euo pipefail
          cache_buster="${TARGET_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          version_file="$RUNNER_TEMP/version.json"
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 \
            -H 'Cache-Control: no-cache, no-store, max-age=0' \
            "$PUBLIC_URL/api/version?release=$cache_buster" > "$version_file"
          python3 - "$version_file" "$TARGET_SHA" <<'PY'
          import json
          import sys
          path, expected = sys.argv[1:]
          with open(path, encoding="utf-8") as handle: payload = json.load(handle)
          actual = payload.get("commit") or payload.get("version") or payload.get("sha")
          if actual != expected: raise SystemExit(f"Production reports {actual!r}; expected {expected!r}")
          print(f"Production version confirmed: {actual}")
          PY
          curl --fail --silent --show-error -H 'Cache-Control: no-cache' \
            "$PUBLIC_URL/api/health?release=$cache_buster" > /dev/null
          curl --fail --silent --show-error -H 'Cache-Control: no-cache' \
            "$PUBLIC_URL/api/ready?release=$cache_buster" > /dev/null
          python3 scripts/validate_public_app_artifacts.py --base-url "$PUBLIC_URL" \
            --artifacts android \
            --expected-android-sha256 "$EXPECTED_ANDROID_SHA256" \
            --cache-buster "$cache_buster"
          windows_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            -H 'Cache-Control: no-cache' \
            "$PUBLIC_URL/downloads/corvia-cardiology-spaces-windows-1.2.0.exe?release=$cache_buster")"
          [[ "$windows_status" == "410" ]] \
            || { echo "Windows download returned HTTP $windows_status; expected pending status 410" >&2; exit 65; }
          echo "Production SHA, Android 1.2.0 digest and Windows-pending login confirmed."
