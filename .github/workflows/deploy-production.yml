name: Deploy production

on:
  workflow_run:
    workflows:
      - CI
      - RC2 Acceptance — Canonical CorVIA
      - Visual QA — Clinical OS
      - Corpus database reconciliation
      - Corpus inventory
      - Deep functional inventory and public apps
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character SHA from main (defaults to current main)
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: corvia-production-deploy
  cancel-in-progress: false

jobs:
  certify:
    name: Confirm exact main SHA and mandatory gates
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.gates.outputs.ready }}
      sha: ${{ steps.gates.outputs.sha }}
    steps:
      - name: Require every release gate for the current main SHA
        id: gates
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
          REQUESTED_SHA: ${{ inputs.sha }}
          EXPECTED_EMERGENCY_SHA: ${{ vars.CORVIA_AGENDA_SEARCH_EMERGENCY_SHA }}
          # SHA que passou pelos gates frontend, mas falhou antes do commit da
          # migration. A recuperação autorizada deve ser seu descendente direto.
          EMERGENCY_BASE_SHA: b918703065525771ee25de0f7c62a271b2af3bfb
          EMERGENCY_MARKER: "[agenda-search-emergency]"
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/${REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          candidate="$current_main"
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then candidate="$EVENT_SHA";
          elif [[ -n "$REQUESTED_SHA" ]]; then candidate="$REQUESTED_SHA"; fi
          [[ "$candidate" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid full commit SHA: $candidate" >&2; exit 64; }
          echo "sha=$candidate" >> "$GITHUB_OUTPUT"
          if [[ "$candidate" != "$current_main" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Ignoring $candidate because current main is $current_main."
            exit 0
          fi
          runs_file="$RUNNER_TEMP/workflow-runs.json"
          commit_file="$RUNNER_TEMP/candidate-commit.json"
          prior_deploy_candidates="$RUNNER_TEMP/prior-deploy-candidates"
          prior_deploy_marker="$RUNNER_TEMP/prior-certified-deploy"
          emergency_marker="$RUNNER_TEMP/authorized-emergency-release"
          gh api -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${REPOSITORY}/actions/runs?branch=main&head_sha=${candidate}&per_page=100" > "$runs_file"
          gh api -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${REPOSITORY}/commits/${candidate}" > "$commit_file"
          python3 - \
            "$runs_file" "$commit_file" "$candidate" "$GITHUB_RUN_ID" \
            "$prior_deploy_candidates" "$emergency_marker" \
            "$EXPECTED_EMERGENCY_SHA" "$EMERGENCY_BASE_SHA" "$EMERGENCY_MARKER" <<'PY'
          import json
          import sys

          (
              runs_path, commit_path, expected_sha, current_run_id,
              prior_deploy_candidates, emergency_marker,
              expected_emergency_sha, emergency_base_sha, emergency_marker_text,
          ) = sys.argv[1:]
          with open(runs_path, encoding="utf-8") as handle:
              runs = json.load(handle)["workflow_runs"]
          with open(commit_path, encoding="utf-8") as handle:
              commit = json.load(handle)

          allowed_emergency_paths = {
              ".github/workflows/ci.yml",
              ".github/workflows/deploy-production.yml",
              "backend/app/api/agenda_integrada.py",
              "backend/app/api/checklists.py",
              "backend/app/api/emergencia.py",
              "backend/app/api/evidence.py",
              "backend/app/api/library.py",
              "backend/app/api/search.py",
              "backend/app/api/specialty_guides.py",
              "backend/app/services/clinical_text.py",
              "backend/app/services/exportacao_conteudo.py",
              "backend/app/services/guideline_clinical_update.py",
              "backend/app/services/guideline_clinical_update_runtime.py",
              "backend/migrations/versions/f93s20260901_disable_reserved_smoke_agenda.py",
              "backend/tests/test_agenda_integrada.py",
              "backend/tests/test_guideline_clinical_update_runtime.py",
              "backend/tests/test_search_tudo_com_tudo.py",
              "frontend/scripts/check-cardiology-spaces-app-frame-contract.test.mjs",
              "frontend/src/components/ChatFlutuante.tsx",
              "frontend/src/components/ClinicalUpdates.tsx",
              "frontend/src/pages/Agenda.tsx",
              "frontend/src/pages/ChecklistModelo.tsx",
              "frontend/src/pages/Evidencia.tsx",
              "frontend/src/pages/GuiaDoenca.tsx",
              "frontend/src/pages/TriagemSintomas.tsx",
              "frontend/src/styles/cardiology-spaces-app-frame.css",
              "frontend/src/styles/shell.css",
          }
          required_emergency_paths = {
              ".github/workflows/ci.yml",
              ".github/workflows/deploy-production.yml",
              "backend/migrations/versions/f93s20260901_disable_reserved_smoke_agenda.py",
          }
          emergency_authorized = False
          if expected_emergency_sha == expected_sha:
              parents = [item.get("sha") for item in commit.get("parents", [])]
              message = str(commit.get("commit", {}).get("message") or "")
              files = commit.get("files") or []
              changed_paths = {str(item.get("filename") or "") for item in files}
              safe_statuses = all(
                  item.get("status") in {"added", "modified"}
                  and not item.get("previous_filename")
                  for item in files
              )
              ci_green = any(
                  run.get("name") == "CI"
                  and run.get("head_sha") == expected_sha
                  and run.get("head_branch") == "main"
                  and run.get("event") == "push"
                  and run.get("status") == "completed"
                  and run.get("conclusion") == "success"
                  for run in runs
              )
              emergency_authorized = (
                  parents == [emergency_base_sha]
                  and emergency_marker_text in message
                  and bool(changed_paths)
                  and changed_paths <= allowed_emergency_paths
                  and required_emergency_paths <= changed_paths
                  and safe_statuses
                  and ci_green
              )
              if emergency_authorized:
                  with open(emergency_marker, "w", encoding="utf-8") as handle:
                      handle.write(expected_sha + "\n")

          required = {
              "CI": "push",
              "RC2 Acceptance — Canonical CorVIA": "workflow_dispatch",
              "Visual QA — Clinical OS": "workflow_dispatch",
              "Corpus database reconciliation": "workflow_dispatch",
              "Corpus inventory": "workflow_dispatch",
              "Deep functional inventory and public apps": "workflow_dispatch",
          }
          if not emergency_authorized:
              latest = {}
              for run in runs:
                  name = run.get("name")
                  if (name not in required or run.get("head_sha") != expected_sha
                          or run.get("head_branch") != "main" or run.get("event") != required[name]):
                      continue
                  previous = latest.get(name)
                  if previous is None or run.get("created_at", "") > previous.get("created_at", ""):
                      latest[name] = run
              failures = []
              for name in required:
                  run = latest.get(name)
                  if run is None:
                      failures.append(f"{name}: missing")
                  elif run.get("status") != "completed" or run.get("conclusion") != "success":
                      failures.append(f"{name}: status={run.get('status')} conclusion={run.get('conclusion')}")
              if failures:
                  print("Mandatory gates are not all green for this exact SHA:")
                  for failure in failures: print(f"- {failure}")
                  raise SystemExit(1)
          # Cada gate concluído dispara este workflow. A fila serial pode deixar
          # um segundo run pronto depois que o primeiro já publicou e certificou
          # a release. Só um run anterior COMPLETO e VERDE deste próprio workflow
          # é prova suficiente para deduplicar: /api/version isoladamente não
          # certifica health, readiness nem o APK público.
          prior_successes = [
              run for run in runs
              if run.get("name") == "Deploy production"
              and str(run.get("id")) != current_run_id
              and run.get("head_sha") == expected_sha
              and run.get("head_branch") == "main"
              and run.get("status") == "completed"
              and run.get("conclusion") == "success"
          ]
          with open(prior_deploy_candidates, "w", encoding="utf-8") as handle:
              for run in prior_successes:
                  run_id = run.get("id")
                  if isinstance(run_id, int):
                      handle.write(f"{run_id}\n")
          if emergency_authorized:
              print(f"Single-use emergency release authorized for {expected_sha}; frontend CI is green.")
          else:
              print(f"All mandatory web/Android/scientific gates succeeded for {expected_sha}; Windows is pending.")
          PY
          # Um workflow pode terminar verde com o job de deploy pulado (por
          # exemplo, dispatch solicitado para SHA antigo). Confirme nos jobs do
          # run que a publicação + certificação de artefatos realmente executou.
          while IFS= read -r prior_run; do
            [[ "$prior_run" =~ ^[0-9]+$ ]] || continue
            certified_jobs="$(gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${REPOSITORY}/actions/runs/${prior_run}/jobs?per_page=100" \
              --jq '[.jobs[] | select(.name == "Deploy certified web and Android release" and .status == "completed" and .conclusion == "success")] | length')"
            if [[ "$certified_jobs" =~ ^[1-9][0-9]*$ ]]; then
              printf '%s\n' "$prior_run" > "$prior_deploy_marker"
              break
            fi
          done < "$prior_deploy_candidates"
          if [[ -s "$prior_deploy_marker" ]]; then
            prior_run="$(cat "$prior_deploy_marker")"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Certified deploy run $prior_run already completed for $candidate; skipping duplicate deployment."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy certified web and Android release
    needs: certify
    if: needs.certify.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      TARGET_SHA: ${{ needs.certify.outputs.sha }}
      # Public fingerprint of the existing production release certificate.
      # The repository variable remains an explicit override for a controlled
      # certificate rotation; no private signing material is stored in Git.
      ANDROID_CERT_SHA256: ${{ vars.CORVIA_ANDROID_CERT_SHA256 || '1344fed66fce26841b5fbb6a302a27ad5cd207c1b8fb989005e9be370148ce5e' }}
      SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
      SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
      SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
    steps:
      - name: Checkout certified release validators
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Prepare restricted SSH transport
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Missing PRODUCTION_SSH_HOST}"
          : "${SSH_USER:?Missing PRODUCTION_SSH_USER}"
          : "${SSH_PRIVATE_KEY:?Missing PRODUCTION_SSH_PRIVATE_KEY}"
          : "${SSH_KNOWN_HOSTS:?Missing PRODUCTION_SSH_KNOWN_HOSTS}"
          [[ "$ANDROID_CERT_SHA256" =~ ^[0-9A-Fa-f:]{64,95}$ ]] \
            || { echo "CORVIA_ANDROID_CERT_SHA256 repository variable is missing or invalid" >&2; exit 65; }
          ssh_dir="$RUNNER_TEMP/corvia-ssh"
          install -m 0700 -d "$ssh_dir"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$ssh_dir/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 0600 "$ssh_dir/deploy_key" "$ssh_dir/known_hosts"

      - name: Build and stage signed Android, then deploy certified web release
        id: release
        run: |
          set -euo pipefail
          SSH_PORT="${SSH_PORT:-22}"
          cert="$(printf '%s' "$ANDROID_CERT_SHA256" | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          [[ "$cert" =~ ^[0-9a-f]{64}$ ]] || { echo "Invalid normalized Android certificate SHA-256" >&2; exit 65; }
          release_log="$RUNNER_TEMP/corvia-release.log"
          timeout 3000s ssh -p "$SSH_PORT" -i "$RUNNER_TEMP/corvia-ssh/deploy_key" \
            -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$RUNNER_TEMP/corvia-ssh/known_hosts" \
            "$SSH_USER@$SSH_HOST" \
            "deploy-web-android $TARGET_SHA $cert" | tee "$release_log"
          android_sha="$(sed -n 's/^ANDROID_SHA256=//p' "$release_log" | tail -n 1)"
          [[ "$android_sha" =~ ^[0-9a-f]{64}$ ]] \
            || { echo "Remote release did not return a valid Android digest" >&2; exit 65; }
          echo "android_sha256=$android_sha" >> "$GITHUB_OUTPUT"

      - name: Verify exact production release and public artifacts
        env:
          PUBLIC_URL: https://corvia.med.br
          EXPECTED_ANDROID_SHA256: ${{ steps.release.outputs.android_sha256 }}
        run: |
          set -euo pipefail
          cache_buster="${TARGET_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          version_file="$RUNNER_TEMP/version.json"
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 \
            -H 'Cache-Control: no-cache, no-store, max-age=0' \
            "$PUBLIC_URL/api/version?release=$cache_buster" > "$version_file"
          python3 - "$version_file" "$TARGET_SHA" <<'PY'
          import json
          import sys
          path, expected = sys.argv[1:]
          with open(path, encoding="utf-8") as handle: payload = json.load(handle)
          actual = payload.get("commit") or payload.get("version") or payload.get("sha")
          if actual != expected: raise SystemExit(f"Production reports {actual!r}; expected {expected!r}")
          print(f"Production version confirmed: {actual}")
          PY
          curl --fail --silent --show-error -H 'Cache-Control: no-cache' "$PUBLIC_URL/api/health?release=$cache_buster" > /dev/null
          curl --fail --silent --show-error -H 'Cache-Control: no-cache' "$PUBLIC_URL/api/ready?release=$cache_buster" > /dev/null
          python3 scripts/validate_public_app_artifacts.py --base-url "$PUBLIC_URL" \
            --artifacts android \
            --expected-android-sha256 "$EXPECTED_ANDROID_SHA256" \
            --cache-buster "$cache_buster"
          windows_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            -H 'Cache-Control: no-cache' \
            "$PUBLIC_URL/downloads/corvia-cardiology-spaces-windows-1.2.0.exe?release=$cache_buster")"
          [[ "$windows_status" == "410" ]] \
            || { echo "Windows download returned HTTP $windows_status; expected pending status 410" >&2; exit 65; }
          echo "Production SHA, Android 1.2.0 digest and Windows-pending login confirmed."
