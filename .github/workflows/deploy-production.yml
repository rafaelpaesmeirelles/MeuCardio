name: Deploy production

on:
  workflow_run:
    workflows:
      - CI
      - RC2 Acceptance — Canonical CorVIA
      - Visual QA — Clinical OS
      - Corpus database reconciliation
      - Corpus inventory
      - Deep functional inventory and public apps
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character SHA from main (defaults to current main)
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: corvia-production-deploy
  cancel-in-progress: false

jobs:
  certify:
    name: Confirm exact main SHA and mandatory gates
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.gates.outputs.ready }}
      sha: ${{ steps.gates.outputs.sha }}
    steps:
      - name: Require every release gate for the current main SHA
        id: gates
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
          REQUESTED_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/${REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          candidate="$current_main"
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then candidate="$EVENT_SHA";
          elif [[ -n "$REQUESTED_SHA" ]]; then candidate="$REQUESTED_SHA"; fi
          [[ "$candidate" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid full commit SHA: $candidate" >&2; exit 64; }
          echo "sha=$candidate" >> "$GITHUB_OUTPUT"
          if [[ "$candidate" != "$current_main" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Ignoring $candidate because current main is $current_main."
            exit 0
          fi
          runs_file="$RUNNER_TEMP/workflow-runs.json"
          prior_deploy_candidates="$RUNNER_TEMP/prior-deploy-candidates"
          prior_deploy_marker="$RUNNER_TEMP/prior-certified-deploy"
          ci_run_marker="$RUNNER_TEMP/certified-ci-run"
          gh api -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${REPOSITORY}/actions/runs?branch=main&head_sha=${candidate}&per_page=100" > "$runs_file"
          python3 - \
            "$runs_file" "$candidate" "$GITHUB_RUN_ID" \
            "$prior_deploy_candidates" "$ci_run_marker" <<'PY'
          import json
          import sys

          (
              runs_path, expected_sha, current_run_id,
              prior_deploy_candidates, ci_run_marker,
          ) = sys.argv[1:]
          with open(runs_path, encoding="utf-8") as handle:
              runs = json.load(handle)["workflow_runs"]

          required = {
              "CI": "push",
              "RC2 Acceptance — Canonical CorVIA": "workflow_dispatch",
              "Visual QA — Clinical OS": "workflow_dispatch",
              "Corpus database reconciliation": "workflow_dispatch",
              "Corpus inventory": "workflow_dispatch",
              "Deep functional inventory and public apps": "workflow_dispatch",
          }
          latest = {}
          for run in runs:
              name = run.get("name")
              if (name not in required or run.get("head_sha") != expected_sha
                      or run.get("head_branch") != "main" or run.get("event") != required[name]):
                  continue
              previous = latest.get(name)
              if previous is None or run.get("created_at", "") > previous.get("created_at", ""):
                  latest[name] = run
          failures = []
          for name in required:
              run = latest.get(name)
              if run is None:
                  failures.append(f"{name}: missing")
              elif run.get("status") != "completed" or run.get("conclusion") != "success":
                  failures.append(f"{name}: status={run.get('status')} conclusion={run.get('conclusion')}")
          if failures:
              print("Mandatory gates are not all green for this exact SHA:")
              for failure in failures: print(f"- {failure}")
              raise SystemExit(1)
          ci_run_id = latest["CI"].get("id")
          if not isinstance(ci_run_id, int):
              raise SystemExit("Successful CI run has no valid numeric id")
          with open(ci_run_marker, "w", encoding="utf-8") as handle:
              handle.write(f"{ci_run_id}\n")

          prior_successes = [
              run for run in runs
              if run.get("name") == "Deploy production"
              and str(run.get("id")) != current_run_id
              and run.get("head_sha") == expected_sha
              and run.get("head_branch") == "main"
              and run.get("status") == "completed"
              and run.get("conclusion") == "success"
          ]
          with open(prior_deploy_candidates, "w", encoding="utf-8") as handle:
              for run in prior_successes:
                  run_id = run.get("id")
                  if isinstance(run_id, int):
                      handle.write(f"{run_id}\n")
          print(f"All mandatory web/scientific gates succeeded for {expected_sha}.")
          PY
          [[ -s "$ci_run_marker" ]] || { echo "No certified CI run was selected." >&2; exit 65; }
          ci_run="$(cat "$ci_run_marker")"
          [[ "$ci_run" =~ ^[0-9]+$ ]] || { echo "Invalid certified CI run id: $ci_run" >&2; exit 65; }
          risk_gate_count="$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${REPOSITORY}/actions/runs/${ci_run}/jobs?filter=all&per_page=100" \
            --jq '[.jobs[] | select(.name == "Backend risk gate" and .status == "completed" and .conclusion == "success")] | length')"
          [[ "$risk_gate_count" =~ ^[1-9][0-9]*$ ]] || {
            echo "CI run $ci_run has no successful Backend risk gate." >&2
            exit 65
          }
          while IFS= read -r prior_run; do
            [[ "$prior_run" =~ ^[0-9]+$ ]] || continue
            certified_jobs="$(gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${REPOSITORY}/actions/runs/${prior_run}/jobs?per_page=100" \
              --jq '[.jobs[] | select(.name == "Deploy certified web release" and .status == "completed" and .conclusion == "success")] | length')"
            if [[ "$certified_jobs" =~ ^[1-9][0-9]*$ ]]; then
              printf '%s\n' "$prior_run" > "$prior_deploy_marker"
              break
            fi
          done < "$prior_deploy_candidates"
          if [[ -s "$prior_deploy_marker" ]]; then
            prior_run="$(cat "$prior_deploy_marker")"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Certified web deploy run $prior_run already completed for $candidate; skipping duplicate deployment."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy certified web release
    needs: certify
    if: needs.certify.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      TARGET_SHA: ${{ needs.certify.outputs.sha }}
      SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
      SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
      SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
    steps:
      - name: Checkout certified release validators
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Prepare restricted SSH transport
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Missing PRODUCTION_SSH_HOST}"
          : "${SSH_USER:?Missing PRODUCTION_SSH_USER}"
          : "${SSH_PRIVATE_KEY:?Missing PRODUCTION_SSH_PRIVATE_KEY}"
          : "${SSH_KNOWN_HOSTS:?Missing PRODUCTION_SSH_KNOWN_HOSTS}"
          ssh_dir="$RUNNER_TEMP/corvia-ssh"
          install -m 0700 -d "$ssh_dir"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$ssh_dir/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 0600 "$ssh_dir/deploy_key" "$ssh_dir/known_hosts"

      - name: Deploy certified web release
        run: |
          set -euo pipefail
          SSH_PORT="${SSH_PORT:-22}"
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid main SHA" >&2; exit 65; }
          timeout 3000s ssh -p "$SSH_PORT" -i "$RUNNER_TEMP/corvia-ssh/deploy_key" \
            -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$RUNNER_TEMP/corvia-ssh/known_hosts" \
            "$SSH_USER@$SSH_HOST" \
            "deploy-web $TARGET_SHA"

      - name: Verify exact production web release
        env:
          PUBLIC_URL: https://corvia.med.br
        run: |
          set -euo pipefail
          cache_buster="${TARGET_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          version_file="$RUNNER_TEMP/version.json"
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 \
            -H 'Cache-Control: no-cache, no-store, max-age=0' \
            "$PUBLIC_URL/api/version?release=$cache_buster" > "$version_file"
          python3 - "$version_file" "$TARGET_SHA" <<'PY'
          import json
          import sys
          path, expected = sys.argv[1:]
          with open(path, encoding="utf-8") as handle: payload = json.load(handle)
          actual = payload.get("commit") or payload.get("version") or payload.get("sha")
          if actual != expected: raise SystemExit(f"Production reports {actual!r}; expected {expected!r}")
          print(f"Production version confirmed: {actual}")
          PY
          curl --fail --silent --show-error -H 'Cache-Control: no-cache' "$PUBLIC_URL/api/health?release=$cache_buster" > /dev/null
          curl --fail --silent --show-error -H 'Cache-Control: no-cache' "$PUBLIC_URL/api/ready?release=$cache_buster" > /dev/null
          echo "Production web SHA, health and readiness confirmed."
