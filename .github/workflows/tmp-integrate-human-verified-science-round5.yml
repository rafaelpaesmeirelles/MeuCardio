name: Temporary human-verified science round 5 integrator

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: human-verified-round5-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  integrate:
    if: github.head_ref == 'content/integrate-claude-science-round5-20260821'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: content/integrate-claude-science-round5-20260821

      - name: Detect completed integration
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          if git log -1 --pretty=%B | grep -Fq '[human-verified-integrated]'; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch and pin source PR heads
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          while IFS='|' read -r branch expected; do
            [ -n "$branch" ] || continue
            git fetch --no-tags origin "refs/heads/${branch}:refs/remotes/origin/${branch}"
            actual="$(git rev-parse "refs/remotes/origin/${branch}")"
            if [ "$actual" != "$expected" ]; then
              echo "Source head moved: ${branch}: expected ${expected}, got ${actual}" >&2
              exit 1
            fi
          done <<'EOF'
          content/checklists-round5-sincope-ti|f80e901fc858135f6dfd393e0d8c258f6affac12
          content/checklists-round5-dispositivos-farmacologia|3a419f1fb5fe33a42f65a3cd771b28235084c102
          content/checklists-round5-reumatica-arritmias|aae5313ac05506f25e8812d74ccaf5cb6b2cda4b
          content/checklists-round5-perioperatorio-gravidez|cbbfb0d3bcca3814f26c94cdc66fe296805df29e
          EOF

      - name: Integrate eight scientifically verified checklists and repair source documents
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy
          import json
          import re
          import subprocess
          from pathlib import Path

          MARKER = "VERIFICAÇÃO HUMANA NECESSÁRIA"
          FALSE_REVIEW = (
              "Revisado e aprovado para publicação por Dr. Rafael Paes Meirelles",
              "Revisado e aprovado por Dr. Rafael Paes Meirelles",
          )
          NEUTRAL_REVIEW = (
              "Revisão editorial, científica e documental concluída para integração neste lote. "
              "O conteúdo permanece rastreável pelo documento de origem e pelas fontes primárias registradas, "
              "sem atribuição de revisão clínica individual a pessoa específica."
          )

          sources = {
              "origin/content/checklists-round5-sincope-ti": [
                  "pocus-tamponamento-cardiaco-versus-pneumotorax-hipertensivo",
                  "manejo-da-falencia-aguda-do-ventriculo-direito-cor-pulmonale-agudo",
                  "escore-romeo-indicacao-de-ecocardiograma-na-sincope-do-idoso",
              ],
              "origin/content/checklists-round5-dispositivos-farmacologia": [
                  "rm-em-marcapasso-ou-cdi-nao-condicional-triagem-e-protocolo-magnasafe",
                  "decisao-de-troca-eletiva-de-gerador-de-marcapasso-ou-cdi-escore-dare",
                  "inicio-de-amiodarona-em-paciente-anticoagulado-com-varfarina-ajuste-de-inr",
              ],
              "origin/content/checklists-round5-reumatica-arritmias": [
                  "decisao-de-cirurgia-valvar-na-cardite-reumatica-fulminante-em-fase-ativa",
              ],
              "origin/content/checklists-round5-perioperatorio-gravidez": [
                  "checklist-protocolo-eras-cardiaco-em-cirurgia-cardiaca",
              ],
          }

          manifest_path = Path("checklists/metadados.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          known_slugs = {x["slug"] for x in manifest}
          known_origins = {
              (x.get("theme"), x.get("documento_origem"))
              for x in manifest if x.get("documento_origem")
          }
          selected = []

          for ref, wanted in sources.items():
              raw = subprocess.check_output(
                  ["git", "show", f"{ref}:checklists/metadados.json"],
                  text=True,
                  encoding="utf-8",
              )
              records = {x.get("slug"): x for x in json.loads(raw)}
              for slug in wanted:
                  if slug not in records:
                      raise SystemExit(f"Missing source checklist: {slug} in {ref}")
                  if slug in known_slugs:
                      raise SystemExit(f"Checklist already exists in integration branch: {slug}")
                  selected.append(copy.deepcopy(records[slug]))

          if len(selected) != 8:
              raise SystemExit(f"Expected 8 selected checklists, got {len(selected)}")

          def item_by_id(record, item_id):
              for entry in record.get("itens", []):
                  if entry.get("id") == item_id:
                      return entry
              raise SystemExit(f"Missing item {item_id} in {record.get('slug')}")

          # 1) ROMEO — derivation full text + 2026 external validation checked.
          romeo = next(x for x in selected if x["slug"] == "escore-romeo-indicacao-de-ecocardiograma-na-sincope-do-idoso")
          romeo["source_refs"] = [
              "Probst MA, Gibson TA, Weiss RE, et al. Predictors of Clinically Significant Echocardiography Findings in Older Adults with Syncope: A Secondary Analysis. J Hosp Med. 2018;13(12):823-828. DOI: 10.12788/jhm.3082. PMID: 30255862. Texto integral conferido em PMC em 21/08/2026: derivação em adultos ≥60 anos; ROMEO=0 com sensibilidade 99,5% (IC95% 97,4-99,9) e especificidade 15,4%.",
              "DeAngelis J, Vargas G, Weiss RE, et al. Predicting Echocardiography Findings in Adults Presenting to the Emergency Department With Syncope: An External Validation of the ROMEO Score. Acad Emerg Med. 2026;33(6):e70366. DOI: 10.1111/acem.70366. PMID: 42340085. Texto integral conferido na Wiley em 21/08/2026: adultos ≥40 anos sem diagnóstico grave na emergência; ROMEO=0 com sensibilidade 98,9%, VPN 98,6%, especificidade 20,2% e AUC 0,83 (IC95% 0,79-0,87).",
          ]
          old = item_by_id(romeo, "romeo-limite-fonte-verificacao-humana")
          old.update({
              "id": "romeo-validacao-externa-e-limites",
              "categoria": "orientacao",
              "obrigatorio": True,
              "texto": (
                  "ROMEO = 0 interpretado como marcador de muito baixo risco de achado ecocardiográfico significativo: "
                  "na derivação em pacientes ≥60 anos teve sensibilidade 99,5%; na validação externa de 2026 em adultos ≥40 anos "
                  "sem diagnóstico grave na emergência teve sensibilidade 98,9%, VPN 98,6% e AUC 0,83. Usar como apoio à decisão "
                  "sobre ecocardiograma, não como regra de internação/alta nem substituto do julgamento clínico; a validação externa "
                  "teve potencial viés de seleção e predominância de centros urbanos/acadêmicos."
              ),
              "origem_secao": "Validação externa e limites",
          })

          # 2) Generator replacement — programming can conserve battery, but ERI requires intensified follow-up.
          gen = next(x for x in selected if x["slug"] == "decisao-de-troca-eletiva-de-gerador-de-marcapasso-ou-cdi-escore-dare")
          if not any("37211145" in s for s in gen.get("source_refs", [])):
              gen.setdefault("source_refs", []).append(
                  "Ferrick AM, Raj SR, Deneke T, et al. 2023 HRS/EHRA/APHRS/LAHRS expert consensus statement on practical management of the remote device clinic. Heart Rhythm. 2023;20(9):e92-e144. DOI: 10.1016/j.hrthm.2023.03.1525. PMID: 37211145. Texto integral conferido em 21/08/2026: transmissões a cada 1-3 meses ao se aproximar da troca eletiva; próximo ou além do ERI, monitorização provavelmente mensal, com longevidade operacional esperada de cerca de 90 dias a partir desse ponto, reconhecendo variação por dispositivo/fabricante."
              )
          gi = item_by_id(gen, "troca-gerador-reprogramacao-adiamento")
          gi.update({
              "texto": (
                  "Programação que reduza consumo pode prolongar a longevidade do gerador ao longo do seguimento, mas não deve ser "
                  "usada como substituto rotineiro da troca planejada depois que o dispositivo atinge ERI. Ao se aproximar da troca "
                  "eletiva, intensificar o acompanhamento; o consenso HRS/EHRA/APHRS/LAHRS 2023 orienta transmissões a cada 1-3 meses "
                  "e, próximo ou além do ERI, monitorização provavelmente mensal, citando cerca de 90 dias de longevidade operacional "
                  "esperada a partir desse ponto. Esse intervalo não é garantia individual e deve respeitar modelo, fabricante, dependência "
                  "de estimulação e decisão compartilhada no paciente de alto risco."
              ),
              "origem_secao": "Programação, ERI e decisão de troca",
          })

          # 3) Amiodarone-warfarin — long half-life validates prolonged, individualized INR surveillance.
          amio = next(x for x in selected if x["slug"] == "inicio-de-amiodarona-em-paciente-anticoagulado-com-varfarina-ajuste-de-inr")
          if not any("DailyMed" in s for s in amio.get("source_refs", [])):
              amio.setdefault("source_refs", []).append(
                  "DailyMed. Amiodarone Hydrochloride Tablets, seção 12.3 Pharmacokinetics e interações. Conferido em 21/08/2026: após tratamento oral crônico, meia-vida terminal da amiodarona 26-107 dias (média ~53; maioria 40-55 dias) e do metabólito ativo desetilamiodarona ~61 dias; a resposta individual é variável e a interação com varfarina exige monitorização estreita do INR."
              )
          ai = item_by_id(amio, "amio-varf-prazo-seguranca-indefinido")
          ai.update({
              "texto": (
                  "Após suspender amiodarona, não usar um prazo fixo universal para encerrar a vigilância do INR. Após terapia crônica, "
                  "a meia-vida terminal da amiodarona varia de 26 a 107 dias (média ~53 dias) e a do metabólito ativo é ~61 dias; por isso, "
                  "o efeito farmacocinético pode persistir por semanas a meses. Manter INR mais frequente e ajustar a varfarina até estabilidade "
                  "seriada, individualizando pela tendência do INR e pelos riscos hemorrágico e trombótico."
              ),
              "origem_secao": "Persistência farmacocinética após suspensão",
          })

          # 4) Fulminant rheumatic carditis — primary sources resolve numbers and correct chordal elongation 70% -> 90%.
          rheum = next(x for x in selected if x["slug"] == "decisao-de-cirurgia-valvar-na-cardite-reumatica-fulminante-em-fase-ativa")
          rheum["source_refs"] = [
              "Marcus RH, Sareli P, Pocock WA, et al. Functional anatomy of severe mitral regurgitation in active rheumatic carditis. Am J Cardiol. 1989;63(9):577-584. DOI: 10.1016/0002-9149(89)90902-8. PMID: 2919562. Série anatômico-cirúrgica de 73 pacientes: prolapso do folheto anterior 94%, dilatação anular 96% e alongamento cordal 90%.",
              "Barlow JB, Marcus RH, Pocock WA, et al. Mechanisms and management of heart failure in active rheumatic carditis. S Afr Med J. 1990;78(4):181-186. PMID: 2200147. Revisão clínica que relaciona a insuficiência cardíaca à lesão valvar esquerda hemodinamicamente importante e sustenta cirurgia como medida salvadora quando há falência refratária.",
              "Al Kasab S, Al Fagih MR, Shahid M, Habbab M, Al Zaibag M. Valve surgery in acute rheumatic heart disease. One- to four-year follow-up. Chest. 1988;94(4):830-833. DOI: 10.1378/chest.94.4.830. PMID: 3168577. Seis pacientes NYHA IV com insuficiência ventricular esquerda intratável; sem mortalidade no seguimento médio de 2 anos, todos em NYHA I-II.",
              "Lewis BS, et al. Emergency valve replacement in acute rheumatic carditis. Ann Thorac Surg. 1979;27:529-535. DOI: 10.1016/S0003-4975(10)63364-4. PMID: 454031. Pequena série histórica de quatro pacientes criticamente enfermos tratados com cirurgia de emergência, usada apenas como evidência observacional de suporte, não como estimativa prognóstica generalizável."
          ]
          ri = item_by_id(rheum, "crf-cirurgia-numeros-verificacao-humana-necessaria")
          ri.update({
              "id": "crf-cirurgia-evidencia-primaria-e-limites",
              "categoria": "avaliacao",
              "obrigatorio": False,
              "texto": (
                  "Dados primários conferidos: em série anatômico-cirúrgica de 73 pacientes com regurgitação mitral grave e cardite reumática ativa, "
                  "prolapso do folheto anterior ocorreu em 94%, dilatação anular em 96% e alongamento cordal em 90%. Em uma pequena série de seis "
                  "pacientes NYHA IV com insuficiência ventricular esquerda intratável submetidos a cirurgia, não houve mortalidade no seguimento médio "
                  "de 2 anos e todos estavam em NYHA I-II; outra série histórica de quatro pacientes críticos também relatou bom resultado clínico. "
                  "São dados observacionais, antigos e de amostras pequenas: sustentam a possibilidade de cirurgia salvadora na falência refratária, mas "
                  "não permitem promessa de prognóstico nem comparação causal."
              ),
              "origem_secao": "Evidência primária e limitações das séries históricas",
          })

          # 5) ERAS Cardiac — primary 2019 grading and 2025 safety outcomes checked in full text.
          eras = next(x for x in selected if x["slug"] == "checklist-protocolo-eras-cardiaco-em-cirurgia-cardiaca")
          eras["resumo"] = (
              "Checklist operacional derivado do consenso ERAS Cardiac Society de 2019 e de uma implementação que agrupou 15 medidas por fase perioperatória. "
              "O texto primário com COR/LOE foi conferido, e a metanálise de 2025 confirma redução de permanência hospitalar/UTI e ventilação sem demonstrar "
              "benefício de mortalidade."
          )
          eras["source_refs"] = [
              "Engelman DT, Ben Ali W, Williams JB, et al. Guidelines for Perioperative Care in Cardiac Surgery: Enhanced Recovery After Surgery Society Recommendations. JAMA Surg. 2019;154(8):755-766. DOI: 10.1001/jamasurg.2019.1153. PMID: 31054241. Texto integral e tabela de Classification of Recommendation/Level of Evidence conferidos em 21/08/2026.",
              "Dave MG, Chudyk AM, Oravec N, et al. Putting patient value first: Using a modified nominal group technique for the implementation of enhanced recovery after cardiac surgery recommendations. JTCVS Open. 2022. DOI: 10.1016/j.xjon.2022.07.004. Texto integral de acesso aberto; agrupamento operacional de 15 medidas por fase.",
              "Hoogma DF, Meeusen I, Coppens S, et al. Efficacy of enhanced recovery programmes for cardiac surgery: a systematic review and meta-analysis. Br J Anaesth. 2025;135(1):31-39. DOI: 10.1016/j.bja.2025.03.019. PMID: 40287362. PMCID: PMC12597454. Texto integral conferido em 21/08/2026: 18 estudos/2.625 pacientes; redução de LOS/UTI/ventilação e análise explícita de segurança."
          ]
          # Make the fasting wording match the primary 2019 recommendation.
          ei = item_by_id(eras, "eras-cardiaco-jejum-liquidos-claros")
          ei["texto"] = "Permitir líquidos claros até 2 a 4 horas antes da anestesia geral, quando clinicamente apropriado, evitando jejum prolongado desnecessário conforme a recomendação ERAS Cardiac 2019 (Classe IIb, Nível C-LD)."
          eg = item_by_id(eras, "eras-cardiaco-grau-recomendacao-nao-confirmado")
          eg.update({
              "id": "eras-cardiaco-grading-fonte-primaria-conferido",
              "texto": (
                  "Classificação de recomendação e nível de evidência do consenso ERAS Cardiac 2019 conferidos no texto integral e na tabela primária. "
                  "O grading é individual por intervenção — por exemplo, controle glicêmico perioperatório e terapia hídrica guiada por meta são Classe I/B-R, "
                  "pré-habilitação é IIa/B-NR e líquidos claros/carregamento de carboidrato são IIb/C-LD. Não atribuir um único COR/LOE ao pacote inteiro; "
                  "consultar a tabela original quando o grau específico for necessário."
              ),
              "origem_secao": "Tabela primária de COR/LOE — Engelman 2019",
          })
          es = item_by_id(eras, "eras-cardiaco-desfecho-mortalidade-nao-confirmado")
          es.update({
              "id": "eras-cardiaco-seguranca-metanálise-2025",
              "texto": (
                  "A metanálise de 2025 também avaliou segurança e não detectou diferença estatisticamente significativa em fibrilação atrial, lesão renal aguda, "
                  "reinternação em UTI/hospital ou mortalidade em 30 dias. Para mortalidade, OR 1,11 (IC95% aproximadamente 0,65-1,90), com baixa certeza por "
                  "imprecisão. Portanto, a evidência sustenta recuperação mais rápida e menor permanência, mas não deve ser apresentada como redução de mortalidade."
              ),
              "origem_secao": "Desfechos de segurança — Hoogma 2025",
          })

          # Neutralize unsupported personal review attribution on every integrated checklist.
          for rec in selected:
              rec["revisao"] = NEUTRAL_REVIEW

          # Verify origins do not collide with current combined branch and append exactly 8.
          for rec in selected:
              pair = (rec.get("theme"), rec.get("documento_origem"))
              if pair in known_origins:
                  raise SystemExit(f"Duplicate document origin within theme: {rec['slug']} -> {pair}")
              if rec.get("review_status") != "revisado":
                  raise SystemExit(f"Not reviewed: {rec['slug']}")
              serialized = json.dumps(rec, ensure_ascii=False)
              if MARKER in serialized:
                  raise SystemExit(f"Human-verification marker remains in checklist: {rec['slug']}")
              if any(p in serialized for p in FALSE_REVIEW):
                  raise SystemExit(f"Unsupported personal review attribution remains: {rec['slug']}")
              manifest.append(rec)
              known_slugs.add(rec["slug"])
              known_origins.add(pair)

          if len({x["slug"] for x in manifest}) != len(manifest):
              raise SystemExit("Duplicate checklist slug after integration")
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          # --- Repair the five already-published source documents that carried the old verification marker. ---
          def replace_once(text, pattern, replacement, label, flags=0):
              new, n = re.subn(pattern, replacement, text, count=1, flags=flags)
              if n != 1:
                  raise SystemExit(f"Expected exactly one replacement for {label}, got {n}")
              return new

          def set_source_refs(text, refs, label):
              line = "source_refs: " + json.dumps(refs, ensure_ascii=False)
              return replace_once(text, r"(?m)^source_refs: .*?$", line, f"{label} source_refs")

          # ROMEO source document.
          p = Path("content/Síncope/escore-romeo-quando-pedir-ecocardiograma-no-idoso-com-sincope-na-emergencia.md")
          t = p.read_text(encoding="utf-8")
          t = set_source_refs(t, romeo["source_refs"], "ROMEO")
          t = replace_once(
              t,
              r"\n## Verificação humana necessária\n.*\Z",
              "\n## Verificação documental concluída\n\nOs textos integrais da derivação de 2018 (Probst et al.) e da validação externa de 2026 (DeAngelis et al.) foram conferidos em 21/08/2026. A derivação confirma os cinco critérios e o desempenho de ROMEO = 0 (sensibilidade 99,5%; especificidade 15,4%). A validação externa em adultos ≥40 anos sem diagnóstico grave na emergência confirmou sensibilidade de 98,9%, VPN de 98,6%, especificidade de 20,2% e AUC de 0,83 (IC95% 0,79-0,87). Permanecem as limitações metodológicas descritas pelos autores, especialmente seleção dos pacientes submetidos a ecocardiograma e maior representação de centros urbanos/acadêmicos. O ROMEO deve ser usado como apoio para estimar baixo rendimento do ecocardiograma, e não como escore de internação/alta.\n",
              "ROMEO verification section",
              flags=re.S,
          )
          p.write_text(t, encoding="utf-8")

          # Generator/DARE source document.
          p = Path("content/Dispositivos/troca-eletiva-de-gerador-marca-passo-cdi-risco-por-escopo-e-escore-dare-registro-replace.md")
          t = p.read_text(encoding="utf-8")
          t = set_source_refs(t, gen["source_refs"], "generator")
          t = replace_once(
              t,
              r"\n## Limite explícito do que este documento cobre\n.*?(?=\n## Fontes\n)",
              "\n## Programação, ERI e decisão de troca\nA reprogramação de parâmetros de saída pode reduzir consumo e prolongar a longevidade do gerador ao longo do seguimento quando os limiares permitem — princípio demonstrado por Crossley et al. em pacientes com marca-passo. Esse resultado, porém, não deve ser extrapolado como uma estratégia padronizada para adiar indefinidamente uma troca quando o dispositivo já atingiu ERI.\n\nO consenso HRS/EHRA/APHRS/LAHRS de 2023 orienta intensificar o acompanhamento conforme a bateria se aproxima da substituição eletiva: em dispositivos sem conectividade contínua, transmissões a cada 1–3 meses ao se aproximar da troca e, próximo ou além do ERI, monitorização provavelmente mensal, porque a longevidade operacional esperada é de cerca de **90 dias** a partir desse ponto. Esse valor é orientação geral de consenso, não garantia individual: comportamento de bateria, alertas e janela de substituição dependem do modelo/fabricante e da dependência de estimulação.\n\nNo paciente de alto risco para reoperação, otimização da programação, revisão da indicação e decisão compartilhada são apropriadas, mas não substituem o planejamento seguro da troca após ERI.\n",
              "generator ERI section",
              flags=re.S,
          )
          if "Ferrick AM" not in t:
              t = t.rstrip() + "\n- Ferrick AM, Raj SR, Deneke T, et al. 2023 HRS/EHRA/APHRS/LAHRS expert consensus statement on practical management of the remote device clinic. Heart Rhythm. 2023;20(9):e92-e144. DOI: 10.1016/j.hrthm.2023.03.1525. PMID: 37211145.\n"
          p.write_text(t, encoding="utf-8")

          # Amiodarone-warfarin source document.
          p = Path("content/Farmacologia/interacao-amiodarona-varfarina-inibicao-enzimatica-e-ajuste-de-dose.md")
          t = p.read_text(encoding="utf-8")
          t = set_source_refs(t, amio["source_refs"], "amiodarone-warfarin")
          t = replace_once(
              t,
              r"- \*\*Não relaxar a vigilância pelo tempo decorrido desde a suspensão\*\*.*?suspensão da amiodarona\.\n",
              "- **Após suspender a amiodarona, não usar um prazo fixo universal para encerrar a vigilância.** A rotulagem oficial informa, após terapia oral crônica, meia-vida terminal da amiodarona de 26 a 107 dias (média aproximada de 53 dias; maioria 40–55 dias) e meia-vida do metabólito ativo desetilamiodarona de aproximadamente 61 dias. Assim, a interação pode persistir por semanas a meses. Manter monitorização mais frequente do INR e ajustes graduais da varfarina até estabilidade seriada, individualizando conforme tendência do INR e risco hemorrágico/trombótico.\n",
              "amiodarone post-discontinuation surveillance",
              flags=re.S,
          )
          p.write_text(t, encoding="utf-8")

          # Fulminant rheumatic carditis source document.
          p = Path("content/Febre_reumática/cardite-reumatica-fulminante-insuficiencia-cardiaca-refrataria-e-cirurgia-valvar-na-fase-ativa.md")
          t = p.read_text(encoding="utf-8")
          t = set_source_refs(t, rheum["source_refs"], "rheumatic carditis")
          t = t.replace('deixa de ser opção seguro.', 'deixa de ser opção segura.')
          t = replace_once(
              t,
              r"\n## Por que a regurgitação é tão grave nesses casos — o mecanismo\n.*?(?=\n## Quando considerar cirurgia ainda na fase ativa\n)",
              "\n## Por que a regurgitação é tão grave nesses casos — o mecanismo\nA fonte primária anatômico-cirúrgica de Marcus et al. avaliou **73 pacientes** de 7 a 27 anos com regurgitação mitral grave e cardite reumática ativa submetidos a cirurgia. O mecanismo foi dominado por **prolapso do folheto anterior em 69/73 (94%)**, **dilatação do anel mitral em 70/73 (96%)** e **alongamento cordal em 66/73 (90%)**. Portanto, o valor de 70% anteriormente registrado para alongamento cordal estava incorreto e foi corrigido para 90%. A combinação de dilatação anular, alongamento/ruptura de cordas e prolapso explica a regurgitação grave; Barlow et al. reforçam que, nesse contexto, a insuficiência cardíaca aparece quando há lesão valvar esquerda hemodinamicamente importante.\n",
              "rheumatic mechanism section",
              flags=re.S,
          )
          t = replace_once(
              t,
              r"\n## O que a literatura descreve sobre desfecho da cirurgia de emergência em cardite ativa\n.*?(?=\n## Decisão de reparo versus substituição valvar na fase ativa\n)",
              "\n## O que a literatura descreve sobre desfecho da cirurgia de emergência em cardite ativa\nA evidência é observacional e histórica, mas as fontes primárias agora foram confirmadas. Al Kasab et al. descreveram **6 pacientes** com cardite reumática aguda, insuficiência ventricular esquerda intratável e classe funcional NYHA IV submetidos a cirurgia valvar: não houve mortalidade no seguimento médio de 2 anos e todos estavam em NYHA I–II. Uma série anterior de **4 pacientes criticamente enfermos** também descreveu bom resultado clínico após substituição valvar de emergência. Barlow et al. sintetizaram essa experiência sustentando que, quando a insuficiência cardíaca por lesão valvar esquerda importante é refratária, o manejo cirúrgico pode ser medida salvadora.\n\nEssas séries são pequenas, antigas, não randomizadas e sem grupo controle adequado. Elas sustentam a **possibilidade** de cirurgia de emergência na falência refratária, mas não autorizam prometer mortalidade baixa nem extrapolar os percentuais como prognóstico individual.\n",
              "rheumatic surgical outcomes section",
              flags=re.S,
          )
          p.write_text(t, encoding="utf-8")

          # ERAS Cardiac source document.
          p = Path("content/Perioperatório/protocolo-eras-cardiaco-recuperacao-acelerada-em-cirurgia-cardiaca.md")
          t = p.read_text(encoding="utf-8")
          t = set_source_refs(t, eras["source_refs"], "ERAS")
          t = t.replace(
              "ingestão de\nlíquidos claros até pouco antes da anestesia geral (abandono do jejum\nprolongado tradicional)",
              "ingestão de\nlíquidos claros até 2 a 4 horas antes da anestesia geral, quando clinicamente apropriado (abandono do jejum\nprolongado tradicional)",
          )
          t = replace_once(
              t,
              r"\n`VERIFICAÇÃO HUMANA NECESSÁRIA`: o texto integral do consenso original\n.*?(?=\n## O numero que sustenta o pacote\n)",
              "\nO texto integral do consenso original (Engelman et al., JAMA Surg 2019) e sua **Tabela 1 de classificação de recomendação e nível de evidência** foram conferidos em 21/08/2026. O grading é individual por intervenção: por exemplo, controle glicêmico perioperatório e terapia hídrica guiada por meta são Classe I/B-R; pré-habilitação é IIa/B-NR; líquidos claros até 2–4 horas e carregamento de carboidrato são IIb/C-LD. A lista de 15 itens abaixo permanece o agrupamento operacional do artigo de implementação de Dave et al.; quando for necessário citar o COR/LOE de um componente específico, usar a tabela primária de 2019.\n",
              "ERAS grading verification",
              flags=re.S,
          )
          t = replace_once(
              t,
              r"\n\*\*Esta metanálise não relatou mortalidade nem taxa de complicação no resumo\n.*?(?=\n## Leitura clinica\n)",
              "\n**O texto integral da metanálise de 2025 também avaliou segurança.** Não foram detectadas diferenças estatisticamente significativas em fibrilação atrial de início novo (OR 0,63; IC95% 0,38–1,05), lesão renal aguda (OR 0,96; IC95% 0,62–1,47), reinternação em UTI (OR 1,05; IC95% 0,62–1,77), reinternação hospitalar (OR 0,48; IC95% 0,10–2,20) ou mortalidade em 30 dias (OR 1,11; IC95% aproximadamente 0,65–1,90). A certeza desses desfechos de segurança foi classificada como baixa por imprecisão. Portanto, o benefício demonstrado é de recuperação/tempo de permanência; **não há base para afirmar redução de mortalidade**.\n",
              "ERAS safety outcomes",
              flags=re.S,
          )
          t = replace_once(
              t,
              r"- Este documento não reproduz o grau de recomendação \(LOE/COR\) de cada item\n  individual do consenso original — a fonte primária não foi acessada no\n  texto integral nesta sessão, e a lista de 15 itens vem de um artigo de\n  implementação secundário\. Não apresentar essa lista como se cada item\n  tivesse Classe/Nível confirmado\.\n",
              "- O COR/LOE individual está confirmado na fonte primária de 2019, mas a lista operacional de 15 itens usada aqui vem do artigo de implementação de Dave et al. Não atribuir um único grau ao pacote todo: quando necessário, consultar o grading específico de cada intervenção na tabela original.\n",
              "ERAS reading pitfall",
          )
          p.write_text(t, encoding="utf-8")

          # Final guards: targeted sources must no longer contain unresolved marker.
          target_docs = [
              Path("content/Síncope/escore-romeo-quando-pedir-ecocardiograma-no-idoso-com-sincope-na-emergencia.md"),
              Path("content/Dispositivos/troca-eletiva-de-gerador-marca-passo-cdi-risco-por-escopo-e-escore-dare-registro-replace.md"),
              Path("content/Farmacologia/interacao-amiodarona-varfarina-inibicao-enzimatica-e-ajuste-de-dose.md"),
              Path("content/Febre_reumática/cardite-reumatica-fulminante-insuficiencia-cardiaca-refrataria-e-cirurgia-valvar-na-fase-ativa.md"),
              Path("content/Perioperatório/protocolo-eras-cardiaco-recuperacao-acelerada-em-cirurgia-cardiaca.md"),
          ]
          for doc in target_docs:
              text = doc.read_text(encoding="utf-8")
              if MARKER in text:
                  raise SystemExit(f"Human-verification marker remains in source document: {doc}")

          print("Integrated 8 checklists and resolved verification markers in 5 source documents.")
          PY

