name: Claude content maintenance debug 2026-08-21

on:
  push:
    branches:
      - main

permissions:
  contents: read
  issues: write

jobs:
  debug:
    if: contains(github.event.head_commit.message, '[maintenance-claude-debug-20260821]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh auth status

      - name: Reproduce consolidation and publish traceback to issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python tools/maintenance/consolidate_claude_20260821.py > /tmp/maintenance-debug.log 2>&1
          status=$?
          set -e
          python - <<'PY'
          from pathlib import Path
          log = Path('/tmp/maintenance-debug.log').read_text(encoding='utf-8', errors='replace')
          tail = log[-18000:]
          body = "Diagnóstico automático da consolidação Claude.\n\n```text\n" + tail + "\n```\n"
          Path('/tmp/maintenance-debug-issue.md').write_text(body, encoding='utf-8')
          PY
          gh issue create --title "Diagnóstico da falha de consolidação Claude 2026-08-21" --body-file /tmp/maintenance-debug-issue.md
          exit "$status"
