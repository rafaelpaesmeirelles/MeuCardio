name: Temporary audit patient material schema

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    if: github.event.pull_request.head.ref == 'content/consolidate-claude-science-backlog-20260821'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Find non-string patient material fields
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('material-paciente/metadados.json').read_text(encoding='utf-8'))
          bad = []
          for rec in data:
              slug = rec.get('slug')
              for si, sec in enumerate(rec.get('secoes') or []):
                  title = sec.get('titulo', '')
                  if not isinstance(title, str):
                      bad.append({'slug': slug, 'field': f'secoes[{si}].titulo', 'type': type(title).__name__, 'value': title})
                  for field in ('paragrafos', 'itens'):
                      vals = sec.get(field) or []
                      if not isinstance(vals, list):
                          bad.append({'slug': slug, 'field': f'secoes[{si}].{field}', 'type': type(vals).__name__, 'value': vals})
                          continue
                      for i, value in enumerate(vals):
                          if not isinstance(value, str):
                              bad.append({'slug': slug, 'field': f'secoes[{si}].{field}[{i}]', 'type': type(value).__name__, 'value': value})
              for field in ('sinais_de_alerta', 'perguntas'):
                  vals = rec.get(field) or []
                  if not isinstance(vals, list):
                      bad.append({'slug': slug, 'field': field, 'type': type(vals).__name__, 'value': vals})
                      continue
                  for i, value in enumerate(vals):
                      if not isinstance(value, str):
                          bad.append({'slug': slug, 'field': f'{field}[{i}]', 'type': type(value).__name__, 'value': value})
          print(json.dumps({'bad_count': len(bad), 'problems': bad}, ensure_ascii=False, indent=2))
          raise SystemExit(1 if bad else 0)
          PY
