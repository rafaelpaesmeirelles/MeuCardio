name: Claude content maintenance 2026-08-21

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write

jobs:
  fix_pr312_required_fields:
    if: contains(github.event.head_commit.message, '[fix-pr312-required-fields]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout PR 312 release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin release/claude-content-map-20260821
          git checkout -B release/claude-content-map-20260821 origin/release/claude-content-map-20260821

      - name: Repair required drug fields and validate corpus contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('medicamentos/metadados.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          if not isinstance(data, list):
              raise RuntimeError('medicamentos/metadados.json não é lista JSON')

          lacidipino = next((d for d in data if d.get('slug') == 'lacidipino'), None)
          if lacidipino is None:
              raise RuntimeError('Registro lacidipino não encontrado')

          # Fontes primárias já presentes no próprio verbete e reconfirmadas:
          # bula profissional GSK Lacipil e SmPC MOTENS (ATC C08CA09).
          lacidipino['drug_class'] = 'Bloqueador de canal de cálcio di-hidropiridínico'
          refs = lacidipino.setdefault('references', [])
          extra_refs = (
              'Bula profissional Lacipil® (lacidipino) 4 mg, GSK Brasil — antagonista de canal de cálcio di-hidropiridínico.',
              'MOTENS (lacidipine) SmPC, Electronic Medicines Compendium — ATC C08CA09, calcium channel blocker, dihydropyridine derivative.',
          )
          for ref in extra_refs:
              if ref not in refs:
                  refs.append(ref)

          required_text = ('slug', 'generic_name', 'drug_class')
          non_nullable_if_present = (
              'brand_names', 'presentations', 'commercial_presentations', 'dosing',
              'contraindications', 'interactions', 'monitoring', 'indications',
              'adverse_effects', 'notes', 'outcomes', 'references', 'review_status',
          )
          failures = []
          slugs = []
          for i, drug in enumerate(data):
              slug = drug.get('slug')
              slugs.append(slug)
              for field in required_text:
                  value = drug.get(field)
                  if not isinstance(value, str) or not value.strip():
                      failures.append(f'#{i} {slug!r}: {field} ausente/vazio')
              for field in non_nullable_if_present:
                  if field in drug and drug[field] is None:
                      failures.append(f'#{i} {slug!r}: {field}=null')
          if len(slugs) != len(set(slugs)):
              failures.append('slugs duplicados em medicamentos/metadados.json')
          raw = json.dumps(data, ensure_ascii=False)
          if 'VERIFICAÇÃO HUMANA NECESSÁRIA' in raw:
              failures.append('marcador de verificação humana residual em medicamentos/metadados.json')
          if failures:
              raise RuntimeError('\n'.join(failures[:100]))

          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'OK: {len(data)} medicamentos; campos obrigatórios íntegros; lacidipino corrigido.')
          PY

          python -m json.tool medicamentos/metadados.json >/dev/null
          python -m json.tool checklists/metadados.json >/dev/null
          python -m json.tool material-paciente/metadados.json >/dev/null

      - name: Remove temporary PR-branch fixer and push targeted correction
        run: |
          rm -f .github/workflows/fix-release312-required-drug-fields.yml
          git add medicamentos/metadados.json .github/workflows/fix-release312-required-drug-fields.yml
          git commit -m "content: restaurar classe farmacológica obrigatória do lacidipino"
          git push origin HEAD:release/claude-content-map-20260821

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Falha ao corrigir campo obrigatório da PR 312" --body "O reparo dirigido do corpus para a PR #312 falhou. Nenhum deploy foi executado. Revisar o run deste commit." || true
