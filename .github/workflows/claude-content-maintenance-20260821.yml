name: Claude content maintenance 2026-08-21
on:
  push:
    branches: [main]
permissions:
  contents: write
  issues: write
jobs:
  fix_pr312:
    if: contains(github.event.head_commit.message, '[fix-pr312-enlicitide]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch release branch and validate required medication fields
        run: |
          set -o pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin release/claude-content-map-20260821
          git checkout -B release/claude-content-map-20260821 origin/release/claude-content-map-20260821
          python - <<'PY' 2>&1 | tee /tmp/fix.log
          import json
          from pathlib import Path
          p=Path('medicamentos/metadados.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          fixes={
            'lacidipino':'Bloqueador de canal de cálcio di-hidropiridínico',
            'enlicitide':'Inibidor oral de PCSK9',
          }
          refs={
            'lacidipino':'MOTENS (lacidipine) SmPC — ATC C08CA09, dihydropyridine calcium channel blocker.',
            'enlicitide':'Navar AM et al. N Engl J Med. 2026;394:529-539. DOI:10.1056/NEJMoa2511002 — oral PCSK9 inhibitor enlicitide.',
          }
          for d in data:
            slug=d.get('slug')
            if slug in fixes and not str(d.get('drug_class') or '').strip():
              d['drug_class']=fixes[slug]
              r=d.setdefault('references',[])
              if refs[slug] not in r: r.append(refs[slug])
          bad=[]
          for i,d in enumerate(data):
            for k in ('slug','generic_name','drug_class'):
              if not str(d.get(k) or '').strip(): bad.append(f'{i}:{d.get("slug")}:{k}')
          if 'VERIFICAÇÃO HUMANA NECESSÁRIA' in json.dumps(data,ensure_ascii=False): bad.append('human-marker-residual')
          if bad: raise RuntimeError('campos inválidos: '+', '.join(bad[:50]))
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print({'ok':True,'count':len(data)})
          PY
          rm -f .github/workflows/fix-release312-required-drug-fields.yml
          git add medicamentos/metadados.json .github/workflows/fix-release312-required-drug-fields.yml
          git commit -m "content: corrigir classes farmacológicas obrigatórias"
          git push origin HEAD:release/claude-content-map-20260821
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo 'Falha no reparo final da PR #312.'; echo '```'; cat /tmp/fix.log 2>/dev/null || true; echo '```'; } >/tmp/f.md
          gh issue create --title "Falha no reparo final da PR 312" --body-file /tmp/f.md || true
