name: Temporary home quick-actions personalization patcher

on:
  push:
    branches:
      - feat/home-quick-actions-personalization-20260821

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message || '', '[home-personalized]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/home-quick-actions-personalization-20260821
          fetch-depth: 0

      - name: Apply surgical Home changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          main = Path('frontend/src/main.tsx')
          replace_once(
              main,
              'import "./styles/clinical-pixel-polish-conservative.css";\nimport "./styles/clinical-form-control-contrast.css";',
              'import "./styles/clinical-pixel-polish-conservative.css";\nimport "./styles/home-desktop-symmetric-personalizable.css";\nimport "./styles/clinical-form-control-contrast.css";',
              'main css import',
          )

          panel = Path('frontend/src/pages/PainelClinicalOS.tsx')
          replace_once(
              panel,
              'type AcaoRapida = { to: string; titulo: string; detalhe: string; icone: NomeIcone; tone: string };',
              'type AcaoRapida = { id: string; to: string; titulo: string; detalhe: string; icone: NomeIcone; tone: string };',
              'AcaoRapida type',
          )

          old_actions = '''const ACOES: AcaoRapida[] = [
            { to: "/receituario", titulo: "Prescrever", detalhe: "Novo receituário", icone: "prescricao", tone: "cyan" },
            { to: "/documentos", titulo: "Solicitar exames", detalhe: "Adicionar solicitação", icone: "clinica", tone: "blue" },
            { to: "/calculadoras", titulo: "Calculadoras", detalhe: "Escores e índices", icone: "calculadora", tone: "amber" },
            { to: "/interacoes", titulo: "Interações", detalhe: "Segurança medicamentosa", icone: "medicamento", tone: "violet" },
            { to: "/emergencia", titulo: "Emergências", detalhe: "Condutas rápidas", icone: "emergencia", tone: "red" },
            { to: "/diretrizes", titulo: "Guidelines", detalhe: "Diretrizes atuais", icone: "conhecimento", tone: "green" },
            { to: "/assistente", titulo: "CorVIA AI", detalhe: "Assistente Clínica", icone: "assistente", tone: "blue" },
            { to: "/documentos", titulo: "Documentos", detalhe: "Atestado, relatório...", icone: "documento", tone: "violet" },
          ];'''.replace('          ', '')
          new_actions = '''const ACOES_DISPONIVEIS: AcaoRapida[] = [
            { id: "prescrever", to: "/receituario", titulo: "Prescrever", detalhe: "Novo receituário", icone: "prescricao", tone: "cyan" },
            { id: "solicitar-exames", to: "/documentos", titulo: "Solicitar exames", detalhe: "Adicionar solicitação", icone: "clinica", tone: "blue" },
            { id: "calculadoras", to: "/calculadoras", titulo: "Calculadoras", detalhe: "Escores e índices", icone: "calculadora", tone: "amber" },
            { id: "interacoes", to: "/interacoes", titulo: "Interações", detalhe: "Segurança medicamentosa", icone: "medicamento", tone: "violet" },
            { id: "emergencias", to: "/emergencia", titulo: "Emergências", detalhe: "Condutas rápidas", icone: "emergencia", tone: "red" },
            { id: "guidelines", to: "/diretrizes", titulo: "Guidelines", detalhe: "Diretrizes atuais", icone: "conhecimento", tone: "green" },
            { id: "corvia-ai", to: "/assistente", titulo: "CorVIA AI", detalhe: "Assistente Clínica", icone: "assistente", tone: "blue" },
            { id: "documentos", to: "/documentos", titulo: "Documentos", detalhe: "Atestado, relatório...", icone: "documento", tone: "violet" },
            { id: "checklists", to: "/checklists", titulo: "Checklists", detalhe: "Condutas estruturadas", icone: "check", tone: "green" },
            { id: "triagem", to: "/triagem-sintomas", titulo: "Triagem", detalhe: "Triagem de sintomas", icone: "triagem", tone: "red" },
            { id: "pacientes", to: "/round", titulo: "Pacientes", detalhe: "Round e acompanhamento", icone: "pacientes", tone: "cyan" },
            { id: "medicamentos", to: "/medicamentos", titulo: "Medicamentos", detalhe: "Consulta farmacológica", icone: "medicamento", tone: "violet" },
            { id: "agenda", to: "/agenda", titulo: "Agenda", detalhe: "Compromissos e rotas", icone: "agenda", tone: "blue" },
            { id: "evidencias", to: "/evidencias", titulo: "Evidências", detalhe: "Base científica", icone: "evidencia", tone: "cyan" },
          ];
          const ACOES_PADRAO_IDS = ACOES_DISPONIVEIS.slice(0, 10).map((acao) => acao.id);'''.replace('          ', '')
          replace_once(panel, old_actions, new_actions, 'actions catalog')

          replace_once(
              panel,
              'function chaveContextosRecentes(userId?: number) { return userId ? `corvia:contextos-recentes:${userId}` : ""; }',
              'function chaveContextosRecentes(userId?: number) { return userId ? `corvia:contextos-recentes:${userId}` : ""; }\nfunction chaveAcoesRapidas(userId?: number) { return userId ? `corvia:acoes-rapidas:${userId}` : ""; }',
              'storage key',
          )

          replace_once(
              panel,
              '  const [erroRota, setErroRota] = useState<string | null>(null);\n  const inputRef = useRef<HTMLInputElement>(null);',
              '  const [erroRota, setErroRota] = useState<string | null>(null);\n  const [acoesRapidas, setAcoesRapidas] = useState<string[]>(ACOES_PADRAO_IDS);\n  const [personalizandoAcoes, setPersonalizandoAcoes] = useState(false);\n  const [rascunhoAcoes, setRascunhoAcoes] = useState<string[]>(ACOES_PADRAO_IDS);\n  const inputRef = useRef<HTMLInputElement>(null);',
              'quick action state',
          )

          replace_once(
              panel,
              '  useEffect(() => { document.body.classList.add("ccc-home-active"); return () => document.body.classList.remove("ccc-home-active"); }, []);',
              '''  useEffect(() => { document.body.classList.add("ccc-home-active"); return () => document.body.classList.remove("ccc-home-active"); }, []);

  useEffect(() => {
    const chave = chaveAcoesRapidas(usuario?.id);
    if (!chave) return;
    try {
      const armazenadas = JSON.parse(localStorage.getItem(chave) || "[]") as unknown;
      const ids = Array.isArray(armazenadas)
        ? armazenadas.filter((id, indice, lista): id is string => typeof id === "string" && lista.indexOf(id) === indice && ACOES_DISPONIVEIS.some((acao) => acao.id === id))
        : [];
      setAcoesRapidas(ids.length === 10 ? ids : ACOES_PADRAO_IDS);
    } catch {
      setAcoesRapidas(ACOES_PADRAO_IDS);
    }
  }, [usuario?.id]);

  const acoesVisiveis = useMemo(
    () => acoesRapidas.map((id) => ACOES_DISPONIVEIS.find((acao) => acao.id === id)).filter((acao): acao is AcaoRapida => Boolean(acao)),
    [acoesRapidas],
  );''',
              'quick action load effect',
          )

          replace_once(
              panel,
              '  function executar(evento: FormEvent) { evento.preventDefault(); if (comando.trim().length < 2) return; navigate(destinoDoComando(comando)); }\n  function usarExemplo(texto: string) { setComando(texto); inputRef.current?.focus(); }\n  function abrirAssistentePessoal() { window.dispatchEvent(new Event("corvia:abrir-assistente-pessoal")); }',
              '''  function executar(evento: FormEvent) { evento.preventDefault(); if (comando.trim().length < 2) return; navigate(destinoDoComando(comando)); }
  function usarExemplo(texto: string) { setComando(texto); inputRef.current?.focus(); }
  function abrirAssistentePessoal() { window.dispatchEvent(new Event("corvia:abrir-assistente-pessoal")); }
  function abrirPersonalizacaoAcoes() { setRascunhoAcoes([...acoesRapidas]); setPersonalizandoAcoes(true); }
  function alternarAcaoRapida(id: string) {
    setRascunhoAcoes((atuais) => atuais.includes(id) ? atuais.filter((item) => item !== id) : atuais.length < 10 ? [...atuais, id] : atuais);
  }
  function moverAcaoRapida(id: string, deslocamento: -1 | 1) {
    setRascunhoAcoes((atuais) => {
      const indice = atuais.indexOf(id);
      const destino = indice + deslocamento;
      if (indice < 0 || destino < 0 || destino >= atuais.length) return atuais;
      const copia = [...atuais];
      [copia[indice], copia[destino]] = [copia[destino], copia[indice]];
      return copia;
    });
  }
  function restaurarAcoesPadrao() { setRascunhoAcoes([...ACOES_PADRAO_IDS]); }
  function salvarAcoesRapidas() {
    if (rascunhoAcoes.length !== 10) return;
    setAcoesRapidas([...rascunhoAcoes]);
    const chave = chaveAcoesRapidas(usuario?.id);
    if (chave) {
      try { localStorage.setItem(chave, JSON.stringify(rascunhoAcoes)); } catch { /* preferência local não bloqueia a Home */ }
    }
    setPersonalizandoAcoes(false);
  }''',
              'personalization handlers',
          )

          old_section = '''        <section className="ccc-section ccc-actions-section" aria-labelledby="ccc-actions-title">
          <div className="ccc-section__head"><h2 id="ccc-actions-title">Ações rápidas</h2><Link to="/busca"><Icone nome="configuracao" /> Personalizar</Link></div>
          <div className="ccc-actions">{ACOES.map((acao) => <Link to={acao.to} key={acao.titulo} className={`ccc-action ccc-action--${acao.icone}`} data-tone={acao.tone}><span className="ccc-action__icon"><Icone nome={acao.icone} /></span><span><strong>{acao.titulo}</strong><small>{acao.detalhe}</small></span></Link>)}</div>
        </section>'''
          new_section = '''        <section className="ccc-section ccc-actions-section" aria-labelledby="ccc-actions-title">
          <div className="ccc-section__head"><h2 id="ccc-actions-title">Ações rápidas</h2><button type="button" onClick={abrirPersonalizacaoAcoes}><Icone nome="configuracao" /> Personalizar</button></div>
          <div className="ccc-actions">{acoesVisiveis.map((acao) => <Link to={acao.to} key={acao.id} className={`ccc-action ccc-action--${acao.icone}`} data-tone={acao.tone}><span className="ccc-action__icon"><Icone nome={acao.icone} /></span><span><strong>{acao.titulo}</strong><small>{acao.detalhe}</small></span></Link>)}</div>
        </section>

        {personalizandoAcoes && <div className="ccc-quick-actions-picker" onMouseDown={() => setPersonalizandoAcoes(false)}>
          <section className="ccc-quick-actions-picker__dialog" role="dialog" aria-modal="true" aria-labelledby="ccc-quick-actions-picker-title" onMouseDown={(evento) => evento.stopPropagation()}>
            <header className="ccc-quick-actions-picker__header"><h2 id="ccc-quick-actions-picker-title">Personalizar ações rápidas</h2><button type="button" aria-label="Fechar" onClick={() => setPersonalizandoAcoes(false)}>×</button></header>
            <p className="ccc-quick-actions-picker__intro">Escolha exatamente 10 atalhos para manter o painel desktop simétrico em duas fileiras. A ordem escolhida é a ordem exibida na Home.</p>
            <div className="ccc-quick-actions-picker__catalog">
              {ACOES_DISPONIVEIS.map((acao) => {
                const posicao = rascunhoAcoes.indexOf(acao.id);
                const selecionada = posicao >= 0;
                return <div className="ccc-quick-actions-picker__item" data-selected={selecionada} key={acao.id}>
                  <button type="button" className="ccc-quick-actions-picker__toggle" aria-pressed={selecionada} onClick={() => alternarAcaoRapida(acao.id)} disabled={!selecionada && rascunhoAcoes.length >= 10}>
                    <span className="ccc-quick-actions-picker__icon"><Icone nome={acao.icone} /></span>
                    <span className="ccc-quick-actions-picker__copy"><strong>{acao.titulo}</strong><small>{acao.detalhe}</small></span>
                  </button>
                  {selecionada && <span className="ccc-quick-actions-picker__order"><span className="ccc-quick-actions-picker__position">{posicao + 1}</span><button type="button" aria-label={`Mover ${acao.titulo} para cima`} disabled={posicao === 0} onClick={() => moverAcaoRapida(acao.id, -1)}>↑</button><button type="button" aria-label={`Mover ${acao.titulo} para baixo`} disabled={posicao === rascunhoAcoes.length - 1} onClick={() => moverAcaoRapida(acao.id, 1)}>↓</button></span>}
                </div>;
              })}
            </div>
            <footer className="ccc-quick-actions-picker__footer"><span>{rascunhoAcoes.length}/10 selecionadas</span><span className="ccc-quick-actions-picker__footer-actions"><button type="button" onClick={restaurarAcoesPadrao}>Restaurar padrão</button><button type="button" onClick={() => setPersonalizandoAcoes(false)}>Cancelar</button><button type="button" data-primary="true" disabled={rascunhoAcoes.length !== 10} onClick={salvarAcoesRapidas}>Salvar</button></span></footer>
          </section>
        </div>}'''
          replace_once(panel, old_section, new_section, 'quick actions section')
          PY

          git diff --check -- frontend/src/main.tsx frontend/src/pages/PainelClinicalOS.tsx frontend/src/styles/home-desktop-symmetric-personalizable.css
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' frontend/src/main.tsx frontend/src/pages/PainelClinicalOS.tsx | sort)"

      - name: Commit Home implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/main.tsx frontend/src/pages/PainelClinicalOS.tsx
          git diff --cached --check
          git commit -m "feat(home): personalizar ações rápidas e equilibrar desktop [home-personalized]"
          git push origin HEAD:feat/home-quick-actions-personalization-20260821
