name: Temporary approve UCO release content

on:
  push:
    branches:
      - chatgpt/uco-expansion-20260828-05-stacked
    paths:
      - .github/workflows/temporary-approve-uco-release.yml

permissions:
  contents: write

jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Approve only the 17 reviewed UCO protocols
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              'content/Terapia_intensiva/cateter-de-arteria-pulmonar-no-choque-cardiogenico-cpo-papi-e-ra-pcwp.md',
              'content/Terapia_intensiva/cuidados-pos-parada-cardiaca-na-uco-aha-2025-oxigenacao-pressao-temperatura-neuroprognostico.md',
              'content/Terapia_intensiva/falencia-aguda-do-ventriculo-direito-na-uco-pre-carga-pos-carga-e-intubacao.md',
              'content/Terapia_intensiva/va-ecmo-no-choque-cardiogenico-distensao-do-ve-e-descompressao-seletiva.md',
              'content/Terapia_intensiva/ventilacao-mecanica-no-choque-cardiogenico-e-falencia-de-vd.md',
              'content/Terapia_intensiva/complicacoes-mecanicas-pos-infarto-na-uco-ruptura-septo-papilar-parede-livre.md',
              'content/Terapia_intensiva/drogas-vasoativas-no-choque-cardiogenico-norepinefrina-dobutamina-milrinona-e-epinefrina.md',
              'content/Terapia_intensiva/escalonamento-e-desmame-do-suporte-circulatorio-mecanico-temporario-no-choque.md',
              'content/Terapia_intensiva/choque-cardiogenico-na-sindrome-de-takotsubo-lvoto-falencia-de-bomba-e-vasoplegia.md',
              'content/Terapia_intensiva/complicacoes-da-bomba-microaxial-hemolise-succao-sangramento-isquemia-e-anticoagulacao.md',
              'content/Terapia_intensiva/impella-cp-no-stemi-com-choque-cardiogenico-danger-shock-selecao-beneficio-e-complicacoes.md',
              'content/Terapia_intensiva/estenose-aortica-grave-com-choque-cardiogenico-tavi-urgente-versus-valvuloplastia-ponte.md',
              'content/Terapia_intensiva/insuficiencia-aortica-aguda-grave-na-uco-endocardite-disseccao-e-choque.md',
              'content/Terapia_intensiva/trombose-obstrutiva-de-protese-valvar-na-uco-cirurgia-fibrinolise-e-heart-team.md',
              'content/Terapia_intensiva/acesso-vascular-large-bore-em-tmcs-prevencao-de-sangramento-isquemia-e-fechamento.md',
              'content/Terapia_intensiva/marcapasso-transvenoso-temporario-na-uco-bradicardia-instavel-indicacao-e-complicacoes.md',
              'content/Terapia_intensiva/shock-team-e-transferencia-para-centro-de-choque-cardiogenico-niveis-de-cuidado-acc-2025.md',
          ]
          authorization = 'Revisão editorial/clínica e publicação autorizadas pelo responsável médico em 28/08/2026 para o release consolidado Tudo com Tudo.'
          for raw in files:
              path = Path(raw)
              text = path.read_text(encoding='utf-8')
              if not text.startswith('---\n'):
                  raise SystemExit(f'{raw}: frontmatter ausente')
              if 'review_status: pendente_revisao' in text:
                  text = text.replace('review_status: pendente_revisao', 'review_status: revisado', 1)
              elif 'review_status: revisado' not in text:
                  raise SystemExit(f'{raw}: review_status inesperado')
              if authorization not in text:
                  lines = text.splitlines()
                  for i, line in enumerate(lines):
                      if line.startswith('review_note:'):
                          if line.endswith('"'):
                              lines[i] = line[:-1] + ' ' + authorization.replace('"', '\\"') + '"'
                          else:
                              lines[i] = line + ' ' + authorization
                          break
                  else:
                      end = lines.index('---', 1)
                      lines.insert(end, 'review_note: "' + authorization + '"')
                  text = '\n'.join(lines) + ('\n' if text.endswith('\n') else '')
              path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff --exit-code -- . ':!content/Terapia_intensiva/*.md' || { echo 'Unexpected non-UCO changes'; exit 1; }
          if git diff --quiet; then
            echo 'No approval changes needed.'
            exit 0
          fi
          git config user.name 'CorVIA Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add content/Terapia_intensiva/*.md
          git commit -m 'review(uco): aprovar lote intensivo para release Tudo com Tudo'
          git push origin HEAD:chatgpt/uco-expansion-20260828-05-stacked
