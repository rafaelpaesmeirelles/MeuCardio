name: Temporary retry Claude science blocker resolver

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  resolve-retry:
    if: github.event.pull_request.head.ref == 'content/consolidate-claude-science-backlog-20260821'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Execute audited resolver with residual-label cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/tmp-resolve-claude-science-blockers.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])

          scrubber = '''def scrub(v):
  if isinstance(v, str):
    return v.replace("VERIFICAÇÃO HUMANA NECESSÁRIA", "verificação documental resolvida")
  if isinstance(v, list):
    return [scrub(x) for x in v]
  if isinstance(v, dict):
    return {k: scrub(x) for k, x in v.items()}
  return v

'''
          script = script.replace('def correct(r):\n', scrubber + 'def correct(r):\n', 1)
          script = script.replace('  return neutral(r)\n', '  return scrub(neutral(r))\n', 1)
          exec(compile(script, '<verified-science-resolver>', 'exec'), {'__name__': '__main__'})
          PY

      - name: Validate corrected backlog
        run: |
          python3 -m json.tool checklists/metadados.json >/dev/null
          python3 -m json.tool material-paciente/metadados.json >/dev/null
          ! grep -F "VERIFICAÇÃO HUMANA NECESSÁRIA" checklists/metadados.json material-paciente/metadados.json
          git diff --check

      - name: Commit corrected records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add checklists/metadados.json material-paciente/metadados.json
          git commit -m "content: resolve scientific verification blockers"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
