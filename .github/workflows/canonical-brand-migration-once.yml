name: Canonical brand migration (one-time)

on:
  push:
    branches:
      - fix/canonical-brand-css-debt-20260820

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply canonical branding migration and style-debt guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          def read(path: str) -> str:
              return (root / path).read_text(encoding='utf-8')

          def write(path: str, content: str) -> None:
              (root / path).write_text(content, encoding='utf-8')

          def replace_exact(path: str, old: str, new: str, expected: int) -> None:
              content = read(path)
              count = content.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrences of {old!r}, found {count}')
              write(path, content.replace(old, new))

          # Legacy shell: source now points directly to the canonical mark.
          replace_exact(
              'frontend/src/components/ShellClinicalOSLaunch.tsx',
              '/logo-marca.png',
              '/corvia-mark-canonical.svg',
              3,
          )

          # Public/legal surfaces on light backgrounds use the canonical wordmark.
          replace_exact('frontend/src/pages/TermosUso.tsx', '/corvia-logo-compacta.png', '/corvia-logo-canonical.svg', 1)
          replace_exact('frontend/src/pages/PoliticaPrivacidade.tsx', '/corvia-logo-compacta.png', '/corvia-logo-canonical.svg', 1)
          replace_exact('frontend/src/pages/Produto.tsx', '/corvia-logo-compacta.png', '/corvia-logo-canonical.svg', 3)

          # Tour: canonical wordmark in the main header; canonical mark in compact mockups.
          tour_path = 'frontend/src/pages/TourClinicalOS.tsx'
          tour = read(tour_path)
          replacements = [
              (
                  '<span className="cos-tour-mock__brand"><img src="/corvia-logo-compacta.png" alt="" /></span>',
                  '<span className="cos-tour-mock__brand"><img src="/corvia-mark-canonical.svg" alt="" /></span>',
              ),
              (
                  '<header><img src="/corvia-logo-compacta.png" alt=""/><Icone nome="menu"/></header>',
                  '<header><img src="/corvia-mark-canonical.svg" alt=""/><Icone nome="menu"/></header>',
              ),
              (
                  '<div className="cos-tour__brand"><img src="/corvia-logo-compacta.png" alt="CorVIA"/><span><strong>CorVIA</strong><small>Clinical OS do médico</small></span></div>',
                  '<div className="cos-tour__brand"><img src="/corvia-logo-canonical-dark.svg" alt="CorVIA Clinical OS"/></div>',
              ),
              (
                  '<span className="cos-tour-final__mark"><img src="/corvia-logo-compacta.png" alt="" /></span>',
                  '<span className="cos-tour-final__mark"><img src="/corvia-mark-canonical.svg" alt="" /></span>',
              ),
          ]
          for old, new in replacements:
              count = tour.count(old)
              if count != 1:
                  raise SystemExit(f'{tour_path}: expected exactly one occurrence of tour fragment, found {count}: {old[:80]}')
              tour = tour.replace(old, new)
          write(tour_path, tour)

          # Remove CSS asset swapping from the legacy shell: direct source references are canonical now.
          write(
              'frontend/src/styles/canonical-brand-standard.css',
              '/* Identidade canônica no shell: os componentes apontam diretamente para o símbolo aprovado. */\n'
              '.cos-brand__mark img,.cos-topbar__mobile-brand img,.cos-drawer__head img{object-fit:contain}\n',
          )

          # Preserve the approved tour dimensions, but stop hiding/replacing source assets at runtime.
          write(
              'frontend/src/styles/tour-branding-hotfix.css',
              '''/* Tour CorVIA — branding canônico direto, sem troca de asset em runtime. */\n'
              '.cos-tour__brand > img {\n'
              '  display: block;\n'
              '  width: clamp(150px, 18vw, 210px);\n'
              '  height: 48px;\n'
              '  object-fit: contain;\n'
              '  object-position: left center;\n'
              '}\n\n'
              '@media (min-width: 701px) and (max-width: 1180px) {\n'
              '  .cos-tour__top {\n'
              '    grid-template-columns: minmax(170px, 1fr) auto minmax(100px, 1fr);\n'
              '    gap: .75rem;\n'
              '    padding-inline: 1.25rem;\n'
              '  }\n'
              '  .cos-tour__brand > img {\n'
              '    width: 180px;\n'
              '    height: 44px;\n'
              '  }\n'
              '}\n\n'
              '@media (max-width: 700px) {\n'
              '  .cos-tour__brand > img {\n'
              '    width: 142px;\n'
              '    height: 38px;\n'
              '  }\n'
              '}\n'''.replace("'''\\n'", '').replace("\\n'\n              '", "\\n").replace("'\n              '", "").replace("'''", ''),
          )

          # Canonical branding regression contract.
          brand_test_path = 'backend/tests/test_canonical_branding_contract.py'
          brand_test = read(brand_test_path)
          marker = 'def test_frontend_sources_do_not_reference_legacy_brand_assets_or_runtime_swaps():'
          if marker not in brand_test:
              brand_test += '''\n\n\ndef test_frontend_sources_do_not_reference_legacy_brand_assets_or_runtime_swaps():\n    frontend = ROOT / "frontend" / "src"\n    source = "\\n".join(\n        path.read_text(encoding="utf-8")\n        for path in frontend.rglob("*")\n        if path.is_file() and path.suffix in {".ts", ".tsx", ".css", ".html"}\n    )\n    assert "/logo-marca.png" not in source\n    assert "/corvia-logo-compacta.png" not in source\n\n    shell_brand_css = _read("frontend/src/styles/canonical-brand-standard.css")\n    tour_brand_css = _read("frontend/src/styles/tour-branding-hotfix.css")\n    assert "content:url" not in shell_brand_css.replace(" ", "")\n    assert "content:url" not in tour_brand_css.replace(" ", "")\n    assert "display: none !important" not in tour_brand_css\n'''
              write(brand_test_path, brand_test)

          # Freeze the current CSS debt as a ceiling so subsequent work reduces, rather than grows, it.
          css_files = sorted((root / 'frontend' / 'src').rglob('*.css'))
          important_count = sum(path.read_text(encoding='utf-8').count('!important') for path in css_files)
          main_source = read('frontend/src/main.tsx')
          global_imports = len(re.findall(r'import\\s+["\\']\\./styles/[^"\\']+\\.css["\\'];', main_source))
          debt_names = ('hotfix', 'fidelity', 'final', 'canonical', 'release')
          debt_layers = sum(1 for path in css_files if any(term in path.name.lower() for term in debt_names))

          budget_test = f'''from pathlib import Path\nimport re\n\nROOT = Path(__file__).resolve().parents[2]\nCSS_FILE_CEILING = {len(css_files)}\nGLOBAL_STYLE_IMPORT_CEILING = {global_imports}\nIMPORTANT_CEILING = {important_count}\nDEBT_LAYER_NAME_CEILING = {debt_layers}\n\n\ndef test_frontend_style_debt_does_not_grow():\n    css_files = sorted((ROOT / "frontend" / "src").rglob("*.css"))\n    assert len(css_files) <= CSS_FILE_CEILING\n\n    main = (ROOT / "frontend" / "src" / "main.tsx").read_text(encoding="utf-8")\n    imports = len(re.findall(r'import\\s+["\\\']\\./styles/[^"\\\']+\\.css["\\\'];', main))\n    assert imports <= GLOBAL_STYLE_IMPORT_CEILING\n\n    important = sum(path.read_text(encoding="utf-8").count("!important") for path in css_files)\n    assert important <= IMPORTANT_CEILING\n\n    debt_names = ("hotfix", "fidelity", "final", "canonical", "release")\n    debt_layers = sum(1 for path in css_files if any(term in path.name.lower() for term in debt_names))\n    assert debt_layers <= DEBT_LAYER_NAME_CEILING\n'''
          write('backend/tests/test_frontend_style_debt_budget.py', budget_test)

          # Migration must leave no direct legacy references in frontend source.
          all_frontend = '\n'.join(
              p.read_text(encoding='utf-8')
              for p in (root / 'frontend' / 'src').rglob('*')
              if p.is_file() and p.suffix in {'.ts', '.tsx', '.css', '.html'}
          )
          for legacy in ('/logo-marca.png', '/corvia-logo-compacta.png'):
              if legacy in all_frontend:
                  raise SystemExit(f'legacy branding reference remains: {legacy}')

          print(f'CSS baseline: files={len(css_files)}, global_imports={global_imports}, !important={important_count}, debt_layers={debt_layers}')
          PY

          git diff --check
          python -m py_compile backend/tests/test_canonical_branding_contract.py backend/tests/test_frontend_style_debt_budget.py

      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/ShellClinicalOSLaunch.tsx \
                  frontend/src/pages/TermosUso.tsx \
                  frontend/src/pages/PoliticaPrivacidade.tsx \
                  frontend/src/pages/Produto.tsx \
                  frontend/src/pages/TourClinicalOS.tsx \
                  frontend/src/styles/canonical-brand-standard.css \
                  frontend/src/styles/tour-branding-hotfix.css \
                  backend/tests/test_canonical_branding_contract.py \
                  backend/tests/test_frontend_style_debt_budget.py
          git commit -m "fix(ui): canonicalize brand assets and cap CSS debt [skip brand migration]"
          git push origin HEAD:${GITHUB_REF_NAME}
