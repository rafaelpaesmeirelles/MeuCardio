name: Temporary prepare coarctation fetal for consolidated release
on:
  push:
    branches: [claude/aprofundar-coarctacao-aorta-fetal-20260828]
    paths: [.github/workflows/temporary-prepare-coarctation-release.yml]
permissions: {contents: write}
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - run: |
          git fetch origin release/all-pending-20260828
          git checkout origin/release/all-pending-20260828 -- backend/tests/test_canonical_content_review_status.py backend/tests/test_disease_fragments_canonical.py
          mkdir -p doencas/correcoes
          cat > doencas/correcoes/release-approve-20260828-coarctacao-aorta-fetal.json <<'EOF'
          [{"slug":"coarctacao-aorta-fetal","set":{"review_status":"revisado","review_note":"Aprofundamento Tudo com Tudo de cardiologia fetal produzido pelo Claude, com PMIDs verificados individualmente e correções bibliográficas documentadas. Publicação explicitamente autorizada pelo responsável médico em 28/08/2026 para o release consolidado após validação dos gates, vínculos e regras determinísticas. Mantém necessidade de julgamento clínico individual e confirmação pós-natal apropriada."}}]
          EOF
          git rm .github/workflows/temporary-prepare-coarctation-release.yml
          git diff --check
          git config user.name 'CorVIA Release Bot'; git config user.email 'actions@users.noreply.github.com'
          git add backend/tests
          git add -f doencas/correcoes/release-approve-20260828-coarctacao-aorta-fetal.json
          git commit -m 'review(science): preparar coarctação fetal para release'
          git push origin HEAD:claude/aprofundar-coarctacao-aorta-fetal-20260828
