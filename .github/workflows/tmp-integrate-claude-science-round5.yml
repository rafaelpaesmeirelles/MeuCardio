# Temporary branch-only integrator. Remove before merging.
name: Temporary reviewed Claude science round 5 integrator

on:
  push:
    branches:
      - content/integrate-claude-science-round5-20260821
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message || '', '[integrated]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: content/integrate-claude-science-round5-20260821

      - name: Fetch and pin reviewed PR heads
        shell: bash
        run: |
          set -euo pipefail
          while IFS='|' read -r branch expected; do
            [ -n "$branch" ] || continue
            git fetch --no-tags origin "refs/heads/${branch}:refs/remotes/origin/${branch}"
            actual="$(git rev-parse "refs/remotes/origin/${branch}")"
            if [ "$actual" != "$expected" ]; then
              echo "Head moved: ${branch}: expected ${expected}, got ${actual}" >&2
              exit 1
            fi
          done <<'EOF'
          content/material-paciente-round5-valvopatias-pericardio|60205a94f677448f6e39eed5c756c4cdbff23b79
          content/material-paciente-round5-endocardite-reumatica|af75ce6bae4ab0615a90c11005e0061128e80342
          content/material-paciente-round5-ti-dispositivos|1b2750e6d6b3a12459253dc0ebf88a853bc600f8
          content/material-paciente-round5-gravidez-trombo|707fef16dc45b948209175d71585d8e5109691b6
          content/material-paciente-round5-perioperatorio-farmacologia|cd9800312b5bfdbf10d43b73d470e69d3de8c822
          content/checklists-round5-aorta-congenitas|02ac2115e26d41a163606347022b354e68dac822
          content/checklists-round5-endocardite-pericardio|ebed169e2d06ebf14b1c8976ba26573a73004734
          content/checklists-round5-dac-cardiomiopatias|d036b0bacf3bfd13c50619c2faf3a49cb9c81b32
          content/checklists-round5-valvopatias-prevencao|787baa60c53ce23a9bdfb3c9cf2cde4b14dffb15
          content/checklists-round5-fa-hipertensao|29cc7f005e0f56c9db42e9781bd1a4df23948deb
          EOF

      - name: Consolidate and validate reviewed scientific objects
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          MARKER = "VERIFICAÇÃO HUMANA NECESSÁRIA"
          FALSE_REVIEW_PHRASES = (
              "Revisado e aprovado para publicação por Dr. Rafael Paes Meirelles",
              "Revisado e aprovado por Dr. Rafael Paes Meirelles",
          )
          NEUTRAL_REVIEW = (
              "Revisão editorial e documental concluída para integração neste lote. "
              "O conteúdo permanece rastreável pelo documento de origem e pelas fontes registradas, "
              "sem atribuição de revisão clínica individual a pessoa específica."
          )

          groups = {
              "material-paciente/metadados.json": {
                  "refs": [
                      "origin/content/material-paciente-round5-valvopatias-pericardio",
                      "origin/content/material-paciente-round5-endocardite-reumatica",
                      "origin/content/material-paciente-round5-ti-dispositivos",
                      "origin/content/material-paciente-round5-gravidez-trombo",
                      "origin/content/material-paciente-round5-perioperatorio-farmacologia",
                  ],
                  "expected": 15,
                  "origin_field": "documento_slug",
                  "theme_field": "tema",
              },
              "checklists/metadados.json": {
                  "refs": [
                      "origin/content/checklists-round5-aorta-congenitas",
                      "origin/content/checklists-round5-endocardite-pericardio",
                      "origin/content/checklists-round5-dac-cardiomiopatias",
                      "origin/content/checklists-round5-valvopatias-prevencao",
                      "origin/content/checklists-round5-fa-hipertensao",
                  ],
                  "expected": 14,
                  "origin_field": "documento_origem",
                  "theme_field": "theme",
              },
          }

          for path_str, config in groups.items():
              path = Path(path_str)
              current = json.loads(path.read_text(encoding="utf-8"))
              known_slugs = {item["slug"] for item in current}
              origin_field = config["origin_field"]
              theme_field = config["theme_field"]
              known_origins = {
                  (item.get(theme_field), item.get(origin_field))
                  for item in current
                  if item.get(origin_field)
              }
              added = []

              for ref in config["refs"]:
                  raw = subprocess.check_output(
                      ["git", "show", f"{ref}:{path_str}"], text=True, encoding="utf-8"
                  )
                  source = json.loads(raw)
                  for source_item in source:
                      slug = source_item.get("slug")
                      if not slug or slug in known_slugs:
                          continue
                      item = dict(source_item)

                      if item.get("review_status") != "revisado":
                          raise SystemExit(
                              f"BLOCKED {path_str}: {slug} review_status={item.get('review_status')!r}"
                          )

                      pair = (item.get(theme_field), item.get(origin_field))
                      if item.get(origin_field) and pair in known_origins:
                          raise SystemExit(
                              f"BLOCKED {path_str}: duplicate origin within theme for {slug}: {pair!r}"
                          )

                      publishable = {k: v for k, v in item.items() if k != "revisao"}
                      if MARKER in json.dumps(publishable, ensure_ascii=False):
                          raise SystemExit(
                              f"BLOCKED {path_str}: {slug} has unresolved marker in publishable content"
                          )
                      if MARKER in str(item.get("revisao", "")):
                          print(
                              f"NOTE {slug}: internal review metadata retains a disclosure that an "
                              "unconfirmed source detail was intentionally omitted from publishable content"
                          )

                      review_note = str(item.get("revisao", ""))
                      if any(phrase in review_note for phrase in FALSE_REVIEW_PHRASES):
                          item["revisao"] = NEUTRAL_REVIEW
                          print(f"NORMALIZED {slug}: removed unsupported personal review attribution")

                      current.append(item)
                      known_slugs.add(slug)
                      if item.get(origin_field):
                          known_origins.add(pair)
                      added.append(slug)

              if len(added) != config["expected"]:
                  raise SystemExit(
                      f"Unexpected integration count for {path_str}: "
                      f"{len(added)} != {config['expected']}\n" + "\n".join(added)
                  )

              # Final deterministic integrity checks for the combined manifest.
              slugs = [item.get("slug") for item in current]
              if len(slugs) != len(set(slugs)):
                  raise SystemExit(f"Duplicate slug after consolidation: {path_str}")
              for item in current:
                  if item.get("slug") in added:
                      if item.get("review_status") != "revisado":
                          raise SystemExit(f"Non-reviewed integrated item: {item.get('slug')}")
                      if any(p in str(item.get("revisao", "")) for p in FALSE_REVIEW_PHRASES):
                          raise SystemExit(f"Unsupported personal review attribution: {item.get('slug')}")
                      public = {k: v for k, v in item.items() if k != "revisao"}
                      if MARKER in json.dumps(public, ensure_ascii=False):
                          raise SystemExit(f"Unresolved marker in publishable item: {item.get('slug')}")

              path.write_text(
                  json.dumps(current, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
              )
              print(f"{path_str}: added {len(added)} reviewed items")
              for slug in added:
                  print(f"  + {slug}")
          PY

      - name: Check resulting diff only
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool material-paciente/metadados.json >/dev/null
          python -m json.tool checklists/metadados.json >/dev/null
          git diff --check -- material-paciente/metadados.json checklists/metadados.json

      - name: Commit consolidated scientific content
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add material-paciente/metadados.json checklists/metadados.json
          git commit -m "content: integrate reviewed Claude science round 5 [integrated]"
          git push origin HEAD:content/integrate-claude-science-round5-20260821
