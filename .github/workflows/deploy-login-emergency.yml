name: Emergency web UI deploy

on:
  push:
    branches: [main]
    paths:
      - frontend/src/pages/Entrar.tsx
      - frontend/src/components/GalaxyThemeToggle.tsx
      - frontend/src/styles/cardiology-spaces-login-motion-fidelity.css
      - frontend/src/styles/cardiology-spaces-login-galaxy-kinematics.css
      - frontend/src/styles/galaxy-theme-toggle-refinement.css
      - frontend/src/styles/cardiology-spaces-universe-final.css
      - ops/remote-deploy-entrypoint.sh
      - ops/bootstrap-release-entrypoint.sh
      - .github/workflows/deploy-login-emergency.yml

permissions:
  contents: read

# Mesma fila serial da publicação normal: nunca concorre com outro deploy.
concurrency:
  group: corvia-production-deploy
  cancel-in-progress: false

jobs:
  deploy-ui-hotfix:
    name: Deploy approved web UI without test suites
    if: contains(github.event.head_commit.message, '[login-emergency-deploy]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      TARGET_SHA: ${{ github.sha }}
      SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
      SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
      SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}

    steps:
      - name: Prepare restricted production SSH transport
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Missing PRODUCTION_SSH_HOST}"
          : "${SSH_USER:?Missing PRODUCTION_SSH_USER}"
          : "${SSH_PRIVATE_KEY:?Missing PRODUCTION_SSH_PRIVATE_KEY}"
          : "${SSH_KNOWN_HOSTS:?Missing PRODUCTION_SSH_KNOWN_HOSTS}"
          ssh_dir="$RUNNER_TEMP/corvia-ssh"
          install -m 0700 -d "$ssh_dir"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$ssh_dir/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 0600 "$ssh_dir/deploy_key" "$ssh_dir/known_hosts"

      - name: Publish exact current main through the web-only forced command
        run: |
          set -euo pipefail
          SSH_PORT="${SSH_PORT:-22}"
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid main SHA" >&2; exit 65; }
          timeout 3000s ssh -p "$SSH_PORT" -i "$RUNNER_TEMP/corvia-ssh/deploy_key" \
            -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$RUNNER_TEMP/corvia-ssh/known_hosts" \
            "$SSH_USER@$SSH_HOST" \
            "deploy-web $TARGET_SHA"

      - name: Verify public web release
        env:
          PUBLIC_URL: https://corvia.med.br
        run: |
          set -euo pipefail
          cache_buster="${TARGET_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          version_file="$RUNNER_TEMP/version.json"
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 \
            -H 'Cache-Control: no-cache, no-store, max-age=0' \
            "$PUBLIC_URL/api/version?release=$cache_buster" > "$version_file"
          python3 - "$version_file" "$TARGET_SHA" <<'PY'
          import json
          import sys
          path, expected = sys.argv[1:]
          with open(path, encoding="utf-8") as handle:
              payload = json.load(handle)
          actual = payload.get("commit") or payload.get("version") or payload.get("sha")
          if actual != expected:
              raise SystemExit(f"Production reports {actual!r}; expected {expected!r}")
          print(f"Production version confirmed: {actual}")
          PY
          curl --fail --silent --show-error -H 'Cache-Control: no-cache' "$PUBLIC_URL/api/health?release=$cache_buster" > /dev/null
          curl --fail --silent --show-error -H 'Cache-Control: no-cache' "$PUBLIC_URL/api/ready?release=$cache_buster" > /dev/null
          echo "Production web SHA, health and readiness confirmed."
