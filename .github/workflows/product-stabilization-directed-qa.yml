name: Product stabilization directed QA

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/product-stabilization-directed-qa.yml"

permissions:
  contents: read

jobs:
  directed-qa:
    if: github.event.pull_request.head.ref == 'fix/product-stabilization-20260820'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COMPOSE_PROJECT_NAME: corvia_product_qa
      ENVIRONMENT: test
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: meucardio_product
      POSTGRES_PASSWORD: product-test
      POSTGRES_DB: meucardio_product
      REDIS_URL: redis://redis:6379/0
      STORAGE_ENCRYPTION_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
      JWT_SECRET: chave-product-qa-nao-usar-em-producao
      ADMIN_EMAIL: product-qa@teste.local
      ADMIN_PASSWORD: product-qa-seguro-123
      AI_ENABLED: "false"
      MAIL360_CLIENT_ID: id-de-teste
      MAIL360_CLIENT_SECRET: secret-de-teste
      MAIL360_REFRESH_TOKEN: refresh-de-teste
      CORVIA_MAIL_PRECO_CENTAVOS: "1000"
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_product_dummy
      PUBLIC_URL: http://127.0.0.1:8080
      UPLOADS_DIR: /tmp/corvia-product/uploads
      EXAMES_DIR: /tmp/corvia-product/exames-pacientes
      DOCUMENTOS_DIR: /tmp/corvia-product/documentos-emitidos

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Create isolated environment
        run: |
          cat > .env <<'ENV'
          COMPOSE_PROJECT_NAME=corvia_product_qa
          ENVIRONMENT=test
          POSTGRES_HOST=db
          POSTGRES_PORT=5432
          POSTGRES_USER=meucardio_product
          POSTGRES_PASSWORD=product-test
          POSTGRES_DB=meucardio_product
          REDIS_URL=redis://redis:6379/0
          STORAGE_ENCRYPTION_KEY=MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
          JWT_SECRET=chave-product-qa-nao-usar-em-producao
          ADMIN_EMAIL=product-qa@teste.local
          ADMIN_PASSWORD=product-qa-seguro-123
          AI_ENABLED=false
          MAIL360_CLIENT_ID=id-de-teste
          MAIL360_CLIENT_SECRET=secret-de-teste
          MAIL360_REFRESH_TOKEN=refresh-de-teste
          CORVIA_MAIL_PRECO_CENTAVOS=1000
          STRIPE_SECRET_KEY=sk_test_dummy
          STRIPE_WEBHOOK_SECRET=whsec_product_dummy
          PUBLIC_URL=http://127.0.0.1:8080
          UPLOADS_DIR=/tmp/corvia-product/uploads
          EXAMES_DIR=/tmp/corvia-product/exames-pacientes
          DOCUMENTOS_DIR=/tmp/corvia-product/documentos-emitidos
          ENV

      - name: Start isolated stack
        run: docker compose up -d --build db redis backend

      - name: Build production frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Serve production build
        run: |
          mkdir -p product-qa
          cat > product-qa/nginx.conf <<'NGINX'
          server {
            listen 80;
            server_name _;
            root /usr/share/nginx/html;
            index index.html;
            location /api/ {
              proxy_pass http://backend:8000/api/;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_buffering off;
            }
            location / { try_files $uri $uri/ /index.html; }
          }
          NGINX
          docker run -d --name corvia-product-nginx --network corvia_product_qa_default -p 8080:80 \
            -v "$PWD/frontend/dist:/usr/share/nginx/html:ro" \
            -v "$PWD/product-qa/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.27-alpine
          for attempt in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8080/api/ready >/dev/null && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/api/ready >/dev/null

      - name: Create QA administrator
        run: |
          docker compose exec -T backend python -m app.commands.create_admin \
            --email product-qa@teste.local --password product-qa-seguro-123 --name "Dr. Product QA"

      - name: Install Chromium
        run: |
          mkdir -p /tmp/corvia-product-qa && cd /tmp/corvia-product-qa
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Capture reported problem surfaces
        run: |
          mkdir -p product-qa/screenshots
          cat > /tmp/corvia-product-qa/capture.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import path from 'node:path';

          const base = 'http://127.0.0.1:8080';
          const out = path.join(process.env.GITHUB_WORKSPACE, 'product-qa', 'screenshots');
          const reportPath = path.join(process.env.GITHUB_WORKSPACE, 'product-qa', 'report.json');
          fs.mkdirSync(out, { recursive: true });
          const browser = await chromium.launch({ headless: true });
          const report = { pages: [], failures: [], pageErrors: [] };

          const routes = [
            ['home', '/'],
            ['prescricao', '/receituario'],
            ['mail', '/caixa-de-email'],
            ['sincronizacao', '/sincronizacao'],
            ['minha-conta', '/minha-conta'],
            ['tour', '/tour'],
            ['termos', '/termos'],
            ['privacidade', '/privacidade'],
            ['agenda', '/agenda'],
          ];

          async function authenticated(viewport) {
            const context = await browser.newContext({ viewport, colorScheme: 'dark', locale: 'pt-BR' });
            const page = await context.newPage();
            page.on('pageerror', (error) => report.pageErrors.push(String(error)));
            await page.goto(`${base}/entrar`, { waitUntil: 'networkidle' });
            await page.locator('#email').fill('product-qa@teste.local');
            await page.locator('#senha').fill('product-qa-seguro-123');
            await page.locator('button[type="submit"]').click();
            await page.waitForURL((url) => !url.pathname.includes('/entrar'), { timeout: 20000 });
            await page.waitForTimeout(700);
            return { context, page };
          }

          async function capture(page, mode, name, route) {
            await page.goto(`${base}${route}`, { waitUntil: 'networkidle' });
            await page.waitForTimeout(850);
            if (name === 'agenda') {
              const configurar = page.getByRole('button', { name: /configurar/i }).first();
              if (await configurar.isVisible().catch(() => false)) {
                await configurar.click();
                await page.waitForTimeout(350);
              }
            }
            const metrics = await page.evaluate(() => {
              const nav = document.querySelector('.ccc-nav');
              const navText = nav?.textContent || '';
              const legalLogo = document.querySelector('.legal-page > header img');
              const tourAvatar = document.querySelector('.cos-tour-welcome__avatar');
              const bodyText = document.body?.innerText || '';
              return {
                path: location.pathname,
                width: innerWidth,
                scrollWidth: document.documentElement.scrollWidth,
                height: innerHeight,
                scrollHeight: document.documentElement.scrollHeight,
                mailNavLabels: (navText.match(/CorVIA Mail/g) || []).length,
                duplicateLegacyMailLabel: navText.includes('Caixa de e-mail'),
                manualSyncVisible: bodyText.includes('Sincronizar agora'),
                legalLogo: legalLogo?.getAttribute('src') || null,
                tourAvatar: Boolean(tourAvatar),
              };
            });
            report.pages.push({ mode, name, ...metrics });
            if (metrics.scrollWidth > metrics.width + 2) report.failures.push(`${mode}/${name}: horizontal overflow ${metrics.scrollWidth}>${metrics.width}`);
            if (name === 'sincronizacao' && metrics.manualSyncVisible) report.failures.push(`${mode}/${name}: manual sync control still visible`);
            if (name === 'tour' && metrics.tourAvatar) report.failures.push(`${mode}/${name}: broken tour avatar tile still present`);
            if ((name === 'termos' || name === 'privacidade') && metrics.legalLogo !== '/corvia-logo-canonical-dark.svg') report.failures.push(`${mode}/${name}: wrong legal brand asset ${metrics.legalLogo}`);
            if (name === 'home' && (metrics.mailNavLabels !== 1 || metrics.duplicateLegacyMailLabel)) report.failures.push(`${mode}/${name}: duplicated mail navigation`);
            await page.screenshot({ path: path.join(out, `${mode}-${name}.png`), fullPage: true });
          }

          // Public validation must render before authentication gates.
          {
            const context = await browser.newContext({ viewport: { width: 1280, height: 800 }, colorScheme: 'dark', locale: 'pt-BR' });
            const page = await context.newPage();
            page.on('pageerror', (error) => report.pageErrors.push(String(error)));
            await page.goto(`${base}/validar`, { waitUntil: 'networkidle' });
            await page.waitForTimeout(300);
            const hasInput = await page.locator('#codigo-validacao').isVisible().catch(() => false);
            if (!hasInput) report.failures.push('public/validar: validation form unavailable without login');
            await page.screenshot({ path: path.join(out, 'public-validar.png'), fullPage: true });
            await context.close();
          }

          for (const spec of [
            ['desktop', { width: 1440, height: 900 }, routes],
            ['mobile', { width: 390, height: 844 }, routes.filter(([name]) => ['home','prescricao','sincronizacao','minha-conta','tour','termos','privacidade'].includes(name))],
          ]) {
            const [mode, viewport, selected] = spec;
            const { context, page } = await authenticated(viewport);
            for (const [name, route] of selected) await capture(page, mode, name, route);
            await context.close();
          }

          await browser.close();
          fs.writeFileSync(reportPath, JSON.stringify(report, null, 2));
          console.log(JSON.stringify(report, null, 2));
          if (report.pageErrors.length || report.failures.length) process.exit(1);
          JS
          cd /tmp/corvia-product-qa
          node capture.mjs

      - name: Upload directed QA artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: product-stabilization-directed-qa
          path: product-qa/
          if-no-files-found: error
          retention-days: 7

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=250 backend || true
          docker logs corvia-product-nginx || true

      - name: Stop isolated stack
        if: always()
        run: |
          docker rm -f corvia-product-nginx >/dev/null 2>&1 || true
          docker compose down -v --remove-orphans
