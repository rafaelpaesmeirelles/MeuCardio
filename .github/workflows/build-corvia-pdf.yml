name: Build Corvia institutional PDF

on:
  push:
    branches:
      - agent/corvia-pdf-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF dependencies
        run: python -m pip install --disable-pip-version-check reportlab pillow

      - name: Build PDF
        run: python tools/build_corvia_pdf.py

      - name: Inspect output
        run: |
          ls -lh artifacts/Corvia_Apresentacao_Institucional.pdf
          file artifacts/Corvia_Apresentacao_Institucional.pdf

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: corvia-pdf-institucional
          path: artifacts/Corvia_Apresentacao_Institucional.pdf
          if-no-files-found: error
