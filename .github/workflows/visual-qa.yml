name: Visual QA — Clinical OS

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/visual-qa.yml"
      - "frontend/**"
      - "scripts/feature_inventory.py"

permissions:
  contents: read

jobs:
  visual-qa:
    name: Desktop + mobile screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COMPOSE_PROJECT_NAME: corvia_visual_qa
      ENVIRONMENT: test
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: meucardio_visual
      POSTGRES_PASSWORD: visual-test
      POSTGRES_DB: meucardio_visual
      REDIS_URL: redis://redis:6379/0
      STORAGE_ENCRYPTION_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
      JWT_SECRET: chave-visual-qa-nao-usar-em-producao
      ADMIN_EMAIL: visual-qa@teste.local
      ADMIN_PASSWORD: visual-qa-seguro-123
      AI_ENABLED: "false"
      MAIL360_CLIENT_ID: id-de-teste
      MAIL360_CLIENT_SECRET: secret-de-teste
      MAIL360_REFRESH_TOKEN: refresh-de-teste
      CORVIA_MAIL_PRECO_CENTAVOS: "1000"
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_visual_dummy
      PUBLIC_URL: http://127.0.0.1:8080
      UPLOADS_DIR: /tmp/corvia-visual/uploads
      EXAMES_DIR: /tmp/corvia-visual/exames-pacientes
      DOCUMENTOS_DIR: /tmp/corvia-visual/documentos-emitidos

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Create isolated runtime environment
        run: |
          cat > .env <<'ENV'
          COMPOSE_PROJECT_NAME=corvia_visual_qa
          ENVIRONMENT=test
          POSTGRES_HOST=db
          POSTGRES_PORT=5432
          POSTGRES_USER=meucardio_visual
          POSTGRES_PASSWORD=visual-test
          POSTGRES_DB=meucardio_visual
          REDIS_URL=redis://redis:6379/0
          STORAGE_ENCRYPTION_KEY=MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
          JWT_SECRET=chave-visual-qa-nao-usar-em-producao
          ADMIN_EMAIL=visual-qa@teste.local
          ADMIN_PASSWORD=visual-qa-seguro-123
          AI_ENABLED=false
          MAIL360_CLIENT_ID=id-de-teste
          MAIL360_CLIENT_SECRET=secret-de-teste
          MAIL360_REFRESH_TOKEN=refresh-de-teste
          CORVIA_MAIL_PRECO_CENTAVOS=1000
          STRIPE_SECRET_KEY=sk_test_dummy
          STRIPE_WEBHOOK_SECRET=whsec_visual_dummy
          PUBLIC_URL=http://127.0.0.1:8080
          UPLOADS_DIR=/tmp/corvia-visual/uploads
          EXAMES_DIR=/tmp/corvia-visual/exames-pacientes
          DOCUMENTOS_DIR=/tmp/corvia-visual/documentos-emitidos
          ENV

      - name: Start isolated data and API stack
        run: docker compose up -d --build db redis backend

      - name: Build production frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Serve production build through isolated Nginx
        run: |
          mkdir -p visual-qa
          cat > visual-qa/nginx.conf <<'NGINX'
          server {
            listen 80;
            server_name _;
            root /usr/share/nginx/html;
            index index.html;

            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://*.corvia.med.br; frame-src 'none'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

            location /api/ {
              proxy_pass http://backend:8000/api/;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_buffering off;
            }

            location /uploads/ {
              proxy_pass http://backend:8000/uploads/;
              proxy_set_header Host $host;
            }

            location / {
              try_files $uri $uri/ /index.html;
            }
          }
          NGINX
          docker run -d --name corvia-visual-nginx \
            --network corvia_visual_qa_default \
            -p 8080:80 \
            -v "$PWD/frontend/dist:/usr/share/nginx/html:ro" \
            -v "$PWD/visual-qa/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine

      - name: Wait for production HTTP readiness
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/api/ready >/dev/null \
              && curl --fail --silent http://127.0.0.1:8080/entrar >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color backend
          docker logs corvia-visual-nginx || true
          exit 1

      - name: Create visual QA administrator
        run: |
          docker compose exec -T backend python -m app.commands.create_admin \
            --email visual-qa@teste.local \
            --password visual-qa-seguro-123 \
            --name "Alexandriana Visual QA"
          docker compose exec -T backend python - <<'PYPROFILE'
          from sqlalchemy import select
          from app.core.db import SessionLocal
          from app.models.user import User
          with SessionLocal() as db:
              user = db.scalar(select(User).where(User.email == "visual-qa@teste.local"))
              assert user is not None
              user.full_name = "Alexandriana Visual QA"
              user.professional_title = "Profa. Dra."
              db.commit()
          PYPROFILE

      - name: Install ephemeral Chromium runner
        run: |
          mkdir -p /tmp/corvia-visual-qa
          cd /tmp/corvia-visual-qa
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.54.2 pngjs@7.0.0
          npx playwright install --with-deps chromium

      - name: Capture canonical surfaces
        run: |
          mkdir -p visual-qa/screenshots
          cat > /tmp/corvia-visual-qa/capture.mjs <<'JS'
          import { chromium } from 'playwright';
          import { PNG } from 'pngjs';
          import fs from 'node:fs';
          import path from 'node:path';

          const { measureMobileSpaces, validateMobileSpaces } = await import(`file://${process.env.GITHUB_WORKSPACE}/frontend/scripts/mobile-spaces-geometry.mjs`);
          const { inspectFavoritesAndApprovals } = await import(`file://${process.env.GITHUB_WORKSPACE}/frontend/scripts/visual-favorites-approvals.mjs`);
          const base = 'http://127.0.0.1:8080';
          const out = path.join(process.env.GITHUB_WORKSPACE, 'visual-qa', 'screenshots');
          const reportPath = path.join(process.env.GITHUB_WORKSPACE, 'visual-qa', 'report.json');
          fs.mkdirSync(out, { recursive: true });

          const desktopRoutes = [
            ['home', '/'],
            ['medicamentos', '/medicamentos'],
            ['evidencias', '/evidencias'],
            ['pacientes', '/round'],
            ['agenda', '/agenda'],
            ['documentos', '/documentos'],
            ['mail', '/corvia-mail'],
            ['emergencia', '/emergencia'],
            ['preoperatorio', '/avaliacao-preoperatoria'],
            ['admin', '/admin'],
          ];
          const mobileRoutes = [
            ['home', '/'],
            ['medicamentos', '/medicamentos'],
            ['pacientes', '/round'],
            ['agenda', '/agenda'],
            ['emergencia', '/emergencia'],
          ];
          const forbiddenVisibleText = [
            'websearch',
            'texto integral não lido nesta sessão',
            'texto integral nao lido nesta sessao',
            'registro_prospectivo',
            'coorte_retrospectiva',
          ];

          const browser = await chromium.launch({ headless: true });
          const report = { pages: [], pageErrors: [], failures: [] };

          async function login(viewport) {
            const context = await browser.newContext({ viewport, colorScheme: 'dark', locale: 'pt-BR' });
            const page = await context.newPage();
            page.on('pageerror', (error) => report.pageErrors.push(String(error)));
            let sessionResponse = null;
            let profileResponse = null;
            for (let attempt = 1; attempt <= 2 && !sessionResponse; attempt += 1) {
              await page.goto(`${base}/entrar`, { waitUntil: 'networkidle' });
              await page.locator('#email').fill('visual-qa@teste.local');
              await page.locator('#senha').fill('visual-qa-seguro-123');
              const sessionResponsePromise = page.waitForResponse((response) =>
                response.url().endsWith('/api/auth/sessao') && response.request().method() === 'POST',
                { timeout: 12000 },
              ).catch(() => null);
              const profileResponsePromise = page.waitForResponse((response) =>
                response.url().endsWith('/api/auth/me') && response.request().method() === 'GET' && response.status() === 200,
                { timeout: 20000 },
              ).catch(() => null);
              await page.locator('button[type="submit"]').click();
              sessionResponse = await sessionResponsePromise;
              if (sessionResponse) profileResponse = await profileResponsePromise;
            }
            if (!sessionResponse) throw new Error('login visual QA: formulário não enviou a sessão após 2 tentativas');
            if (!sessionResponse.ok()) throw new Error(`login visual QA: HTTP ${sessionResponse.status()}`);
            if (!profileResponse) throw new Error('login visual QA: perfil autenticado não foi confirmado');
            await page.waitForURL((url) => !url.pathname.includes('/entrar'), { timeout: 20000 });
            await page.goto(`${base}/`, { waitUntil: 'networkidle' });
            await page.waitForTimeout(900);
            await selectCompleteMode(page);
            return { context, page };
          }

          async function selectHomeMode(page, mode) {
            await page.getByRole('combobox', {name:'Modo de trabalho',exact:true}).selectOption(mode);
            await page.locator(`.atelier-home.spaces-home--mode-${mode}`).waitFor({state:'visible'});
          }

          async function setHomeTheme(page, theme) {
            const account=page.locator('details.atelier-account');
            if (!await account.evaluate(element => element.open)) await account.locator('summary').click();
            await account.getByRole('radio',{name:theme === 'light' ? /Modo claro/ : /Modo escuro/}).click();
            await page.waitForFunction(value => document.documentElement.dataset.corviaTheme === value,theme);
            if (await account.evaluate(element => element.open)) await account.locator('summary').click();
            await account.locator('.corvia-theme-selector').waitFor({state:'hidden'});
          }

          async function selectCompleteMode(page) {
            // Complete an actual isolated onboarding if this freshly created
            // administrator requires it; never bypass the gate with storage.
            await page.locator('.atelier-home, .cst--atelier').first().waitFor({state:'visible',timeout:15000});
            if (await page.locator('.cst--atelier').isVisible().catch(() => false)) {
              const chapters=page.locator('.cst-at__chapter-select select');
              await chapters.selectOption(String((await chapters.locator('option').count())-1));
              await page.getByRole('button',{name:'Entrar no Cardiology Spaces',exact:true}).click();
              await page.locator('.atelier-home').waitFor({state:'visible',timeout:15000});
            }
            await selectHomeMode(page,'complete');
            if (await page.locator('.atelier-arrival').isVisible().catch(() => false)) {
              const mobileSpace=page.locator('.atelier-mobile-spaces button').filter({hasText:/^Consultório$/});
              if (await mobileSpace.isVisible()) await mobileSpace.click();
              else await page.getByRole('button',{name:'Selecionar Consultório',exact:true}).click();
              await page.locator('.atelier-primary').click();
            }
            await page.locator('.atelier-space').waitFor({state:'visible',timeout:10000});
            await page.waitForURL(url => url.searchParams.get('espaco') === 'consultorio' && url.searchParams.get('modo') === 'complete');
            await page.evaluate(() => window.scrollTo({top:0,left:0,behavior:'instant'}));
          }

          async function inspectAndCapture(page, mode, name, route) {
            await page.goto(`${base}${route}`, { waitUntil: 'networkidle' });
            if (name === 'home') {
              await selectCompleteMode(page);
              await page.locator('.atelier-day > summary').click();
              await page.locator('.atelier-day .spaces-day').waitFor({state:'visible'});
              await page.evaluate(() => window.scrollTo({top:0,left:0,behavior:'instant'}));
            }
            await page.waitForTimeout(1100);
            await page.locator('.atelier-home img[src^="/atelier/"]').evaluateAll(images => Promise.all(images.filter(image => image.getBoundingClientRect().width > 0).map(image => image.decode().catch(() => undefined))));
            const metrics = await page.evaluate((forbidden) => {
              const visible = (element) => {
                if (!element) return false;
                const style = getComputedStyle(element);
                const rect = element.getBoundingClientRect();
                return style.display !== 'none' && style.visibility !== 'hidden' && rect.width > 0 && rect.height > 0;
              };
              const bodyText = document.body?.innerText || '';
              const text = bodyText.toLocaleLowerCase('pt-BR');
              const fixed = [...document.querySelectorAll('*')]
                .filter((element) => {
                  const style = getComputedStyle(element);
                  return style.position === 'fixed' && visible(element);
                })
                .slice(0, 30)
                .map((element) => ({ tag: element.tagName.toLowerCase(), className: typeof element.className === 'string' ? element.className : '', aria: element.getAttribute('aria-label') || '' }));
              const emergency = document.querySelector('.emerg');
              const emergencyRect = emergency && visible(emergency)
                ? (() => { const r = emergency.getBoundingClientRect(); return { left:r.left, top:r.top, right:r.right, bottom:r.bottom }; })()
                : null;
              const sidebar = document.querySelector('.cv-sidebar');
              const topbar = document.querySelector('.cv-topbar');
              const overlaps = (first, second) => {
                if (!first || !second || !visible(first) || !visible(second)) return false;
                const a = first.getBoundingClientRect();
                const b = second.getBoundingClientRect();
                return a.left < b.right && a.right > b.left && a.top < b.bottom && a.bottom > b.top;
              };
              const emergencyUnderChrome = emergency
                ? overlaps(emergency, sidebar) || overlaps(emergency, topbar)
                : false;
              const legacyFabVisible = visible(document.querySelector('.cos-emergency-fab'));
              const creditVisible = visible(document.querySelector('.credito'));
              const suspenseVisible = text.includes('carregando a tela');
              return {
                path: location.pathname,
                width: innerWidth,
                scrollWidth: document.documentElement.scrollWidth,
                height: innerHeight,
                bodyText,
                forbidden: forbidden.filter((needle) => text.includes(needle)),
                fixed,
                emergencyRect,
                emergencyUnderChrome,
                legacyFabVisible,
                creditVisible,
                suspenseVisible,
                spacesHome: visible(document.querySelector('.atelier-home')),
                spacesBrand: visible(document.querySelector('.atelier-brand')),
                spacesInterior: visible(document.querySelector('.atelier-space')),
                spacesShelves: [...document.querySelectorAll('.atelier-shelf')].filter(visible).length,
                spacesActions: [...document.querySelectorAll('.atelier-shelf .spaces-action')].map(element => ({visible:visible(element),href:element.getAttribute('href'),label:element.innerText})),
                spacesDay: visible(document.querySelector('.atelier-day .spaces-day')),
                contextCatalogTrigger: visible(document.querySelector('.atelier-catalog-trigger')),
                workMode: document.querySelector('select[aria-label="Modo de trabalho"]')?.value,
                consultorioSelected: document.querySelector('.atelier-home')?.getAttribute('data-space') === 'consultorio',
                brokenInteriors: [...document.querySelectorAll('.atelier-home img[src^="/atelier/"]')].filter(element => visible(element) && (!element.complete || !element.naturalWidth || !element.alt)).map(element => element.getAttribute('src')),
                drugCommand: visible(document.querySelector('.cc-drugs-page')),
              };
            }, forbiddenVisibleText);
            report.pages.push({ mode, name, route, ...metrics, bodyText: undefined });
            if (metrics.scrollWidth > metrics.width + 12) report.failures.push(`${mode}/${name}: overflow horizontal ${metrics.scrollWidth}px > ${metrics.width}px`);
            if (metrics.forbidden.length) report.failures.push(`${mode}/${name}: texto interno visível: ${metrics.forbidden.join(', ')}`);
            if (metrics.legacyFabVisible) report.failures.push(`${mode}/${name}: FAB legado visível sobre o Clinical OS`);
            if (metrics.creditVisible) report.failures.push(`${mode}/${name}: crédito institucional visível dentro do workspace`);
            if (metrics.suspenseVisible) report.failures.push(`${mode}/${name}: rota permaneceu presa no fallback “Carregando a tela”`);
            if (name === 'medicamentos' && !metrics.drugCommand) report.failures.push(`${mode}/medicamentos: Medication Command Center não renderizou`);
            if (name === 'home') {
              if (!metrics.spacesHome || !metrics.spacesBrand || !metrics.spacesInterior || !metrics.contextCatalogTrigger || !metrics.consultorioSelected || metrics.workMode !== 'complete') report.failures.push(`${mode}/home: incomplete Atelier workspace`);
              if (metrics.spacesShelves !== 3 || metrics.spacesActions.length !== 12 || metrics.spacesActions.some(action => !action.visible || !action.href?.startsWith('/') || action.href.startsWith('//'))) report.failures.push(`${mode}/home: expected three shelves and twelve available same-origin functions`);
              if (!metrics.spacesDay) report.failures.push(`${mode}/home: real agenda disclosure failed to open`);
              if (metrics.brokenInteriors.length) report.failures.push(`${mode}/home: missing accessible interiors ${metrics.brokenInteriors.join(', ')}`);
            }
            if (mode === 'desktop' && name === 'emergencia') {
              if (!metrics.emergencyRect || metrics.emergencyUnderChrome) report.failures.push(`desktop/emergencia: modo está sob a sidebar/topbar (${JSON.stringify(metrics.emergencyRect)})`);
            }
            await page.screenshot({ path: path.join(out, `${mode}-${name}.png`), fullPage: false });
          }

          async function inspectScientificMonitor(page, name) {
            const day=page.locator('.atelier-day');
            if (!await day.evaluate(element => element.open)) await day.locator('summary').click();
            const monitor = page.locator('.atelier-home.spaces-home--mode-scientific .atelier-day .scientific-intelligence-monitor.is-compact');
            const count = await monitor.count();
            const timelineCount = await page.locator('.atelier-home.spaces-home--mode-scientific .atelier-day .spaces-scientific-timeline, .atelier-home.spaces-home--mode-scientific .atelier-day [aria-label="Minha timeline"]').count();
            const metrics = {name,count,timelineCount};
            if (count !== 1) report.failures.push(`${name}: expected exactly one CorVIA Intelligence monitor, found ${count}`);
            if (timelineCount !== 0) report.failures.push(`${name}: replaced Timeline card is still present`);
            if (count === 1) {
              await monitor.locator('.scientific-intelligence-monitor__health').waitFor({state:'visible',timeout:15000});
              await monitor.locator('h3').evaluate(element => element.scrollIntoView({block:'center',inline:'nearest',behavior:'instant'}));
              metrics.heading = await monitor.locator('h3').innerText();
              metrics.openLink = await monitor.locator('a[href="/intelligence"]').isVisible();
              metrics.health = await monitor.locator('.scientific-intelligence-monitor__health').innerText();
              metrics.hasCadence = (await monitor.innerText()).includes('Consultas a cada');
              metrics.box = await monitor.boundingBox();
              const width = page.viewportSize().width;
              if (metrics.heading.trim() !== 'CorVIA Intelligence' || !metrics.openLink || !metrics.health || !metrics.hasCadence) report.failures.push(`${name}: monitor missing its title, access link or actual monitoring status`);
              if (!metrics.box || metrics.box.x < -1 || metrics.box.x + metrics.box.width > width + 1) report.failures.push(`${name}: intelligence monitor outside viewport`);
              // Capture the real visible viewport, not a tall element clipped by its scrollable aside.
              await page.screenshot({path:path.join(out,`${name}-intelligence.png`),fullPage:false});
              metrics.headingContrast = [];
              const luminance = rgb => rgb.map(value => value / 255).map(value => value <= .04045 ? value / 12.92 : ((value + .055) / 1.055) ** 2.4).reduce((sum,value,index) => sum + value * [.2126,.7152,.0722][index],0);
              for (const heading of await monitor.locator('h3,h4').all()) {
                await heading.evaluate(element => element.scrollIntoView({block:'center',inline:'nearest',behavior:'instant'}));
                const sample = await heading.evaluate(element => {
                  const box=element.getBoundingClientRect();
                  const panel=element.closest('.scientific-intelligence-monitor');
                  const panelBox=panel.getBoundingClientRect();
                  const x=panelBox.left+8, y=(box.top+box.bottom)/2;
                  return {text:element.textContent.trim(),color:getComputedStyle(element).color,x,y,uncovered:document.elementFromPoint(x,y) === panel};
                });
                const png=PNG.sync.read(await page.screenshot({fullPage:false}));
                const scale=png.width/page.viewportSize().width;
                const x=Math.floor(sample.x*scale), y=Math.floor(sample.y*scale);
                const color=sample.color.match(/^rgba?\(([\d.]+)[, ]+([\d.]+)[, ]+([\d.]+)/);
                if (!sample.uncovered || !color || x < 0 || y < 0 || x >= png.width || y >= png.height) {
                  report.failures.push(`${name}: cannot verify visible background of heading ${sample.text}`);
                  continue;
                }
                const background=[...png.data.slice((y*png.width+x)*4,(y*png.width+x)*4+3)];
                const foreground=color.slice(1,4).map(Number);
                const levels=[luminance(background),luminance(foreground)].sort((a,b)=>a-b);
                const ratio=(levels[1]+.05)/(levels[0]+.05);
                metrics.headingContrast.push({text:sample.text,foreground,background,ratio});
                if (ratio < 4.5) report.failures.push(`${name}: heading ${sample.text} contrast ${ratio.toFixed(2)} < 4.5`);
              }
              metrics.controls=[];
              for (const selector of ['a[href="/intelligence"]','.scientific-intelligence-monitor__refresh']) {
                const control=monitor.locator(selector);
                await control.evaluate(element => element.scrollIntoView({block:'center',inline:'nearest',behavior:'instant'}));
                const access=await control.evaluate(element => {
                  const box=element.getBoundingClientRect();
                  const dx=Math.min(8,box.width/4),dy=Math.min(8,box.height/4);
                  const points=[[box.left+dx,box.top+dy],[box.right-dx,box.top+dy],[box.left+dx,box.bottom-dy],[box.right-dx,box.bottom-dy],[(box.left+box.right)/2,(box.top+box.bottom)/2]];
                  return {text:element.textContent.trim(),width:box.width,height:box.height,uncovered:points.every(([x,y]) => x>=0 && y>=0 && x<innerWidth && y<innerHeight && element.contains(document.elementFromPoint(x,y)))};
                });
                metrics.controls.push(access);
                if (!access.uncovered) report.failures.push(`${name}: control ${access.text} clipped or covered after scrolling`);
              }
              await page.screenshot({path:path.join(out,`${name}-intelligence-controls.png`),fullPage:false});
              await page.locator('.atelier-header .atelier-brand').evaluate(element => element.scrollIntoView({block:'start',inline:'nearest',behavior:'instant'}));
              // Reset the QA's explicit monitor scroll, not just the brand's own offset.
              await page.evaluate(() => window.scrollTo({top:0,left:0,behavior:'instant'}));
            }
            (report.scientificIntelligenceSurfaces ??= []).push(metrics);
          }

          async function inspectMobileSpacesMatrix(page) {
            const matrix=[];
            for (const width of [320,360,393,430]) {
              await page.setViewportSize({width,height:900});
              await page.goto(`${base}/`,{waitUntil:'networkidle'});
              await selectCompleteMode(page);
              for (const theme of ['light','dark']) {
                await setHomeTheme(page,theme);
                await page.locator('.atelier-header > .atelier-brand').click();
                await page.locator('.atelier-arrival').waitFor({state:'visible'});
                await selectHomeMode(page,'complete');
                const capture=async mode => {
                  await page.evaluate(async () => {
                    await document.fonts.ready;
                    await Promise.all([...document.querySelectorAll('.atelier-home img')].filter(image => image.getBoundingClientRect().width > 0).map(image => image.decode().catch(() => undefined)));
                    window.scrollTo({top:0,left:0,behavior:'instant'});
                  });
                  const metrics=await page.evaluate(measureMobileSpaces);
                  const name=`mobile-${width}-${theme}-${mode}`;
                  if (metrics.theme !== theme) report.failures.push(`${name}: expected theme ${theme}, rendered ${metrics.theme}`);
                  report.failures.push(...validateMobileSpaces(metrics,'Profa. Dra. Alexandriana').map(error => `${name}: ${error}`));
                  matrix.push({name,mode,width,requestedTheme:theme,...metrics});
                  await page.screenshot({path:path.join(out,`${name}.png`),fullPage:false});
                };
                await capture('arrival');
                await page.locator('.atelier-primary').click();
                await page.locator('.atelier-space').waitFor({state:'visible'});
                for (const mode of ['complete','essential','scientific']) {
                  await selectHomeMode(page,mode);
                  await capture(mode);
                  if (mode === 'scientific') await inspectScientificMonitor(page,`mobile-${width}-${theme}-${mode}`);
                }
              }
            }
            for (const light of matrix.filter(entry => entry.theme === 'light')) {
              const dark=matrix.find(entry => entry.theme === 'dark' && entry.width === light.width && entry.mode === light.mode);
              for (const key of ['brand','wordmark','catalog','search','identity','avatar','identityName','organization']) {
                if (!light[key] && !dark?.[key]) continue;
                if (!light[key] || !dark?.[key] || ['left','top','width','height'].some(part => Math.abs(light[key][part]-dark[key][part]) > 1)) report.failures.push(`${light.width}/${light.mode}: ${key} geometry changes with theme`);
              }
            }
            report.mobileSpacesMatrix=matrix;
            if (matrix.length !== 32) report.failures.push(`mobile spaces matrix incomplete: ${matrix.length}/32`);
          }

          async function assertCatalog(page, mode, requiredLinks) {
            await page.locator('.atelier-catalog-trigger').click();
            await page.locator('.spaces-catalog').waitFor({ state: 'visible' });
            for (const href of requiredLinks) {
              const link = page.locator(`.spaces-catalog a[href="${href}"]`).first();
              if (!await link.isVisible().catch(() => false) && mode === 'desktop') report.failures.push(`${mode}/catálogo: feature sem acesso visível ${href}`);
              if (mode === 'mobile' && !await page.locator(`.spaces-catalog a[href="${href}"]`).count()) report.failures.push(`${mode}/catálogo: feature sem acesso ${href}`);
            }
            const courses = page.locator('.spaces-catalog a[href="/cursos"], .spaces-catalog a[href^="/cursos/"]');
            if (await courses.count()) report.failures.push(`${mode}/catálogo: Cursos ainda exposto`);
          }

          try {
            const desktop = await login({ width: 1440, height: 1000 });
            for (const [name, route] of desktopRoutes) await inspectAndCapture(desktop.page, 'desktop', name, route);

            await desktop.page.goto(`${base}/`, { waitUntil: 'networkidle' });
            await selectCompleteMode(desktop.page);
            const desktopBrand = await desktop.page.locator('.atelier-header .atelier-brand img').getAttribute('alt').catch(() => null);
            if (desktopBrand !== 'CorVIA Cardiology Spaces') report.failures.push(`desktop/home: branding inválido (${desktopBrand})`);
            await selectHomeMode(desktop.page,'scientific');
            for (const theme of ['light','dark']) {
              await setHomeTheme(desktop.page,theme);
              await inspectScientificMonitor(desktop.page, `desktop-${theme}-scientific`);
            }
            await selectHomeMode(desktop.page,'complete');
            const requiredDesktopLinks = ['/triagem-sintomas','/interacoes','/condicoes','/fluxogramas','/biblioteca','/avaliacao-preoperatoria','/telediagnostico','/indicadores','/documentos-cientificos-ia','/apresentacao','/admin','/admin/usuarios','/fila-telediagnostico'];
            await assertCatalog(desktop.page, 'desktop', requiredDesktopLinks);
            await desktop.page.screenshot({ path: path.join(out, 'desktop-todas-funcoes.png'), fullPage: false });
            await desktop.context.close();

            const mobile = await login({ width: 390, height: 844 });
            for (const [name, route] of mobileRoutes) await inspectAndCapture(mobile.page, 'mobile', name, route);

            await mobile.page.goto(`${base}/`, { waitUntil: 'networkidle' });
            await selectCompleteMode(mobile.page);
            const mobileActions=await mobile.page.locator('.atelier-shelf .spaces-action').evaluateAll(elements => elements.map(element => ({label:element.innerText,href:element.getAttribute('href')})));
            for (const href of ['/receituario','/documentos','/prontuario','/exames-ia']) {
              if (!mobileActions.some(action => action.href === href)) report.failures.push(`mobile/tools: canonical clinical access missing ${href}`);
            }
            const everything=await mobile.page.locator('.atelier-search input[aria-label="Buscar no Tudo com Tudo"]').isVisible();
            const support=await mobile.page.locator('.atelier-space__note a[href="/assistente"]').count();
            if (!everything || support !== 1) report.failures.push('mobile/tools: Tudo com Tudo or Apoio CorVIA unavailable');
            const requiredMobileLinks = ['/triagem-sintomas','/interacoes','/fluxogramas','/biblioteca','/avaliacao-preoperatoria','/telediagnostico','/documentos-cientificos-ia','/apresentacao','/admin','/admin/usuarios','/fila-telediagnostico'];
            await assertCatalog(mobile.page, 'mobile', requiredMobileLinks);
            await mobile.page.waitForTimeout(250);
            await mobile.page.screenshot({ path: path.join(out, 'mobile-todas-funcoes.png'), fullPage: false });
            const moreVisible = await mobile.page.locator('.spaces-catalog').isVisible();
            if (!moreVisible) report.failures.push('mobile/catálogo: catálogo de funções não abriu');
            await inspectMobileSpacesMatrix(mobile.page);
            await inspectFavoritesAndApprovals({ page: mobile.page, base, out, report,
              approvalTitle: 'Mudanças de Conduta Baseadas em Novas Evidências para Aprovação' });
            await mobile.context.close();
            if (report.scientificIntelligenceSurfaces?.length !== 10) report.failures.push(`scientific intelligence surfaces incomplete: ${report.scientificIntelligenceSurfaces?.length || 0}/10`);
          } catch (error) {
            report.failures.push(`capture runner: ${error?.stack || error}`);
          } finally {
            await browser.close();
          }

          if (report.pageErrors.length) report.failures.push(`page errors: ${report.pageErrors.join(' | ')}`);
          fs.writeFileSync(reportPath, JSON.stringify(report, null, 2));
          console.log(JSON.stringify(report, null, 2));
          if (report.failures.length) process.exitCode = 1;
          JS
          cd /tmp/corvia-visual-qa
          node capture.mjs

      - name: Upload visual QA artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: corvia-clinical-os-visual-qa
          path: visual-qa/
          if-no-files-found: warn
          retention-days: 7

      - name: Show stack logs on failure
        if: failure()
        run: |
          docker compose logs --no-color --tail=250 backend
          docker logs corvia-visual-nginx || true

      - name: Stop isolated stack
        if: always()
        run: |
          docker rm -f corvia-visual-nginx 2>/dev/null || true
          docker compose down -v --remove-orphans
