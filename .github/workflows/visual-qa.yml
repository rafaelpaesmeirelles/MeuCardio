name: Visual QA — Clinical OS

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/visual-qa.yml"
      - "frontend/**"
      - "scripts/feature_inventory.py"

permissions:
  contents: read

jobs:
  visual-qa:
    name: Desktop + mobile screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COMPOSE_PROJECT_NAME: corvia_visual_qa
      ENVIRONMENT: test
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: meucardio_visual
      POSTGRES_PASSWORD: visual-test
      POSTGRES_DB: meucardio_visual
      REDIS_URL: redis://redis:6379/0
      STORAGE_ENCRYPTION_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
      JWT_SECRET: chave-visual-qa-nao-usar-em-producao
      ADMIN_EMAIL: visual-qa@teste.local
      ADMIN_PASSWORD: visual-qa-seguro-123
      AI_ENABLED: "false"
      MAIL360_CLIENT_ID: id-de-teste
      MAIL360_CLIENT_SECRET: secret-de-teste
      MAIL360_REFRESH_TOKEN: refresh-de-teste
      CORVIA_MAIL_PRECO_CENTAVOS: "1000"
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_visual_dummy
      PUBLIC_URL: http://127.0.0.1:8080
      UPLOADS_DIR: /tmp/corvia-visual/uploads
      EXAMES_DIR: /tmp/corvia-visual/exames-pacientes
      DOCUMENTOS_DIR: /tmp/corvia-visual/documentos-emitidos

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Create isolated runtime environment
        run: |
          cat > .env <<'ENV'
          COMPOSE_PROJECT_NAME=corvia_visual_qa
          ENVIRONMENT=test
          POSTGRES_HOST=db
          POSTGRES_PORT=5432
          POSTGRES_USER=meucardio_visual
          POSTGRES_PASSWORD=visual-test
          POSTGRES_DB=meucardio_visual
          REDIS_URL=redis://redis:6379/0
          STORAGE_ENCRYPTION_KEY=MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
          JWT_SECRET=chave-visual-qa-nao-usar-em-producao
          ADMIN_EMAIL=visual-qa@teste.local
          ADMIN_PASSWORD=visual-qa-seguro-123
          AI_ENABLED=false
          MAIL360_CLIENT_ID=id-de-teste
          MAIL360_CLIENT_SECRET=secret-de-teste
          MAIL360_REFRESH_TOKEN=refresh-de-teste
          CORVIA_MAIL_PRECO_CENTAVOS=1000
          STRIPE_SECRET_KEY=sk_test_dummy
          STRIPE_WEBHOOK_SECRET=whsec_visual_dummy
          PUBLIC_URL=http://127.0.0.1:8080
          UPLOADS_DIR=/tmp/corvia-visual/uploads
          EXAMES_DIR=/tmp/corvia-visual/exames-pacientes
          DOCUMENTOS_DIR=/tmp/corvia-visual/documentos-emitidos
          ENV

      - name: Start isolated data and API stack
        run: docker compose up -d --build db redis backend

      - name: Build production frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Serve production build through isolated Nginx
        run: |
          mkdir -p visual-qa
          cat > visual-qa/nginx.conf <<'NGINX'
          server {
            listen 80;
            server_name _;
            root /usr/share/nginx/html;
            index index.html;

            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://*.corvia.med.br; frame-src 'none'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

            location /api/ {
              proxy_pass http://backend:8000/api/;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_buffering off;
            }

            location /uploads/ {
              proxy_pass http://backend:8000/uploads/;
              proxy_set_header Host $host;
            }

            location / {
              try_files $uri $uri/ /index.html;
            }
          }
          NGINX
          docker run -d --name corvia-visual-nginx \
            --network corvia_visual_qa_default \
            -p 8080:80 \
            -v "$PWD/frontend/dist:/usr/share/nginx/html:ro" \
            -v "$PWD/visual-qa/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine

      - name: Wait for production HTTP readiness
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/api/ready >/dev/null \
              && curl --fail --silent http://127.0.0.1:8080/entrar >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color backend
          docker logs corvia-visual-nginx || true
          exit 1

      - name: Create visual QA administrator
        run: |
          docker compose exec -T backend python -m app.commands.create_admin \
            --email visual-qa@teste.local \
            --password visual-qa-seguro-123 \
            --name "Dr. Visual QA"

      - name: Install ephemeral Chromium runner
        run: |
          mkdir -p /tmp/corvia-visual-qa
          cd /tmp/corvia-visual-qa
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Capture canonical surfaces
        run: |
          mkdir -p visual-qa/screenshots
          cat > /tmp/corvia-visual-qa/capture.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import path from 'node:path';

          const base = 'http://127.0.0.1:8080';
          const out = path.join(process.env.GITHUB_WORKSPACE, 'visual-qa', 'screenshots');
          const reportPath = path.join(process.env.GITHUB_WORKSPACE, 'visual-qa', 'report.json');
          fs.mkdirSync(out, { recursive: true });

          const desktopRoutes = [
            ['home', '/'],
            ['medicamentos', '/medicamentos'],
            ['evidencias', '/evidencias'],
            ['pacientes', '/round'],
            ['agenda', '/agenda'],
            ['documentos', '/documentos'],
            ['mail', '/corvia-mail'],
            ['emergencia', '/emergencia'],
            ['preoperatorio', '/avaliacao-preoperatoria'],
            ['admin', '/admin'],
          ];
          const mobileRoutes = [
            ['home', '/'],
            ['medicamentos', '/medicamentos'],
            ['pacientes', '/round'],
            ['agenda', '/agenda'],
            ['emergencia', '/emergencia'],
          ];
          const forbiddenVisibleText = [
            'websearch',
            'texto integral não lido nesta sessão',
            'texto integral nao lido nesta sessao',
            'registro_prospectivo',
            'coorte_retrospectiva',
          ];

          const browser = await chromium.launch({ headless: true });
          const report = { pages: [], pageErrors: [], failures: [] };

          async function login(viewport) {
            const context = await browser.newContext({ viewport, colorScheme: 'dark', locale: 'pt-BR' });
            const page = await context.newPage();
            page.on('pageerror', (error) => report.pageErrors.push(String(error)));
            await page.goto(`${base}/entrar`, { waitUntil: 'networkidle' });
            await page.locator('#email').fill('visual-qa@teste.local');
            await page.locator('#senha').fill('visual-qa-seguro-123');
            await page.locator('button[type="submit"]').click();
            await page.waitForURL((url) => !url.pathname.includes('/entrar'), { timeout: 20000 });
            await page.waitForTimeout(900);
            await selectCompleteMode(page);
            return { context, page };
          }

          async function selectCompleteMode(page) {
            const choice = page.locator('.spaces-choice');
            if (await choice.isVisible().catch(() => false)) {
              // Este gate certifica a Home. O tour tem contrato próprio e, em
              // um contexto novo, redirecionaria corretamente antes da Home.
              await page.evaluate(() => localStorage.setItem('corvia:cardiology-spaces:tour:v3', 'visual-qa'));
              await page.locator('.spaces-choice__cards button', { hasText: 'Completo' }).click();
            }
            await page.locator('.spaces-home').waitFor({ state: 'visible', timeout: 10000 });
          }

          async function inspectAndCapture(page, mode, name, route) {
            await page.goto(`${base}${route}`, { waitUntil: 'networkidle' });
            if (name === 'home') await selectCompleteMode(page);
            await page.waitForTimeout(1100);
            const metrics = await page.evaluate((forbidden) => {
              const visible = (element) => {
                if (!element) return false;
                const style = getComputedStyle(element);
                const rect = element.getBoundingClientRect();
                return style.display !== 'none' && style.visibility !== 'hidden' && rect.width > 0 && rect.height > 0;
              };
              const bodyText = document.body?.innerText || '';
              const text = bodyText.toLocaleLowerCase('pt-BR');
              const fixed = [...document.querySelectorAll('*')]
                .filter((element) => {
                  const style = getComputedStyle(element);
                  return style.position === 'fixed' && visible(element);
                })
                .slice(0, 30)
                .map((element) => ({ tag: element.tagName.toLowerCase(), className: typeof element.className === 'string' ? element.className : '', aria: element.getAttribute('aria-label') || '' }));
              const emergency = document.querySelector('.emerg');
              const emergencyRect = emergency && visible(emergency)
                ? (() => { const r = emergency.getBoundingClientRect(); return { left:r.left, top:r.top, right:r.right, bottom:r.bottom }; })()
                : null;
              const legacyFabVisible = [
                document.querySelector('button[aria-label^="Abrir o CorvIA Chat"]'),
                document.querySelector('section[aria-label="CorvIA Chat"]'),
                document.querySelector('.cos-emergency-fab'),
              ].some(visible);
              const creditVisible = visible(document.querySelector('.credito'));
              const suspenseVisible = text.includes('carregando a tela');
              return {
                path: location.pathname,
                width: innerWidth,
                scrollWidth: document.documentElement.scrollWidth,
                height: innerHeight,
                bodyText,
                forbidden: forbidden.filter((needle) => text.includes(needle)),
                fixed,
                emergencyRect,
                legacyFabVisible,
                creditVisible,
                suspenseVisible,
                spacesHome: visible(document.querySelector('.spaces-home')),
                spacesBrand: visible(document.querySelector('.spaces-brand')),
                spacesDoors: visible(document.querySelector('.spaces-doors')),
                spacesNow: visible(document.querySelector('.spaces-layer--now')),
                spacesNext: visible(document.querySelector('.spaces-layer--next')),
                spacesReferences: visible(document.querySelector('.spaces-layer--refs')),
                spacesDock: visible(document.querySelector('.spaces-dock')),
                spacesDay: visible(document.querySelector('.spaces-day')),
                contextRail: visible(document.querySelector('.spaces-context-rail')),
                contextCatalogTrigger: visible(document.querySelector('.spaces-context-rail__all')),
                consultorioSelected: document.querySelector('.spaces-door[aria-pressed="true"]')?.textContent?.includes('Consultório') === true,
                drugCommand: visible(document.querySelector('.cc-drugs-page')),
              };
            }, forbiddenVisibleText);
            report.pages.push({ mode, name, route, ...metrics, bodyText: undefined });
            if (metrics.scrollWidth > metrics.width + 12) report.failures.push(`${mode}/${name}: overflow horizontal ${metrics.scrollWidth}px > ${metrics.width}px`);
            if (metrics.forbidden.length) report.failures.push(`${mode}/${name}: texto interno visível: ${metrics.forbidden.join(', ')}`);
            if (metrics.legacyFabVisible) report.failures.push(`${mode}/${name}: FAB legado visível sobre o Clinical OS`);
            if (metrics.creditVisible) report.failures.push(`${mode}/${name}: crédito institucional visível dentro do workspace`);
            if (metrics.suspenseVisible) report.failures.push(`${mode}/${name}: rota permaneceu presa no fallback “Carregando a tela”`);
            if (name === 'medicamentos' && !metrics.drugCommand) report.failures.push(`${mode}/medicamentos: Medication Command Center não renderizou`);
            if (name === 'home' && (!metrics.spacesHome || !metrics.spacesBrand || !metrics.spacesDoors || !metrics.spacesNow || !metrics.spacesDock || !metrics.contextRail || !metrics.contextCatalogTrigger || !metrics.consultorioSelected)) {
              report.failures.push(`${mode}/home: Cardiology Spaces incompleto (home=${metrics.spacesHome}, brand=${metrics.spacesBrand}, doors=${metrics.spacesDoors}, now=${metrics.spacesNow}, dock=${metrics.spacesDock}, rail=${metrics.contextRail}, catalog=${metrics.contextCatalogTrigger}, consultorio=${metrics.consultorioSelected})`);
            }
            if (mode === 'desktop' && name === 'home' && (!metrics.spacesNext || !metrics.spacesReferences || !metrics.spacesDay)) {
              report.failures.push(`desktop/home: modo completo incompleto (next=${metrics.spacesNext}, references=${metrics.spacesReferences}, day=${metrics.spacesDay})`);
            }
            if (mode === 'desktop' && name === 'emergencia') {
              if (!metrics.emergencyRect || metrics.emergencyRect.left < 200 || metrics.emergencyRect.top < 50) report.failures.push(`desktop/emergencia: modo está sob a sidebar/topbar (${JSON.stringify(metrics.emergencyRect)})`);
            }
            await page.screenshot({ path: path.join(out, `${mode}-${name}.png`), fullPage: false });
          }

          async function assertCatalog(page, mode, requiredLinks) {
            await page.locator('.spaces-context-rail__all').click();
            await page.locator('.spaces-catalog').waitFor({ state: 'visible' });
            for (const href of requiredLinks) {
              const link = page.locator(`.spaces-catalog a[href="${href}"]`).first();
              if (!await link.isVisible().catch(() => false) && mode === 'desktop') report.failures.push(`${mode}/catálogo: feature sem acesso visível ${href}`);
              if (mode === 'mobile' && !await page.locator(`.spaces-catalog a[href="${href}"]`).count()) report.failures.push(`${mode}/catálogo: feature sem acesso ${href}`);
            }
            const courses = page.locator('.spaces-catalog a[href="/cursos"], .spaces-catalog a[href^="/cursos/"]');
            if (await courses.count()) report.failures.push(`${mode}/catálogo: Cursos ainda exposto`);
          }

          try {
            const desktop = await login({ width: 1440, height: 1000 });
            for (const [name, route] of desktopRoutes) await inspectAndCapture(desktop.page, 'desktop', name, route);

            await desktop.page.goto(`${base}/`, { waitUntil: 'networkidle' });
            await selectCompleteMode(desktop.page);
            const desktopBrand = await desktop.page.locator('.spaces-brand').first().getAttribute('aria-label').catch(() => null);
            if (desktopBrand !== 'CorVIA Cardiology Spaces') report.failures.push(`desktop/home: branding inválido (${desktopBrand})`);
            const requiredDesktopLinks = ['/triagem-sintomas','/interacoes','/condicoes','/fluxogramas','/biblioteca','/avaliacao-preoperatoria','/telediagnostico','/indicadores','/documentos-cientificos-ia','/apresentacao','/admin','/admin/usuarios','/fila-telediagnostico'];
            await assertCatalog(desktop.page, 'desktop', requiredDesktopLinks);
            await desktop.page.screenshot({ path: path.join(out, 'desktop-todas-funcoes.png'), fullPage: false });
            await desktop.context.close();

            const mobile = await login({ width: 390, height: 844 });
            for (const [name, route] of mobileRoutes) await inspectAndCapture(mobile.page, 'mobile', name, route);

            await mobile.page.goto(`${base}/`, { waitUntil: 'networkidle' });
            await selectCompleteMode(mobile.page);
            const labels = await mobile.page.locator('.spaces-dock > * span').allTextContents();
            const expected = ['Prescrever','Solicitar exames','Prontuário','Documentos','Tudo com Tudo','Apoio CorVIA'];
            if (JSON.stringify(labels) !== JSON.stringify(expected)) report.failures.push(`mobile/dock: itens canônicos divergentes ${JSON.stringify(labels)}`);
            const requiredMobileLinks = ['/triagem-sintomas','/interacoes','/fluxogramas','/biblioteca','/avaliacao-preoperatoria','/telediagnostico','/documentos-cientificos-ia','/apresentacao','/admin','/admin/usuarios','/fila-telediagnostico'];
            await assertCatalog(mobile.page, 'mobile', requiredMobileLinks);
            await mobile.page.waitForTimeout(250);
            await mobile.page.screenshot({ path: path.join(out, 'mobile-todas-funcoes.png'), fullPage: false });
            const moreVisible = await mobile.page.locator('.spaces-catalog').isVisible();
            if (!moreVisible) report.failures.push('mobile/catálogo: catálogo de funções não abriu');
            await mobile.context.close();
          } catch (error) {
            report.failures.push(`capture runner: ${error?.stack || error}`);
          } finally {
            await browser.close();
          }

          if (report.pageErrors.length) report.failures.push(`page errors: ${report.pageErrors.join(' | ')}`);
          fs.writeFileSync(reportPath, JSON.stringify(report, null, 2));
          console.log(JSON.stringify(report, null, 2));
          if (report.failures.length) process.exitCode = 1;
          JS
          cd /tmp/corvia-visual-qa
          node capture.mjs

      - name: Upload visual QA artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: corvia-clinical-os-visual-qa
          path: visual-qa/
          if-no-files-found: warn
          retention-days: 7

      - name: Show stack logs on failure
        if: failure()
        run: |
          docker compose logs --no-color --tail=250 backend
          docker logs corvia-visual-nginx || true

      - name: Stop isolated stack
        if: always()
        run: |
          docker rm -f corvia-visual-nginx 2>/dev/null || true
          docker compose down -v --remove-orphans
