name: Final Claude content audit

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  audit:
    if: github.event.pull_request.head.ref == 'release/claude-content-batch-20260820-final'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Audit semantic content delta
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          python - <<'PY'
          import json, subprocess
          from pathlib import Path

          FILES = [
              'checklists/metadados.json',
              'material-paciente/metadados.json',
              'medicamentos/metadados.json',
          ]
          FORBIDDEN_NEW = [
              'VERIFICAÇÃO HUMANA NECESSÁRIA',
              'Dr. Rafael Paes Meirelles',
              'CRM-SP 138266',
              'RQE 134798',
              'aprovado para publicação por',
              'aval clínico individual do Dr.',
          ]

          def load(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))
          def load_base(path):
              raw = subprocess.check_output(['git','show',f'origin/main:{path}'], text=True)
              return json.loads(raw)
          def by_slug(items, path):
              out = {}
              for item in items:
                  slug = item.get('slug')
                  assert slug and slug not in out, f'{path}: slug inválido/duplicado {slug}'
                  out[slug] = item
              return out

          totals = {}
          for path in FILES:
              base_items = load_base(path)
              cur_items = load(path)
              base = by_slug(base_items, path)
              cur = by_slug(cur_items, path)
              added = [s for s in cur if s not in base]
              modified = [s for s in cur if s in base and cur[s] != base[s]]
              removed = [s for s in base if s not in cur]
              assert not removed, f'{path}: registros removidos {removed}'
              totals[path] = {'before':len(base),'after':len(cur),'added':len(added),'modified':len(modified)}

              for slug in added:
                  record = cur[slug]
                  raw = json.dumps(record, ensure_ascii=False)
                  for needle in FORBIDDEN_NEW:
                      assert needle.lower() not in raw.lower(), f'{path}:{slug}: texto editorial/atestado proibido: {needle}'
                  assert record.get('review_status') == 'revisado', f'{path}:{slug}: review_status != revisado'
                  assert record.get('published') is not True, f'{path}:{slug}: published=true versionado não permitido'

              if path == 'medicamentos/metadados.json':
                  for slug in added + modified:
                      record = cur[slug]
                      base_record = base.get(slug, {})
                      if record.get('brand_names') != base_record.get('brand_names'):
                          for brand in record.get('brand_names', []):
                              assert isinstance(brand, str) and 0 < len(brand) <= 120, f'{slug}: brand_names não canônico'
                              assert 'VERIFICAÇÃO HUMANA' not in brand, f'{slug}: brand_names com marcador editorial'
                  for slug in ('dipiridamol','quinapril-cloridrato'):
                      if slug in cur:
                          assert not cur[slug].get('brand_names'), f'{slug}: marca cancelada exposta como ativa'

          assert totals['checklists/metadados.json']['after'] - totals['checklists/metadados.json']['before'] == 36, totals
          assert totals['material-paciente/metadados.json']['after'] - totals['material-paciente/metadados.json']['before'] == 48, totals
          assert totals['medicamentos/metadados.json']['after'] - totals['medicamentos/metadados.json']['before'] == 6, totals

          ids = {}
          for record in load('checklists/metadados.json'):
              for item in record.get('itens', []):
                  item_id = item.get('id')
                  if not item_id:
                      continue
                  assert item_id not in ids, f'ID de checklist duplicado: {item_id} ({ids[item_id]} / {record["slug"]})'
                  ids[item_id] = record['slug']

          print(json.dumps(totals, ensure_ascii=False, indent=2))
          print('FINAL_CLAUDE_CONTENT_AUDIT=PASS')
          PY
