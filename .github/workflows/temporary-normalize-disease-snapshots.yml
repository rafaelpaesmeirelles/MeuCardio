name: Temporary normalize disease snapshots
on:
  push:
    branches: [release/all-pending-20260828]
    paths: [.github/workflows/temporary-normalize-disease-snapshots.yml]
permissions: {contents: write}
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - name: Keep only genuinely new disease records in historical snapshots
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          base = json.loads(Path('doencas/metadados.json').read_text(encoding='utf-8'))
          base_slugs = {item['slug'] for item in base}
          expected = {
              'doencas/fragmentos/pr580-doenca-da-aorta.snapshot.json': 'doenca-da-aorta',
              'doencas/fragmentos/pr590-choque-cardiogenico.json': 'choque-cardiogenico',
              'doencas/fragmentos/pr594-insuficiencia-cardiaca-avancada.json': 'insuficiencia-cardiaca-avancada',
              'doencas/fragmentos/pr596-cardiopatia-congenita-adulto.json': 'cardiopatia-congenita-do-adulto',
              'doencas/fragmentos/pr597-hipertensao-resistente-refrataria.json': 'hipertensao-resistente-e-refrataria',
              'doencas/fragmentos/pr599-dispositivos-cardiacos-implantaveis.json': 'dispositivos-cardiacos-implantaveis',
          }
          for raw_path, expected_slug in expected.items():
              path = Path(raw_path)
              items = json.loads(path.read_text(encoding='utf-8'))
              retained = [item for item in items if item.get('slug') not in base_slugs]
              slugs = [item.get('slug') for item in retained]
              if slugs != [expected_slug]:
                  raise SystemExit(f'{raw_path}: esperado somente {expected_slug}; retidos={slugs}')
              path.write_text(json.dumps(retained, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              print(f'{raw_path}: {len(items)} -> 1 ({expected_slug})')
          PY
          PYTHONPATH=backend python - <<'PY'
          from pathlib import Path
          from app.services.disease_manifest import load_disease_records
          records = load_disease_records(Path('doencas/metadados.json'))
          print('LOAD_OK', len(records))
          PY
          python scripts/content_inventory.py --minimum-records 9469 --minimum-files 2188 --strict
          git diff --check
          git config user.name 'CorVIA Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/temporary-diagnose-disease-fragments.yml .github/workflows/temporary-normalize-disease-snapshots.yml
          git add doencas/fragmentos
          git commit -m 'fix(science): reduzir snapshots a hubs canônicos novos'
          git push origin HEAD:release/all-pending-20260828
