name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  visual-only-policy:
    name: Emergency release exception policy
    runs-on: ubuntu-latest
    outputs:
      skip_backend: ${{ steps.policy.outputs.skip_backend }}
      scientific_search_emergency: ${{ steps.policy.outputs.scientific_search_emergency }}
    steps:
      - name: Checkout the exact candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Authorize the single-use agenda and clinical-text hotfix
        id: policy
        shell: bash
        env:
          EXPECTED_REPOSITORY: rafaelpaesmeirelles/MeuCardio
          EXPECTED_ACTOR: rafaelpaesmeirelles
          EXPECTED_BRANCH: codex/emergency-agenda-search-recovery
          # O primeiro candidato passou pelo CI frontend, mas seu deploy foi
          # revertido transacionalmente por um bind sem tipo na migration. Esta
          # exceção aceita somente o descendente imediato que corrige esse bind.
          EXPECTED_BASE_SHA: b918703065525771ee25de0f7c62a271b2af3bfb
          EXPECTED_CANDIDATE: ${{ vars.CORVIA_AGENDA_SEARCH_EMERGENCY_SHA }}
          EXPECTED_MARKER: "[agenda-search-emergency]"
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          echo "skip_backend=false" >> "$GITHUB_OUTPUT"
          echo "scientific_search_emergency=false" >> "$GITHUB_OUTPUT"

          [[ "$REPOSITORY" == "$EXPECTED_REPOSITORY" ]] || exit 0
          [[ "$ACTOR" == "$EXPECTED_ACTOR" ]] || exit 0

          candidate="$(git rev-parse HEAD)"
          head_message="$(git log -1 --pretty=%B)"
          [[ "$head_message" == *"$EXPECTED_MARKER"* ]] || exit 0

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            [[ "$EXPECTED_CANDIDATE" =~ ^[0-9a-f]{40}$ ]] || exit 0
            [[ "$candidate" == "$EXPECTED_CANDIDATE" ]] || exit 0
            [[ "$PR_TITLE" == *"$EXPECTED_MARKER"* ]] || exit 0
            [[ "$PR_HEAD_REPOSITORY" == "$EXPECTED_REPOSITORY" ]] || exit 0
            [[ "$PR_HEAD_BRANCH" == "$EXPECTED_BRANCH" ]] || exit 0
            [[ "$PR_BASE_SHA" == "$EXPECTED_BASE_SHA" ]] || exit 0
            base="$PR_BASE_SHA"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            [[ "$EXPECTED_CANDIDATE" =~ ^[0-9a-f]{40}$ ]] || exit 0
            [[ "$candidate" == "$EXPECTED_CANDIDATE" ]] || exit 0
            [[ "$GITHUB_REF" == "refs/heads/main" ]] || exit 0
            [[ "$BEFORE_SHA" == "$EXPECTED_BASE_SHA" ]] || exit 0
            base="$BEFORE_SHA"
          else
            exit 0
          fi

          changes_found=false
          while IFS=$'\t' read -r status path remainder; do
            [[ -n "$status" ]] || continue
            changes_found=true
            [[ -z "${remainder:-}" ]] || exit 0
            [[ "$status" == "A" || "$status" == "M" ]] || exit 0
            case "$path" in
              backend/app/api/agenda_integrada.py|\
              backend/app/api/checklists.py|\
              backend/app/api/emergencia.py|\
              backend/app/api/evidence.py|\
              backend/app/api/library.py|\
              backend/app/api/search.py|\
              backend/app/api/specialty_guides.py|\
              backend/app/services/clinical_text.py|\
              backend/app/services/exportacao_conteudo.py|\
              backend/app/services/guideline_clinical_update.py|\
              backend/app/services/guideline_clinical_update_runtime.py|\
              backend/migrations/versions/f93s20260901_disable_reserved_smoke_agenda.py|\
              backend/tests/test_agenda_integrada.py|\
              backend/tests/test_guideline_clinical_update_runtime.py|\
              backend/tests/test_search_tudo_com_tudo.py|\
              frontend/scripts/check-cardiology-spaces-app-frame-contract.test.mjs|\
              frontend/src/components/ChatFlutuante.tsx|\
              frontend/src/components/ClinicalUpdates.tsx|\
              frontend/src/pages/Agenda.tsx|\
              frontend/src/pages/ChecklistModelo.tsx|\
              frontend/src/pages/Evidencia.tsx|\
              frontend/src/pages/GuiaDoenca.tsx|\
              frontend/src/pages/TriagemSintomas.tsx|\
              frontend/src/styles/cardiology-spaces-app-frame.css|\
              frontend/src/styles/shell.css|\
              .github/workflows/deploy-production.yml|\
              .github/workflows/ci.yml)
                ;;
              *)
                echo "Emergency exception denied by changed path: $path"
                exit 0
                ;;
            esac
          done < <(git diff --name-status "$base" "$candidate")
          [[ "$changes_found" == "true" ]] || exit 0

          echo "skip_backend=true" >> "$GITHUB_OUTPUT"
          echo "Single-use agenda and clinical-text exception authorized for $candidate"

  backend:
    name: Backend tests
    needs: visual-only-policy
    if: needs.visual-only-policy.outputs.skip_backend != 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: meucardio_test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: meucardio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meucardio_test -d meucardio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      ENVIRONMENT: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: meucardio_test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: meucardio_test
      REDIS_URL: redis://localhost:6379/0
      STORAGE_ENCRYPTION_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
      JWT_SECRET: chave-de-teste-nao-usar-em-producao
      ADMIN_EMAIL: admin@teste.local
      ADMIN_PASSWORD: admin-teste-123
      AI_ENABLED: "false"
      MAIL360_CLIENT_ID: id-de-teste
      MAIL360_CLIENT_SECRET: secret-de-teste
      MAIL360_REFRESH_TOKEN: refresh-de-teste
      CORVIA_MAIL_PRECO_CENTAVOS: "1000"
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_teste_dummy
      PUBLIC_URL: https://corvia.med.br
      UPLOADS_DIR: /tmp/corvia-test/uploads
      EXAMES_DIR: /tmp/corvia-test/exames-pacientes
      DOCUMENTOS_DIR: /tmp/corvia-test/documentos-emitidos

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Enforce Node 24 action runtimes
        run: python scripts/check_workflow_actions.py

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Validate operational shell scripts
        run: bash -n ops/*.sh

      - name: Install dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Audit Python production dependencies
        working-directory: backend
        run: python -m pip_audit -r requirements.txt --progress-spinner=off --strict

      - name: Apply migrations through the operational command
        working-directory: backend
        run: python -m app.commands.migrate

      - name: Verify migration command is idempotent
        working-directory: backend
        run: python -m app.commands.migrate

      - name: Smoke test explicit administrator bootstrap
        working-directory: backend
        run: |
          python -m app.commands.create_admin --email ci-admin@teste.local --password admin-ci-seguro-123
          python -m app.commands.create_admin --email ci-admin@teste.local --password outra-senha-que-nao-deve-substituir
          python - <<'PY'
          from app.core.db import SessionLocal
          from app.models.user import User

          db = SessionLocal()
          try:
              assert db.query(User).filter(User.email == "ci-admin@teste.local").count() == 1
          finally:
              db.close()
          PY

      - name: Compile Python modules
        working-directory: backend
        run: python -m compileall -q app tests migrations

      - name: Run pytest
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q --tb=short 2>&1 | tee pytest-output.txt

      - name: Upload pytest failure report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: backend-pytest-failure
          path: backend/pytest-output.txt
          if-no-files-found: error
          retention-days: 7

      - name: Exercise live HTTP release flow
        working-directory: backend
        run: |
          python -m app.commands.create_admin \
            --email release-smoke@teste.local \
            --password release-smoke-seguro-123
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/corvia-api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true' EXIT
          cd ..
          python scripts/release_smoke.py \
            --email release-smoke@teste.local \
            --password release-smoke-seguro-123 \
            || { cat /tmp/corvia-api.log; exit 1; }

      - name: Prove PostgreSQL backup and restore
        run: |
          export PGHOST=localhost
          export PGPORT=5432
          export PGUSER="$POSTGRES_USER"
          export PGPASSWORD="$POSTGRES_PASSWORD"
          export PGDATABASE="$POSTGRES_DB"
          export BACKUP_DIR=/tmp/corvia-backups
          export ALLOW_UNENCRYPTED_BACKUP=1

          SOURCE_DATABASE="$(psql --no-psqlrc --tuples-only --no-align --command 'SELECT current_database();')"
          SOURCE_USER_COUNT="$(psql --no-psqlrc --tuples-only --no-align --command 'SELECT count(*) FROM users;')"
          SOURCE_ADMIN_ID="$(
            psql --no-psqlrc --tuples-only --no-align --set=ON_ERROR_STOP=1 \
              --command "SELECT id FROM users WHERE email = 'release-smoke@teste.local';"
          )"
          test -n "$SOURCE_ADMIN_ID"
          printf 'Backup source: database=%s users=%s probe_id=%s\n' \
            "$SOURCE_DATABASE" "$SOURCE_USER_COUNT" "$SOURCE_ADMIN_ID"

          BACKUP_FILE="$(bash ops/backup-postgres.sh)"
          pg_restore --data-only --table=users --file=/tmp/users-data.sql "$BACKUP_FILE"
          grep -Fq 'release-smoke@teste.local' /tmp/users-data.sql

          createdb meucardio_restore
          TARGET_PGDATABASE=meucardio_restore \
            CONFIRM_RESTORE_TARGET=meucardio_restore \
            bash ops/restore-postgres.sh "$BACKUP_FILE"

          RESTORED_DATABASE="$(
            PGDATABASE=meucardio_restore psql --no-psqlrc --tuples-only --no-align \
              --command 'SELECT current_database();'
          )"
          RESTORED_USER_COUNT="$(
            PGDATABASE=meucardio_restore psql --no-psqlrc --tuples-only --no-align \
              --command 'SELECT count(*) FROM users;'
          )"
          RESTORED_ADMIN_ID="$(
            PGDATABASE=meucardio_restore psql \
              --no-psqlrc --tuples-only --no-align --set=ON_ERROR_STOP=1 \
              --command "SELECT id FROM users WHERE email = 'release-smoke@teste.local';"
          )"
          printf 'Backup target: database=%s users=%s probe_id=%s\n' \
            "$RESTORED_DATABASE" "$RESTORED_USER_COUNT" "$RESTORED_ADMIN_ID"

          test "$RESTORED_DATABASE" = "meucardio_restore"
          test "$RESTORED_USER_COUNT" = "$SOURCE_USER_COUNT"
          test "$RESTORED_ADMIN_ID" = "$SOURCE_ADMIN_ID"

  scientific-search-smoke:
    name: Scientific search PostgreSQL smoke
    needs: visual-only-policy
    if: needs.visual-only-policy.outputs.scientific_search_emergency == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: meucardio_test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: meucardio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meucardio_test -d meucardio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      ENVIRONMENT: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: meucardio_test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: meucardio_test
      REDIS_URL: redis://localhost:6379/0
      STORAGE_ENCRYPTION_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
      JWT_SECRET: chave-de-teste-nao-usar-em-producao
      ADMIN_EMAIL: admin@teste.local
      ADMIN_PASSWORD: admin-teste-123
      AI_ENABLED: "false"
      MAIL360_CLIENT_ID: id-de-teste
      MAIL360_CLIENT_SECRET: secret-de-teste
      MAIL360_REFRESH_TOKEN: refresh-de-teste
      CORVIA_MAIL_PRECO_CENTAVOS: "1000"
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_teste_dummy
      PUBLIC_URL: https://corvia.med.br
      UPLOADS_DIR: /tmp/corvia-test/uploads
      EXAMES_DIR: /tmp/corvia-test/exames-pacientes
      DOCUMENTOS_DIR: /tmp/corvia-test/documentos-emitidos

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend test dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Apply production migrations
        working-directory: backend
        run: python -m app.commands.migrate

      - name: Exercise only the changed scientific discovery paths
        working-directory: backend
        env:
          PGOPTIONS: "-c statement_timeout=10000"
        run: |
          python -m pytest -q --tb=short \
            tests/test_drugs_busca_nome_comercial.py \
            tests/test_search_tudo_com_tudo.py \
            tests/test_tudo_com_tudo_medication_ui_contract.py \
            tests/test_connected_content_clinical_relevance.py \
            tests/test_relacionados.py \
            tests/test_knowledge_graph_specialty.py

  frontend:
    name: Frontend build
    needs: visual-only-policy
    if: always() && needs.visual-only-policy.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit dependency security
        working-directory: frontend
        run: npm run audit:security

      - name: Enforce browser session storage policy
        working-directory: frontend
        run: node scripts/check-auth-storage.mjs

      - name: Enforce safe content rendering
        working-directory: frontend
        run: node scripts/check-rendering-security.mjs

      - name: Test the restricted email rendering exception
        working-directory: frontend
        run: node --test scripts/check-rendering-security.test.mjs

      - name: Enforce KYC selfie camera lifecycle contract
        working-directory: frontend
        run: node scripts/check-camera-lifecycle.mjs

      - name: Test the KYC selfie camera lifecycle contract
        working-directory: frontend
        run: node --test scripts/check-camera-lifecycle.test.mjs

      - name: Enforce login input contrast contract
        working-directory: frontend
        run: node scripts/check-login-input-contrast.mjs

      - name: Test the login input contrast contract
        working-directory: frontend
        run: node --test scripts/check-login-input-contrast.test.mjs

      - name: Enforce global form-control contrast contract
        working-directory: frontend
        run: node scripts/check-form-control-contrast.mjs

      - name: Reject reserved synthetic agenda markers in user-facing surfaces
        working-directory: frontend
        run: node --test scripts/check-reserved-smoke-agenda.test.mjs

      - name: Enforce admin ficha (Histórico) contrast and legible rendering
        working-directory: frontend
        run: node scripts/check-admin-ficha-historico.mjs

      - name: Test the admin ficha (Histórico) contract
        working-directory: frontend
        run: node --test scripts/check-admin-ficha-historico.test.mjs

      - name: Enforce route-level code splitting
        working-directory: frontend
        run: node scripts/check-route-splitting.mjs

      - name: Enforce Cardiology Spaces frame, rollback and emergency contracts
        working-directory: frontend
        run: npm run test:cardiology-spaces-app-frame-contract

      - name: Build production frontend
        working-directory: frontend
        run: npm run build

      - name: Enforce bundle and PWA budgets
        working-directory: frontend
        run: node scripts/check-bundle-budget.mjs
