name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  backend_scope:
    name: Detect backend risk
    runs-on: ubuntu-latest
    outputs:
      backend_mode: ${{ steps.scope.outputs.backend_mode }}
      targeted_tests: ${{ steps.scope.outputs.targeted_tests }}
      changes_digest: ${{ steps.scope.outputs.changes_digest }}
      tested_tree: ${{ steps.scope.outputs.tested_tree }}
    steps:
      - name: Checkout history for an exact base/head comparison
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Enforce Node 24 action runtimes
        run: python scripts/check_workflow_actions.py

      - name: Test CI and release policy contracts
        run: python scripts/test_ci_release_policy.py

      - name: Classify changed paths
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python scripts/ci_release_policy.py classify-git \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --github-output "$GITHUB_OUTPUT" \
            --github-summary "$GITHUB_STEP_SUMMARY"

  backend:
    name: Backend tests
    needs: backend_scope
    if: needs.backend_scope.outputs.backend_mode != 'skip'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: meucardio_test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: meucardio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meucardio_test -d meucardio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      ENVIRONMENT: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: meucardio_test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: meucardio_test
      REDIS_URL: redis://localhost:6379/0
      STORAGE_ENCRYPTION_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
      JWT_SECRET: chave-de-teste-nao-usar-em-producao
      ADMIN_EMAIL: admin@teste.local
      ADMIN_PASSWORD: admin-teste-123
      AI_ENABLED: "false"
      MAIL360_CLIENT_ID: id-de-teste
      MAIL360_CLIENT_SECRET: secret-de-teste
      MAIL360_REFRESH_TOKEN: refresh-de-teste
      CORVIA_MAIL_PRECO_CENTAVOS: "1000"
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_teste_dummy
      PUBLIC_URL: https://corvia.med.br
      UPLOADS_DIR: /tmp/corvia-test/uploads
      EXAMES_DIR: /tmp/corvia-test/exames-pacientes
      DOCUMENTOS_DIR: /tmp/corvia-test/documentos-emitidos

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install PostgreSQL client
        if: needs.backend_scope.outputs.backend_mode == 'full'
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Validate operational shell scripts
        if: needs.backend_scope.outputs.backend_mode == 'full'
        run: bash -n ops/*.sh

      - name: Install dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Audit Python production dependencies
        if: needs.backend_scope.outputs.backend_mode == 'full'
        working-directory: backend
        run: python -m pip_audit -r requirements.txt --progress-spinner=off --strict

      - name: Apply migrations through the operational command
        if: needs.backend_scope.outputs.backend_mode != 'skip'
        working-directory: backend
        run: python -m app.commands.migrate

      - name: Verify migration command is idempotent
        if: needs.backend_scope.outputs.backend_mode != 'skip'
        working-directory: backend
        run: python -m app.commands.migrate

      - name: Smoke test explicit administrator bootstrap
        if: needs.backend_scope.outputs.backend_mode == 'full'
        working-directory: backend
        run: |
          python -m app.commands.create_admin --email ci-admin@teste.local --password admin-ci-seguro-123
          python -m app.commands.create_admin --email ci-admin@teste.local --password outra-senha-que-nao-deve-substituir
          python - <<'PY'
          from app.core.db import SessionLocal
          from app.models.user import User

          db = SessionLocal()
          try:
              assert db.query(User).filter(User.email == "ci-admin@teste.local").count() == 1
          finally:
              db.close()
          PY

      - name: Compile Python modules
        if: needs.backend_scope.outputs.backend_mode == 'full'
        working-directory: backend
        run: python -m compileall -q app tests migrations

      - name: Run full pytest suite
        if: needs.backend_scope.outputs.backend_mode == 'full'
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q --tb=short 2>&1 | tee pytest-output.txt

      - name: Run changed backend tests
        if: needs.backend_scope.outputs.backend_mode == 'targeted'
        working-directory: backend
        env:
          TARGETED_TESTS: ${{ needs.backend_scope.outputs.targeted_tests }}
        run: >-
          python ../scripts/ci_release_policy.py run-targeted-tests
          --tests-json "$TARGETED_TESTS"
          --report pytest-output.txt

      - name: Upload pytest failure report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: backend-pytest-failure
          path: backend/pytest-output.txt
          if-no-files-found: error
          retention-days: 7

      - name: Exercise live HTTP release flow
        if: needs.backend_scope.outputs.backend_mode == 'full'
        working-directory: backend
        run: |
          python -m app.commands.create_admin \
            --email release-smoke@teste.local \
            --password release-smoke-seguro-123
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/corvia-api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true' EXIT
          cd ..
          python scripts/release_smoke.py \
            --email release-smoke@teste.local \
            --password release-smoke-seguro-123 \
            || { cat /tmp/corvia-api.log; exit 1; }

      - name: Prove PostgreSQL backup and restore
        if: needs.backend_scope.outputs.backend_mode == 'full'
        run: |
          export PGHOST=localhost
          export PGPORT=5432
          export PGUSER="$POSTGRES_USER"
          export PGPASSWORD="$POSTGRES_PASSWORD"
          export PGDATABASE="$POSTGRES_DB"
          export BACKUP_DIR=/tmp/corvia-backups
          export ALLOW_UNENCRYPTED_BACKUP=1

          SOURCE_DATABASE="$(psql --no-psqlrc --tuples-only --no-align --command 'SELECT current_database();')"
          SOURCE_USER_COUNT="$(psql --no-psqlrc --tuples-only --no-align --command 'SELECT count(*) FROM users;')"
          SOURCE_ADMIN_ID="$(
            psql --no-psqlrc --tuples-only --no-align --set=ON_ERROR_STOP=1 \
              --command "SELECT id FROM users WHERE email = 'release-smoke@teste.local';"
          )"
          test -n "$SOURCE_ADMIN_ID"
          printf 'Backup source: database=%s users=%s probe_id=%s\n' \
            "$SOURCE_DATABASE" "$SOURCE_USER_COUNT" "$SOURCE_ADMIN_ID"

          BACKUP_FILE="$(bash ops/backup-postgres.sh)"
          pg_restore --data-only --table=users --file=/tmp/users-data.sql "$BACKUP_FILE"
          grep -Fq 'release-smoke@teste.local' /tmp/users-data.sql

          createdb meucardio_restore
          TARGET_PGDATABASE=meucardio_restore \
            CONFIRM_RESTORE_TARGET=meucardio_restore \
            bash ops/restore-postgres.sh "$BACKUP_FILE"

          RESTORED_DATABASE="$(
            PGDATABASE=meucardio_restore psql --no-psqlrc --tuples-only --no-align \
              --command 'SELECT current_database();'
          )"
          RESTORED_USER_COUNT="$(
            PGDATABASE=meucardio_restore psql --no-psqlrc --tuples-only --no-align \
              --command 'SELECT count(*) FROM users;'
          )"
          RESTORED_ADMIN_ID="$(
            PGDATABASE=meucardio_restore psql \
              --no-psqlrc --tuples-only --no-align --set=ON_ERROR_STOP=1 \
              --command "SELECT id FROM users WHERE email = 'release-smoke@teste.local';"
          )"
          printf 'Backup target: database=%s users=%s probe_id=%s\n' \
            "$RESTORED_DATABASE" "$RESTORED_USER_COUNT" "$RESTORED_ADMIN_ID"

          test "$RESTORED_DATABASE" = "meucardio_restore"
          test "$RESTORED_USER_COUNT" = "$SOURCE_USER_COUNT"
          test "$RESTORED_ADMIN_ID" = "$SOURCE_ADMIN_ID"

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit dependency security
        working-directory: frontend
        run: npm run audit:security

      - name: Enforce browser session storage policy
        working-directory: frontend
        run: node scripts/check-auth-storage.mjs

      - name: Enforce safe content rendering
        working-directory: frontend
        run: node scripts/check-rendering-security.mjs

      - name: Test the restricted email rendering exception
        working-directory: frontend
        run: node --test scripts/check-rendering-security.test.mjs

      - name: Enforce KYC selfie camera lifecycle contract
        working-directory: frontend
        run: node scripts/check-camera-lifecycle.mjs

      - name: Test the KYC selfie camera lifecycle contract
        working-directory: frontend
        run: node --test scripts/check-camera-lifecycle.test.mjs

      - name: Enforce login input contrast contract
        working-directory: frontend
        run: node scripts/check-login-input-contrast.mjs

      - name: Test the login input contrast contract
        working-directory: frontend
        run: node --test scripts/check-login-input-contrast.test.mjs

      - name: Enforce global form-control contrast contract
        working-directory: frontend
        run: node scripts/check-form-control-contrast.mjs

      - name: Enforce admin ficha (Histórico) contrast and legible rendering
        working-directory: frontend
        run: node scripts/check-admin-ficha-historico.mjs

      - name: Test the admin ficha (Histórico) contract
        working-directory: frontend
        run: node --test scripts/check-admin-ficha-historico.test.mjs

      - name: Enforce route-level code splitting
        working-directory: frontend
        run: node scripts/check-route-splitting.mjs

      - name: Build production frontend
        working-directory: frontend
        run: npm run build

      - name: Enforce bundle and PWA budgets
        working-directory: frontend
        run: node scripts/check-bundle-budget.mjs

  ci_policy:
    name: CI policy
    if: always()
    needs: [backend_scope, backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout attestation policy at the exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Require every applicable CI job
        shell: bash
        env:
          SCOPE_RESULT: ${{ needs.backend_scope.result }}
          BACKEND_MODE: ${{ needs.backend_scope.outputs.backend_mode }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          set -euo pipefail
          [[ "$SCOPE_RESULT" == "success" ]] \
            || { echo "Backend scope detection: $SCOPE_RESULT" >&2; exit 1; }
          [[ "$FRONTEND_RESULT" == "success" ]] \
            || { echo "Frontend build: $FRONTEND_RESULT" >&2; exit 1; }

          case "$BACKEND_MODE:$BACKEND_RESULT" in
            full:success)
              echo "Backend full suite required and successful."
              ;;
            targeted:success)
              echo "Changed backend tests required and successful."
              ;;
            skip:skipped)
              echo "Backend tests safely skipped by the path policy."
              ;;
            *)
              echo "Invalid backend gate state: mode=$BACKEND_MODE result=$BACKEND_RESULT" >&2
              exit 1
              ;;
          esac

      - name: Write reusable PR CI attestation
        env:
          ATTESTATION_PATH: ${{ runner.temp }}/ci-pr-attestation.json
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TESTED_TREE: ${{ needs.backend_scope.outputs.tested_tree }}
          BACKEND_MODE: ${{ needs.backend_scope.outputs.backend_mode }}
          TARGETED_TESTS: ${{ needs.backend_scope.outputs.targeted_tests }}
          CHANGES_DIGEST: ${{ needs.backend_scope.outputs.changes_digest }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python scripts/ci_release_policy.py write-attestation \
            --repository "$REPOSITORY" \
            --pr-number "$PR_NUMBER" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --tested-tree "$TESTED_TREE" \
            --backend-mode "$BACKEND_MODE" \
            --targeted-tests "$TARGETED_TESTS" \
            --changes-digest "$CHANGES_DIGEST" \
            --backend-result "$BACKEND_RESULT" \
            --frontend-result "$FRONTEND_RESULT" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --output "$ATTESTATION_PATH"

      - name: Publish reusable PR CI attestation
        uses: actions/upload-artifact@v6
        with:
          name: ci-pr-attestation
          path: ${{ runner.temp }}/ci-pr-attestation.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30
