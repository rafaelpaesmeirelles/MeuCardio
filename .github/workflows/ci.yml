name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-presentation-identity:
    name: Apply presentation professional identity
    if: github.head_ref == 'agent/perfil-documentos-prescricoes-historico' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/perfil-documentos-prescricoes-historico
          fetch-depth: 0
      - name: Apply presentation identity
        run: python tools/apply_presentation_identity.py
      - name: Restore permanent CI and publish implementation
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name 'CorvIA Automation'
          git config user.email 'automation@corvia.med.br'
          git add -A
          git diff --cached --check
          git commit -m 'feat: inclui logo e identidade profissional nas apresentações'
          git push origin HEAD:agent/perfil-documentos-prescricoes-historico
