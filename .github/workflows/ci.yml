name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  actions: read
  contents: read

# Serializa PR/push/retry do mesmo codigo. Assim a segunda execucao so comeca
# depois que a primeira pode ter produzido o certificado SHA+suite reutilizavel.
concurrency:
  group: corvia-ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  backend-risk-policy:
    name: Classify backend risk and reuse exact suites
    runs-on: ubuntu-latest
    outputs:
      backend_mode: ${{ steps.classify.outputs.backend_mode }}
      candidate_sha: ${{ steps.changes.outputs.candidate_sha }}
      focused_tests: ${{ steps.classify.outputs.focused_tests }}
      policy_reasons: ${{ steps.classify.outputs.policy_reasons }}
      policy_version: ${{ steps.classify.outputs.policy_version }}
      reuse_backend: ${{ steps.reuse.outputs.reuse_backend }}
      reuse_source_run: ${{ steps.reuse.outputs.reuse_source_run }}
      suite_key: ${{ steps.classify.outputs.suite_key }}
    steps:
      - name: Checkout the exact candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Resolve the complete candidate change set
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          candidate="$(git rev-parse HEAD)"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
            [[ "$base" =~ ^[0-9a-f]{40}$ ]] || {
              echo "Invalid pull request base SHA: $base" >&2
              exit 64
            }
            git cat-file -e "${base}^{commit}"
            git diff --no-renames --name-only --diff-filter=ACDMRTUXB "${base}...${candidate}" \
              > "$RUNNER_TEMP/backend-policy-paths.txt"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            base="$BEFORE_SHA"
            if [[ ! "$base" =~ ^[0-9a-f]{40}$ ]] || [[ "$base" == "0000000000000000000000000000000000000000" ]]; then
              git diff-tree --root --no-renames --no-commit-id --name-only -r "$candidate" \
                > "$RUNNER_TEMP/backend-policy-paths.txt"
            else
              git cat-file -e "${base}^{commit}"
              git diff --no-renames --name-only --diff-filter=ACDMRTUXB "${base}..${candidate}" \
                > "$RUNNER_TEMP/backend-policy-paths.txt"
            fi
          else
            echo "Unsupported CI event: $EVENT_NAME" >&2
            exit 64
          fi
          echo "candidate_sha=$candidate" >> "$GITHUB_OUTPUT"
          echo "Changed paths considered by backend policy:"
          sed -n '1,300p' "$RUNNER_TEMP/backend-policy-paths.txt"

      - name: Test risk classification and exact-suite reuse before trusting them
        run: python -m unittest scripts.tests.test_ci_backend_policy -v

      - name: Classify backend risk and select focused tests
        id: classify
        run: >-
          python scripts/ci_backend_policy.py
          --paths-file "$RUNNER_TEMP/backend-policy-paths.txt"
          --repo-root .
          --github-output "$GITHUB_OUTPUT"

      - name: Reuse only an identical successful suite for this exact SHA
        id: reuse
        shell: bash
        env:
          BACKEND_MODE: ${{ steps.classify.outputs.backend_mode }}
          CANDIDATE_SHA: ${{ steps.changes.outputs.candidate_sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SUITE_KEY: ${{ steps.classify.outputs.suite_key }}
        run: |
          set -euo pipefail
          echo "reuse_backend=false" >> "$GITHUB_OUTPUT"
          echo "reuse_source_run=" >> "$GITHUB_OUTPUT"
          [[ "$BACKEND_MODE" != "skip" ]] || exit 0

          expected_job="Backend tests"
          if [[ "$BACKEND_MODE" == "focused" ]]; then
            expected_job="Backend focused tests"
          fi
          runs_file="$RUNNER_TEMP/backend-policy-runs.json"
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${CANDIDATE_SHA}&per_page=100" \
            > "$runs_file"

          mapfile -t run_ids < <(python3 - "$runs_file" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              runs = json.load(stream).get("workflow_runs", [])
          for run in sorted(runs, key=lambda item: item.get("created_at", ""), reverse=True):
              run_id = run.get("id")
              if isinstance(run_id, int):
                  print(run_id)
          PY
          )
          for run_id in "${run_ids[@]}"; do
            jobs_file="$RUNNER_TEMP/backend-policy-jobs-${run_id}.json"
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${REPOSITORY}/actions/runs/${run_id}/jobs?filter=all&per_page=100" \
              > "$jobs_file"
            if python3 scripts/ci_backend_reuse.py \
              --jobs-json "$jobs_file" \
              --candidate-sha "$CANDIDATE_SHA" \
              --job-name "$expected_job" \
              --suite-key "$SUITE_KEY"
            then
              echo "reuse_backend=true" >> "$GITHUB_OUTPUT"
              echo "reuse_source_run=$run_id" >> "$GITHUB_OUTPUT"
              echo "Reusing certified suite $SUITE_KEY from CI run $run_id for $CANDIDATE_SHA."
              exit 0
            fi
          done

          echo "No identical successful backend suite found for $CANDIDATE_SHA; execution is mandatory."

      - name: Summarize backend policy
        env:
          BACKEND_MODE: ${{ steps.classify.outputs.backend_mode }}
          POLICY_REASONS: ${{ steps.classify.outputs.policy_reasons }}
          REUSE_BACKEND: ${{ steps.reuse.outputs.reuse_backend }}
          REUSE_SOURCE_RUN: ${{ steps.reuse.outputs.reuse_source_run }}
          SUITE_KEY: ${{ steps.classify.outputs.suite_key }}
        run: |
          {
            echo "### Backend CI policy"
            echo "- mode: \`$BACKEND_MODE\`"
            echo "- suite: \`$SUITE_KEY\`"
            echo "- reuse exact SHA/suite: \`$REUSE_BACKEND\`"
            echo "- source run: \`${REUSE_SOURCE_RUN:-none}\`"
            echo "- reasons: \`$POLICY_REASONS\`"
          } >> "$GITHUB_STEP_SUMMARY"

  backend:
    name: Backend tests
    needs: backend-risk-policy
    if: >-
      needs.backend-risk-policy.outputs.backend_mode == 'full' &&
      needs.backend-risk-policy.outputs.reuse_backend != 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: meucardio_test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: meucardio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meucardio_test -d meucardio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      ENVIRONMENT: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: meucardio_test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: meucardio_test
      REDIS_URL: redis://localhost:6379/0
      STORAGE_ENCRYPTION_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
      JWT_SECRET: chave-de-teste-nao-usar-em-producao
      ADMIN_EMAIL: admin@teste.local
      ADMIN_PASSWORD: admin-teste-123
      AI_ENABLED: "false"
      MAIL360_CLIENT_ID: id-de-teste
      MAIL360_CLIENT_SECRET: secret-de-teste
      MAIL360_REFRESH_TOKEN: refresh-de-teste
      CORVIA_MAIL_PRECO_CENTAVOS: "1000"
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_teste_dummy
      PUBLIC_URL: https://corvia.med.br
      UPLOADS_DIR: /tmp/corvia-test/uploads
      EXAMES_DIR: /tmp/corvia-test/exames-pacientes
      DOCUMENTOS_DIR: /tmp/corvia-test/documentos-emitidos

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.backend-risk-policy.outputs.candidate_sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Enforce Node 24 action runtimes
        run: python scripts/check_workflow_actions.py

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Validate operational shell scripts
        run: bash -n ops/*.sh

      - name: Install dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Audit Python production dependencies
        working-directory: backend
        run: python -m pip_audit -r requirements.txt --progress-spinner=off --strict

      - name: Apply migrations through the operational command
        working-directory: backend
        run: python -m app.commands.migrate

      - name: Verify migration command is idempotent
        working-directory: backend
        run: python -m app.commands.migrate

      - name: Smoke test explicit administrator bootstrap
        working-directory: backend
        run: |
          python -m app.commands.create_admin --email ci-admin@teste.local --password admin-ci-seguro-123
          python -m app.commands.create_admin --email ci-admin@teste.local --password outra-senha-que-nao-deve-substituir
          python - <<'PY'
          from app.core.db import SessionLocal
          from app.models.user import User

          db = SessionLocal()
          try:
              assert db.query(User).filter(User.email == "ci-admin@teste.local").count() == 1
          finally:
              db.close()
          PY

      - name: Compile Python modules
        working-directory: backend
        run: python -m compileall -q app tests migrations

      - name: Run pytest
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q --tb=short 2>&1 | tee pytest-output.txt

      - name: Upload pytest failure report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: backend-pytest-failure
          path: backend/pytest-output.txt
          if-no-files-found: error
          retention-days: 7

      - name: Exercise live HTTP release flow
        working-directory: backend
        run: |
          python -m app.commands.create_admin \
            --email release-smoke@teste.local \
            --password release-smoke-seguro-123
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/corvia-api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true' EXIT
          cd ..
          python scripts/release_smoke.py \
            --email release-smoke@teste.local \
            --password release-smoke-seguro-123 \
            || { cat /tmp/corvia-api.log; exit 1; }

      - name: Prove PostgreSQL backup and restore
        run: |
          export PGHOST=localhost
          export PGPORT=5432
          export PGUSER="$POSTGRES_USER"
          export PGPASSWORD="$POSTGRES_PASSWORD"
          export PGDATABASE="$POSTGRES_DB"
          export BACKUP_DIR=/tmp/corvia-backups
          export ALLOW_UNENCRYPTED_BACKUP=1

          SOURCE_DATABASE="$(psql --no-psqlrc --tuples-only --no-align --command 'SELECT current_database();')"
          SOURCE_USER_COUNT="$(psql --no-psqlrc --tuples-only --no-align --command 'SELECT count(*) FROM users;')"
          SOURCE_ADMIN_ID="$(
            psql --no-psqlrc --tuples-only --no-align --set=ON_ERROR_STOP=1 \
              --command "SELECT id FROM users WHERE email = 'release-smoke@teste.local';"
          )"
          test -n "$SOURCE_ADMIN_ID"
          printf 'Backup source: database=%s users=%s probe_id=%s\n' \
            "$SOURCE_DATABASE" "$SOURCE_USER_COUNT" "$SOURCE_ADMIN_ID"

          BACKUP_FILE="$(bash ops/backup-postgres.sh)"
          pg_restore --data-only --table=users --file=/tmp/users-data.sql "$BACKUP_FILE"
          grep -Fq 'release-smoke@teste.local' /tmp/users-data.sql

          createdb meucardio_restore
          TARGET_PGDATABASE=meucardio_restore \
            CONFIRM_RESTORE_TARGET=meucardio_restore \
            bash ops/restore-postgres.sh "$BACKUP_FILE"

          RESTORED_DATABASE="$(
            PGDATABASE=meucardio_restore psql --no-psqlrc --tuples-only --no-align \
              --command 'SELECT current_database();'
          )"
          RESTORED_USER_COUNT="$(
            PGDATABASE=meucardio_restore psql --no-psqlrc --tuples-only --no-align \
              --command 'SELECT count(*) FROM users;'
          )"
          RESTORED_ADMIN_ID="$(
            PGDATABASE=meucardio_restore psql \
              --no-psqlrc --tuples-only --no-align --set=ON_ERROR_STOP=1 \
              --command "SELECT id FROM users WHERE email = 'release-smoke@teste.local';"
          )"
          printf 'Backup target: database=%s users=%s probe_id=%s\n' \
            "$RESTORED_DATABASE" "$RESTORED_USER_COUNT" "$RESTORED_ADMIN_ID"

          test "$RESTORED_DATABASE" = "meucardio_restore"
          test "$RESTORED_USER_COUNT" = "$SOURCE_USER_COUNT"
          test "$RESTORED_ADMIN_ID" = "$SOURCE_ADMIN_ID"

      - name: Backend suite certificate ${{ needs.backend-risk-policy.outputs.suite_key }}
        env:
          CANDIDATE_SHA: ${{ needs.backend-risk-policy.outputs.candidate_sha }}
          SUITE_KEY: ${{ needs.backend-risk-policy.outputs.suite_key }}
        run: echo "Certified $SUITE_KEY for exact SHA $CANDIDATE_SHA."

  backend-focused:
    name: Backend focused tests
    needs: backend-risk-policy
    if: >-
      needs.backend-risk-policy.outputs.backend_mode == 'focused' &&
      needs.backend-risk-policy.outputs.reuse_backend != 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: meucardio_test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: meucardio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meucardio_test -d meucardio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      ENVIRONMENT: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: meucardio_test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: meucardio_test
      REDIS_URL: redis://localhost:6379/0
      STORAGE_ENCRYPTION_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
      JWT_SECRET: chave-de-teste-nao-usar-em-producao
      ADMIN_EMAIL: admin@teste.local
      ADMIN_PASSWORD: admin-teste-123
      AI_ENABLED: "false"
      MAIL360_CLIENT_ID: id-de-teste
      MAIL360_CLIENT_SECRET: secret-de-teste
      MAIL360_REFRESH_TOKEN: refresh-de-teste
      CORVIA_MAIL_PRECO_CENTAVOS: "1000"
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_teste_dummy
      PUBLIC_URL: https://corvia.med.br
      UPLOADS_DIR: /tmp/corvia-test/uploads
      EXAMES_DIR: /tmp/corvia-test/exames-pacientes
      DOCUMENTOS_DIR: /tmp/corvia-test/documentos-emitidos

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.backend-risk-policy.outputs.candidate_sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend test dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      # Mesmo quando a mudanca nao inclui uma migration, os testes deste projeto
      # exigem um PostgreSQL inicializado pelo comando operacional; isto prepara
      # o banco limpo, mas nao exercita novamente o gate completo de migration.
      - name: Initialize the focused test database at current head
        working-directory: backend
        run: python -m app.commands.migrate

      - name: Compile changed backend surfaces
        working-directory: backend
        run: python -m compileall -q app tests

      - name: Run only tests selected by the risk policy
        working-directory: backend
        shell: bash
        env:
          FOCUSED_TESTS: ${{ needs.backend-risk-policy.outputs.focused_tests }}
        run: |
          set -euo pipefail
          [[ -n "$FOCUSED_TESTS" ]] || { echo "Focused test list is empty." >&2; exit 64; }
          # Os caminhos sao produzidos pelo classificador e validados contra
          # ^tests/test_[A-Za-z0-9_]+\.py$ antes de chegarem ao shell.
          read -r -a tests <<< "$FOCUSED_TESTS"
          python -m pytest -q --tb=short "${tests[@]}" 2>&1 | tee pytest-focused-output.txt

      - name: Upload focused pytest failure report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: backend-focused-pytest-failure-${{ needs.backend-risk-policy.outputs.suite_key }}
          path: backend/pytest-focused-output.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Backend suite certificate ${{ needs.backend-risk-policy.outputs.suite_key }}
        env:
          CANDIDATE_SHA: ${{ needs.backend-risk-policy.outputs.candidate_sha }}
          SUITE_KEY: ${{ needs.backend-risk-policy.outputs.suite_key }}
        run: echo "Certified $SUITE_KEY for exact SHA $CANDIDATE_SHA."

  backend-risk-gate:
    name: Backend risk gate
    needs: [backend-risk-policy, backend, backend-focused]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the classified backend evidence
        env:
          FOCUSED_RESULT: ${{ needs.backend-focused.result }}
          FULL_RESULT: ${{ needs.backend.result }}
          MODE: ${{ needs.backend-risk-policy.outputs.backend_mode }}
          POLICY_RESULT: ${{ needs.backend-risk-policy.result }}
          REUSE_BACKEND: ${{ needs.backend-risk-policy.outputs.reuse_backend }}
          REUSE_SOURCE_RUN: ${{ needs.backend-risk-policy.outputs.reuse_source_run }}
          SUITE_KEY: ${{ needs.backend-risk-policy.outputs.suite_key }}
        run: |
          set -euo pipefail
          [[ "$POLICY_RESULT" == "success" ]] || {
            echo "Backend risk policy did not succeed: $POLICY_RESULT" >&2
            exit 1
          }
          case "$MODE" in
            skip)
              [[ "$FULL_RESULT" == "skipped" && "$FOCUSED_RESULT" == "skipped" ]] || {
                echo "Frontend/docs-only change unexpectedly ran a backend suite." >&2
                exit 1
              }
              echo "Backend correctly skipped for a frontend/docs-only change."
              ;;
            full)
              if [[ "$REUSE_BACKEND" == "true" ]]; then
                [[ "$REUSE_SOURCE_RUN" =~ ^[0-9]+$ ]] || {
                  echo "Full suite reuse has no valid source run." >&2
                  exit 1
                }
                [[ "$FULL_RESULT" == "skipped" ]] || {
                  echo "Full suite was repeated despite an exact certificate." >&2
                  exit 1
                }
              else
                [[ "$FULL_RESULT" == "success" ]] || {
                  echo "Mandatory full backend suite result: $FULL_RESULT" >&2
                  exit 1
                }
              fi
              ;;
            focused)
              if [[ "$REUSE_BACKEND" == "true" ]]; then
                [[ "$REUSE_SOURCE_RUN" =~ ^[0-9]+$ ]] || {
                  echo "Focused suite reuse has no valid source run." >&2
                  exit 1
                }
                [[ "$FOCUSED_RESULT" == "skipped" ]] || {
                  echo "Focused suite was repeated despite an exact certificate." >&2
                  exit 1
                }
              else
                [[ "$FOCUSED_RESULT" == "success" ]] || {
                  echo "Mandatory focused backend suite result: $FOCUSED_RESULT" >&2
                  exit 1
                }
              fi
              ;;
            *)
              echo "Unknown backend mode: $MODE" >&2
              exit 64
              ;;
          esac
          echo "Backend risk gate passed for $SUITE_KEY."

  frontend:
    name: Frontend build
    needs: backend-risk-policy
    if: always() && needs.backend-risk-policy.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit dependency security
        working-directory: frontend
        run: npm run audit:security

      - name: Enforce browser session storage policy
        working-directory: frontend
        run: node scripts/check-auth-storage.mjs

      - name: Enforce safe content rendering
        working-directory: frontend
        run: node scripts/check-rendering-security.mjs

      - name: Test the restricted email rendering exception
        working-directory: frontend
        run: node --test scripts/check-rendering-security.test.mjs

      - name: Enforce KYC selfie camera lifecycle contract
        working-directory: frontend
        run: node scripts/check-camera-lifecycle.mjs

      - name: Test the KYC selfie camera lifecycle contract
        working-directory: frontend
        run: node --test scripts/check-camera-lifecycle.test.mjs

      - name: Enforce login input contrast contract
        working-directory: frontend
        run: node scripts/check-login-input-contrast.mjs

      - name: Test the login input contrast contract
        working-directory: frontend
        run: node --test scripts/check-login-input-contrast.test.mjs

      - name: Enforce global form-control contrast contract
        working-directory: frontend
        run: node scripts/check-form-control-contrast.mjs

      - name: Test Cardiology Spaces theme parity, login and clinical identity
        working-directory: frontend
        run: >-
          node --test
          scripts/check-cardiology-spaces-light-mode-contract.test.mjs
          scripts/check-cardiology-spaces-login-gateway-contract.test.mjs
          scripts/check-clinical-identity.test.mjs

      - name: Reject reserved synthetic agenda markers in user-facing surfaces
        working-directory: frontend
        run: node --test scripts/check-reserved-smoke-agenda.test.mjs

      - name: Enforce admin ficha (Histórico) contrast and legible rendering
        working-directory: frontend
        run: node scripts/check-admin-ficha-historico.mjs

      - name: Test the admin ficha (Histórico) contract
        working-directory: frontend
        run: node --test scripts/check-admin-ficha-historico.test.mjs

      - name: Enforce route-level code splitting
        working-directory: frontend
        run: node scripts/check-route-splitting.mjs

      - name: Enforce Cardiology Spaces frame, rollback and emergency contracts
        working-directory: frontend
        run: npm run test:cardiology-spaces-app-frame-contract

      - name: Build production frontend
        working-directory: frontend
        run: npm run build

      - name: Enforce bundle and PWA budgets
        working-directory: frontend
        run: node scripts/check-bundle-budget.mjs
