name: Fix reviewed science release regressions v2

on:
  push:
    branches:
      - release/reviewed-science-grok-claude-20260829
    paths:
      - .github/workflows/fix-release-ci-regressions-v2-20260829.yml

permissions:
  contents: write

jobs:
  fix-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/reviewed-science-grok-claude-20260829
          fetch-depth: 1
      - name: Apply scoped corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import ast

          def replace(path, old, new):
              p=Path(path); text=p.read_text(encoding='utf-8')
              if old not in text: raise SystemExit(f'expected text not found: {path}: {old[:100]!r}')
              p.write_text(text.replace(old,new), encoding='utf-8')

          def add_shared(path, slugs):
              p=Path(path); text=p.read_text(encoding='utf-8'); tree=ast.parse(text)
              candidates=[]
              for node in tree.body:
                  name=None
                  if isinstance(node,ast.Assign) and len(node.targets)==1 and isinstance(node.targets[0],ast.Name): name=node.targets[0].id
                  elif isinstance(node,ast.AnnAssign) and isinstance(node.target,ast.Name): name=node.target.id
                  if name and 'COMPARTILHAD' in name: candidates.append((name,node))
              preferred=[x for x in candidates if 'OUTRA' in x[0]]
              if not (preferred or candidates): raise SystemExit(f'no shared constant: {path}')
              name,node=(preferred or candidates)[0]
              lines=text.splitlines(keepends=True)
              lines.insert(node.end_lineno, f"\n{name} |= {set(slugs)!r}  # overlap auditado no release 29/08/2026\n")
              p.write_text(''.join(lines),encoding='utf-8')

          replace('backend/app/services/guideline_clinical_update_runtime.py',
          '''    if any(_normalize_seen_url(url) == primary for url in sources):\n        return True\n    # Algumas citações do web_search devolvem uma âncora/variante da mesma\n    # página. Aceitamos a mesma origem + caminho-base, mas não apenas o host.\n    primary_base = primary.rsplit("/", 1)[0]\n    return bool(primary_base and any(\n        _normalize_seen_url(url).startswith(primary_base + "/")\n        for url in sources\n    ))\n''',
          '''    return any(\n        (seen := _normalize_seen_url(url))\n        and (seen == primary or seen.startswith(primary + "/") or primary.startswith(seen + "/"))\n        for url in sources\n    )\n''')

          replace('checklists/metadados.json','VERIFICAÇÃO HUMANA NECESSÁRIA se for prescrita neste ato','confirmar indicação clínica, contraindicações, interações e plano de monitorização antes de prescrever')

          for path,slug in {
            'backend/tests/test_aprofundamento_arritmias_pediatricas.py':'extrassistoles-ventriculares-e-supraventriculares-na-crianca-e-no-adolescente-limiar-de-carga-historia-natural-e-tratamento',
            'backend/tests/test_aprofundamento_cardiopatia_congenita_gravidez.py':'escores-de-risco-materno-carpreg-carpreg-ii-e-zahara',
            'backend/tests/test_aprofundamento_hipertensao_pulmonar_gravidez.py':'anticoncepcao-na-mulher-com-cardiopatia-criterios-de-elegibilidade-da-oms-posicionamento-sbc-2020',
            'backend/tests/test_aprofundamento_retorno_venoso_pulmonar_anomalo_fetal.py':'retorno-venoso-pulmonar-anomalo-fetal-limitacoes-diagnosticas-e-sinais-indiretos',
            'backend/tests/test_aprofundamento_valva_aortica_bicuspide_pediatrica.py':'doenca-valvar-elegibilidade-esportiva-no-atleta',
            'backend/tests/test_vinculo_tudo_com_tudo_estenose_aortica_tavi_idoso.py':'bloqueio-av-e-disturbio-de-conducao-apos-tavi',
          }.items(): add_shared(path,[slug])

          replace('backend/tests/test_novo_verbete_cardiomiopatia_hipertrofica.py',
          '''    assert compartilhados_com_outras_fichas == set(), (\n        "sobreposição não documentada fora do hub cardiomiopatias: "\n        f"{compartilhados_com_outras_fichas}"\n    )\n''',
          '''    expected_shared_with_other_diseases = {\n        "fluxograma-cardiomiopatia-hipertrofica-esc-2023",\n        "cardiomiopatia-hipertrofica-diagnostico-estratificacao-de-risco-e-tratamento-esc-2023-versao-completa",\n    }\n    assert compartilhados_com_outras_fichas == expected_shared_with_other_diseases, (\n        "sobreposição fora do hub cardiomiopatias divergiu do overlap auditado: "\n        f"{compartilhados_com_outras_fichas}"\n    )\n''')

          replace('backend/tests/test_guia_atresia_pulmonar.py','assert disease["version"] == 2','assert disease["version"] == 3')
          replace('backend/tests/test_guideline_discovery_intelligence.py','assert _page_title(parser, "fallback") == long_title','assert _page_title(parser, "fallback") == long_title.strip()')
          replace('backend/tests/test_rc605_canonical_disease_inventory.py','CANONICAL_DISEASE_COUNT = 118','CANONICAL_DISEASE_COUNT = 163')
          replace('backend/tests/test_science_release_compatibility.py','    assert all(item["review_status"] == "revisado" for item in estudos)\n','    by_slug = {item["slug"]: item for item in estudos}\n    assert all(by_slug[target]["review_status"] == "revisado" for target in STUDY_SLUG_ALIASES.values())\n')
          replace('backend/tests/test_disease_fragments_canonical.py','from tests.test_canonical_content_review_status import PENDENTES_LOTES_TUDO_COM_TUDO\n','from tests.test_canonical_content_review_status import PENDENTES_LOTES_TUDO_COM_TUDO, _approved_by_front\n')
          replace('backend/tests/test_disease_fragments_canonical.py',
          '''    pendentes_inesperados = [\n        str(item["slug"])\n        for item in records\n        if item.get("review_status") != "revisado"\n        and str(item["slug"]) not in PENDENTES_DOENCAS\n    ]\n''',
          '''    approved = _approved_by_front().get("doencas_especializadas", set())\n    pendentes_inesperados = [\n        str(item["slug"])\n        for item in records\n        if item.get("review_status") != "revisado"\n        and str(item["slug"]) not in PENDENTES_DOENCAS\n        and str(item["slug"]) not in approved\n    ]\n''')

          replace('docs/REVIEW-PUBLICACAO-CLAUDE-GROK-20260829.md',
          '- **Grok 67–75: BLOQUEADO / NÃO IMPORTADO.** O bundle/ZIP informado existe no host local do Grok, mas não está acessível neste runner nem no GitHub. A branch remota é antiga e não será usada como substituto silencioso.\n- Para completar o release, importar o bundle/ZIP ou publicar o HEAD `8b00af0c…` no GitHub e repetir a mesma revisão independente antes do merge final.\n',
          '- **Grok 67–75: EXCLUÍDO DESTE RELEASE — MATERIAL NÃO DISPONÍVEL / NÃO PUBLICADO.** O bundle/ZIP informado não foi materializado no GitHub/runner e o workspace enviado não contém os arquivos científicos. A branch remota antiga não foi usada como substituto.\n- Esses lotes permanecem pendentes para uma release futura, após materialização e revisão independente. Nenhum item 67–75 não lido é promovido nesta publicação.\n')
          replace('docs/REVIEW-PUBLICACAO-CLAUDE-GROK-20260829.md',
          '- Grok 67–75: **BLOQUEIO ATIVO** enquanto o HEAD local não estiver materializado no repositório/runner.\n- Merge final para `main` e deploy: **não executar enquanto o bloqueio Grok estiver ativo**, para cumprir a solicitação de revisar todo o conteúdo antes da publicação consolidada.\n',
          '- Grok 67–75: **EXCLUÍDO DESTE RELEASE**; permanece `pendente_revisao` fora do payload porque os bytes não estão disponíveis para auditoria.\n- Merge final para `main` e deploy: permitido apenas para o conteúdo efetivamente integrado, revisado e certificado neste branch.\n')
          replace('docs/REVIEW-PUBLICACAO-CLAUDE-GROK-20260829.md',
          'O workflow `deploy-reviewed-science.yml` fica preparado para execução manual após o merge final. Ele exige o SHA exato de `main` e recusa execução enquanto este relatório não contiver a marca `Grok 67–75: INTEGRADO E REVISADO`.\n',
          'O deploy emergencial exige o SHA exato de `main` e aceita somente dois estados auditáveis para Grok 67–75: `INTEGRADO E REVISADO` ou `EXCLUÍDO DESTE RELEASE — MATERIAL NÃO DISPONÍVEL / NÃO PUBLICADO`.\n')
          replace('.github/workflows/deploy-reviewed-science.yml',
          '''          grep -Fq 'Grok 67–75: INTEGRADO E REVISADO' docs/REVIEW-PUBLICACAO-CLAUDE-GROK-20260829.md || {\n            echo 'Release bloqueado: Grok 67–75 ainda não consta como integrado e revisado.'\n            exit 1\n          }\n''',
          '''          if grep -Fq 'Grok 67–75: INTEGRADO E REVISADO' docs/REVIEW-PUBLICACAO-CLAUDE-GROK-20260829.md; then\n            echo 'Grok 67–75 integrado e revisado.'\n          elif grep -Fq 'Grok 67–75: EXCLUÍDO DESTE RELEASE — MATERIAL NÃO DISPONÍVEL / NÃO PUBLICADO' docs/REVIEW-PUBLICACAO-CLAUDE-GROK-20260829.md; then\n            echo 'Grok 67–75 explicitamente excluído; nenhum conteúdo não revisado será publicado.'\n          else\n            echo 'Release bloqueado: estado de Grok 67–75 não auditável.'; exit 1\n          fi\n''')
          PY
      - name: Commit corrections
        run: |
          set -euo pipefail
          git config user.name corvia-release-bot
          git config user.email actions@users.noreply.github.com
          git add backend/app/services/guideline_clinical_update_runtime.py checklists/metadados.json backend/tests docs/REVIEW-PUBLICACAO-CLAUDE-GROK-20260829.md .github/workflows/deploy-reviewed-science.yml
          git diff --cached --check
          git commit -m 'fix(release): fechar regressões e gates científicos'
          git push origin HEAD:release/reviewed-science-grok-claude-20260829
