name: Consolidate Claude content (one-time)

on:
  push:
    branches:
      - release/claude-content-batch-20260820-final

permissions:
  contents: write

jobs:
  consolidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch Claude content PR heads
        shell: bash
        run: |
          set -euo pipefail
          prs=(166 167 168 169 170 171 172 173 174 175 176 177 178 179 180 182 183 184 185 186 187 188 189 190 191 192 193 194 195 196 197 199 200 201 202 203)
          for pr in "${prs[@]}"; do
            git fetch origin "+refs/pull/${pr}/head:refs/remotes/pr/${pr}"
          done
          git fetch origin main:refs/remotes/origin/main

      - name: Merge structured content semantically
        env:
          BASE_REF: origin/main
        run: |
          python .github/scripts/consolidate_claude_content.py
          git diff --check
          python -m json.tool checklists/metadados.json >/dev/null
          python -m json.tool material-paciente/metadados.json >/dev/null
          python -m json.tool medicamentos/metadados.json >/dev/null

      - name: Commit consolidated corpus
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add checklists/metadados.json material-paciente/metadados.json medicamentos/metadados.json
          if git diff --cached --quiet; then
            echo "No structured changes to commit"
            exit 0
          fi
          git commit -m "content: consolidate Claude review batch"
          git push origin HEAD:release/claude-content-batch-20260820-final
