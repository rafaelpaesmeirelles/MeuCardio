name: Pre-home Visual QA — Canonical CorVIA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/prehome-visual-qa.yml"
      - "frontend/src/pages/Entrar.tsx"
      - "frontend/src/pages/SolicitarAcesso.tsx"
      - "frontend/src/pages/EsqueciSenha.tsx"
      - "frontend/src/pages/RedefinirSenha.tsx"
      - "frontend/src/components/PublicCardiologyFrame.tsx"
      - "frontend/src/pages/Produto.tsx"
      - "frontend/public/atelier/**"
      - "frontend/src/styles/corvia-atelier-login.css"
      - "frontend/src/styles/corvia-atelier-public.css"
      - "frontend/src/styles/corvia-atelier.css"
      - "frontend/src/lib/corviaTheme.tsx"
      - "frontend/src/styles/login.css"
      - "frontend/src/styles/login-viewport-refinement.css"
      - "frontend/src/styles/cardiology-spaces-login.css"
      - "frontend/src/main.tsx"

permissions:
  contents: read

jobs:
  prehome-visual-qa:
    name: Login + signup + recovery desktop/mobile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: corvia_prehome_qa
      ENVIRONMENT: test
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: meucardio_prehome
      POSTGRES_PASSWORD: prehome-test
      POSTGRES_DB: meucardio_prehome
      REDIS_URL: redis://redis:6379/0
      STORAGE_ENCRYPTION_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
      JWT_SECRET: chave-prehome-qa-nao-usar-em-producao
      ADMIN_EMAIL: prehome-qa@teste.local
      ADMIN_PASSWORD: prehome-qa-seguro-123
      AI_ENABLED: "false"
      MAIL360_CLIENT_ID: id-de-teste
      MAIL360_CLIENT_SECRET: secret-de-teste
      MAIL360_REFRESH_TOKEN: refresh-de-teste
      CORVIA_MAIL_PRECO_CENTAVOS: "1000"
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_prehome_dummy
      PUBLIC_URL: http://127.0.0.1:8081
      UPLOADS_DIR: /tmp/corvia-prehome/uploads
      EXAMES_DIR: /tmp/corvia-prehome/exames
      DOCUMENTOS_DIR: /tmp/corvia-prehome/documentos

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Create isolated runtime environment
        run: |
          cat > .env <<'ENV'
          COMPOSE_PROJECT_NAME=corvia_prehome_qa
          ENVIRONMENT=test
          POSTGRES_HOST=db
          POSTGRES_PORT=5432
          POSTGRES_USER=meucardio_prehome
          POSTGRES_PASSWORD=prehome-test
          POSTGRES_DB=meucardio_prehome
          REDIS_URL=redis://redis:6379/0
          STORAGE_ENCRYPTION_KEY=MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
          JWT_SECRET=chave-prehome-qa-nao-usar-em-producao
          ADMIN_EMAIL=prehome-qa@teste.local
          ADMIN_PASSWORD=prehome-qa-seguro-123
          AI_ENABLED=false
          MAIL360_CLIENT_ID=id-de-teste
          MAIL360_CLIENT_SECRET=secret-de-teste
          MAIL360_REFRESH_TOKEN=refresh-de-teste
          CORVIA_MAIL_PRECO_CENTAVOS=1000
          STRIPE_SECRET_KEY=sk_test_dummy
          STRIPE_WEBHOOK_SECRET=whsec_prehome_dummy
          PUBLIC_URL=http://127.0.0.1:8081
          UPLOADS_DIR=/tmp/corvia-prehome/uploads
          EXAMES_DIR=/tmp/corvia-prehome/exames
          DOCUMENTOS_DIR=/tmp/corvia-prehome/documentos
          ENV

      - name: Start isolated backend
        run: docker compose up -d --build db redis backend

      - name: Build production frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Serve production build
        run: |
          mkdir -p prehome-qa
          cat > prehome-qa/nginx.conf <<'NGINX'
          server {
            listen 80;
            server_name _;
            root /usr/share/nginx/html;
            index index.html;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            location /api/ {
              proxy_pass http://backend:8000/api/;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Forwarded-Proto $scheme;
            }
            location / { try_files $uri $uri/ /index.html; }
          }
          NGINX
          docker run -d --name corvia-prehome-nginx \
            --network corvia_prehome_qa_default -p 8081:80 \
            -v "$PWD/frontend/dist:/usr/share/nginx/html:ro" \
            -v "$PWD/prehome-qa/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine

      - name: Wait for HTTP readiness
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8081/api/ready >/dev/null \
              && curl --fail --silent http://127.0.0.1:8081/entrar >/dev/null; then exit 0; fi
            sleep 2
          done
          docker compose logs --no-color backend
          docker logs corvia-prehome-nginx || true
          exit 1

      - name: Install isolated Chromium runner
        run: |
          mkdir -p /tmp/corvia-prehome-qa
          cd /tmp/corvia-prehome-qa
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Capture and validate approved pre-home family
        run: |
          mkdir -p prehome-qa/screenshots
          cat > /tmp/corvia-prehome-qa/capture.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import path from 'node:path';

          const base = 'http://127.0.0.1:8081';
          const out = path.join(process.env.GITHUB_WORKSPACE, 'prehome-qa', 'screenshots');
          const reportPath = path.join(process.env.GITHUB_WORKSPACE, 'prehome-qa', 'report.json');
          const routes = [
            ['login', '/entrar'],
            ['cadastro', '/solicitar-acesso'],
            ['esqueci-senha', '/esqueci-senha'],
            ['redefinir-senha', '/redefinir-senha?token=visual-qa-token'],
          ];
          const viewports = [
            ['desktop-amplo-2560x1440', { width: 2560, height: 1440 }],
            ['notebook-1366x768', { width: 1366, height: 768 }],
            ['desktop-intermediario-1366x850', { width: 1366, height: 850 }],
            ['desktop-baixo-1366x640', { width: 1366, height: 640 }],
            ['desktop-critico-1280x600', { width: 1280, height: 600 }],
            ['desktop-1440x900', { width: 1440, height: 900 }],
            ['mobile-390x844', { width: 390, height: 844 }],
            ['mobile-estreito-320x740', { width: 320, height: 740 }],
            ['tablet-820x1180', { width: 820, height: 1180 }],
          ];
          const browser = await chromium.launch({ headless: true });
          const report = { pages: [], themeParity: [], pageErrors: [], failures: [] };
          const approvedAssets = {
            entrance: '/atelier/atelier-entrance.webp',
            logo: '/atelier/corvia-logo-atelier.svg',
          };
          for (const asset of Object.values(approvedAssets)) {
            if (!fs.statSync(path.join(process.env.GITHUB_WORKSPACE, 'frontend/public', asset)).size) {
              throw new Error('Approved Atelier asset is empty: ' + asset);
            }
          }
          function channel(rgb) {
            const values = String(rgb || '').match(/rgba?\((\d+)[, ]+(\d+)[, ]+(\d+)/i);
            return values ? values.slice(1, 4).map(Number) : null;
          }
          function luminance(rgb) {
            const channels = channel(rgb);
            if (!channels) return null;
            const linear = channels.map((value) => {
              const s = value / 255;
              return s <= 0.04045 ? s / 12.92 : ((s + 0.055) / 1.055) ** 2.4;
            });
            return 0.2126 * linear[0] + 0.7152 * linear[1] + 0.0722 * linear[2];
          }
          function contrast(foreground, background) {
            const a = luminance(foreground), b = luminance(background);
            return a === null || b === null ? null : (Math.max(a, b) + 0.05) / (Math.min(a, b) + 0.05);
          }
          const paritySelectors = [
            '#corvia-login', '.atelier-login__topbar', '.atelier-login__story',
            '.atelier-login__copy h1', '.atelier-login__entrance', '.atelier-login__spaces',
            '.atelier-login__access', '.atelier-login__access-heading', '.login-gateway__theme-choice',
            '.login-gateway__form', '.atelier-login__footer', '.login-gateway__forgot', '.atelier-login__join',
          ];
          for (const [viewportName, viewport] of viewports) {
            const context = await browser.newContext({ viewport, colorScheme: 'dark', locale: 'pt-BR' });
            const page = await context.newPage();
            page.on('pageerror', (error) => report.pageErrors.push(viewportName + ': ' + String(error)));
            const fail = (name, detail) => report.failures.push(viewportName + '/' + name + ': ' + detail);
            for (const [name, route] of routes) {
              await page.goto(base + route, { waitUntil: 'networkidle' });
              await page.locator(name === 'login' ? '.corvia-atelier-login' : '.corvia-atelier-public').waitFor();
              await page.evaluate(() => document.fonts.ready);
              const capture = () => page.evaluate(({ name, approvedAssets, paritySelectors }) => {
                const isLogin = name === 'login';
                const visible = (element) => {
                  if (!element) return false;
                  const c = getComputedStyle(element), r = element.getBoundingClientRect();
                  return c.display !== 'none' && c.visibility !== 'hidden' && r.width > 0 && r.height > 0;
                };
                const rect = (selector) => {
                  const el = document.querySelector(selector);
                  if (!el) return null;
                  const r = el.getBoundingClientRect();
                  return { x: r.x + scrollX, y: r.y + scrollY, width: r.width, height: r.height };
                };
                const image = document.querySelector(isLogin ? '.atelier-login__entrance img' : '.atelier-public__scene img');
                const logo = document.querySelector(isLogin ? '.atelier-login__brand img' : '.public-corvia-brand--atelier img');
                const inputs = [...document.querySelectorAll('input:not([type="radio"]):not([type="checkbox"]), select, textarea')];
                const fieldContrast = inputs.filter(visible).map((input) => {
                  const c = getComputedStyle(input);
                  let background = c.backgroundColor;
                  for (let p = input.parentElement; p && /rgba\(0, 0, 0, 0\)|transparent/.test(background); p = p.parentElement) {
                    background = getComputedStyle(p).backgroundColor;
                  }
                  return {
                    id: input.id, foreground: c.color, background,
                    placeholder: input.getAttribute('placeholder') ? getComputedStyle(input, '::placeholder').color : null,
                    labeled: Boolean(input.labels?.length || input.getAttribute('aria-label') || input.getAttribute('aria-labelledby')),
                  };
                });
                const controls = [...document.querySelectorAll('a, button, input')].map((el) => ({
                  tag: el.tagName, type: el.type || '', name: el.name || '', value: el.value || '',
                  href: el.getAttribute('href'), label: el.getAttribute('aria-label') || el.getAttribute('placeholder') || el.textContent?.trim() || '',
                  disabled: Boolean(el.disabled),
                }));
                const themeTargets = [...document.querySelectorAll('.login-gateway__theme-choice label')].map((el) => {
                  const r = el.getBoundingClientRect(); return { width: r.width, height: r.height };
                });
                return {
                  isLogin, width: innerWidth, height: innerHeight,
                  scrollWidth: document.documentElement.scrollWidth, scrollHeight: document.documentElement.scrollHeight,
                  theme: document.querySelector('#corvia-login')?.getAttribute('data-login-theme') || null,
                  root: visible(document.querySelector(isLogin ? '#corvia-login' : '.public-space')),
                  panel: visible(document.querySelector(isLogin ? '.atelier-login__access' : '.public-space__surface')),
                  story: visible(document.querySelector(isLogin ? '.atelier-login__story' : '.public-space__context')),
                  approvedImage: visible(image) && image.complete && image.naturalWidth > 0 && image.getAttribute('src') === approvedAssets.entrance,
                  approvedLogo: visible(logo) && logo.complete && logo.naturalWidth > 0 && logo.getAttribute('src') === approvedAssets.logo,
                  fieldContrast, controls, themeTargets,
                  rects: Object.fromEntries(paritySelectors.map((selector) => [selector, rect(selector)])),
                };
              }, { name, approvedAssets, paritySelectors });
              const initial = await capture();
              report.pages.push({ viewportName, name, route, ...initial });
              if (initial.scrollWidth > viewport.width + 4) fail(name, 'overflow horizontal');
              if (!initial.root || !initial.panel || !initial.story) fail(name, 'composição pública incompleta');
              if (!initial.approvedImage || !initial.approvedLogo) fail(name, 'fotografia ou marca Atelier aprovada ausente/incompleta');
              if (name === 'login' && initial.theme !== 'light') fail(name, 'a entrada perolada não é o padrão');
              const verifyFields = (metrics, theme) => {
                if (!metrics.fieldContrast.length) fail(name, theme + ': nenhum campo transacional visível');
                for (const field of metrics.fieldContrast) {
                  if (!field.labeled) fail(name, theme + ': campo sem nome acessível ' + field.id);
                  const textRatio = contrast(field.foreground, field.background);
                  const placeholderRatio = field.placeholder ? contrast(field.placeholder, field.background) : 21;
                  if (textRatio === null || textRatio < 4.5) fail(name, theme + ': contraste do campo ' + field.id + ' = ' + textRatio);
                  if (placeholderRatio === null || placeholderRatio < 4.5) fail(name, theme + ': contraste do placeholder ' + field.id + ' = ' + placeholderRatio);
                  const surface = luminance(field.background);
                  if (theme === 'light' && (surface === null || surface < 0.75)) fail(name, 'superfície clara do campo ausente: ' + field.id);
                  if (theme === 'dark' && (surface === null || surface > 0.15)) fail(name, 'superfície escura do campo ausente: ' + field.id);
                }
              };
              verifyFields(initial, 'light');
              // The approved two-column entrance scrolls naturally on short screens.
              // Every transactional control must remain reachable and unobscured after scrolling.
              const actionable = page.locator(name === 'login'
                ? '.login-gateway__form input:not([type="checkbox"]), .login-gateway__form button, .login-gateway__forgot, .atelier-login__join, .atelier-login__footer a'
                : '.public-space__surface input:not([type="checkbox"]), .public-space__surface select, .public-space__surface button, .public-space__footer a');
              for (const control of await actionable.all()) {
                if (!await control.isVisible()) continue;
                await control.scrollIntoViewIfNeeded();
                const reachable = await control.evaluate((el) => {
                  const r = el.getBoundingClientRect();
                  const x = Math.min(innerWidth - 1, Math.max(0, r.x + r.width / 2));
                  const y = Math.min(innerHeight - 1, Math.max(0, r.y + r.height / 2));
                  const top = document.elementFromPoint(x, y);
                  return r.width > 0 && r.height > 0 && r.x >= -1 && r.right <= innerWidth + 1
                    && r.bottom > 0 && r.top < innerHeight && Boolean(top && (el.contains(top) || top.contains(el)));
                });
                if (!reachable) fail(name, 'controle inacessível ou encoberto após rolagem');
              }
              await page.evaluate(() => { document.activeElement?.blur(); window.scrollTo({ top: 0, left: 0, behavior: 'instant' }); });
              await page.screenshot({ path: path.join(out, viewportName + '-' + name + '.png'), fullPage: true });
              if (name === 'login') {
                const nativeContract = await page.evaluate(() => ({
                  formCount: document.querySelectorAll('.login-gateway__form').length,
                  validWhenEmpty: document.querySelector('.login-gateway__form').checkValidity(),
                  email: document.querySelector('#email')?.getAttribute('autocomplete'),
                  password: document.querySelector('#senha')?.getAttribute('autocomplete'),
                  recovery: document.querySelector('.login-gateway__forgot')?.getAttribute('href'),
                  join: document.querySelector('.atelier-login__join')?.getAttribute('href'),
                }));
                if (nativeContract.formCount !== 1 || nativeContract.validWhenEmpty || nativeContract.email !== 'username'
                  || nativeContract.password !== 'current-password' || nativeContract.recovery !== '/esqueci-senha'
                  || nativeContract.join !== '/solicitar-acesso') fail(name, 'contrato nativo de autenticação/recuperação alterado');
                for (const target of initial.themeTargets) {
                  if (target.width < 44 || target.height < 44) fail(name, 'seletor de aparência menor que 44px');
                }
                await page.locator('#email').fill('visual-qa@teste.local');
                await page.locator('#senha').fill('somente-verificacao-local');
                await page.getByRole('button', { name: 'Mostrar senha', exact: true }).click();
                if (await page.locator('#senha').getAttribute('type') !== 'text') fail(name, 'mostrar senha não funciona');
                await page.getByRole('button', { name: 'Ocultar senha', exact: true }).click();
                if (await page.locator('#senha').getAttribute('type') !== 'password') fail(name, 'ocultar senha não funciona');
                const light = await capture();
                await page.locator('label:has(input[name="tema-publico"][value="dark"])').click();
                await page.locator('#corvia-login[data-login-theme="dark"]').waitFor();
                const dark = await capture();
                verifyFields(dark, 'dark');
                if (!dark.approvedImage || !dark.approvedLogo) fail(name, 'troca de tema removeu a arquitetura aprovada');
                if (!await page.locator('input[name="tema-publico"][value="dark"]').isChecked()) fail(name, 'radio escuro não anunciou a seleção');
                if (JSON.stringify(light.controls) !== JSON.stringify(dark.controls)) fail(name, 'troca de aparência perdeu campos ou controles');
                for (const selector of paritySelectors) {
                  const a = light.rects[selector], b = dark.rects[selector];
                  if (!a || !b) { fail(name, 'elemento de paridade ausente: ' + selector); continue; }
                  for (const dimension of ['x', 'y', 'width', 'height']) {
                    if (Math.abs(a[dimension] - b[dimension]) > 1.5) fail(name, 'geometria varia por tema: ' + selector + '/' + dimension);
                  }
                  if (b.x < -4 || b.x + b.width > viewport.width + 4 || b.y + b.height > dark.scrollHeight + 4) fail(name, 'elemento fora da área rolável: ' + selector);
                }
                report.themeParity.push({ viewportName, light, dark });
                await page.evaluate(() => { document.activeElement?.blur(); window.scrollTo({ top: 0, left: 0, behavior: 'instant' }); });
                await page.screenshot({ path: path.join(out, viewportName + '-login-dark.png'), fullPage: true });
                await page.reload({ waitUntil: 'networkidle' });
                if (await page.locator('#corvia-login').getAttribute('data-login-theme') !== 'dark') fail(name, 'preferência explícita escura não foi preservada');
                await page.locator('label:has(input[name="tema-publico"][value="light"])').click();
                await page.locator('#corvia-login[data-login-theme="light"]').waitFor();
              }
            }
            await context.close();
          }
          await browser.close();
          if (report.pageErrors.length) report.failures.push(`page errors: ${report.pageErrors.join(' | ')}`);
          fs.writeFileSync(reportPath, JSON.stringify(report, null, 2));
          console.log(JSON.stringify(report, null, 2));
          if (report.failures.length) process.exitCode = 1;
          JS
          cd /tmp/corvia-prehome-qa
          node capture.mjs

      - name: Upload pre-home QA artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: corvia-prehome-canonical-visual-qa
          path: prehome-qa/
          if-no-files-found: error
          retention-days: 14

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose logs --no-color --tail=200 backend
          docker logs corvia-prehome-nginx || true

      - name: Stop isolated stack
        if: always()
        run: |
          docker rm -f corvia-prehome-nginx 2>/dev/null || true
          docker compose down -v --remove-orphans
