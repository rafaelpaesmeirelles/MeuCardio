name: Pre-home Visual QA — Canonical CorVIA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/prehome-visual-qa.yml"
      - "frontend/src/pages/Entrar.tsx"
      - "frontend/src/pages/SolicitarAcesso.tsx"
      - "frontend/src/pages/EsqueciSenha.tsx"
      - "frontend/src/pages/RedefinirSenha.tsx"
      - "frontend/src/components/PreHomeBrand.tsx"
      - "frontend/src/styles/login.css"
      - "frontend/src/styles/login-viewport-refinement.css"
      - "frontend/src/styles/cardiology-spaces-login.css"
      - "frontend/src/main.tsx"

permissions:
  contents: read

jobs:
  prehome-visual-qa:
    name: Login + signup + recovery desktop/mobile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: corvia_prehome_qa
      ENVIRONMENT: test
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: meucardio_prehome
      POSTGRES_PASSWORD: prehome-test
      POSTGRES_DB: meucardio_prehome
      REDIS_URL: redis://redis:6379/0
      STORAGE_ENCRYPTION_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
      JWT_SECRET: chave-prehome-qa-nao-usar-em-producao
      ADMIN_EMAIL: prehome-qa@teste.local
      ADMIN_PASSWORD: prehome-qa-seguro-123
      AI_ENABLED: "false"
      MAIL360_CLIENT_ID: id-de-teste
      MAIL360_CLIENT_SECRET: secret-de-teste
      MAIL360_REFRESH_TOKEN: refresh-de-teste
      CORVIA_MAIL_PRECO_CENTAVOS: "1000"
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_prehome_dummy
      PUBLIC_URL: http://127.0.0.1:8081
      UPLOADS_DIR: /tmp/corvia-prehome/uploads
      EXAMES_DIR: /tmp/corvia-prehome/exames
      DOCUMENTOS_DIR: /tmp/corvia-prehome/documentos

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Create isolated runtime environment
        run: |
          cat > .env <<'ENV'
          COMPOSE_PROJECT_NAME=corvia_prehome_qa
          ENVIRONMENT=test
          POSTGRES_HOST=db
          POSTGRES_PORT=5432
          POSTGRES_USER=meucardio_prehome
          POSTGRES_PASSWORD=prehome-test
          POSTGRES_DB=meucardio_prehome
          REDIS_URL=redis://redis:6379/0
          STORAGE_ENCRYPTION_KEY=MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
          JWT_SECRET=chave-prehome-qa-nao-usar-em-producao
          ADMIN_EMAIL=prehome-qa@teste.local
          ADMIN_PASSWORD=prehome-qa-seguro-123
          AI_ENABLED=false
          MAIL360_CLIENT_ID=id-de-teste
          MAIL360_CLIENT_SECRET=secret-de-teste
          MAIL360_REFRESH_TOKEN=refresh-de-teste
          CORVIA_MAIL_PRECO_CENTAVOS=1000
          STRIPE_SECRET_KEY=sk_test_dummy
          STRIPE_WEBHOOK_SECRET=whsec_prehome_dummy
          PUBLIC_URL=http://127.0.0.1:8081
          UPLOADS_DIR=/tmp/corvia-prehome/uploads
          EXAMES_DIR=/tmp/corvia-prehome/exames
          DOCUMENTOS_DIR=/tmp/corvia-prehome/documentos
          ENV

      - name: Start isolated backend
        run: docker compose up -d --build db redis backend

      - name: Build production frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Serve production build
        run: |
          mkdir -p prehome-qa
          cat > prehome-qa/nginx.conf <<'NGINX'
          server {
            listen 80;
            server_name _;
            root /usr/share/nginx/html;
            index index.html;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            location /api/ {
              proxy_pass http://backend:8000/api/;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Forwarded-Proto $scheme;
            }
            location / { try_files $uri $uri/ /index.html; }
          }
          NGINX
          docker run -d --name corvia-prehome-nginx \
            --network corvia_prehome_qa_default -p 8081:80 \
            -v "$PWD/frontend/dist:/usr/share/nginx/html:ro" \
            -v "$PWD/prehome-qa/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine

      - name: Wait for HTTP readiness
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8081/api/ready >/dev/null \
              && curl --fail --silent http://127.0.0.1:8081/entrar >/dev/null; then exit 0; fi
            sleep 2
          done
          docker compose logs --no-color backend
          docker logs corvia-prehome-nginx || true
          exit 1

      - name: Install isolated Chromium runner
        run: |
          mkdir -p /tmp/corvia-prehome-qa
          cd /tmp/corvia-prehome-qa
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Capture and validate approved pre-home family
        run: |
          mkdir -p prehome-qa/screenshots
          cat > /tmp/corvia-prehome-qa/capture.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import path from 'node:path';

          const base = 'http://127.0.0.1:8081';
          const out = path.join(process.env.GITHUB_WORKSPACE, 'prehome-qa', 'screenshots');
          const reportPath = path.join(process.env.GITHUB_WORKSPACE, 'prehome-qa', 'report.json');
          const routes = [
            ['login', '/entrar'],
            ['cadastro', '/solicitar-acesso'],
            ['esqueci-senha', '/esqueci-senha'],
            ['redefinir-senha', '/redefinir-senha?token=visual-qa-token'],
          ];
          const viewports = [
            ['desktop-amplo-2560x1440', { width: 2560, height: 1440 }],
            ['notebook-1366x768', { width: 1366, height: 768 }],
            ['desktop-intermediario-1366x850', { width: 1366, height: 850 }],
            ['desktop-baixo-1366x640', { width: 1366, height: 640 }],
            ['desktop-critico-1280x600', { width: 1280, height: 600 }],
            ['desktop-1440x900', { width: 1440, height: 900 }],
            ['mobile-390x844', { width: 390, height: 844 }],
          ];
          const browser = await chromium.launch({ headless: true });
          const report = { pages: [], themeParity: [], pageErrors: [], failures: [] };

          function channel(rgb) {
            const m = String(rgb || '').match(/rgba?\((\d+)[, ]+(\d+)[, ]+(\d+)/i);
            return m ? [Number(m[1]), Number(m[2]), Number(m[3])] : null;
          }
          function luminance(rgb) {
            const c = channel(rgb); if (!c) return null;
            const linear = c.map((value) => { const s = value / 255; return s <= 0.03928 ? s / 12.92 : ((s + 0.055) / 1.055) ** 2.4; });
            return 0.2126 * linear[0] + 0.7152 * linear[1] + 0.0722 * linear[2];
          }

          for (const [viewportName, viewport] of viewports) {
            const context = await browser.newContext({ viewport, colorScheme: 'dark', locale: 'pt-BR' });
            const page = await context.newPage();
            page.on('pageerror', (error) => report.pageErrors.push(`${viewportName}: ${String(error)}`));
            for (const [name, route] of routes) {
              await page.goto(`${base}${route}`, { waitUntil: 'networkidle' });
              await page.waitForTimeout(350);
              const metrics = await page.evaluate(({ viewportName, pageName }) => {
                const visible = (selector) => {
                  const element = document.querySelector(selector); if (!element) return false;
                  const style = getComputedStyle(element); const rect = element.getBoundingClientRect();
                  return style.display !== 'none' && style.visibility !== 'hidden' && rect.width > 0 && rect.height > 0;
                };
                const rect = (selector) => {
                  const element = document.querySelector(selector); if (!element) return null;
                  const value = element.getBoundingClientRect();
                  return { x:value.x, y:value.y, width:value.width, height:value.height, right:value.right, bottom:value.bottom };
                };
                const intersects = (first, second) => Boolean(
                  first && second
                  && first.x < second.right && first.right > second.x
                  && first.y < second.bottom && first.bottom > second.y
                );
                const isLogin = pageName === 'login';
                const selectors = isLogin ? {
                  root: '.login-gateway',
                  panel: '.login-gateway__console',
                  brand: '.login-gateway__scene',
                  logo: '.login-gateway__brand',
                  hero: '.login-gateway__core .prehome-brand__heart',
                } : {
                  root: '.public-space',
                  panel: '.public-space__surface',
                  brand: '.public-space__context',
                  logo: '.public-corvia-brand',
                  hero: '.public-space__signal',
                };
                const sample = document.querySelector(selectors.panel);
                const heart = rect('.login-gateway__core .prehome-brand__heart');
                const ensino = rect('.login-gateway__space--ensino');
                const style = sample ? getComputedStyle(sample) : null;
                return {
                  width: innerWidth, height: innerHeight,
                  scrollWidth: document.documentElement.scrollWidth,
                  scrollHeight: document.documentElement.scrollHeight,
                  isLogin,
                  loginTheme: isLogin ? document.querySelector('.login-gateway')?.getAttribute('data-login-theme') || '' : null,
                  sampleVisible: visible(selectors.panel), brandVisible: visible(selectors.brand),
                  sampleBackground: style?.backgroundColor || '',
                  canonicalMain: visible(selectors.root), logo: visible(selectors.logo),
                  heroVisual: visible(selectors.hero),
                  rootRect: rect(selectors.root),
                  panelRect: rect(selectors.panel),
                  footerRect: rect('.login-gateway__footer'),
                  utilitiesRect: rect('.login-gateway__utilities'),
                  metaRect: rect('.login-gateway__form-meta'),
                  headingRect: rect('.login-gateway__hero h1'),
                  sceneRect: rect('.login-gateway__scene'),
                  heartOverlapsEnsino: intersects(heart, ensino),
                  isMobile: viewportName.startsWith('mobile'), bodyText: document.body?.innerText || '',
                };
              }, { viewportName, pageName: name });
              const sampleLum = luminance(metrics.sampleBackground);
              report.pages.push({ viewportName, name, route, ...metrics, bodyText: undefined, sampleLuminance: sampleLum });
              if (metrics.scrollWidth > metrics.width + 4) report.failures.push(`${viewportName}/${name}: overflow horizontal ${metrics.scrollWidth}px > ${metrics.width}px`);
              if (!metrics.sampleVisible) report.failures.push(`${viewportName}/${name}: painel transacional não renderizou`);
              if (!metrics.brandVisible) report.failures.push(`${viewportName}/${name}: área conceitual não renderizou`);
              if (!metrics.logo) report.failures.push(`${viewportName}/${name}: marca CorVIA não está visível`);
              if (!metrics.canonicalMain) report.failures.push(`${viewportName}/${name}: shell público canônico ausente`);
              if ((metrics.isLogin ? !metrics.isMobile : true) && !metrics.heroVisual) report.failures.push(`${viewportName}/${name}: elemento visual central ausente`);
              if (metrics.isLogin && !metrics.isMobile && metrics.heartOverlapsEnsino) report.failures.push(`${viewportName}/${name}: coração conflita geometricamente com o espaço Ensino`);
              if (metrics.isLogin && !metrics.isMobile) {
                if (metrics.scrollHeight > metrics.height + 2) report.failures.push(`${viewportName}/${name}: login excede verticalmente a área útil ${metrics.scrollHeight}px > ${metrics.height}px`);
                for (const [part, bounds] of [['raiz', metrics.rootRect], ['console', metrics.panelRect], ['rodapé', metrics.footerRect], ['utilidades', metrics.utilitiesRect], ['metadados', metrics.metaRect]]) {
                  if (!bounds || bounds.y < -1 || bounds.bottom > metrics.height + 1) report.failures.push(`${viewportName}/${name}: ${part} fora da área útil ${JSON.stringify(bounds)}`);
                }
                if (!metrics.headingRect || !metrics.sceneRect || metrics.headingRect.x < metrics.sceneRect.x - 1 || metrics.headingRect.right > metrics.sceneRect.right + 1 || metrics.headingRect.y < metrics.sceneRect.y - 1) report.failures.push(`${viewportName}/${name}: título principal cortado ${JSON.stringify({ heading:metrics.headingRect, scene:metrics.sceneRect })}`);
              }
              if (metrics.isLogin && metrics.loginTheme !== 'dark') report.failures.push(`${viewportName}/${name}: o tema escuro tradicional não é o padrão (${metrics.loginTheme || 'ausente'})`);
              if (sampleLum !== null && sampleLum > 0.15) report.failures.push(`${viewportName}/${name}: painel claro/genérico detectado (luminância=${sampleLum.toFixed(3)})`);
              if (!/CorVIA/i.test(metrics.bodyText)) report.failures.push(`${viewportName}/${name}: identidade CorVIA ausente no texto visível`);
              await page.screenshot({ path: path.join(out, `${viewportName}-${name}.png`), fullPage: false });

              if (metrics.isLogin) {
                const paritySelectors = [
                  '.login-gateway', '.login-gateway__topbar', '.login-gateway__scene',
                  '.login-gateway__hero h1', '.login-gateway__core',
                  '.login-gateway__space--consultorio', '.login-gateway__space--hospital',
                  '.login-gateway__space--ensino', '.login-gateway__space--pesquisa',
                  '.login-gateway__space--gestao', '.login-gateway__console',
                  '.login-gateway__console-head', '.login-gateway__theme-choice',
                  '.login-gateway__form', '.login-gateway__footer',
                  '.login-gateway__form-meta', '.login-gateway__utilities',
                ];
                const captureThemeContract = () => page.evaluate((selectors) => {
                  const rects = Object.fromEntries(selectors.map((selector) => {
                    const element = document.querySelector(selector);
                    if (!element) return [selector, null];
                    const value = element.getBoundingClientRect();
                    return [selector, { x:value.x, y:value.y, width:value.width, height:value.height }];
                  }));
                  const controls = [...document.querySelectorAll('a, button, input')].map((element) => ({
                    tag: element.tagName.toLocaleLowerCase('pt-BR'),
                    type: element instanceof HTMLInputElement || element instanceof HTMLButtonElement ? element.type : '',
                    name: element instanceof HTMLInputElement ? element.name : '',
                    value: element instanceof HTMLInputElement ? element.value : '',
                    label: element.getAttribute('aria-label') || element.getAttribute('placeholder') || element.textContent?.trim() || '',
                    disabled: 'disabled' in element ? Boolean(element.disabled) : false,
                  }));
                  const panel = document.querySelector('.login-gateway__console');
                  return {
                    theme: document.querySelector('.login-gateway')?.getAttribute('data-login-theme') || '',
                    scrollWidth: document.documentElement.scrollWidth,
                    scrollHeight: document.documentElement.scrollHeight,
                    panelBackground: panel ? getComputedStyle(panel).backgroundColor : '',
                    rects,
                    controls,
                  };
                }, paritySelectors);
                const darkContract = await captureThemeContract();
                const lightThemeInput = page.locator('input[name="tema-publico"][value="light"]');
                await page.locator('label:has(input[name="tema-publico"][value="light"])').click();
                await page.locator('.login-gateway[data-login-theme="light"]').waitFor();
                await page.waitForTimeout(120);
                const lightContract = await captureThemeContract();
                const lightLuminance = luminance(lightContract.panelBackground);
                report.themeParity.push({ viewportName, dark: darkContract, light: lightContract, lightPanelLuminance: lightLuminance });
                if (lightContract.theme !== 'light') report.failures.push(`${viewportName}/${name}: seleção do tema claro não foi aplicada`);
                if (!await lightThemeInput.isChecked()) report.failures.push(`${viewportName}/${name}: rádio do tema claro não refletiu a seleção`);
                if (lightLuminance === null || lightLuminance < 0.75) report.failures.push(`${viewportName}/${name}: superfície clara não ficou inequivocamente clara (${lightLuminance})`);
                if (JSON.stringify(darkContract.controls) !== JSON.stringify(lightContract.controls)) report.failures.push(`${viewportName}/${name}: funções ou controles divergem entre claro e escuro`);
                if (darkContract.scrollWidth !== lightContract.scrollWidth || darkContract.scrollHeight !== lightContract.scrollHeight) report.failures.push(`${viewportName}/${name}: dimensões do documento divergem entre claro e escuro`);
                for (const selector of paritySelectors) {
                  const darkRect = darkContract.rects[selector];
                  const lightRect = lightContract.rects[selector];
                  if (!darkRect || !lightRect) {
                    report.failures.push(`${viewportName}/${name}: elemento de paridade ausente ${selector}`);
                    continue;
                  }
                  const drift = Math.max(...['x', 'y', 'width', 'height'].map((key) => Math.abs(darkRect[key] - lightRect[key])));
                  if (drift > 0.75) report.failures.push(`${viewportName}/${name}: geometria diverge entre claro e escuro em ${selector} (${drift.toFixed(2)}px)`);
                }
                await page.screenshot({ path: path.join(out, `${viewportName}-${name}-light.png`), fullPage: false });
              }
            }
            await context.close();
          }
          await browser.close();
          if (report.pageErrors.length) report.failures.push(`page errors: ${report.pageErrors.join(' | ')}`);
          fs.writeFileSync(reportPath, JSON.stringify(report, null, 2));
          console.log(JSON.stringify(report, null, 2));
          if (report.failures.length) process.exitCode = 1;
          JS
          cd /tmp/corvia-prehome-qa
          node capture.mjs

      - name: Upload pre-home QA artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: corvia-prehome-canonical-visual-qa
          path: prehome-qa/
          if-no-files-found: error
          retention-days: 14

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose logs --no-color --tail=200 backend
          docker logs corvia-prehome-nginx || true

      - name: Stop isolated stack
        if: always()
        run: |
          docker rm -f corvia-prehome-nginx 2>/dev/null || true
          docker compose down -v --remove-orphans
