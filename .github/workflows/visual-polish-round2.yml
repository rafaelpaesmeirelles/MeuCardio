name: Visual polish round 2

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/visual-polish-round2.yml"

permissions:
  contents: read

jobs:
  visual-polish:
    if: github.event.pull_request.head.ref == 'ui/polish-round2-20260821'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COMPOSE_PROJECT_NAME: corvia_visual_polish
      ENVIRONMENT: test
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: meucardio_polish
      POSTGRES_PASSWORD: polish-test
      POSTGRES_DB: meucardio_polish
      REDIS_URL: redis://redis:6379/0
      STORAGE_ENCRYPTION_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
      JWT_SECRET: chave-polish-qa-nao-usar-em-producao
      ADMIN_EMAIL: polish-qa@teste.local
      ADMIN_PASSWORD: polish-qa-seguro-123
      AI_ENABLED: "false"
      MAIL360_CLIENT_ID: id-de-teste
      MAIL360_CLIENT_SECRET: secret-de-teste
      MAIL360_REFRESH_TOKEN: refresh-de-teste
      CORVIA_MAIL_PRECO_CENTAVOS: "1000"
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_polish_dummy
      PUBLIC_URL: http://127.0.0.1:8080
      UPLOADS_DIR: /tmp/corvia-polish/uploads
      EXAMES_DIR: /tmp/corvia-polish/exames-pacientes
      DOCUMENTOS_DIR: /tmp/corvia-polish/documentos-emitidos

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Create isolated environment
        run: |
          cat > .env <<'ENV'
          COMPOSE_PROJECT_NAME=corvia_visual_polish
          ENVIRONMENT=test
          POSTGRES_HOST=db
          POSTGRES_PORT=5432
          POSTGRES_USER=meucardio_polish
          POSTGRES_PASSWORD=polish-test
          POSTGRES_DB=meucardio_polish
          REDIS_URL=redis://redis:6379/0
          STORAGE_ENCRYPTION_KEY=MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
          JWT_SECRET=chave-polish-qa-nao-usar-em-producao
          ADMIN_EMAIL=polish-qa@teste.local
          ADMIN_PASSWORD=polish-qa-seguro-123
          AI_ENABLED=false
          MAIL360_CLIENT_ID=id-de-teste
          MAIL360_CLIENT_SECRET=secret-de-teste
          MAIL360_REFRESH_TOKEN=refresh-de-teste
          CORVIA_MAIL_PRECO_CENTAVOS=1000
          STRIPE_SECRET_KEY=sk_test_dummy
          STRIPE_WEBHOOK_SECRET=whsec_polish_dummy
          PUBLIC_URL=http://127.0.0.1:8080
          UPLOADS_DIR=/tmp/corvia-polish/uploads
          EXAMES_DIR=/tmp/corvia-polish/exames-pacientes
          DOCUMENTOS_DIR=/tmp/corvia-polish/documentos-emitidos
          ENV

      - name: Start isolated backend
        run: docker compose up -d --build db redis backend

      - name: Build production frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Serve production build
        run: |
          mkdir -p visual-polish-qa
          cat > visual-polish-qa/nginx.conf <<'NGINX'
          server {
            listen 80;
            server_name _;
            root /usr/share/nginx/html;
            index index.html;
            location /api/ {
              proxy_pass http://backend:8000/api/;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_buffering off;
            }
            location / { try_files $uri $uri/ /index.html; }
          }
          NGINX
          docker run -d --name corvia-visual-polish-nginx --network corvia_visual_polish_default -p 8080:80 \
            -v "$PWD/frontend/dist:/usr/share/nginx/html:ro" \
            -v "$PWD/visual-polish-qa/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.27-alpine
          for attempt in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8080/api/ready >/dev/null && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/api/ready >/dev/null

      - name: Create QA administrator
        run: |
          docker compose exec -T backend python -m app.commands.create_admin \
            --email polish-qa@teste.local --password polish-qa-seguro-123 --name "Dr. Visual Polish"

      - name: Install Chromium
        run: |
          mkdir -p /tmp/corvia-visual-polish && cd /tmp/corvia-visual-polish
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Capture audited surfaces
        run: |
          mkdir -p visual-polish-qa/screenshots
          cat > /tmp/corvia-visual-polish/capture.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import path from 'node:path';

          const base = 'http://127.0.0.1:8080';
          const out = path.join(process.env.GITHUB_WORKSPACE, 'visual-polish-qa', 'screenshots');
          const reportPath = path.join(process.env.GITHUB_WORKSPACE, 'visual-polish-qa', 'report.json');
          fs.mkdirSync(out, { recursive: true });
          const browser = await chromium.launch({ headless: true });
          const report = { pages: [], failures: [], pageErrors: [] };
          const routes = [
            ['home', '/'], ['prescricao', '/receituario'], ['agenda', '/agenda'],
            ['mail', '/corvia-mail'], ['sincronizacao', '/sincronizacao'],
            ['minha-conta', '/minha-conta'], ['tour', '/tour'],
            ['termos', '/termos'], ['privacidade', '/privacidade'],
          ];

          async function authenticated(viewport) {
            const context = await browser.newContext({ viewport, colorScheme: 'dark', locale: 'pt-BR' });
            const page = await context.newPage();
            page.on('pageerror', (error) => report.pageErrors.push(String(error)));
            await page.goto(`${base}/entrar`, { waitUntil: 'networkidle' });
            await page.locator('#email').fill('polish-qa@teste.local');
            await page.locator('#senha').fill('polish-qa-seguro-123');
            await page.locator('button[type="submit"]').click();
            await page.waitForURL((url) => !url.pathname.includes('/entrar'), { timeout: 20000 });
            return { context, page };
          }

          async function capture(page, mode, name, route) {
            await page.goto(`${base}${route}`, { waitUntil: 'networkidle' });
            await page.waitForTimeout(900);
            if (name === 'agenda') {
              const button = page.getByRole('button', { name: /configurar/i }).first();
              if (await button.isVisible().catch(() => false)) {
                await button.click();
                await page.waitForTimeout(350);
              }
            }
            const metrics = await page.evaluate(() => {
              const rects = [...document.querySelectorAll('.cartao')].map((el) => el.getBoundingClientRect());
              const tinyText = [...document.querySelectorAll('p,label,button,input,select,textarea')]
                .filter((el) => {
                  const s = getComputedStyle(el);
                  const r = el.getBoundingClientRect();
                  return r.width > 0 && r.height > 0 && parseFloat(s.fontSize) < 9;
                }).length;
              const overflowingCards = rects.filter((r) => r.right > innerWidth + 2 || r.left < -2).length;
              return {
                path: location.pathname,
                width: innerWidth,
                scrollWidth: document.documentElement.scrollWidth,
                height: innerHeight,
                scrollHeight: document.documentElement.scrollHeight,
                tinyText,
                overflowingCards,
                legalLogo: document.querySelector('.legal-page > header img')?.getAttribute('src') || null,
              };
            });
            report.pages.push({ mode, name, ...metrics });
            if (metrics.scrollWidth > metrics.width + 2) report.failures.push(`${mode}/${name}: horizontal overflow ${metrics.scrollWidth}>${metrics.width}`);
            if (metrics.overflowingCards) report.failures.push(`${mode}/${name}: ${metrics.overflowingCards} card(s) outside viewport`);
            if ((name === 'termos' || name === 'privacidade') && metrics.legalLogo !== '/corvia-logo-canonical-dark.svg') report.failures.push(`${mode}/${name}: noncanonical logo`);
            await page.screenshot({ path: path.join(out, `${mode}-${name}.png`), fullPage: true });
          }

          for (const [mode, viewport, selected] of [
            ['desktop', { width: 1440, height: 900 }, routes],
            ['notebook', { width: 1280, height: 720 }, routes],
            ['mobile', { width: 390, height: 844 }, routes],
          ]) {
            const { context, page } = await authenticated(viewport);
            for (const [name, route] of selected) await capture(page, mode, name, route);
            await context.close();
          }

          await browser.close();
          fs.writeFileSync(reportPath, JSON.stringify(report, null, 2));
          console.log(JSON.stringify(report, null, 2));
          if (report.pageErrors.length || report.failures.length) process.exit(1);
          JS
          cd /tmp/corvia-visual-polish
          node capture.mjs

      - name: Upload visual polish artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-polish-round2
          path: visual-polish-qa/
          if-no-files-found: error
          retention-days: 7

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=250 backend || true
          docker logs corvia-visual-polish-nginx || true

      - name: Stop isolated stack
        if: always()
        run: |
          docker rm -f corvia-visual-polish-nginx >/dev/null 2>&1 || true
          docker compose down -v --remove-orphans
