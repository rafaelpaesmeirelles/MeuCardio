name: CorVIA Intelligence — Scientific radar

on:
  schedule:
    # O runner acorda de hora em hora; o backend decide se faz varredura completa:
    # - dias normais: a cada 4h;
    # - congressos/janelas de publicação: 1/1h;
    # - pico recente de publicações confiáveis: 1/1h até o pico arrefecer.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: corvia-intelligence-scientific-radar
  cancel-in-progress: false

jobs:
  discover:
    name: Discover new official cardiovascular publications
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
      SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
      SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
    steps:
      - name: Resolve exact current main SHA
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha="$(gh api "repos/${REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "CorVIA Intelligence target: $sha"

      - name: Run CorVIA Intelligence inside the deployed production backend
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Missing PRODUCTION_SSH_HOST}"
          : "${SSH_USER:?Missing PRODUCTION_SSH_USER}"
          : "${SSH_PRIVATE_KEY:?Missing PRODUCTION_SSH_PRIVATE_KEY}"
          : "${SSH_KNOWN_HOSTS:?Missing PRODUCTION_SSH_KNOWN_HOSTS}"
          : "${TARGET_SHA:?Missing current main SHA}"
          SSH_PORT="${SSH_PORT:-22}"

          request="intelligence"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            request="intelligence-force"
          fi

          ssh_dir="$RUNNER_TEMP/corvia-intelligence-ssh"
          install -m 0700 -d "$ssh_dir"
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$ssh_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 0600 "$ssh_dir/key" "$ssh_dir/known_hosts"

          ssh \
            -p "$SSH_PORT" \
            -i "$ssh_dir/key" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=5 \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$ssh_dir/known_hosts" \
            "$SSH_USER@$SSH_HOST" \
            "$request $TARGET_SHA"
