name: Temporary add ALI emergency entry

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  add-ali-emergency:
    if: github.event.pull_request.head.ref == 'content/dap-claudicacao-isquemia-membro-20260821'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Append ALI emergency record with referential guards
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = Path('emergencia/metadados.json')
          data = json.loads(manifest.read_text(encoding='utf-8'))
          if not isinstance(data, list):
              raise SystemExit('emergency manifest must be a JSON list')

          slug = 'isquemia-aguda-de-membro'
          if any(isinstance(x, dict) and x.get('slug') == slug for x in data):
              raise SystemExit(f'emergency slug already exists: {slug}')

          orders = [x.get('ordem') for x in data if isinstance(x, dict) and isinstance(x.get('ordem'), int)]
          if not orders or max(orders) != 121:
              raise SystemExit(f'unexpected current max ordem: {max(orders) if orders else None}; rebase/review required')

          doc_slug = 'isquemia-aguda-de-membro-classificacao-de-rutherford-e-conduta'
          flow_slug = 'fluxograma-isquemia-aguda-de-membro-rutherford-2024'
          docs = list(Path('content').rglob('*.md'))
          doc_slugs = set()
          for p in docs:
              text = p.read_text(encoding='utf-8', errors='ignore')
              for line in text.splitlines()[:30]:
                  if line.startswith('slug:'):
                      doc_slugs.add(line.split(':', 1)[1].strip().strip('"\''))
                      break
          if doc_slug not in doc_slugs:
              raise SystemExit(f'missing documento_slug target: {doc_slug}')
          if flow_slug not in doc_slugs:
              raise SystemExit(f'missing fluxograma_slug target: {flow_slug}')

          related = [
              'fibrilacao-atrial-de-alta-resposta',
              'sindrome-aortica-aguda',
              'endocardite-infecciosa-com-instabilidade-ou-complicacao-aguda',
          ]
          emergency_slugs = {x.get('slug') for x in data if isinstance(x, dict)}
          missing_related = [x for x in related if x not in emergency_slugs]
          if missing_related:
              raise SystemExit(f'missing related emergency slugs: {missing_related}')

          record = {
              'slug': slug,
              'titulo': 'Isquemia aguda de membro',
              'gatilho': 'Dor súbita em membro com palidez/frialdade, pulso abruptamente reduzido ou ausente, parestesia ou déficit motor — suspeita de ameaça à viabilidade do membro',
              'ordem': 122,
              'documento_slug': doc_slug,
              'fluxograma_slug': flow_slug,
              'relacionados': related,
              'review_status': 'revisado',
          }

          # Preserve the pre-existing manifest formatting byte-for-byte and append only one object.
          raw = manifest.read_text(encoding='utf-8').rstrip()
          if not raw.endswith(']'):
              raise SystemExit('manifest does not end in ]')
          prefix = raw[:-1].rstrip()
          rec = json.dumps(record, ensure_ascii=False, indent=2)
          rec = '  ' + rec.replace('\n', '\n  ')
          new_raw = prefix + ',\n' + rec + '\n]\n'

          parsed = json.loads(new_raw)
          if parsed != data + [record]:
              raise SystemExit('semantic round-trip mismatch')
          slugs = [x.get('slug') for x in parsed if isinstance(x, dict)]
          if len(slugs) != len(set(slugs)):
              raise SystemExit('duplicate emergency slugs after append')

          manifest.write_text(new_raw, encoding='utf-8')
          print(json.dumps({'added': slug, 'ordem': 122, 'total': len(parsed)}, ensure_ascii=False))
          PY
          git diff --check

      - name: Commit emergency manifest and remove temporary workflow
        run: |
          rm .github/workflows/tmp-add-ali-emergency.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add emergencia/metadados.json .github/workflows/tmp-add-ali-emergency.yml
          git commit -m "content: connect acute limb ischemia to emergency mode"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
