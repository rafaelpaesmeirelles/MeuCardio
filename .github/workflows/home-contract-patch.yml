name: Patch Home catalog contract

on:
  push:
    branches:
      - agent/clinical-command-center-full-ui
    paths:
      - .github/workflows/home-contract-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/clinical-command-center-full-ui
          fetch-depth: 0
      - name: Restore canonical catalog wording on Home
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/pages/PainelClinicalOS.tsx')
          text = path.read_text(encoding='utf-8')
          old = 'conteúdos conectados no catálogo'
          new = 'conteúdos no catálogo'
          if old not in text:
              raise SystemExit('Texto esperado da Home não encontrado; abortando sem escrever.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name "CorVIA CI"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/src/pages/PainelClinicalOS.tsx
          git commit -m "fix(home): restore canonical catalog wording"
          git push origin HEAD:agent/clinical-command-center-full-ui
