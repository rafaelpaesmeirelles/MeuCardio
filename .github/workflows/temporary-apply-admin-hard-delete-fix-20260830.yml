name: Temporary apply admin hard-delete fix

on:
  push:
    branches: [fix/admin-hard-delete-20260830]

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/admin-hard-delete-20260830
          fetch-depth: 1
      - name: Patch account erasure flow
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          backend = Path('backend/app/api/admin_user_management.py')
          text = backend.read_text(encoding='utf-8')
          marker = 'ACCOUNT_ERASURE_TOMBSTONE_V1'
          if marker in text:
              print('account erasure fix already applied')
          else:
              text = text.replace('import logging\n', 'import logging\nimport secrets\n', 1)
              text = text.replace(
                  'from sqlalchemy import delete, inspect, text, update\n',
                  'from sqlalchemy import MetaData, Table, delete, inspect, text, update\n',
                  1,
              )

              start = text.index('def _preparar_referencias_para_exclusao')
              end = text.index('@router.delete("/{user_id}")', start)
              replacement = '''# ACCOUNT_ERASURE_TOMBSTONE_V1\ndef _desvincular_referencias_anulaveis(db: Session, user_id: int) -> None:\n    """Anonimiza proveniência opcional sem destruir histórico compartilhado.\n\n    A exclusão administrativa não pode apagar prontuários/documentos de outro\n    controlador só porque o usuário excluído aparece como revisor/autor. Toda\n    FK anulável para ``users.id`` é, portanto, desidentificada. Referências\n    não anuláveis permanecem apontando para o tombstone sem PII.\n    """\n    bind = db.get_bind()\n    inspector = inspect(bind)\n    metadata = MetaData()\n    reflected: dict[str, Table] = {}\n    for table_name in inspector.get_table_names():\n        columns = {item["name"]: item for item in inspector.get_columns(table_name)}\n        for fk in inspector.get_foreign_keys(table_name):\n            if fk.get("referred_table") != "users" or fk.get("referred_columns") != ["id"]:\n                continue\n            constrained = fk.get("constrained_columns") or []\n            if len(constrained) != 1:\n                continue\n            column_name = constrained[0]\n            if not columns.get(column_name, {}).get("nullable"):\n                continue\n            table = reflected.get(table_name)\n            if table is None:\n                table = Table(table_name, metadata, autoload_with=bind)\n                reflected[table_name] = table\n            db.execute(\n                update(table)\n                .where(table.c[column_name] == user_id)\n                .values({column_name: None})\n            )\n\n\ndef _apagar_linha_privada_se_existir(\n    db: Session, table_name: str, column_name: str, user_id: int, nomes: set[str]\n) -> None:\n    if table_name not in nomes:\n        return\n    table = Table(table_name, MetaData(), autoload_with=db.get_bind())\n    if column_name not in table.c:\n        return\n    db.execute(delete(table).where(table.c[column_name] == user_id))\n\n\ndef _preparar_referencias_para_exclusao(db: Session, user_id: int) -> None:\n    # Política alinhada à página pública /excluir-conta: elimina credenciais e\n    # identidade da conta; histórico que precise sobreviver fica desidentificado.\n    _desvincular_referencias_anulaveis(db, user_id)\n    nomes = set(inspect(db.get_bind()).get_table_names())\n\n    # Dados de identidade/autenticação não têm motivo para sobreviver ao\n    # encerramento definitivo da conta. Os dados clínicos históricos não são\n    # varridos indiscriminadamente: podem ter dever de retenção e permanecerão\n    # ligados somente ao tombstone sem PII.\n    for table_name, column_name in (\n        ("account_recovery_emails", "user_id"),\n        ("password_reset_tokens", "user_id"),\n        ("kyc_requirement_waivers", "owner_id"),\n        ("kyc_verifications", "owner_id"),\n        ("google_test_user_requests", "user_id"),\n    ):\n        _apagar_linha_privada_se_existir(db, table_name, column_name, user_id, nomes)\n\n    # Histórico financeiro ativo é bloqueado antes desta etapa. Assinaturas\n    # legadas/inativas e a caixa local deixam de identificar a conta removida.\n    db.execute(delete(Subscription).where(Subscription.user_id == user_id))\n    db.execute(delete(EmailAccount).where(EmailAccount.user_id == user_id))\n\n\ndef _anonimizar_usuario_excluido(alvo: User) -> None:\n    """Transforma a linha referencial em tombstone impossível de autenticar.\n\n    Manter o id evita quebrar FKs históricas não anuláveis; nenhum dado\n    cadastral ou credencial do titular permanece nessa linha.\n    """\n    agora = datetime.now(timezone.utc)\n    alvo.email = f"excluido-{alvo.id}@deleted.corvia.invalid"\n    alvo.full_name = "Conta excluída"\n    alvo.password_hash = hash_password(secrets.token_urlsafe(48))\n    alvo.role = "leitor"\n    alvo.is_active = False\n    alvo.status = "excluido"\n    alvo.sessions_valid_after = agora\n    alvo.active_session_id = None\n    alvo.convidado = False\n    alvo.investidor = False\n    alvo.profile_completion_required = False\n    alvo.boas_vindas_pendente = False\n    alvo.onboarding_visto = True\n\n    nullable_personal = (\n        "birth_date", "cpf", "profession", "council_name", "council_number",\n        "council_state", "council_name_other", "council_state_other",\n        "specialty", "rqe", "professional_title", "workplace_name",\n        "workplace_department", "workplace_role", "workplace_notes",\n        "photo_url", "crm", "document_logo_url", "home_street", "home_number",\n        "home_complement", "home_neighborhood", "home_city", "home_state",\n        "home_zip", "practice_street", "practice_number", "practice_complement",\n        "practice_neighborhood", "practice_city", "practice_state",\n        "practice_zip", "practice_phone", "reviewed_by", "reviewed_at",\n        "rejection_note", "convidado_plano_preferido", "last_seen_at",\n        "assinatura_metodo_preferido", "ia_ferramentas_consent_em",\n        "ia_ferramentas_consent_versao", "email_conta_padrao_envio",\n        "instagram_handle", "instagram_photo_url",\n    )\n    for attr in nullable_personal:\n        if hasattr(alvo, attr):\n            setattr(alvo, attr, None)\n\n    for attr in (\n        "include_workplace_on_documents", "show_online_status",\n        "email_assinatura_ativa", "email_assinatura_digital_ativa",\n        "email_assinatura_incluir_telefone", "email_assinatura_incluir_endereco",\n    ):\n        if hasattr(alvo, attr):\n            setattr(alvo, attr, False)\n\n\ndef _validar_exclusao_local(db: Session, user_id: int) -> None:\n    # SAVEPOINT: prova o erase/anonymize local antes de tocar no Mail360.\n    nested = db.begin_nested()\n    try:\n        _preparar_referencias_para_exclusao(db, user_id)\n        alvo = db.get(User, user_id)\n        if alvo:\n            _anonimizar_usuario_excluido(alvo)\n        db.flush()\n    except IntegrityError as exc:\n        nested.rollback()\n        db.rollback()\n        log.warning("Exclusão de user_id=%s bloqueada por dependência: %s", user_id, exc)\n        raise HTTPException(\n            status_code=409,\n            detail="A conta possui uma dependência incompatível com a política de exclusão. Nada foi apagado.",\n        ) from exc\n    else:\n        nested.rollback()\n        db.rollback()\n\n\n'''
              text = text[:start] + replacement + text[end:]

              route_start = text.index('@router.delete("/{user_id}")')
              route = text[route_start:]
              route = route.replace('admin=Depends(require_admin),', 'owner=Depends(require_owner_admin),', 1)
              route = route.replace('_pode_excluir(db, alvo, admin)', '_pode_excluir(db, alvo, owner)', 1)
              route = route.replace(
                  '''    _preparar_referencias_para_exclusao(db, user_id)\n    alvo = db.get(User, user_id)\n    if not alvo:\n        raise HTTPException(status_code=409, detail="A conta mudou durante a exclusão; recarregue e tente novamente.")\n    db.delete(alvo)\n    db.add(AuditLog(\n        user_id=admin.id,\n''',
                  '''    _preparar_referencias_para_exclusao(db, user_id)\n    alvo = db.get(User, user_id)\n    if not alvo or alvo.status == "excluido":\n        raise HTTPException(status_code=409, detail="A conta mudou durante a exclusão; recarregue e tente novamente.")\n    _anonimizar_usuario_excluido(alvo)\n    db.add(AuditLog(\n        user_id=owner.id,\n''',
                  1,
              )
              route = route.replace(
                  'log.critical("Corrida na exclusão definitiva de user_id=%s após Mail360: %s", user_id, exc)',
                  'log.critical("Falha na conclusão da exclusão definitiva de user_id=%s após Mail360: %s", user_id, exc)',
                  1,
              )
              route = route.replace(
                  '''        "corvia_mail_endereco": mail_address,\n    }\n''',
                  '''        "corvia_mail_endereco": mail_address,\n        "dados_cadastrais_anonimizados": True,\n    }\n''',
                  1,
              )
              text = text[:route_start] + route
              backend.write_text(text, encoding='utf-8')

          admin = Path('backend/app/api/admin.py')
          a = admin.read_text(encoding='utf-8')
          if '# ACCOUNT_ERASURE_HIDE_TOMBSTONES_V1' not in a:
              p1 = a.index('@router.get("/users")')
              p2 = a.find('@router.', p1 + 10)
              seg = a[p1:p2]
              seg = seg.replace('    q = db.query(User)\n', '    # ACCOUNT_ERASURE_HIDE_TOMBSTONES_V1\n    q = db.query(User).filter(User.status != "excluido")\n', 1)
              a = a[:p1] + seg + a[p2:]

              p1 = a.index('@router.get("/usuarios")')
              p2 = a.find('@router.', p1 + 10)
              if p2 == -1:
                  p2 = len(a)
              seg = a[p1:p2]
              seg = seg.replace('    query = db.query(User)\n', '    query = db.query(User).filter(User.status != "excluido")\n', 1)
              a = a[:p1] + seg + a[p2:]
              admin.write_text(a, encoding='utf-8')

          frontend = Path('frontend/src/pages/AdminGerenciarUsuario.tsx')
          f = frontend.read_text(encoding='utf-8')
          old = '''          Esta ação é irreversível. Remove a conta local e, se houver, a caixa nativa do CorVIA Mail.\n          Contas administrativas e qualquer conta com cobrança Stripe relevante são bloqueadas.\n'''
          new = '''          Esta ação é irreversível. Remove o acesso, as credenciais e os dados cadastrais da conta e, se houver, a caixa nativa do CorVIA Mail.\n          Registros históricos que precisem ser conservados ficam desidentificados, sem manter os dados cadastrais do titular.\n          Contas administrativas e qualquer conta com cobrança Stripe relevante são bloqueadas.\n'''
          if old in f:
              frontend.write_text(f.replace(old, new, 1), encoding='utf-8')

          test = Path('backend/tests/test_admin_user_management_erasure.py')
          test.write_text('''from types import SimpleNamespace\n\nfrom app.api.admin_user_management import _anonimizar_usuario_excluido\n\n\ndef _target():\n    return SimpleNamespace(\n        id=42, email="pessoa@example.com", full_name="Pessoa Real", password_hash="hash-antigo",\n        role="medico", is_active=True, status="aprovado", sessions_valid_after=None, active_session_id="sessao",\n        convidado=True, investidor=False, profile_completion_required=True, boas_vindas_pendente=True, onboarding_visto=False,\n        birth_date="1980-01-01", cpf="123", profession="Médico", council_name="CRM", council_number="1", council_state="SP",\n        council_name_other=None, council_state_other=None, specialty="Cardiologia", rqe="1", professional_title="Dr.",\n        workplace_name="Clínica", workplace_department="Cardio", workplace_role="Médico", workplace_notes="nota",\n        photo_url="/foto", crm="CRM1", document_logo_url="/logo", home_street="Rua", home_number="1", home_complement=None,\n        home_neighborhood="Bairro", home_city="Cidade", home_state="SP", home_zip="00000", practice_street="Rua",\n        practice_number="2", practice_complement=None, practice_neighborhood="B", practice_city="C", practice_state="SP",\n        practice_zip="000", practice_phone="1", reviewed_by=1, reviewed_at="x", rejection_note="x",\n        convidado_plano_preferido="completo", last_seen_at="x", assinatura_metodo_preferido="a1",\n        ia_ferramentas_consent_em="x", ia_ferramentas_consent_versao="v1", email_conta_padrao_envio="corvia",\n        instagram_handle="pessoa", instagram_photo_url="x", include_workplace_on_documents=True, show_online_status=True,\n        email_assinatura_ativa=True, email_assinatura_digital_ativa=True, email_assinatura_incluir_telefone=True,\n        email_assinatura_incluir_endereco=True,\n    )\n\n\ndef test_exclusao_transforma_usuario_em_tombstone_sem_pii_ou_acesso():\n    alvo = _target()\n    _anonimizar_usuario_excluido(alvo)\n    assert alvo.status == "excluido"\n    assert alvo.is_active is False\n    assert alvo.role == "leitor"\n    assert alvo.email == "excluido-42@deleted.corvia.invalid"\n    assert alvo.full_name == "Conta excluída"\n    assert alvo.password_hash != "hash-antigo"\n    assert alvo.active_session_id is None\n    assert alvo.cpf is None\n    assert alvo.council_number is None\n    assert alvo.workplace_name is None\n    assert alvo.home_street is None\n    assert alvo.practice_street is None\n    assert alvo.instagram_handle is None\n    assert alvo.email_assinatura_ativa is False\n    assert alvo.convidado is False\n    assert alvo.investidor is False\n\n\ndef test_listas_administrativas_ocultam_tombstones():\n    source = __import__('pathlib').Path(__file__).resolve().parents[1] / 'app' / 'api' / 'admin.py'\n    text = source.read_text(encoding='utf-8')\n    assert 'q = db.query(User).filter(User.status != "excluido")' in text\n    assert 'query = db.query(User).filter(User.status != "excluido")' in text\n\n\ndef test_exclusao_definitiva_e_restrita_ao_owner_admin():\n    source = __import__('pathlib').Path(__file__).resolve().parents[1] / 'app' / 'api' / 'admin_user_management.py'\n    text = source.read_text(encoding='utf-8')\n    route = text[text.index('@router.delete("/{user_id}")'):]\n    assert 'owner=Depends(require_owner_admin)' in route\n    assert 'db.delete(alvo)' not in route\n    assert '_anonimizar_usuario_excluido(alvo)' in route\n''', encoding='utf-8')
          PY
      - name: Validate syntax and targeted regression
        run: |
          set -euo pipefail
          python3 -m compileall -q backend/app/api/admin_user_management.py backend/app/api/admin.py
          python3 - <<'PY'
          from pathlib import Path
          text=Path('backend/app/api/admin_user_management.py').read_text(encoding='utf-8')
          assert 'ACCOUNT_ERASURE_TOMBSTONE_V1' in text
          assert 'owner=Depends(require_owner_admin)' in text[text.index('@router.delete("/{user_id}")'):]
          assert 'db.delete(alvo)' not in text[text.index('@router.delete("/{user_id}")'):]
          admin=Path('backend/app/api/admin.py').read_text(encoding='utf-8')
          assert admin.count('User.status != "excluido"') >= 2
          PY
      - name: Commit code fix
        run: |
          set -euo pipefail
          if git diff --quiet -- backend frontend; then
            echo 'No code changes to commit.'
            exit 0
          fi
          git config user.name corvia-fix-bot
          git config user.email actions@users.noreply.github.com
          git add backend frontend
          git diff --cached --check
          git commit -m 'fix(admin): tornar exclusão definitiva de conta confiável'
          git push origin HEAD:fix/admin-hard-delete-20260830
