name: Temporary inspect user FKs

on:
  push:
    branches: [fix/admin-hard-delete-20260830]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Show references to users.id and deletion semantics
        run: |
          set -euo pipefail
          echo '=== MODELS users.id ==='
          grep -RIn --include='*.py' 'users\.id' backend/app/models || true
          echo '=== MIGRATIONS users.id ==='
          grep -RIn --include='*.py' -E 'users.*id|user_id.*ForeignKey|ForeignKey.*users' backend/migrations/versions || true
          echo '=== USER FK constraints in SQLAlchemy metadata ==='
          cd backend
          python - <<'PY'
          from app.models import *  # noqa
          from app.core.db import Base
          for table in sorted(Base.metadata.tables.values(), key=lambda t: t.name):
              for fk in table.foreign_key_constraints:
                  targets = [e.target_fullname for e in fk.elements]
                  if any(t == 'users.id' for t in targets):
                      cols = [e.parent.name for e in fk.elements]
                      print(table.name, cols, '->', targets, 'ondelete=', fk.ondelete, 'nullable=', [e.parent.nullable for e in fk.elements])
          PY
