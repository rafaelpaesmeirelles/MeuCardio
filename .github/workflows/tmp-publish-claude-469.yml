name: Temporary recover Claude PR469 content

on:
  push:
    branches: [content/publish-overnight-claude-469-20260822]

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: content/publish-overnight-claude-469-20260822
          fetch-depth: 0
      - name: Recover two reviewed checklist records from PR469
        run: |
          git fetch origin content/checklists-round6-trombo-calculadoras-v4
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path

          target = Path('checklists/metadados.json')
          raw = target.read_text(encoding='utf-8')
          current = json.loads(raw)
          wanted = [
              'diagnostico-e-anticoagulacao-na-trombose-venosa-cerebral',
              'aplicacao-do-escore-de-duke-do-teste-ergometrico-na-avaliacao-prognostica-de-dor-toracica',
          ]
          existing = {x['slug'] for x in current}
          if all(slug in existing for slug in wanted):
              print('Records already recovered; nothing to do.')
              raise SystemExit(0)
          collision = [slug for slug in wanted if slug in existing]
          if collision:
              raise SystemExit(f'partial collision: {collision}')

          source_raw = subprocess.check_output(
              ['git', 'show', 'FETCH_HEAD:checklists/metadados.json'], text=True
          )
          source = json.loads(source_raw)
          by_slug = {x['slug']: x for x in source}
          missing = [slug for slug in wanted if slug not in by_slug]
          if missing:
              raise SystemExit(f'missing source records: {missing}')
          records = [by_slug[slug] for slug in wanted]

          for rec in records:
              rec['revisao'] = (
                  'Revisão científica, editorial e documental concluída para integração '
                  'neste lote, com rastreabilidade pelo documento de origem e fontes registradas.'
              )

          duke = records[1]
          duke['source_refs'] = [
              'Mark DB, Hlatky MA, Harrell FE Jr, Lee KL, Califf RM, Pryor DB. Exercise treadmill score for predicting prognosis in coronary artery disease. Ann Intern Med. 1987;106(6):793-800. PMID: 3579066.',
              'Mark DB, Shaw L, Harrell FE Jr, Hlatky MA, Lee KL, Lipscomb J, Califf RM, Pryor DB. Prognostic value of a treadmill exercise score in outpatients with suspected coronary artery disease. N Engl J Med. 1991;325(12):849-853. PMID: 1875969.',
              'Gulati M, Levy PD, Mukherjee D, et al. 2021 AHA/ACC/ASE/CHEST/SAEM/SCCT/SCMR Guideline for the Evaluation and Diagnosis of Chest Pain. Circulation. 2021;144:e368-e454. DOI: 10.1161/CIR.0000000000001029.',
              'Virani SS, Newby LK, Arnold SV, et al. 2023 AHA/ACC/ACCP/ASPC/NLA/PCNA Guideline for the Management of Patients With Chronic Coronary Disease. Circulation. 2023;148:e9-e119. DOI: 10.1161/CIR.0000000000001168.',
          ]
          items = {x['id']: x for x in duke['itens']}
          items['escore-duke-teste-ergometrico-registro-tempo-exercicio']['texto'] = (
              'Registro do tempo total de exercício em minutos no protocolo de Bruce, '
              'que é o tempo usado na fórmula original do Duke Treadmill Score. Se outro '
              'protocolo foi utilizado, não inserir diretamente seus minutos na fórmula '
              'sem método de conversão ou validação apropriado.'
          )
          items['escore-duke-teste-ergometrico-classificacao-faixa-risco']['texto'] = (
              'Classificação pela convenção original: escore ≥5 = baixo risco; de -10 a +4 '
              '= risco intermediário; ≤-11 = alto risco. A faixa é prognóstica e não substitui '
              'a integração com sintomas, probabilidade clínica, capacidade funcional e '
              'resultados anatômicos ou funcionais atuais.'
          )
          items['escore-duke-teste-ergometrico-conduta-alto-risco']['texto'] = (
              'Escore de alto risco tratado como marcador de prognóstico adverso que exige '
              'avaliação cardiológica adicional e integração com a carga de isquemia, anatomia '
              'coronariana e persistência de sintomas. Não indicar angiografia invasiva '
              'automaticamente pelo Duke isolado; nas diretrizes atuais, isquemia moderada ou '
              'grave, DAC de alto risco e/ou sintomas persistentes apesar de tratamento orientam '
              'a decisão de anatomia invasiva.'
          )
          items['escore-duke-teste-ergometrico-conduta-baixo-risco']['texto'] = (
              'Escore de baixo risco favorece estratégia conservadora e prevenção/tratamento '
              'clínico, sem indicação de investigação invasiva baseada apenas no número. '
              'Nova investigação depende da probabilidade clínica, persistência ou progressão '
              'dos sintomas e de outros achados de risco.'
          )
          duke['review_note'] = (
              'Duke Treadmill Score preservado como instrumento prognóstico histórico; '
              'decisões de angiografia e imagem foram atualizadas para o contexto das '
              'diretrizes AHA/ACC contemporâneas e não são disparadas pelo escore isoladamente.'
          )

          cvt = records[0]
          cvt['source_refs'] = [
              'Saposnik G, Bushnell C, Coutinho JM, et al. Diagnosis and Management of Cerebral Venous Thrombosis: A Scientific Statement From the American Heart Association. Stroke. 2024;55(3):e77-e90. PMID: 38284265. DOI: 10.1161/STR.0000000000000456.',
              'Saposnik G, Barinagarrementeria F, Brown RD Jr, et al. Diagnosis and management of cerebral venous thrombosis: a statement for healthcare professionals from the AHA/ASA. Stroke. 2011;42(4):1158-1192. PMID: 21293023.',
          ]
          for item in cvt['itens']:
              if item['id'] == 'trombose-venosa-cerebral-trombolise-trombectomia-reservada':
                  item['texto'] = (
                      'Terapia endovascular não é tratamento inicial rotineiro. Considerá-la '
                      'como estratégia de resgate em CVT grave com progressão clínica ou '
                      'propagação trombótica apesar de anticoagulação adequada, em decisão '
                      'multidisciplinar e centro com experiência.'
                  )
              elif item['id'] == 'trombose-venosa-cerebral-anticoagulacao-fase-aguda':
                  item['texto'] = (
                      'Anticoagulação parenteral iniciada na fase aguda, preferencialmente com '
                      'heparina de baixo peso molecular ou com heparina não fracionada conforme '
                      'o contexto. Hemorragia intracraniana decorrente da própria CVT não é, por '
                      'si só, contraindicação à anticoagulação.'
                  )

          corpus_text = '\n'.join(
              p.read_text(encoding='utf-8', errors='ignore')
              for p in Path('content').rglob('*.md')
          )
          for rec in records:
              marker = f"slug: {rec['documento_origem']}"
              if marker not in corpus_text:
                  raise SystemExit(f"source document not found: {rec['documento_origem']}")

          all_item_ids = [item['id'] for rec in current for item in rec.get('itens', [])]
          incoming_ids = [item['id'] for rec in records for item in rec.get('itens', [])]
          if len(incoming_ids) != len(set(incoming_ids)):
              raise SystemExit('duplicate item id within incoming records')
          overlap = sorted(set(all_item_ids) & set(incoming_ids))
          if overlap:
              raise SystemExit(f'item id collision with main: {overlap}')

          stripped = raw.rstrip()
          if not stripped.endswith(']'):
              raise SystemExit('unexpected JSON terminator')
          prefix = stripped[:-1].rstrip()
          serialized = []
          for rec in records:
              block = json.dumps(rec, ensure_ascii=False, indent=2)
              serialized.append('\n'.join('  ' + line for line in block.splitlines()))
          new_raw = prefix + ',\n' + ',\n'.join(serialized) + '\n]\n'
          parsed = json.loads(new_raw)
          slugs = [x['slug'] for x in parsed]
          if len(slugs) != len(set(slugs)):
              raise SystemExit('slug duplication after append')
          if len(parsed) != len(current) + 2:
              raise SystemExit('record count guard failed')
          target.write_text(new_raw, encoding='utf-8')
          print('Recovered and scientifically hardened:', wanted)
          PY
          git diff --check
      - name: Commit recovered content
        run: |
          if git diff --quiet; then
            echo "No content changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add checklists/metadados.json
          git commit -m "content: recover and harden Claude round6 CVT and Duke checklists"
          git push origin HEAD:content/publish-overnight-claude-469-20260822
