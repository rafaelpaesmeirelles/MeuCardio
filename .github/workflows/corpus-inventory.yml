name: Corpus inventory

on:
  pull_request:
    paths:
      - "content/**"
      - "galeria/**"
      - "exames/**"
      - "evidencias/**"
      - "estudos/**"
      - "medicamentos/**"
      - "checklists/**"
      - "trilhas/**"
      - "material-paciente/**"
      - "emergencia/**"
      - "casos-clinicos/**"
      - "doencas/**"
      - "triagem-sintomas/**"
      - "controlados/**"
      - "scripts/content_inventory.py"
      - "scripts/audit_tudo_com_tudo.py"
      - ".github/workflows/corpus-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    name: Scientific corpus inventory
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enforce scientific corpus baseline
        run: >-
          python scripts/content_inventory.py
          --minimum-records 9454
          --minimum-files 2185
          --strict

      - name: Audit canonical Tudo com Tudo references
        run: |
          python scripts/audit_tudo_com_tudo.py > tudo-com-tudo-audit.json
          python - <<'PY'
          import json

          with open("tudo-com-tudo-audit.json", encoding="utf-8") as stream:
              audit = json.load(stream)
          assert audit["total_items"] == 9454, audit["total_items"]
          assert audit["review_status"] == {"revisado": 9454}, audit["review_status"]
          assert audit["topic_coverage"]["covered"] == 9454, audit["topic_coverage"]
          assert audit["broken_references"] == [], audit["broken_references"][:10]
          PY
