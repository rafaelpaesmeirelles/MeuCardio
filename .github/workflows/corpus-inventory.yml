name: Corpus inventory

on:
  pull_request:
    paths:
      - "content/**"
      - "galeria/**"
      - "exames/**"
      - "evidencias/**"
      - "estudos/**"
      - "medicamentos/**"
      - "checklists/**"
      - "trilhas/**"
      - "material-paciente/**"
      - "emergencia/**"
      - "casos-clinicos/**"
      - "doencas/**"
      - "triagem-sintomas/**"
      - "controlados/**"
      - "scripts/content_inventory.py"
      - "scripts/audit_tudo_com_tudo.py"
      - ".github/workflows/corpus-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    name: Scientific corpus inventory
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enforce scientific corpus baseline
        run: >-
          python scripts/content_inventory.py
          --minimum-records 9469
          --minimum-files 2188
          --strict

      - name: Audit canonical Tudo com Tudo references
        run: |
          python scripts/audit_tudo_com_tudo.py > tudo-com-tudo-audit.json
          python - <<'PY'
          import json

          with open("tudo-com-tudo-audit.json", encoding="utf-8") as stream:
              audit = json.load(stream)

          total = audit["total_items"]
          review_status = audit["review_status"]
          topic_coverage = audit["topic_coverage"]

          # 9.496 é o último baseline certificado, não um teto. O corpus deve
          # poder crescer sem obrigar a regravar este workflow a cada lote.
          assert total >= 9496, total
          assert sum(review_status.values()) == total, review_status
          assert set(review_status) <= {"revisado", "pendente_revisao", "rejeitado"}, review_status

          # Tudo com Tudo continua obrigatório para 100% dos itens. Pendências
          # editoriais nominais são controladas pelo Content Review Status Gate,
          # não por uma contagem global congelada de itens revisados.
          assert topic_coverage["total"] == total, topic_coverage
          assert topic_coverage["covered"] == total, topic_coverage
          assert topic_coverage["without_explicit_topic"] == 0, topic_coverage
          assert audit["broken_references"] == [], audit["broken_references"][:10]
          PY
