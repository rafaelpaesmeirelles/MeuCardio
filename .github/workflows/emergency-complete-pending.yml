name: Emergency complete pending release

on:
  push:
    branches:
      - feat/cfm-registry-sync-20260902

permissions:
  contents: write

concurrency:
  group: emergency-complete-pending-release
  cancel-in-progress: false

jobs:
  complete:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/cfm-registry-sync-20260902
          fetch-depth: 0
      - name: Consolidate CFM, automatic KYC and CorVIA Mail pending work
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- backend/tests/test_cardiologia_intensiva_uco_contract.py
          python - <<'PY'
          from pathlib import Path
          import re

          def must_replace(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f"anchor ausente: {label}")
              return text.replace(old, new, 1)

          # ------------------------------------------------------------------
          # Native CorVIA mailbox delegation: link a second CorVIA/Mail360
          # mailbox after authenticating its own mailbox password. Password is
          # never stored in the delegation table.
          # ------------------------------------------------------------------
          model = Path('backend/app/models/email_delegation.py')
          model.write_text('''from __future__ import annotations\n\nfrom sqlalchemy import BigInteger, Column, DateTime, ForeignKey, UniqueConstraint, func\n\nfrom app.core.db import Base\n\n\nclass EmailMailboxDelegation(Base):\n    __tablename__ = "email_mailbox_delegations"\n    __table_args__ = (\n        UniqueConstraint("owner_account_id", "target_account_id", name="uq_email_mailbox_delegation"),\n    )\n\n    id = Column(BigInteger, primary_key=True, autoincrement=True)\n    owner_account_id = Column(BigInteger, ForeignKey("email_accounts.id", ondelete="CASCADE"), nullable=False, index=True)\n    target_account_id = Column(BigInteger, ForeignKey("email_accounts.id", ondelete="CASCADE"), nullable=False, index=True)\n    created_at = Column(DateTime(timezone=True), nullable=False, server_default=func.now())\n''', encoding='utf-8')

          init = Path('backend/app/models/__init__.py')
          txt = init.read_text(encoding='utf-8')
          line = 'from app.models.email_delegation import EmailMailboxDelegation\n'
          if line not in txt:
              txt += ('\n' if txt and not txt.endswith('\n') else '') + line
              init.write_text(txt, encoding='utf-8')

          mig = Path('backend/migrations/versions/f96m20260903_email_mailbox_delegation.py')
          mig.write_text('''"""Delegação segura entre caixas nativas CorVIA Mail.\n\nRevision ID: f96m20260903\nRevises: f95c20260902\nCreate Date: 2026-09-03\n"""\nfrom alembic import op\nimport sqlalchemy as sa\n\nrevision = "f96m20260903"\ndown_revision = "f95c20260902"\nbranch_labels = None\ndepends_on = None\n\n\ndef upgrade() -> None:\n    op.create_table(\n        "email_mailbox_delegations",\n        sa.Column("id", sa.BigInteger(), autoincrement=True, nullable=False),\n        sa.Column("owner_account_id", sa.BigInteger(), nullable=False),\n        sa.Column("target_account_id", sa.BigInteger(), nullable=False),\n        sa.Column("created_at", sa.DateTime(timezone=True), nullable=False, server_default=sa.func.now()),\n        sa.ForeignKeyConstraint(["owner_account_id"], ["email_accounts.id"], ondelete="CASCADE"),\n        sa.ForeignKeyConstraint(["target_account_id"], ["email_accounts.id"], ondelete="CASCADE"),\n        sa.PrimaryKeyConstraint("id"),\n        sa.UniqueConstraint("owner_account_id", "target_account_id", name="uq_email_mailbox_delegation"),\n    )\n    op.create_index("ix_email_mailbox_delegations_owner_account_id", "email_mailbox_delegations", ["owner_account_id"])\n    op.create_index("ix_email_mailbox_delegations_target_account_id", "email_mailbox_delegations", ["target_account_id"])\n\n\ndef downgrade() -> None:\n    op.drop_table("email_mailbox_delegations")\n''', encoding='utf-8')

          email = Path('backend/app/api/email.py')
          src = email.read_text(encoding='utf-8')
          src = must_replace(
              src,
              'from app.models.email_account import EmailAccount\n',
              'from app.models.email_account import EmailAccount\nfrom app.models.email_delegation import EmailMailboxDelegation\n',
              'email model import',
          )

          marker = '\n\n# --------------------------------------------------------------------------\n# Contas externas — proxy ao vivo; o conteúdo permanece no provedor\n# --------------------------------------------------------------------------\n'
          if marker not in src:
              raise SystemExit('anchor ausente: external mail section')
          linked_code = r'''

# --------------------------------------------------------------------------
# Caixas nativas CorVIA vinculadas — segunda caixa no mesmo CorVIA Mail
# --------------------------------------------------------------------------
class VincularCaixaCorvia(BaseModel):
    email_address: str = Field(min_length=3, max_length=254)
    senha: str = Field(min_length=1, max_length=256)


def _caixa_corvia_vinculada(db: Session, conta: EmailAccount, target_id: int) -> EmailAccount:
    vinculo = db.query(EmailMailboxDelegation).filter(
        EmailMailboxDelegation.owner_account_id == conta.id,
        EmailMailboxDelegation.target_account_id == target_id,
    ).first()
    if not vinculo:
        raise HTTPException(status_code=403, detail="Esta caixa CorVIA não está vinculada à sessão atual.")
    alvo = db.get(EmailAccount, target_id)
    if not alvo or not alvo.mail360_account_key:
        raise HTTPException(status_code=404, detail="Caixa CorVIA vinculada não encontrada.")
    return alvo


@router.get("/corvia-vinculadas")
def listar_caixas_corvia_vinculadas(
    db: Session = Depends(get_db),
    conta: EmailAccount = Depends(current_email_account),
):
    vinculos = db.query(EmailMailboxDelegation).filter(
        EmailMailboxDelegation.owner_account_id == conta.id,
    ).all()
    ids = [v.target_account_id for v in vinculos]
    if not ids:
        return []
    alvos = db.query(EmailAccount).filter(EmailAccount.id.in_(ids)).all()
    por_id = {a.id: a for a in alvos if a.mail360_account_key}
    return [
        {
            "id": f"corvia:{target_id}",
            "provider": "corvia",
            "display_name": por_id[target_id].email_address,
            "email_address": por_id[target_id].email_address,
            "native": True,
            "read_mail": True,
            "send_mail": True,
            "padrao": False,
            "linked_native": True,
        }
        for target_id in ids if target_id in por_id
    ]


@router.post("/corvia-vinculadas", status_code=201)
def vincular_caixa_corvia(
    dados: VincularCaixaCorvia,
    db: Session = Depends(get_db),
    conta: EmailAccount = Depends(current_email_account),
):
    endereco = dados.email_address.strip().casefold()
    alvo = db.query(EmailAccount).filter(
        EmailAccount.email_address == endereco,
    ).first()
    if not alvo or not alvo.password_hash or not alvo.mail360_account_key:
        raise HTTPException(status_code=404, detail="Caixa CorVIA não encontrada.")
    if alvo.id == conta.id:
        raise HTTPException(status_code=409, detail="Esta já é a caixa CorVIA da sessão atual.")
    if not verify_password(dados.senha, alvo.password_hash):
        raise HTTPException(status_code=401, detail="Senha da caixa CorVIA vinculada inválida.")
    existente = db.query(EmailMailboxDelegation).filter(
        EmailMailboxDelegation.owner_account_id == conta.id,
        EmailMailboxDelegation.target_account_id == alvo.id,
    ).first()
    if not existente:
        db.add(EmailMailboxDelegation(owner_account_id=conta.id, target_account_id=alvo.id))
        db.commit()
    return {"id": f"corvia:{alvo.id}", "email_address": alvo.email_address}


@router.delete("/corvia-vinculadas/{target_id}", status_code=204)
def desvincular_caixa_corvia(
    target_id: int,
    db: Session = Depends(get_db),
    conta: EmailAccount = Depends(current_email_account),
):
    vinculo = db.query(EmailMailboxDelegation).filter(
        EmailMailboxDelegation.owner_account_id == conta.id,
        EmailMailboxDelegation.target_account_id == target_id,
    ).first()
    if vinculo:
        db.delete(vinculo)
        db.commit()


@router.get("/corvia/{target_id}/pastas")
def pastas_caixa_corvia_vinculada(
    target_id: int,
    db: Session = Depends(get_db),
    conta: EmailAccount = Depends(current_email_account),
):
    _exigir_configurado()
    alvo = _caixa_corvia_vinculada(db, conta, target_id)
    try:
        return mail360.listar_pastas(alvo.mail360_account_key)
    except Mail360Error as exc:
        raise HTTPException(status_code=502, detail=str(exc)) from exc


@router.get("/corvia/{target_id}/mensagens")
def mensagens_caixa_corvia_vinculada(
    target_id: int,
    pasta: str | None = None,
    limite: int = 50,
    inicio: int = 1,
    db: Session = Depends(get_db),
    conta: EmailAccount = Depends(current_email_account),
):
    if limite < 1 or limite > 200 or inicio < 1:
        raise HTTPException(status_code=422, detail="Paginação inválida.")
    _exigir_configurado()
    alvo = _caixa_corvia_vinculada(db, conta, target_id)
    try:
        return mail360.listar_mensagens(alvo.mail360_account_key, pasta, limite, inicio)
    except Mail360Error as exc:
        raise HTTPException(status_code=502, detail=str(exc)) from exc


