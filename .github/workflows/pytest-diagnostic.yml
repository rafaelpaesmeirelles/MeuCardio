name: Pytest diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/pytest-diagnostic.yml"

permissions:
  contents: read

jobs:
  first-failure:
    name: First failure shard ${{ matrix.shard }}/4
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: meucardio_test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: meucardio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meucardio_test -d meucardio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      ENVIRONMENT: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: meucardio_test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: meucardio_test
      REDIS_URL: redis://localhost:6379/0
      STORAGE_ENCRYPTION_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
      JWT_SECRET: chave-de-teste-nao-usar-em-producao
      ADMIN_EMAIL: admin@teste.local
      ADMIN_PASSWORD: admin-teste-123
      AI_ENABLED: "false"
      MAIL360_CLIENT_ID: id-de-teste
      MAIL360_CLIENT_SECRET: secret-de-teste
      MAIL360_REFRESH_TOKEN: refresh-de-teste
      CORVIA_MAIL_PRECO_CENTAVOS: "1000"
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_teste_dummy
      PUBLIC_URL: https://corvia.med.br
      UPLOADS_DIR: /tmp/corvia-test/uploads
      EXAMES_DIR: /tmp/corvia-test/exames-pacientes
      DOCUMENTOS_DIR: /tmp/corvia-test/documentos-emitidos
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Apply migrations
        working-directory: backend
        run: python -m app.commands.migrate
      - name: Run shard and stop on first failure
        working-directory: backend
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -o pipefail
          mapfile -t TEST_FILES < <(python - <<'PY'
          import os
          from pathlib import Path
          shard = int(os.environ['SHARD'])
          files = sorted(str(p) for p in Path('tests').glob('test_*.py'))
          for path in files[shard::4]:
              print(path)
          PY
          )
          printf 'Shard %s: %s test files\n' "$SHARD" "${#TEST_FILES[@]}"
          python -m pytest -q -x --tb=short "${TEST_FILES[@]}" 2>&1 | tee "first-failure-shard-${SHARD}.txt"
      - name: Upload first failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: pytest-first-failure-${{ matrix.shard }}
          path: backend/first-failure-shard-${{ matrix.shard }}.txt
          if-no-files-found: error
          retention-days: 2
