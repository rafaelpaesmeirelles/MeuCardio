name: Cardiology Spaces — Approved Reference QA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/cardiology-spaces-reference-qa.yml"
      - "frontend/**"

permissions:
  contents: read

jobs:
  reference-fidelity:
    name: Complete + Essential + Science · 1600x900
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COMPOSE_PROJECT_NAME: corvia_spaces_reference
      ENVIRONMENT: test
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: meucardio_visual
      POSTGRES_PASSWORD: visual-test
      POSTGRES_DB: meucardio_visual
      REDIS_URL: redis://redis:6379/0
      STORAGE_ENCRYPTION_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
      JWT_SECRET: chave-spaces-reference-nao-usar-em-producao
      ADMIN_EMAIL: spaces-reference@teste.local
      ADMIN_PASSWORD: spaces-reference-123
      AI_ENABLED: "false"
      MAIL360_CLIENT_ID: id-de-teste
      MAIL360_CLIENT_SECRET: secret-de-teste
      MAIL360_REFRESH_TOKEN: refresh-de-teste
      CORVIA_MAIL_PRECO_CENTAVOS: "1000"
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_visual_dummy
      PUBLIC_URL: http://127.0.0.1:8080
      UPLOADS_DIR: /tmp/corvia-spaces-reference/uploads
      EXAMES_DIR: /tmp/corvia-spaces-reference/exames
      DOCUMENTOS_DIR: /tmp/corvia-spaces-reference/documentos

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Create isolated environment
        run: |
          cat > .env <<'ENV'
          COMPOSE_PROJECT_NAME=corvia_spaces_reference
          ENVIRONMENT=test
          POSTGRES_HOST=db
          POSTGRES_PORT=5432
          POSTGRES_USER=meucardio_visual
          POSTGRES_PASSWORD=visual-test
          POSTGRES_DB=meucardio_visual
          REDIS_URL=redis://redis:6379/0
          STORAGE_ENCRYPTION_KEY=MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
          JWT_SECRET=chave-spaces-reference-nao-usar-em-producao
          ADMIN_EMAIL=spaces-reference@teste.local
          ADMIN_PASSWORD=spaces-reference-123
          AI_ENABLED=false
          MAIL360_CLIENT_ID=id-de-teste
          MAIL360_CLIENT_SECRET=secret-de-teste
          MAIL360_REFRESH_TOKEN=refresh-de-teste
          CORVIA_MAIL_PRECO_CENTAVOS=1000
          STRIPE_SECRET_KEY=sk_test_dummy
          STRIPE_WEBHOOK_SECRET=whsec_visual_dummy
          PUBLIC_URL=http://127.0.0.1:8080
          UPLOADS_DIR=/tmp/corvia-spaces-reference/uploads
          EXAMES_DIR=/tmp/corvia-spaces-reference/exames
          DOCUMENTOS_DIR=/tmp/corvia-spaces-reference/documentos
          ENV

      - name: Start API stack
        run: docker compose up -d --build db redis backend

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Serve build
        run: |
          mkdir -p reference-qa
          cat > reference-qa/nginx.conf <<'NGINX'
          server {
            listen 80;
            root /usr/share/nginx/html;
            index index.html;
            location /api/ { proxy_pass http://backend:8000/api/; proxy_buffering off; }
            location /uploads/ { proxy_pass http://backend:8000/uploads/; }
            location / { try_files $uri $uri/ /index.html; }
          }
          NGINX
          docker run -d --name corvia-spaces-reference-nginx \
            --network corvia_spaces_reference_default -p 8080:80 \
            -v "$PWD/frontend/dist:/usr/share/nginx/html:ro" \
            -v "$PWD/reference-qa/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine

      - name: Wait for HTTP
        run: |
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:8080/api/ready >/dev/null \
              && curl --fail --silent http://127.0.0.1:8080/entrar >/dev/null \
              && exit 0
            sleep 2
          done
          docker compose logs --no-color backend
          exit 1

      - name: Create QA administrator
        run: |
          docker compose exec -T backend python -m app.commands.create_admin \
            --email spaces-reference@teste.local \
            --password spaces-reference-123 \
            --name "Dr. Reference QA"

      - name: Install Chromium runner
        run: |
          mkdir -p /tmp/corvia-spaces-reference-qa
          cd /tmp/corvia-spaces-reference-qa
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Capture and certify approved composition
        run: |
          mkdir -p reference-qa/screenshots
          cat > /tmp/corvia-spaces-reference-qa/capture.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import path from 'node:path';

          const base = 'http://127.0.0.1:8080';
          const out = path.join(process.env.GITHUB_WORKSPACE, 'reference-qa');
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 1600, height: 900 }, colorScheme: 'dark', locale: 'pt-BR' });
          const page = await context.newPage();
          const failures = [];
          const modes = {};

          async function login() {
            await page.goto(`${base}/entrar`, { waitUntil: 'networkidle' });
            await page.locator('#email').fill('spaces-reference@teste.local');
            await page.locator('#senha').fill('spaces-reference-123');
            await page.locator('button[type="submit"]').click();
            await page.waitForURL((url) => !url.pathname.includes('/entrar'), { timeout: 20000 });
            await page.evaluate(() => {
              localStorage.setItem('corvia:cardiology-spaces:tour:v3', 'reference-qa');
              sessionStorage.removeItem('corvia:cardiology-spaces:mode');
            });
            await page.goto(`${base}/`, { waitUntil: 'networkidle' });
          }

          const { certifyAtelierReference } = await import(
            new URL('file://' + path.join(process.env.GITHUB_WORKSPACE, 'frontend/scripts/atelier-reference.mjs')).href
          );
          try {
            await login();
            await certifyAtelierReference({ page, base, out, failures });
          } catch(error) {
            failures.push(String(error?.stack || error));
          } finally {
            fs.writeFileSync(path.join(out, 'report.json'), JSON.stringify({ design: 'atelier', failures }, null, 2));
            await browser.close();
          }
          if(failures.length) {
            console.error(JSON.stringify(failures, null, 2));
            process.exitCode = 1;
          }

          JS
          node /tmp/corvia-spaces-reference-qa/capture.mjs

      - name: Upload reference artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cardiology-spaces-approved-reference
          path: |
            reference-qa/screenshots/*.png
            reference-qa/*.png
            reference-qa/atelier-reference.json
            reference-qa/report.json
          if-no-files-found: warn

      - name: Stop isolated stack
        if: always()
        run: |
          docker rm -f corvia-spaces-reference-nginx >/dev/null 2>&1 || true
          docker compose down -v --remove-orphans
