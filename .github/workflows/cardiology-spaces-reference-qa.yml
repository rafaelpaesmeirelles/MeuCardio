name: Cardiology Spaces — Approved Reference QA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/cardiology-spaces-reference-qa.yml"
      - "frontend/**"

permissions:
  contents: read

jobs:
  reference-fidelity:
    name: Complete + Essential + Science · 1536x864
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COMPOSE_PROJECT_NAME: corvia_spaces_reference
      ENVIRONMENT: test
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: meucardio_visual
      POSTGRES_PASSWORD: visual-test
      POSTGRES_DB: meucardio_visual
      REDIS_URL: redis://redis:6379/0
      STORAGE_ENCRYPTION_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
      JWT_SECRET: chave-spaces-reference-nao-usar-em-producao
      ADMIN_EMAIL: spaces-reference@teste.local
      ADMIN_PASSWORD: spaces-reference-123
      AI_ENABLED: "false"
      MAIL360_CLIENT_ID: id-de-teste
      MAIL360_CLIENT_SECRET: secret-de-teste
      MAIL360_REFRESH_TOKEN: refresh-de-teste
      CORVIA_MAIL_PRECO_CENTAVOS: "1000"
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_visual_dummy
      PUBLIC_URL: http://127.0.0.1:8080
      UPLOADS_DIR: /tmp/corvia-spaces-reference/uploads
      EXAMES_DIR: /tmp/corvia-spaces-reference/exames
      DOCUMENTOS_DIR: /tmp/corvia-spaces-reference/documentos

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Create isolated environment
        run: |
          cat > .env <<'ENV'
          COMPOSE_PROJECT_NAME=corvia_spaces_reference
          ENVIRONMENT=test
          POSTGRES_HOST=db
          POSTGRES_PORT=5432
          POSTGRES_USER=meucardio_visual
          POSTGRES_PASSWORD=visual-test
          POSTGRES_DB=meucardio_visual
          REDIS_URL=redis://redis:6379/0
          STORAGE_ENCRYPTION_KEY=MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
          JWT_SECRET=chave-spaces-reference-nao-usar-em-producao
          ADMIN_EMAIL=spaces-reference@teste.local
          ADMIN_PASSWORD=spaces-reference-123
          AI_ENABLED=false
          MAIL360_CLIENT_ID=id-de-teste
          MAIL360_CLIENT_SECRET=secret-de-teste
          MAIL360_REFRESH_TOKEN=refresh-de-teste
          CORVIA_MAIL_PRECO_CENTAVOS=1000
          STRIPE_SECRET_KEY=sk_test_dummy
          STRIPE_WEBHOOK_SECRET=whsec_visual_dummy
          PUBLIC_URL=http://127.0.0.1:8080
          UPLOADS_DIR=/tmp/corvia-spaces-reference/uploads
          EXAMES_DIR=/tmp/corvia-spaces-reference/exames
          DOCUMENTOS_DIR=/tmp/corvia-spaces-reference/documentos
          ENV

      - name: Start API stack
        run: docker compose up -d --build db redis backend

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Serve build
        run: |
          mkdir -p reference-qa
          cat > reference-qa/nginx.conf <<'NGINX'
          server {
            listen 80;
            root /usr/share/nginx/html;
            index index.html;
            location /api/ { proxy_pass http://backend:8000/api/; proxy_buffering off; }
            location /uploads/ { proxy_pass http://backend:8000/uploads/; }
            location / { try_files $uri $uri/ /index.html; }
          }
          NGINX
          docker run -d --name corvia-spaces-reference-nginx \
            --network corvia_spaces_reference_default -p 8080:80 \
            -v "$PWD/frontend/dist:/usr/share/nginx/html:ro" \
            -v "$PWD/reference-qa/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine

      - name: Wait for HTTP
        run: |
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:8080/api/ready >/dev/null \
              && curl --fail --silent http://127.0.0.1:8080/entrar >/dev/null \
              && exit 0
            sleep 2
          done
          docker compose logs --no-color backend
          exit 1

      - name: Create QA administrator
        run: |
          docker compose exec -T backend python -m app.commands.create_admin \
            --email spaces-reference@teste.local \
            --password spaces-reference-123 \
            --name "Dr. Reference QA"

      - name: Install Chromium runner
        run: |
          mkdir -p /tmp/corvia-spaces-reference-qa
          cd /tmp/corvia-spaces-reference-qa
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Capture and certify approved composition
        run: |
          mkdir -p reference-qa/screenshots
          cat > /tmp/corvia-spaces-reference-qa/capture.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import path from 'node:path';

          const base = 'http://127.0.0.1:8080';
          const out = path.join(process.env.GITHUB_WORKSPACE, 'reference-qa');
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 1536, height: 864 }, colorScheme: 'dark', locale: 'pt-BR' });
          const page = await context.newPage();
          const failures = [];
          const modes = {};

          async function login() {
            await page.goto(`${base}/entrar`, { waitUntil: 'networkidle' });
            await page.locator('#email').fill('spaces-reference@teste.local');
            await page.locator('#senha').fill('spaces-reference-123');
            await page.locator('button[type="submit"]').click();
            await page.waitForURL((url) => !url.pathname.includes('/entrar'), { timeout: 20000 });
            await page.evaluate(() => {
              localStorage.setItem('corvia:cardiology-spaces:tour:v3', 'reference-qa');
              sessionStorage.removeItem('corvia:cardiology-spaces:mode');
            });
            await page.goto(`${base}/`, { waitUntil: 'networkidle' });
          }

          async function choose(label, targetLabel) {
            if (await page.locator('.spaces-choice').isVisible().catch(() => false)) {
              await page.locator('.spaces-choice__cards button', { hasText: label }).click();
            } else {
              await page.locator('.spaces-home__topbar nav button', { hasText: label }).click();
            }
            await page.locator('.spaces-home').waitFor({ state: 'visible', timeout: 10000 });
            if (targetLabel) await page.locator('.spaces-door', { hasText: targetLabel }).click();
            await page.waitForTimeout(350);
          }

          async function certifyDefaultPortal(modeLabel, expectedLabel) {
            const activeLabel = (await page.locator('.spaces-door.is-active').first().textContent())?.trim() || '';
            if (!activeLabel.includes(expectedLabel)) failures.push(`${modeLabel}: portal padrão deveria ser ${expectedLabel}, encontrado ${activeLabel || 'nenhum'}`);
          }

          async function measure(mode) {
            const metrics = await page.evaluate((modeName) => {
              const q = (selector) => document.querySelector(selector);
              const qa = (selector) => [...document.querySelectorAll(selector)];
              const r = (el) => {
                if (!el) return null;
                const b = el.getBoundingClientRect();
                return { x:b.x, y:b.y, width:b.width, height:b.height, right:b.right, bottom:b.bottom };
              };
              const doors = qa('.spaces-door').map((el) => ({ label:el.textContent?.trim() || '', active:el.classList.contains('is-active'), rect:r(el), scene:r(el.querySelector('i')) }));
              return {
                mode: modeName,
                viewport: { width:innerWidth, height:innerHeight, scrollWidth:document.documentElement.scrollWidth, scrollHeight:document.documentElement.scrollHeight },
                root:r(q('.spaces-home')),
                scientific:q('.spaces-home')?.classList.contains('spaces-home--scientific') || false,
                brand:r(q('.spaces-brand')),
                topbar:r(q('.spaces-home__topbar')),
                greeting:r(q('.spaces-workspace__greeting')),
                rail:r(q('.spaces-context-rail')),
                workspace:r(q('.spaces-workspace')),
                doors,
                title:r(q('.spaces-title')),
                titleText:q('.spaces-title')?.textContent?.trim() || '',
                now:r(q('.spaces-layer--now')),
                next:r(q('.spaces-layer--next')),
                refs:r(q('.spaces-layer--refs')),
                essential:r(q('.spaces-layer--essential')),
                personalize:r(q('.spaces-personalize')),
                doctor:r(q('.spaces-doctor')),
                day:r(q('.spaces-day')),
                dayTitle:q('.spaces-day h2')?.textContent?.trim() || '',
                dock:r(q('.spaces-dock')),
                dockLabels:qa('.spaces-dock span').map((el) => el.textContent?.trim() || ''),
                layerLabels:qa('.spaces-layer header span').map((el) => el.textContent?.trim() || ''),
                motto:r(q('.spaces-motto')),
                heart:r(q('.spaces-home__heart')),
                tabs:qa('.spaces-home__topbar nav button').map((el) => ({ text:el.textContent?.trim() || '', active:el.classList.contains('is-active') })),
              };
            }, mode);
            modes[mode] = metrics;
            await page.screenshot({ path:path.join(out, 'screenshots', `${mode}.png`), fullPage:false });
            return metrics;
          }

          function certify(m, mode) {
            const active = m.doors.find((d) => d.active);
            const inactive = m.doors.filter((d) => !d.active);
            const avgW = inactive.reduce((s,d) => s + (d.rect?.width || 0), 0) / Math.max(1,inactive.length);
            const avgH = inactive.reduce((s,d) => s + (d.scene?.height || 0), 0) / Math.max(1,inactive.length);
            if (m.viewport.scrollWidth > m.viewport.width + 8) failures.push(`${mode}: overflow horizontal ${m.viewport.scrollWidth}>${m.viewport.width}`);
            if (m.doors.length !== 5) failures.push(`${mode}: esperado 5 portais, encontrado ${m.doors.length}`);
            if (!active?.rect || active.rect.width < avgW * 1.28) failures.push(`${mode}: portal ativo não domina em largura (${active?.rect?.width || 0} vs média ${avgW.toFixed(1)})`);
            if (!active?.scene || active.scene.height < avgH * 1.18) failures.push(`${mode}: portal ativo não domina em altura (${active?.scene?.height || 0} vs média ${avgH.toFixed(1)})`);
            if (!m.rail || m.rail.width < 82 || m.rail.width > 125 || m.rail.x > 150) failures.push(`${mode}: rail fora da geometria aprovada ${JSON.stringify(m.rail)}`);
            if (!m.day || m.day.width < 160 || m.day.width > 225 || m.day.right < 1470) failures.push(`${mode}: painel do dia fora da coluna direita ${JSON.stringify(m.day)}`);
            if (!m.now || m.now.width < 760) failures.push(`${mode}: camada AGORA estreita ${JSON.stringify(m.now)}`);
            if (!m.dock || m.dock.width < 1400 || m.dock.bottom < 790) failures.push(`${mode}: dock não ocupa a base aprovada ${JSON.stringify(m.dock)}`);
            if (!m.heart || m.heart.width < 500) failures.push(`${mode}: coração holográfico ausente/pequeno ${JSON.stringify(m.heart)}`);
            if (!m.title || Math.abs((m.title.x + m.title.width / 2) - 768) > 165) failures.push(`${mode}: título do espaço fora do eixo central ${JSON.stringify(m.title)}`);
            const expectedTab = mode === 'complete' ? 'Completo' : mode === 'essential' ? 'Essencial' : 'Ciência & Ensino';
            if (!m.tabs.some((t) => t.text === expectedTab && t.active)) failures.push(`${mode}: aba correta não está ativa`);
            if (mode === 'complete' && (!m.next || !m.refs)) failures.push('complete: Em seguida/Referências ausentes');
            if (mode === 'essential' && (!m.essential || !m.personalize || m.next || m.refs)) failures.push('essential: composição de essenciais incorreta');
            if (mode === 'scientific') {
              const expectedDoors = ['Descobrir','Evidências','Aprender','Ensinar','Produzir'];
              for (const label of expectedDoors) if (!m.doors.some((d) => d.label.includes(label))) failures.push(`scientific: jornada ausente ${label}`);
              if (!m.scientific || !m.next || !m.refs || m.essential) failures.push('scientific: composição científica incorreta');
              if (!m.titleText.includes('Minha jornada')) failures.push(`scientific: título incorreto ${m.titleText}`);
              if (!m.layerLabels.includes('APROFUNDAR') || !m.layerLabels.includes('CONEXÕES DO CONHECIMENTO')) failures.push(`scientific: camadas científicas incompletas ${JSON.stringify(m.layerLabels)}`);
              if (m.dayTitle !== 'Minha jornada científica') failures.push(`scientific: painel lateral incorreto ${m.dayTitle}`);
              const expectedDock = ['Tudo com Tudo','Biblioteca','Evidências','Trilhas','Documento IA','Apresentar'];
              for (const label of expectedDock) if (!m.dockLabels.includes(label)) failures.push(`scientific: ação global ausente ${label}`);
            }
          }

          try {
            await login();
            await choose('Completo');
            await certifyDefaultPortal('complete-default', 'Consultório');
            await page.locator('.spaces-door', { hasText: 'Hospital' }).click();
            await page.waitForTimeout(350);
            certify(await measure('complete'), 'complete');
            await choose('Essencial');
            await certifyDefaultPortal('essential-default', 'Consultório');
            await page.locator('.spaces-door', { hasText: 'Hospital' }).click();
            await page.waitForTimeout(350);
            certify(await measure('essential'), 'essential');
            await choose('Ciência & Ensino', 'Evidências');
            certify(await measure('scientific'), 'scientific');
            fs.writeFileSync(path.join(out, 'report.json'), JSON.stringify({ failures, modes }, null, 2));
            if (failures.length) throw new Error(failures.join('\n'));
          } finally {
            await browser.close();
          }
          JS
          node /tmp/corvia-spaces-reference-qa/capture.mjs

      - name: Upload reference artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cardiology-spaces-approved-reference
          path: |
            reference-qa/screenshots/*.png
            reference-qa/report.json
          if-no-files-found: warn

      - name: Stop isolated stack
        if: always()
        run: |
          docker rm -f corvia-spaces-reference-nginx >/dev/null 2>&1 || true
          docker compose down -v --remove-orphans
