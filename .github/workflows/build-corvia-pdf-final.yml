name: Build final Corvia institutional PDF

on:
  push:
    branches:
      - agent/corvia-pdf-final
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip pdf final]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check reportlab pillow pymupdf

      - name: Apply reviewed layout corrections
        run: python tools/patch_corvia_pdf_layout.py

      - name: Build source PDF
        run: python tools/build_corvia_pdf.py

      - name: Create compact final PDF
        run: |
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          import fitz
          from PIL import Image

          src = Path('artifacts/Corvia_Apresentacao_Institucional.pdf')
          out = Path('artifacts/Corvia_Apresentacao_Institucional_final.pdf')
          doc = fitz.open(src)
          pages = []
          for page in doc:
              pix = page.get_pixmap(matrix=fitz.Matrix(1.0, 1.0), alpha=False)
              pages.append(Image.open(BytesIO(pix.tobytes('png'))).convert('RGB'))
          pages[0].save(out, 'PDF', resolution=72.0, save_all=True,
                        append_images=pages[1:], quality=76, optimize=True)
          print(out, out.stat().st_size)
          PY

      - name: Upload final PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: corvia-pdf-institucional-final
          path: artifacts/Corvia_Apresentacao_Institucional_final.pdf
          if-no-files-found: error

      - name: Record final run id
        run: printf '%s\n' '${{ github.run_id }}' > artifacts/corvia_pdf_final_run_id.txt

      - name: Publish final run id
        run: |
          git config user.name "Corvia PDF Builder"
          git config user.email "corvia-pdf-builder@users.noreply.github.com"
          git add -f artifacts/corvia_pdf_final_run_id.txt
          git commit -m "build: registra run final do PDF [skip pdf final]" -m "Fonte: ChatGPT"
          git push origin HEAD:agent/corvia-pdf-final
