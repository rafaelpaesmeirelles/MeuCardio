name: Apply painel menu acervo patch

on:
  push:
    branches:
      - agent/painel-menu-acervo-preservado

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: agent/painel-menu-acervo-preservado
          fetch-depth: 0

      - name: Apply verified patch
        run: python scripts/apply_painel_menu_acervo.py

      - name: Remove temporary workflow
        run: rm -f .github/workflows/apply-painel-menu-acervo.yml

      - name: Commit implementation
        run: |
          git config user.name "CorvIA Automation"
          git config user.email "automation@corvia.med.br"
          git add -A
          git diff --cached --check
          git commit -m "fix: corrige painel, menu e publicação do acervo"
          git push origin HEAD:agent/painel-menu-acervo-preservado
