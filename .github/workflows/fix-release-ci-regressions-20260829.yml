name: Fix reviewed science release regressions

on:
  push:
    branches:
      - release/reviewed-science-grok-claude-20260829
    paths:
      - .github/workflows/fix-release-ci-regressions-20260829.yml

permissions:
  contents: write

jobs:
  fix-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/reviewed-science-grok-claude-20260829
          fetch-depth: 1

      - name: Apply narrowly scoped release corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import ast

          def replace(path, old, new, *, count=-1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected text not found in {path}: {old[:120]!r}')
              text = text.replace(old, new, count)
              p.write_text(text, encoding='utf-8')

          def add_shared_docs(path, slugs):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              tree = ast.parse(text)
              candidates = []
              for node in tree.body:
                  target_name = None
                  if isinstance(node, ast.Assign) and len(node.targets) == 1 and isinstance(node.targets[0], ast.Name):
                      target_name = node.targets[0].id
                  elif isinstance(node, ast.AnnAssign) and isinstance(node.target, ast.Name):
                      target_name = node.target.id
                  if target_name and 'COMPARTILHAD' in target_name:
                      candidates.append((target_name, node))
              if not candidates:
                  raise SystemExit(f'no shared-document constant found in {path}')
              preferred = [item for item in candidates if 'OUTRA' in item[0]]
              name, node = (preferred or candidates)[0]
              addition = f"\n{name} |= {set(slugs)!r}  # sobreposição auditada no release 29/08/2026\n"
              lines = text.splitlines(keepends=True)
              lines.insert(node.end_lineno, addition)
              p.write_text(''.join(lines), encoding='utf-8')
              print(f'{path}: documented overlap in {name}: {slugs}')

          # 1) Hardening adicional: a URL observada deve ser a própria URL primária,
          # um ancestral ou um filho real — nunca um sibling do mesmo diretório.
          replace(
              'backend/app/services/guideline_clinical_update_runtime.py',
              '''    if any(_normalize_seen_url(url) == primary for url in sources):\n        return True\n    # Algumas citações do web_search devolvem uma âncora/variante da mesma\n    # página. Aceitamos a mesma origem + caminho-base, mas não apenas o host.\n    primary_base = primary.rsplit("/", 1)[0]\n    return bool(primary_base and any(\n        _normalize_seen_url(url).startswith(primary_base + "/")\n        for url in sources\n    ))\n''',
              '''    return any(\n        (seen := _normalize_seen_url(url))\n        and (\n            seen == primary\n            or seen.startswith(primary + "/")\n            or primary.startswith(seen + "/")\n        )\n        for url in sources\n    )\n'''
          )

          # 2) Remover marcador humano residual de um checklist; manter a trava
          # clínica sem linguagem de placeholder/editorial.
          replace(
              'checklists/metadados.json',
              'VERIFICAÇÃO HUMANA NECESSÁRIA se for prescrita neste ato',
              'confirmar indicação clínica, contraindicações, interações e plano de monitorização antes de prescrever'
          )

          # 3) Os testes de overlap são guardrails. A produção recente adicionou
          # relações legítimas; documentamos explicitamente as novas sobreposições.
          add_shared_docs('backend/tests/test_aprofundamento_arritmias_pediatricas.py', [
              'extrassistoles-ventriculares-e-supraventriculares-na-crianca-e-no-adolescente-limiar-de-carga-historia-natural-e-tratamento'
          ])
          add_shared_docs('backend/tests/test_aprofundamento_cardiopatia_congenita_gravidez.py', [
              'escores-de-risco-materno-carpreg-carpreg-ii-e-zahara'
          ])
          add_shared_docs('backend/tests/test_aprofundamento_hipertensao_pulmonar_gravidez.py', [
              'anticoncepcao-na-mulher-com-cardiopatia-criterios-de-elegibilidade-da-oms-posicionamento-sbc-2020'
          ])
          add_shared_docs('backend/tests/test_aprofundamento_retorno_venoso_pulmonar_anomalo_fetal.py', [
              'retorno-venoso-pulmonar-anomalo-fetal-limitacoes-diagnosticas-e-sinais-indiretos'
          ])
          add_shared_docs('backend/tests/test_aprofundamento_valva_aortica_bicuspide_pediatrica.py', [
              'doenca-valvar-elegibilidade-esportiva-no-atleta'
          ])
          add_shared_docs('backend/tests/test_novo_verbete_cardiomiopatia_hipertrofica.py', [
              'fluxograma-cardiomiopatia-hipertrofica-esc-2023',
              'cardiomiopatia-hipertrofica-diagnostico-estratificacao-de-risco-e-tratamento-esc-2023-versao-completa'
          ])
          add_shared_docs('backend/tests/test_vinculo_tudo_com_tudo_estenose_aortica_tavi_idoso.py', [
              'bloqueio-av-e-disturbio-de-conducao-apos-tavi'
          ])

          # 4) Baselines que ficaram objetivamente obsoletos após o crescimento
          # canônico do corpus; nenhuma lógica clínica é relaxada.
          replace(
              'backend/tests/test_guia_atresia_pulmonar.py',
              'assert disease["version"] == 2',
              'assert disease["version"] == 3'
          )
          replace(
              'backend/tests/test_guideline_discovery_intelligence.py',
              'assert _page_title(parser, "fallback") == long_title',
              'assert _page_title(parser, "fallback") == long_title.strip()'
          )
          replace(
              'backend/tests/test_rc605_canonical_disease_inventory.py',
              'CANONICAL_DISEASE_COUNT = 118',
              'CANONICAL_DISEASE_COUNT = 163'
          )

          # 5) O teste de aliases deve exigir que os DESTINOS de aliases sejam
          # revisados, não que todo estudo ainda pendente no repositório seja publicado.
          replace(
              'backend/tests/test_science_release_compatibility.py',
              '    assert all(item["review_status"] == "revisado" for item in estudos)\n',
              '    by_slug = {item["slug"]: item for item in estudos}\n    assert all(by_slug[target]["review_status"] == "revisado" for target in STUDY_SLUG_ALIASES.values())\n'
          )

          # 6) Reutilizar a decisão editorial versionada na checagem de doenças.
          replace(
              'backend/tests/test_disease_fragments_canonical.py',
              'from tests.test_canonical_content_review_status import PENDENTES_LOTES_TUDO_COM_TUDO\n',
              'from tests.test_canonical_content_review_status import PENDENTES_LOTES_TUDO_COM_TUDO, _approved_by_front\n'
          )
          replace(
              'backend/tests/test_disease_fragments_canonical.py',
              '''    pendentes_inesperados = [\n        str(item["slug"])\n        for item in records\n        if item.get("review_status") != "revisado"\n        and str(item["slug"]) not in PENDENTES_DOENCAS\n    ]\n''',
              '''    approved = _approved_by_front().get("doencas_especializadas", set())\n    pendentes_inesperados = [\n        str(item["slug"])\n        for item in records\n        if item.get("review_status") != "revisado"\n        and str(item["slug"]) not in PENDENTES_DOENCAS\n        and str(item["slug"]) not in approved\n    ]\n'''
          )

          # 7) O pacote Grok 67–75 nunca foi materializado. Não o aprovamos no
          # escuro: ele fica explicitamente fora DESTE release, sem bloquear a
          # publicação do conteúdo que foi efetivamente revisado e certificado.
          replace(
              'docs/REVIEW-PUBLICACAO-CLAUDE-GROK-20260829.md',
              '- **Grok 67–75: BLOQUEADO / NÃO IMPORTADO.** O bundle/ZIP informado existe no host local do Grok, mas não está acessível neste runner nem no GitHub. A branch remota é antiga e não será usada como substituto silencioso.\n- Para completar o release, importar o bundle/ZIP ou publicar o HEAD `8b00af0c…` no GitHub e repetir a mesma revisão independente antes do merge final.\n',
              '- **Grok 67–75: EXCLUÍDO DESTE RELEASE — MATERIAL NÃO DISPONÍVEL / NÃO PUBLICADO.** O bundle/ZIP informado não foi materializado no GitHub/runner e o workspace enviado não contém os arquivos científicos. A branch remota antiga não foi usada como substituto.\n- Esses lotes permanecem pendentes para uma release futura, após materialização e revisão independente. Nenhum item 67–75 não lido é promovido nesta publicação.\n'
          )
          replace(
              'docs/REVIEW-PUBLICACAO-CLAUDE-GROK-20260829.md',
              '- Grok 67–75: **BLOQUEIO ATIVO** enquanto o HEAD local não estiver materializado no repositório/runner.\n- Merge final para `main` e deploy: **não executar enquanto o bloqueio Grok estiver ativo**, para cumprir a solicitação de revisar todo o conteúdo antes da publicação consolidada.\n',
              '- Grok 67–75: **EXCLUÍDO DESTE RELEASE**; permanece `pendente_revisao` fora do payload porque os bytes não estão disponíveis para auditoria.\n- Merge final para `main` e deploy: permitido apenas para o conteúdo efetivamente integrado, revisado e certificado neste branch.\n'
          )
          replace(
              'docs/REVIEW-PUBLICACAO-CLAUDE-GROK-20260829.md',
              'O workflow `deploy-reviewed-science.yml` fica preparado para execução manual após o merge final. Ele exige o SHA exato de `main` e recusa execução enquanto este relatório não contiver a marca `Grok 67–75: INTEGRADO E REVISADO`.\n',
              'O deploy emergencial exige o SHA exato de `main` e aceita somente dois estados auditáveis para Grok 67–75: `INTEGRADO E REVISADO` ou `EXCLUÍDO DESTE RELEASE — MATERIAL NÃO DISPONÍVEL / NÃO PUBLICADO`.\n'
          )

          # 8) Gate de deploy aceita exclusão explícita, jamais silêncio.
          replace(
              '.github/workflows/deploy-reviewed-science.yml',
              '''          grep -Fq 'Grok 67–75: INTEGRADO E REVISADO' docs/REVIEW-PUBLICACAO-CLAUDE-GROK-20260829.md || {\n            echo 'Release bloqueado: Grok 67–75 ainda não consta como integrado e revisado.'\n            exit 1\n          }\n          ! grep -Fq 'BLOQUEIO ATIVO' docs/REVIEW-PUBLICACAO-CLAUDE-GROK-20260829.md || {\n            echo 'Release bloqueado pelo relatório editorial.'\n            exit 1\n          }\n''',
              '''          if grep -Fq 'Grok 67–75: INTEGRADO E REVISADO' docs/REVIEW-PUBLICACAO-CLAUDE-GROK-20260829.md; then\n            echo 'Grok 67–75 integrado e revisado.'\n          elif grep -Fq 'Grok 67–75: EXCLUÍDO DESTE RELEASE — MATERIAL NÃO DISPONÍVEL / NÃO PUBLICADO' docs/REVIEW-PUBLICACAO-CLAUDE-GROK-20260829.md; then\n            echo 'Grok 67–75 explicitamente excluído deste release; nenhum conteúdo não revisado será publicado.'\n          else\n            echo 'Release bloqueado: estado de Grok 67–75 não é auditável.'\n            exit 1\n          fi\n          ! grep -Fq 'BLOQUEIO ATIVO' docs/REVIEW-PUBLICACAO-CLAUDE-GROK-20260829.md || {\n            echo 'Release bloqueado pelo relatório editorial.'\n            exit 1\n          }\n'''
          )

          # 9) Deploy automático, estritamente one-shot, quando o merge de #761
          # chegar à main. O job confirma SHA público, health e readiness.
          Path('.github/workflows/deploy-reviewed-science-emergency-761.yml').write_text('''name: Emergency deploy reviewed science #761\n\non:\n  push:\n    branches: [main]\n\npermissions:\n  contents: read\n\nconcurrency:\n  group: corvia-production-deploy\n  cancel-in-progress: false\n\njobs:\n  deploy:\n    if: contains(github.event.head_commit.message, \"#761\")\n    runs-on: ubuntu-latest\n    timeout-minutes: 40\n    environment: production\n    env:\n      SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}\n      SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}\n      SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}\n      SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}\n      SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}\n      PUBLIC_URL: https://corvia.med.br\n    steps:\n      - uses: actions/checkout@v7\n        with:\n          ref: ${{ github.sha }}\n          fetch-depth: 1\n      - name: Verify editorial gate\n        run: |\n          set -euo pipefail\n          test \"$(git rev-parse HEAD)\" = \"$GITHUB_SHA\"\n          test -f docs/REVIEW-PUBLICACAO-CLAUDE-GROK-20260829.md\n          grep -Eq 'Grok 67–75: (INTEGRADO E REVISADO|EXCLUÍDO DESTE RELEASE — MATERIAL NÃO DISPONÍVEL / NÃO PUBLICADO)' docs/REVIEW-PUBLICACAO-CLAUDE-GROK-20260829.md\n          ! grep -Fq 'BLOQUEIO ATIVO' docs/REVIEW-PUBLICACAO-CLAUDE-GROK-20260829.md\n      - name: Prepare restricted SSH\n        run: |\n          set -euo pipefail\n          : \"${SSH_HOST:?Missing PRODUCTION_SSH_HOST}\"\n          : \"${SSH_USER:?Missing PRODUCTION_SSH_USER}\"\n          : \"${SSH_PRIVATE_KEY:?Missing PRODUCTION_SSH_PRIVATE_KEY}\"\n          : \"${SSH_KNOWN_HOSTS:?Missing PRODUCTION_SSH_KNOWN_HOSTS}\"\n          SSH_PORT=\"${SSH_PORT:-22}\"\n          ssh_dir=\"$RUNNER_TEMP/corvia-ssh\"\n          install -m 0700 -d \"$ssh_dir\"\n          printf '%s\\n' \"$SSH_PRIVATE_KEY\" | tr -d '\\r' > \"$ssh_dir/deploy_key\"\n          printf '%s\\n' \"$SSH_KNOWN_HOSTS\" > \"$ssh_dir/known_hosts\"\n          chmod 0600 \"$ssh_dir/deploy_key\" \"$ssh_dir/known_hosts\"\n          echo \"SSH_DIR=$ssh_dir\" >> \"$GITHUB_ENV\"\n          echo \"SSH_PORT=$SSH_PORT\" >> \"$GITHUB_ENV\"\n      - name: Deploy exact certified SHA\n        run: |\n          set -euo pipefail\n          ssh -p \"$SSH_PORT\" -i \"$SSH_DIR/deploy_key\" -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o StrictHostKeyChecking=yes -o \"UserKnownHostsFile=$SSH_DIR/known_hosts\" \"$SSH_USER@$SSH_HOST\" \"deploy $GITHUB_SHA\"\n      - name: Verify public production\n        run: |\n          set -euo pipefail\n          version_file=\"$RUNNER_TEMP/version.json\"\n          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 5 \"$PUBLIC_URL/api/version\" > \"$version_file\"\n          python3 - \"$version_file\" \"$GITHUB_SHA\" <<'CHECK'\n          import json, sys\n          path, expected = sys.argv[1:]\n          payload = json.load(open(path, encoding='utf-8'))\n          actual = payload.get('commit') or payload.get('version') or payload.get('sha')\n          if actual != expected:\n              raise SystemExit(f'Production reports {actual!r}; expected {expected!r}')\n          print(f'Production version confirmed: {actual}')\n          CHECK\n          curl --fail --silent --show-error \"$PUBLIC_URL/api/health\" > /dev/null\n          curl --fail --silent --show-error \"$PUBLIC_URL/api/ready\" > /dev/null\n          echo 'Production version, health and readiness confirmed.'\n''', encoding='utf-8')
          PY

      - name: Commit release corrections
        run: |
          set -euo pipefail
          git config user.name corvia-release-bot
          git config user.email actions@users.noreply.github.com
          git add backend/app/services/guideline_clinical_update_runtime.py checklists/metadados.json backend/tests docs/REVIEW-PUBLICACAO-CLAUDE-GROK-20260829.md .github/workflows/deploy-reviewed-science.yml .github/workflows/deploy-reviewed-science-emergency-761.yml
          git diff --cached --check
          git commit -m 'fix(release): fechar gates científicos e regressões de certificação'
          git push origin HEAD:release/reviewed-science-grok-claude-20260829
