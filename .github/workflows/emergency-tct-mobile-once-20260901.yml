name: Emergency TCT mobile deploy one-shot

on:
  workflow_run:
    workflows:
      - Deploy production
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: corvia-emergency-tct-mobile-20260901
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.id == 33583288491 && github.event.workflow_run.head_sha == 'f23d2dc548719d3c05460faad734c96a09dc8dc2' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      HOTFIX_SHA: f23d2dc548719d3c05460faad734c96a09dc8dc2
      SELF_PATH: .github/workflows/emergency-tct-mobile-once-20260901.yml
      ANDROID_CERT_SHA256: ${{ vars.CORVIA_ANDROID_CERT_SHA256 || '1344fed66fce26841b5fbb6a302a27ad5cd207c1b8fb989005e9be370148ce5e' }}
      SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
      SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
      SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 3

      - name: Lock this exception to the approved visual hotfix
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          target="$(git rev-parse HEAD)"
          parent="$(git rev-parse HEAD^)"
          current_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          [[ "$target" == "$current_main" ]] || { echo "Target is not current main" >&2; exit 65; }
          [[ "$parent" == "$HOTFIX_SHA" ]] || { echo "One-shot parent mismatch" >&2; exit 65; }
          mapfile -t trigger_diff < <(git diff --name-only "$parent" "$target")
          [[ "${#trigger_diff[@]}" -eq 1 && "${trigger_diff[0]}" == "$SELF_PATH" ]] \
            || { printf 'One-shot commit contains unexpected paths:\n%s\n' "${trigger_diff[*]}" >&2; exit 65; }
          hotfix_base="$(git rev-parse "$HOTFIX_SHA^1")"
          mapfile -t hotfix_diff < <(git diff --name-only "$hotfix_base" "$HOTFIX_SHA")
          [[ "${#hotfix_diff[@]}" -eq 1 && "${hotfix_diff[0]}" == "frontend/src/styles/tudo-com-tudo.css" ]] \
            || { printf 'Hotfix scope changed unexpectedly:\n%s\n' "${hotfix_diff[*]}" >&2; exit 65; }
          echo "target_sha=$target" >> "$GITHUB_OUTPUT"

      - name: Reuse only the completed minimal CI evidence from the hotfix
        shell: bash
        run: |
          set -euo pipefail
          runs="$(gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/actions/runs?branch=main&head_sha=${HOTFIX_SHA}&per_page=100")"
          ci_run="$(jq -r '[.workflow_runs[] | select(.name == "CI" and .event == "push" and .status == "completed" and .conclusion == "success")] | sort_by(.created_at) | last | .id // empty' <<<"$runs")"
          [[ "$ci_run" =~ ^[0-9]+$ ]] || { echo "No successful CI for hotfix" >&2; exit 65; }
          jobs="$(gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${ci_run}/jobs?filter=all&per_page=100")"
          jq -e '[.jobs[] | select(.name == "Frontend build" and .status == "completed" and .conclusion == "success")] | length >= 1' <<<"$jobs" >/dev/null
          jq -e '[.jobs[] | select(.name == "Backend risk gate" and .status == "completed" and .conclusion == "success")] | length >= 1' <<<"$jobs" >/dev/null
          jq -e '[.jobs[] | select(.name == "Backend tests" and .status == "completed" and .conclusion == "skipped")] | length >= 1' <<<"$jobs" >/dev/null
          jq -e '[.jobs[] | select(.name == "Backend focused tests" and .status == "completed" and .conclusion == "skipped")] | length >= 1' <<<"$jobs" >/dev/null
          echo "Reusing CI $ci_run: frontend green; backend suites skipped as visual-only."

      - name: Prepare restricted production SSH
        shell: bash
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Missing PRODUCTION_SSH_HOST}"
          : "${SSH_USER:?Missing PRODUCTION_SSH_USER}"
          : "${SSH_PRIVATE_KEY:?Missing PRODUCTION_SSH_PRIVATE_KEY}"
          : "${SSH_KNOWN_HOSTS:?Missing PRODUCTION_SSH_KNOWN_HOSTS}"
          ssh_dir="$RUNNER_TEMP/corvia-ssh"
          install -m 0700 -d "$ssh_dir"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$ssh_dir/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 0600 "$ssh_dir/deploy_key" "$ssh_dir/known_hosts"

      - name: Deploy current main through the existing restricted entrypoint
        env:
          TARGET_SHA: ${{ steps.lock.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          port="${SSH_PORT:-22}"
          cert="$(printf '%s' "$ANDROID_CERT_SHA256" | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          [[ "$cert" =~ ^[0-9a-f]{64}$ ]] || { echo "Invalid Android certificate fingerprint" >&2; exit 65; }
          timeout 3000s ssh -p "$port" -i "$RUNNER_TEMP/corvia-ssh/deploy_key" \
            -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$RUNNER_TEMP/corvia-ssh/known_hosts" \
            "$SSH_USER@$SSH_HOST" \
            "deploy-web-android $TARGET_SHA $cert"

      - name: Verify only production version and health
        env:
          TARGET_SHA: ${{ steps.lock.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          base='https://corvia.med.br'
          nonce="${TARGET_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          version_file="$RUNNER_TEMP/version.json"
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 \
            -H 'Cache-Control: no-cache, no-store, max-age=0' \
            "$base/api/version?release=$nonce" > "$version_file"
          python3 - "$version_file" "$TARGET_SHA" <<'PY'
          import json, sys
          path, expected = sys.argv[1:]
          with open(path, encoding='utf-8') as f:
              payload = json.load(f)
          actual = payload.get('commit') or payload.get('version') or payload.get('sha')
          if actual != expected:
              raise SystemExit(f'Production reports {actual!r}; expected {expected!r}')
          print(f'Production version confirmed: {actual}')
          PY
          curl --fail --silent --show-error -H 'Cache-Control: no-cache' "$base/api/health?release=$nonce" >/dev/null
          curl --fail --silent --show-error -H 'Cache-Control: no-cache' "$base/api/ready?release=$nonce" >/dev/null
          echo "Emergency visual deploy healthy."
