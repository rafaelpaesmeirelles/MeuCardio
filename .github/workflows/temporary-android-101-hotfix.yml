name: Temporary Android 1.0.1 hotfix

on:
  push:
    branches: [main]
    paths: [.github/workflows/temporary-android-101-hotfix.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply exact Android 1.0.1 release patch
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'{path}: expected text not found: {old[:120]!r}')
              text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8')

          replace_exact(
              'frontend/android/app/build.gradle',
              'versionCode 2\n        versionName "1.1"',
              'versionCode 2\n        versionName "1.0.1"',
          )

          replace_exact(
              'frontend/src/pages/Entrar.tsx',
              '<a className="prehome-android-download" href="/downloads/corvia-os-android.apk" download>\n              <span className="prehome-android-download__icon"><MarcaAndroid /></span>\n              <span><strong>Baixar app para Android</strong><small>Versão de testes · APK assinado</small></span>',
              '<a\n              className="prehome-android-download"\n              href="/downloads/corvia-os-android-1.0.1.apk"\n              download="CorVIA-OS-Android-1.0.1.apk"\n            >\n              <span className="prehome-android-download__icon"><MarcaAndroid /></span>\n              <span><strong>Baixar app para Android</strong><small>Versão 1.0.1 · APK assinado</small></span>',
          )

          caddy = Path('infra/Caddyfile')
          text = caddy.read_text(encoding='utf-8')
          old = '''\thandle /downloads/corvia-os-android.apk {\n\t\troot * /downloads\n\t\trewrite * /corvia-os-android.apk\n\t\theader Content-Type "application/vnd.android.package-archive"\n\t\theader Content-Disposition "attachment; filename=CorVIA-OS-Android.apk"\n\t\theader Cache-Control "no-store"\n\t\tfile_server\n\t}\n\n\thandle /downloads/corvia-os-android.apk.sha256 {\n\t\troot * /downloads\n\t\trewrite * /corvia-os-android.apk.sha256\n\t\theader Content-Type "text/plain; charset=utf-8"\n\t\theader Cache-Control "no-store"\n\t\tfile_server\n\t}\n'''
          new = '''\tredir /downloads/corvia-os-android.apk /downloads/corvia-os-android-1.0.1.apk 308\n\tredir /downloads/corvia-os-android.apk.sha256 /downloads/corvia-os-android-1.0.1.apk.sha256 308\n\n\thandle /downloads/corvia-os-android-1.0.1.apk {\n\t\troot * /downloads\n\t\trewrite * /corvia-os-android-1.0.1.apk\n\t\theader Content-Type "application/vnd.android.package-archive"\n\t\theader Content-Disposition "attachment; filename=CorVIA-OS-Android-1.0.1.apk"\n\t\theader Cache-Control "no-store"\n\t\tfile_server\n\t}\n\n\thandle /downloads/corvia-os-android-1.0.1.apk.sha256 {\n\t\troot * /downloads\n\t\trewrite * /corvia-os-android-1.0.1.apk.sha256\n\t\theader Content-Type "text/plain; charset=utf-8"\n\t\theader Cache-Control "no-store"\n\t\tfile_server\n\t}\n'''
          if old not in text:
              raise SystemExit('infra/Caddyfile: legacy Android route block not found')
          caddy.write_text(text.replace(old, new, 1), encoding='utf-8')

          deploy = Path('.github/workflows/deploy-production.yml')
          text = deploy.read_text(encoding='utf-8')
          anchor = '''      - name: Verify public production\n        env:\n          PUBLIC_URL: https://corvia.med.br\n'''
          build_step = '''      - name: Build and publish signed Android 1.0.1 APK on production host\n        run: |\n          set -euo pipefail\n          ssh \\\n            -p "$SSH_PORT" \\\n            -i "$ssh_dir/deploy_key" \\\n            -o BatchMode=yes \\\n            -o ConnectTimeout=20 \\\n            -o IdentitiesOnly=yes \\\n            -o ServerAliveInterval=30 \\\n            -o ServerAliveCountMax=10 \\\n            -o StrictHostKeyChecking=yes \\\n            -o "UserKnownHostsFile=$ssh_dir/known_hosts" \\\n            "$SSH_USER@$SSH_HOST" \\\n            'set -euo pipefail; \\\n             cd /opt/meucardio/frontend; \\\n             test -f android/keystore.properties; \\\n             npx cap sync android; \\\n             cd android; \\\n             JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64 PATH=/usr/lib/jvm/java-21-openjdk-amd64/bin:$PATH ./gradlew assembleRelease; \\\n             test -s app/build/outputs/apk/release/app-release.apk; \\\n             install -d -m 0755 /opt/meucardio/downloads; \\\n             install -m 0644 app/build/outputs/apk/release/app-release.apk /opt/meucardio/downloads/corvia-os-android-1.0.1.apk; \\\n             cp /opt/meucardio/downloads/corvia-os-android-1.0.1.apk /opt/meucardio/downloads/corvia-os-android.apk; \\\n             cd /opt/meucardio/downloads; \\\n             sha256sum corvia-os-android-1.0.1.apk > corvia-os-android-1.0.1.apk.sha256; \\\n             sha256sum corvia-os-android.apk > corvia-os-android.apk.sha256'\n\n'''
          if anchor not in text:
              raise SystemExit('deploy-production.yml: verify anchor not found')
          if 'Build and publish signed Android 1.0.1 APK on production host' not in text:
              text = text.replace(anchor, build_step + anchor, 1)
          deploy.write_text(text, encoding='utf-8')
          PY

          git rm .github/workflows/temporary-android-101-hotfix.yml
          git diff --check
          git config user.name 'CorVIA Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add frontend/android/app/build.gradle frontend/src/pages/Entrar.tsx infra/Caddyfile .github/workflows/deploy-production.yml
          git commit -m 'fix(android): publicar APK assinado 1.0.1 no download direto'
          git push origin HEAD:main
