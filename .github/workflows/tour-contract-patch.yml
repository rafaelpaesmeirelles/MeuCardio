name: Patch Tour communication contract

on:
  push:
    branches:
      - agent/clinical-command-center-full-ui
    paths:
      - .github/workflows/tour-contract-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/clinical-command-center-full-ui
          fetch-depth: 0
      - name: Restore CorVIA Chat as separate communication product in Tour
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/pages/TourClinicalOS.tsx')
          text = path.read_text(encoding='utf-8')
          old = 'pontos:["Inbox premium", "HTML recebido isolado", "Assistente não lê caixa sem necessidade"]'
          new = 'pontos:["Inbox premium", "CorVIA Chat permanece separado do Assistente", "HTML recebido isolado", "Assistente não lê caixa sem necessidade"]'
          if old not in text:
              raise SystemExit('Trecho canônico do slide Comunicação não encontrado; abortando sem escrever.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name "CorVIA CI"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/src/pages/TourClinicalOS.tsx
          git commit -m "fix(tour): preserve CorVIA Chat as separate communication product"
          git push origin HEAD:agent/clinical-command-center-full-ui
