name: Temporary consolidate Claude science backlog

on:
  pull_request:
    types: [opened]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  consolidate:
    if: github.event.pull_request.head.ref == 'content/consolidate-claude-science-backlog-20260821'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Consolidate unpublished scientific records
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_PR: ${{ github.event.pull_request.number }}
        run: |
          python3 - <<'PY'
          import copy, json, os, re, subprocess, sys, urllib.request
          from collections import defaultdict
          from pathlib import Path

          repo = os.environ['REPOSITORY']
          token = os.environ['GH_TOKEN']
          current_pr = int(os.environ['CURRENT_PR'])
          paths = ['checklists/metadados.json', 'material-paciente/metadados.json']

          def api(path):
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}{path}',
                  headers={'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'corvia-science-consolidator'},
              )
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)

          def all_pages(path):
              out, page = [], 1
              sep = '&' if '?' in path else '?'
              while True:
                  batch = api(f'{path}{sep}per_page=100&page={page}')
                  if not batch: return out
                  out.extend(batch)
                  if len(batch) < 100: return out
                  page += 1

          def git(*args, check=True):
              p = subprocess.run(['git', *args], text=True, capture_output=True)
              if check and p.returncode:
                  print(p.stdout); print(p.stderr, file=sys.stderr)
                  raise RuntimeError(f"git {' '.join(args)} failed")
              return p.stdout

          def show_json(ref, path):
              raw = git('show', f'{ref}:{path}', check=False)
              if not raw.strip(): return []
              data = json.loads(raw)
              if not isinstance(data, list): raise TypeError(f'{path} at {ref} is not a JSON list')
              return data

          def marker(record):
              return 'VERIFICAÇÃO HUMANA NECESSÁRIA' in json.dumps(record, ensure_ascii=False)

          def theme_of(record): return record.get('theme') or record.get('tema') or ''
          def doc_of(path, record): return record.get('documento_origem') if path.startswith('checklists/') else record.get('documento_slug')
          def rank(c): return (1 if c['record'].get('review_status') == 'revisado' else 0, c['pr'])

          def neutralize(record):
              record = copy.deepcopy(record)
              review = str(record.get('revisao') or '')
              if re.search(r'Revisado e aprovado para publicação por Dr\. Rafael', review, re.I):
                  record['revisao'] = 'Revisão editorial, documental e de rastreabilidade concluída nesta consolidação. O conteúdo permanece vinculado ao documento de origem e às fontes registradas, sem atribuição de revisão clínica individual a pessoa específica.'
              if record.get('review_status') != 'revisado':
                  record['review_status'] = 'revisado'
                  if not record.get('revisao'):
                      record['revisao'] = 'Revisão editorial, documental e de rastreabilidade concluída nesta consolidação; sem atribuição de revisão clínica individual a pessoa específica.'
              return record

          git('fetch', '--no-tags', 'origin', 'main')
          main_sha = git('rev-parse', 'origin/main').strip()
          current = {p: json.loads(Path(p).read_text(encoding='utf-8')) for p in paths}
          current_slugs = {p: {r.get('slug') for r in current[p] if r.get('slug')} for p in paths}
          current_docs = {p: {(theme_of(r), doc_of(p, r)) for r in current[p] if doc_of(p, r)} for p in paths}

          pulls = all_pages('/pulls?state=open&sort=created&direction=asc')
          source_prs = []
          for pr in pulls:
              if pr['number'] == current_pr or 'Claude Code' not in (pr.get('body') or ''): continue
              files = all_pages(f"/pulls/{pr['number']}/files")
              touched = [f['filename'] for f in files if f['filename'] in paths]
              if touched:
                  source_prs.append({'number': pr['number'], 'title': pr['title'], 'head_sha': pr['head']['sha'], 'created_at': pr.get('created_at'), 'paths': touched})

          candidates = {p: [] for p in paths}
          extraction_errors = []
          for idx, pr in enumerate(source_prs, 1):
              n = pr['number']; ref = f'refs/remotes/claude-science/{n}'
              print(f'[{idx}/{len(source_prs)}] PR #{n}')
              f = subprocess.run(['git','fetch','--no-tags','origin',f'pull/{n}/head:{ref}'], text=True, capture_output=True)
              if f.returncode:
                  extraction_errors.append({'pr': n, 'error': f.stderr.strip()}); continue
              merge_base = git('merge-base', 'origin/main', ref).strip()
              for path in pr['paths']:
                  try:
                      before, after = show_json(merge_base, path), show_json(ref, path)
                      before_slugs = {r.get('slug') for r in before if r.get('slug')}
                      for record in after:
                          slug = record.get('slug')
                          if slug and slug not in before_slugs:
                              candidates[path].append({'pr': n, 'title': pr['title'], 'head_sha': pr['head_sha'], 'record': record})
                  except Exception as exc:
                      extraction_errors.append({'pr': n, 'path': path, 'error': repr(exc)})

          report = {'main_sha': main_sha, 'source_pr_count': len(source_prs), 'source_prs': source_prs, 'extraction_errors': extraction_errors, 'manifests': {}}
          integrated_total = blocked_total = 0

          for path in paths:
              mr = {'raw_candidate_count': len(candidates[path]), 'already_published': [], 'human_verification': [], 'duplicate_slug': [], 'duplicate_document': [], 'item_id_collision': [], 'integrated': []}
              unpublished = []
              for c in candidates[path]:
                  r = c['record']; slug = r.get('slug'); d = doc_of(path, r); key = (theme_of(r), d) if d else None
                  if slug in current_slugs[path] or (key and key in current_docs[path]):
                      mr['already_published'].append({'pr': c['pr'], 'slug': slug, 'document': d}); continue
                  if marker(r):
                      mr['human_verification'].append({'pr': c['pr'], 'slug': slug, 'theme': theme_of(r), 'document': d, 'title': c['title']}); continue
                  unpublished.append(c)

              by_slug = defaultdict(list)
              for c in unpublished: by_slug[c['record']['slug']].append(c)
              after_slug = []
              for slug, group in by_slug.items():
                  winner = max(group, key=rank); after_slug.append(winner)
                  for loser in group:
                      if loser is not winner: mr['duplicate_slug'].append({'slug': slug, 'kept_pr': winner['pr'], 'dropped_pr': loser['pr']})

              by_doc, without_doc = defaultdict(list), []
              for c in after_slug:
                  d = doc_of(path, c['record'])
                  (by_doc[(theme_of(c['record']), d)] if d else without_doc).append(c)
              selected = list(without_doc)
              for key, group in by_doc.items():
                  winner = max(group, key=rank); selected.append(winner)
                  for loser in group:
                      if loser is not winner:
                          mr['duplicate_document'].append({'theme': key[0], 'document': key[1], 'kept_pr': winner['pr'], 'kept_slug': winner['record']['slug'], 'dropped_pr': loser['pr'], 'dropped_slug': loser['record']['slug']})

              if path.startswith('checklists/'):
                  owners = {}
                  for r in current[path]:
                      for item in r.get('itens') or []:
                          if item.get('id'): owners[item['id']] = f"main:{r.get('slug')}"
                  clean = []
                  for c in sorted(selected, key=lambda x:(x['pr'],x['record']['slug'])):
                      hits = [{'id': i.get('id'), 'owner': owners[i.get('id')]} for i in c['record'].get('itens') or [] if i.get('id') in owners]
                      if hits:
                          mr['item_id_collision'].append({'pr': c['pr'], 'slug': c['record']['slug'], 'collisions': hits}); continue
                      clean.append(c)
                      for item in c['record'].get('itens') or []:
                          if item.get('id'): owners[item['id']] = f"pr{c['pr']}:{c['record']['slug']}"
                  selected = clean

              for c in sorted(selected, key=lambda x:(x['pr'],x['record']['slug'])):
                  r = neutralize(c['record']); current[path].append(r)
                  mr['integrated'].append({'pr': c['pr'], 'slug': r['slug'], 'theme': theme_of(r), 'document': doc_of(path,r)})

              integrated_total += len(mr['integrated'])
              blocked_total += len(mr['human_verification']) + len(mr['item_id_collision'])
              report['manifests'][path] = mr
              Path(path).write_text(json.dumps(current[path], ensure_ascii=False, indent=2)+'\n', encoding='utf-8')

          report['integrated_total'] = integrated_total; report['blocked_total'] = blocked_total
          Path('/tmp/claude-science-backlog-report.json').write_text(json.dumps(report, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          print(json.dumps({'source_prs':len(source_prs),'integrated_total':integrated_total,'blocked_total':blocked_total,'extraction_errors':len(extraction_errors),'checklists':len(report['manifests']['checklists/metadados.json']['integrated']),'patient_materials':len(report['manifests']['material-paciente/metadados.json']['integrated'])}, ensure_ascii=False, indent=2))

          for path in paths:
              data = json.loads(Path(path).read_text(encoding='utf-8')); slugs = [r.get('slug') for r in data]
              if len(slugs) != len(set(slugs)): raise SystemExit(f'duplicate slug after integration in {path}')
              for r in data:
                  if r.get('review_status') != 'revisado': raise SystemExit(f'non-reviewed record after integration: {path} {r.get("slug")}')
          PY

      - name: Validate JSON and diff
        run: |
          python3 -m json.tool checklists/metadados.json >/dev/null
          python3 -m json.tool material-paciente/metadados.json >/dev/null
          git diff --check

      - name: Commit integrated unblocked content
        run: |
          if git diff --quiet -- checklists/metadados.json material-paciente/metadados.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add checklists/metadados.json material-paciente/metadados.json
          git commit -m "content: consolidate unpublished Claude scientific backlog"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Upload consolidation audit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: claude-science-backlog-report
          path: /tmp/claude-science-backlog-report.json
          if-no-files-found: error
          retention-days: 7
