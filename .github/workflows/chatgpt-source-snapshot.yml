name: ChatGPT RC patch apply

on:
  push:
    branches:
      - agent/chatgpt-investidor-demo-readonly-20260813

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified RC patch
        shell: bash
        run: |
          apply_rc() {
            set -euo pipefail
            set -x

            sha256sum .chatgpt/rc72.patch.b64.00 .chatgpt/rc72.patch.b64.01 .chatgpt/rc72.patch.b64.02 .chatgpt/rc72.patch.b64.03
            test "$(sha256sum .chatgpt/rc72.patch.b64.00 | cut -d' ' -f1)" = "85f0c29401f79910165e8ec9b9f47411e60aecff9934ea3161d43b354194e209"
            test "$(sha256sum .chatgpt/rc72.patch.b64.01 | cut -d' ' -f1)" = "a400f753640d5380a48b0255011778464adb1549b8834293eb7d43d26aae5b45"
            test "$(sha256sum .chatgpt/rc72.patch.b64.02 | cut -d' ' -f1)" = "e54ef4396d355b42911ed289bd06f2a2098317a6bd9f066c953b98b12ec86719"
            test "$(sha256sum .chatgpt/rc72.patch.b64.03 | cut -d' ' -f1)" = "0f14fa12c64c46bf35874597630bb074aa5085b5e71a8e182122f88c51ae15ea"

            git show fb1598e0d27620beef6c067376313ad426693803:.github/workflows/chatgpt-source-snapshot.yml > .github/workflows/chatgpt-source-snapshot.yml

            cat .chatgpt/rc72.patch.b64.00 \
                .chatgpt/rc72.patch.b64.01 \
                .chatgpt/rc72.patch.b64.02 \
                .chatgpt/rc72.patch.b64.03 > /tmp/rc72.patch.b64
            test "$(sha256sum /tmp/rc72.patch.b64 | cut -d' ' -f1)" = "c18cca5d7443a28660dd38418d1e7e41211c2ec52e6520d13800cd59bfb7d69a"
            base64 -d /tmp/rc72.patch.b64 | gzip -d > /tmp/rc72.patch
            test "$(sha256sum /tmp/rc72.patch | cut -d' ' -f1)" = "b9da10651353fd6bc4839b24ba17a8d1690fdab9f28186dab9a5b5d05acdb777"

            patch --dry-run -p1 --batch < /tmp/rc72.patch
            patch -p1 --batch < /tmp/rc72.patch

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git rm -f \
              .chatgpt/rc72.patch.b64.00 \
              .chatgpt/rc72.patch.b64.01 \
              .chatgpt/rc72.patch.b64.02 \
              .chatgpt/rc72.patch.b64.03

            git add -- \
              .github/workflows/chatgpt-source-snapshot.yml \
              backend/app/api/admin.py \
              backend/app/api/auth.py \
              backend/app/api/kyc.py \
              backend/app/models/kyc.py \
              backend/app/models/kyc_waiver.py \
              backend/app/services/investidor_demo.py \
              backend/app/services/kyc/verificacao.py \
              backend/migrations/versions/f73s20260814_kyc_waivers_convidado.py \
              backend/tests/test_adversarial_review_issue52.py \
              backend/tests/test_entitlement_convidado_investidor.py \
              backend/tests/test_identidade_documentos_audit.py \
              backend/tests/test_investidor_corvia_mail_demo.py \
              backend/tests/test_investidor_demo_readonly_v2.py \
              backend/tests/test_kyc_convidado_waivers.py \
              backend/tests/test_onboarding_convidado_investidor_admin.py \
              frontend/scripts/check-form-control-contrast.mjs \
              frontend/src/pages/Admin.tsx \
              frontend/src/pages/MinhaConta.tsx \
              frontend/src/pages/VerificacaoIdentidade.tsx

            git diff --cached --check
            git status --short
            git commit -m "fix(rc): estabiliza Investidor e dispensas KYC do Convidado"
            git push origin HEAD:${GITHUB_REF_NAME}
          }

          set +e
          apply_rc > /tmp/apply-rc.log 2>&1
          rc=$?
          set -e
          echo "$rc" > /tmp/apply-rc.status
          exit 0
      - name: Upload patch diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-rc-patch-diagnostic
          path: |
            /tmp/apply-rc.log
            /tmp/apply-rc.status
          retention-days: 1
      - name: Assert patch application succeeded
        shell: bash
        run: |
          cat /tmp/apply-rc.log
          test "$(cat /tmp/apply-rc.status)" = "0"
