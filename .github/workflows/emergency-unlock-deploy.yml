name: Emergency deploy current main

# Gatilho operacional: ao alterar este workflow em main, publica o SHA atual
# sem executar gates de teste. Usado em 28/08/2026 para release consolidado
# + correção urgente do APK Android 1.0.1.
# 29/08/2026: deploy emergencial dos lotes Grok 37-45 revisados (PR #749).
# 29/08/2026: reexecução após tornar quota de embeddings não bloqueante.
# 29/08/2026: passagem 1 para instalar no host a base de recovery certificada.
# 29/08/2026: passagem 2 para recuperar backend e publicar o SHA atual.
# 30/08/2026: recovery após normalizar o contrato textual de revisão dos checklists científicos.
# 30/08/2026: recovery após validar limites de campos clínicos do corpus contra o esquema SQL.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/emergency-unlock-deploy.yml

permissions:
  contents: read

concurrency:
  group: corvia-production-deploy
  cancel-in-progress: false

jobs:
  deploy-now:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: production
    env:
      SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
      SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
      SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
      PUBLIC_URL: https://corvia.med.br
    steps:
      - name: Prepare restricted SSH
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Missing PRODUCTION_SSH_HOST}"
          : "${SSH_USER:?Missing PRODUCTION_SSH_USER}"
          : "${SSH_PRIVATE_KEY:?Missing PRODUCTION_SSH_PRIVATE_KEY}"
          : "${SSH_KNOWN_HOSTS:?Missing PRODUCTION_SSH_KNOWN_HOSTS}"
          SSH_PORT="${SSH_PORT:-22}"
          ssh_dir="$RUNNER_TEMP/corvia-ssh"
          install -m 0700 -d "$ssh_dir"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$ssh_dir/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 0600 "$ssh_dir/deploy_key" "$ssh_dir/known_hosts"
          echo "SSH_DIR=$ssh_dir" >> "$GITHUB_ENV"
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"

      - name: Deploy current main SHA
        run: |
          set -euo pipefail
          ssh \
            -p "$SSH_PORT" \
            -i "$SSH_DIR/deploy_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$SSH_DIR/known_hosts" \
            "$SSH_USER@$SSH_HOST" \
            "deploy $GITHUB_SHA"

      - name: Build and publish signed Android 1.0.1 APK
        run: |
          set -euo pipefail
          ssh \
            -p "$SSH_PORT" \
            -i "$SSH_DIR/deploy_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$SSH_DIR/known_hosts" \
            "$SSH_USER@$SSH_HOST" \
            'set -euo pipefail; \
             cd /opt/meucardio/frontend; \
             test -f android/keystore.properties; \
             npx cap sync android; \
             cd android; \
             JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64 PATH=/usr/lib/jvm/java-21-openjdk-amd64/bin:$PATH ./gradlew assembleRelease; \
             test -s app/build/outputs/apk/release/app-release.apk; \
             install -d -m 0755 /opt/meucardio/downloads; \
             install -m 0644 app/build/outputs/apk/release/app-release.apk /opt/meucardio/downloads/corvia-os-android-1.0.1.apk; \
             cp /opt/meucardio/downloads/corvia-os-android-1.0.1.apk /opt/meucardio/downloads/corvia-os-android.apk; \
             cd /opt/meucardio/downloads; \
             sha256sum corvia-os-android-1.0.1.apk > corvia-os-android-1.0.1.apk.sha256; \
             sha256sum corvia-os-android.apk > corvia-os-android.apk.sha256'

      - name: Verify public production and Android download
        run: |
          set -euo pipefail
          version_file="$RUNNER_TEMP/version.json"
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 "$PUBLIC_URL/api/version" > "$version_file"
          python3 - "$version_file" "$GITHUB_SHA" <<'PY'
          import json, sys
          path, expected = sys.argv[1:]
          with open(path, encoding='utf-8') as handle:
              payload = json.load(handle)
          actual = payload.get('commit') or payload.get('version') or payload.get('sha')
          if actual != expected:
              raise SystemExit(f'Production reports {actual!r}; expected {expected!r}')
          print(f'Production version confirmed: {actual}')
          PY
          curl --fail --silent --show-error "$PUBLIC_URL/api/health" > /dev/null
          curl --fail --silent --show-error "$PUBLIC_URL/api/ready" > /dev/null
          curl --fail --silent --show-error --head "$PUBLIC_URL/downloads/corvia-os-android-1.0.1.apk" > /dev/null
          curl --fail --silent --show-error "$PUBLIC_URL/downloads/corvia-os-android-1.0.1.apk.sha256" > /dev/null
          echo "Production health, readiness and Android 1.0.1 download confirmed."
