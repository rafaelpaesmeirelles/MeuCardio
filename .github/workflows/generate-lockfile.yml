name: Generate frontend lockfile

on:
  pull_request:
    paths:
      - "frontend/package.json"
      - ".github/workflows/generate-lockfile.yml"

permissions:
  contents: write

jobs:
  generate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/supply-chain-node24'
    name: Generate audited package-lock
    runs-on: ubuntu-latest
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Regenerate lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify vulnerable generator is gone
        working-directory: frontend
        run: |
          node - <<'NODE'
          const lock = require('./package-lock.json');
          const packages = lock.packages || {};
          if (Object.keys(packages).some((name) => name.includes('@capacitor/assets'))) {
            throw new Error('@capacitor/assets ainda está presente no lockfile');
          }
          const tar = packages['node_modules/tar']?.version;
          if (!tar || Number(tar.split('.')[0]) < 7) {
            throw new Error(`versão inesperada de tar: ${tar || 'ausente'}`);
          }
          console.log(`Lockfile validado: tar ${tar}; @capacitor/assets ausente.`);
          NODE
          sha256sum package-lock.json

      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- frontend/package-lock.json; then
            echo "Lockfile já está sincronizado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "Regenera lockfile sem gerador vulnerável"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
