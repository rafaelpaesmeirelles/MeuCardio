name: Temporary final release fixes
on:
  push:
    branches: [release/all-pending-20260828]
    paths: [.github/workflows/temporary-fix-release-final.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - name: Apply canonical schema and overlap contract fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Canonical migration for legacy assistant_questions.text -> label.
          path = Path('backend/app/services/disease_manifest.py')
          text = path.read_text(encoding='utf-8')
          helper = '''\n\ndef _normalize_assistant_questions(record: dict[str, Any]) -> None:\n    """Canonicalize legacy question text to the UI-supported label field."""\n    questions = record.get("assistant_questions")\n    if not isinstance(questions, list):\n        return\n    for question in questions:\n        if not isinstance(question, dict):\n            continue\n        legacy = question.pop("text", None)\n        if not str(question.get("label") or "").strip() and isinstance(legacy, str) and legacy.strip():\n            question["label"] = legacy\n'''
          if '_normalize_assistant_questions' not in text:
              marker = '\ndef load_disease_records(base_manifest: str | Path) -> list[dict[str, Any]]:\n'
              if marker not in text:
                  raise SystemExit('disease_manifest: load marker not found')
              text = text.replace(marker, helper + marker, 1)
          old_return = '    _apply_corrections(by_slug, base)\n    return [by_slug[slug] for slug in ordered_slugs]\n'
          new_return = '    _apply_corrections(by_slug, base)\n    for slug in ordered_slugs:\n        _normalize_assistant_questions(by_slug[slug])\n    return [by_slug[slug] for slug in ordered_slugs]\n'
          if new_return not in text:
              if old_return not in text:
                  raise SystemExit('disease_manifest: return marker not found')
              text = text.replace(old_return, new_return, 1)
          path.write_text(text, encoding='utf-8')

          # 2) /excluir-conta is now a canonical visible navigation destination.
          path = Path('scripts/feature_inventory.py')
          text = path.read_text(encoding='utf-8')
          if '"/excluir-conta"' not in text.split('EXPECTED_NAV_ROUTES = {', 1)[1].split('}', 1)[0]:
              anchor = '"/usuarios-online", "/minha-conta", "/privacidade", "/termos"'
              replacement = '"/usuarios-online", "/minha-conta", "/excluir-conta", "/privacidade", "/termos"'
              if anchor not in text:
                  raise SystemExit('feature_inventory: nav anchor not found')
              text = text.replace(anchor, replacement, 1)
          path.write_text(text, encoding='utf-8')

          # 3) Document only the exact legitimate overlaps reported by the final combined corpus CI.
          additions = {
            'backend/tests/test_aprofundamento_arritmias_pediatricas.py': [
              'disfuncao-do-no-sinusal-na-crianca-e-no-adolescente-etiologia-pos-cirurgica-holter-e-indicacao-de-marca-passo',
              'cardiomiopatia-induzida-por-taquicardia-na-crianca-diagnostico-diferencial-e-recuperacao-apos-ablacao',
              'flutter-atrial-pos-natal-no-neonato-lactente-e-crianca-macrorreentria-cardioversao-e-overdrive-pacing',
            ],
            'backend/tests/test_aprofundamento_avaliacao_multidimensional_cardiogeriatrica.py': [
              'fluxograma-hipertensao-no-idoso-e-no-fragil-quando-iniciar-alvo-e-desintensificacao-esc-2024',
            ],
            'backend/tests/test_aprofundamento_bloqueio_atrioventricular_fetal.py': [
              'bloqueio-av-congenito-completo-no-recem-nascido',
              'ecocardiografia-fetal-seriada-na-gestante-anti-ro-ssa-positiva-vigilancia-do-bloqueio-cardiaco-congenito',
            ],
            'backend/tests/test_aprofundamento_cardiopatia_congenita_gravidez.py': [
              'sindrome-de-eisenmenger-contraindicacao-absoluta-a-gestacao-mecanismo-mwho-iv',
              'sindrome-de-eisenmenger-e-gestacao-mortalidade-materna-do-registro-britanico-ao-ropac',
              'circulacao-de-fontan-e-gestacao-desfechos-maternos-e-fetais',
            ],
            'backend/tests/test_aprofundamento_dor_toracica_pediatrica.py': [
              'miocardite-aguda-pediatrica-diagnostico-suporte-hemodinamico-e-ecmo',
              'cardiomiopatia-induzida-por-taquicardia-na-crianca-diagnostico-diferencial-e-recuperacao-apos-ablacao',
              'trombose-coronaria-e-infarto-em-aneurisma-de-kawasaki',
              'miocardite-pos-vacina-de-mrna-em-adolescentes-incidencia-comparacao-com-covid-19-e-vigilancia-atual',
              'miocardite-fulminante-pediatrica-e-choque-cardiogenico',
            ],
            'backend/tests/test_aprofundamento_fisiologia_ventriculo_unico.py': [
              'disfuncao-do-no-sinusal-na-crianca-e-no-adolescente-etiologia-pos-cirurgica-holter-e-indicacao-de-marca-passo',
              'descompensacao-aguda-da-circulacao-de-fontan',
              'circulacao-de-fontan-e-gestacao-desfechos-maternos-e-fetais',
            ],
            'backend/tests/test_aprofundamento_flutter_atrial_fetal.py': [
              'flutter-atrial-pos-natal-no-neonato-lactente-e-crianca-macrorreentria-cardioversao-e-overdrive-pacing',
            ],
            'backend/tests/test_aprofundamento_hipertensao_arterial_pediatrica.py': [
              'obesidade-infantil-e-risco-cardiovascular-hipertensao-dislipidemia-aterogenica-e-dano-subclinico-em-orgao-alvo',
            ],
            'backend/tests/test_aprofundamento_hipotensao_ortostatica_no_idoso.py': [
              'fluxograma-hipertensao-no-idoso-e-no-fragil-quando-iniciar-alvo-e-desintensificacao-esc-2024',
            ],
            'backend/tests/test_aprofundamento_indicacoes_ecocardiograma_fetal.py': [
              'ecocardiografia-fetal-seriada-na-gestante-anti-ro-ssa-positiva-vigilancia-do-bloqueio-cardiaco-congenito',
            ],
            'backend/tests/test_aprofundamento_plano_parto_cardiopatia_materna.py': [
              'sindrome-de-eisenmenger-contraindicacao-absoluta-a-gestacao-mecanismo-mwho-iv',
            ],
            'backend/tests/test_aprofundamento_taquicardia_supraventricular_fetal.py': [
              'taquiarritmia-fetal-hidropsia-nao-imune-e-tratamento-transplacentario',
            ],
            'backend/tests/test_vinculo_tudo_com_tudo_doenca_de_kawasaki.py': [
              'trombose-coronaria-e-infarto-em-aneurisma-de-kawasaki',
            ],
            'backend/tests/test_vinculo_tudo_com_tudo_miocardite_pediatrica.py': [
              'miocardite-fulminante-pediatrica-e-choque-cardiogenico',
              'miocardite-pos-vacina-de-mrna-em-adolescentes-incidencia-comparacao-com-covid-19-e-vigilancia-atual',
              'miocardite-aguda-pediatrica-diagnostico-suporte-hemodinamico-e-ecmo',
            ],
          }

          for raw, slugs in additions.items():
              p = Path(raw)
              t = p.read_text(encoding='utf-8')
              marker = 'DOCUMENTOS_COMPARTILHADOS_COM_OUTRAS_FICHAS = {'
              start = t.find(marker)
              if start < 0:
                  raise SystemExit(f'{raw}: overlap set marker not found')
              end = t.find('\n}', start)
              if end < 0:
                  raise SystemExit(f'{raw}: overlap set closing brace not found')
              block = t[start:end]
              missing = [s for s in slugs if f'"{s}"' not in block]
              if missing:
                  insertion = ''.join(f'    "{s}",  # overlap legítimo no corpus consolidado 28/08/2026\n' for s in missing)
                  t = t[:end] + '\n' + insertion.rstrip('\n') + t[end:]
                  p.write_text(t, encoding='utf-8')

          # Workflow is one-shot and must not survive in release.
          Path('.github/workflows/temporary-fix-release-final.yml').unlink()
          PY

          git diff --check
          cd backend
          pytest -q \
            tests/test_assistant_questions_schema_global.py \
            tests/test_canonical_content_review_status.py \
            tests/test_disease_fragments_canonical.py \
            tests/test_aprofundamento_arritmias_pediatricas.py \
            tests/test_aprofundamento_avaliacao_multidimensional_cardiogeriatrica.py \
            tests/test_aprofundamento_bloqueio_atrioventricular_fetal.py \
            tests/test_aprofundamento_cardiopatia_congenita_gravidez.py \
            tests/test_aprofundamento_dor_toracica_pediatrica.py \
            tests/test_aprofundamento_fisiologia_ventriculo_unico.py \
            tests/test_aprofundamento_flutter_atrial_fetal.py \
            tests/test_aprofundamento_hipertensao_arterial_pediatrica.py \
            tests/test_aprofundamento_hipotensao_ortostatica_no_idoso.py \
            tests/test_aprofundamento_indicacoes_ecocardiograma_fetal.py \
            tests/test_aprofundamento_plano_parto_cardiopatia_materna.py \
            tests/test_aprofundamento_taquicardia_supraventricular_fetal.py \
            tests/test_vinculo_tudo_com_tudo_doenca_de_kawasaki.py \
            tests/test_vinculo_tudo_com_tudo_miocardite_pediatrica.py
          cd ..
          python scripts/feature_inventory.py
          python scripts/content_inventory.py --strict
          python scripts/audit_tudo_com_tudo.py

          git config user.name 'CorVIA Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix(release): corrigir schema, navegação e overlaps finais'
          git push origin HEAD:release/all-pending-20260828
