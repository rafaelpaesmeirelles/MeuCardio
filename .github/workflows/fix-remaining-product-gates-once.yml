name: Fix remaining product gates once

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'fix/product-stabilization-20260820' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/product-stabilization-20260820
          fetch-depth: 0
      - name: Apply remaining gate fixes
        run: |
          python .github/scripts/fix_remaining_product_gates.py
          python -m compileall -q backend/app backend/tests scripts
          git diff --check
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend frontend scripts
          if ! git diff --cached --quiet; then
            git commit -m "fix: align canonical mail route and remaining release gates"
            git push origin HEAD:fix/product-stabilization-20260820
          fi
